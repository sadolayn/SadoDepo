<style>
  :root {
    --bg: #000000;
    --card: #0d0d0d;
    --field: #161616;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --faint: #5a5a5a;
    --accent: #e0a24f;
    --line: #262626;
    --up: #3fbf7f;
    --down: #ef5d5d;
    --upbg: rgba(63,191,127,.14);
    --downbg: rgba(239,93,93,.14);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 12px 16px 32px; line-height: 1.45;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  header h1 { margin: 0; font-size: 20px; }
  .upd { text-align: center; color: var(--muted); font-size: 12px; margin-bottom: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  h2 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
  .num { font-variant-numeric: tabular-nums; }

  /* Güncel */
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .tile { background: var(--field); border: 1px solid var(--line); border-radius: 14px; padding: 11px 12px; cursor: pointer; text-align: left; color: var(--ink); font: inherit; }
  .tile.sel { border-color: var(--accent); }
  .tile .n { font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; gap: 6px; }
  .tile .v { font-size: 20px; font-weight: 700; margin: 2px 0 2px; }
  .tile .v small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .tile .c { font-size: 11.5px; color: var(--muted); display: flex; gap: 8px; white-space: nowrap; }
  .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .up { color: var(--up); } .down { color: var(--down); }

  /* Grafik */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .chip { padding: 7px 12px; border-radius: 18px; background: var(--field); border: 1px solid var(--line); color: var(--muted); font-size: 13px; cursor: pointer; font-weight: 600; }
  .chip.on { background: var(--accent); color: #000; border-color: var(--accent); }
  .chart { position: relative; height: 220px; touch-action: pan-y; }
  .chart svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .tip { position: absolute; top: 0; pointer-events: none; background: #1d1d1d; border: 1px solid #3a3a3a; border-radius: 10px; padding: 6px 9px; font-size: 12px; white-space: nowrap; display: none; transform: translateX(-50%); z-index: 2; }
  .tip b { display: block; font-size: 14px; }
  .chead { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .chead .big { font-size: 22px; font-weight: 700; }
  .chead .chg { font-size: 13px; }

  /* Tablo */
  .tbl { overflow-x: auto; margin: 0 -16px; padding: 0 16px; }
  table { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 560px; font-size: 13px; }
  th, td { padding: 8px 7px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); z-index: 1; }
  td.p { border-radius: 6px; }
  td.p.pos { background: var(--upbg); }
  td.p.neg { background: var(--downbg); }
  tr.tot td { font-weight: 700; border-bottom: none; }
  .seg { display: inline-flex; background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 3px; margin-bottom: 10px; }
  .seg button { border: none; background: none; color: var(--muted); padding: 7px 12px; border-radius: 9px; font-size: 13px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #000; }

  /* Simülatör */
  .inrow { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  label.f { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input[type=text], input[type=date], input[type=number] {
    width: 100%; padding: 12px; font-size: 16px; border-radius: 12px; background: var(--field);
    color: var(--ink); border: 1px solid var(--line); outline: none; font-family: inherit;
  }
  input:focus { border-color: var(--accent); }
  input[type=date] { color-scheme: dark; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin: -4px 0 12px; }
  .quick button { padding: 5px 10px; border-radius: 14px; background: var(--field); border: 1px solid var(--line); color: var(--muted); font-size: 12px; cursor: pointer; }
  .quick button.on { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 700; }
  .res { display: grid; gap: 8px; }
  .ri { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 10px 12px; background: var(--field); border: 1px solid var(--line); border-radius: 12px; }
  .ri .a { font-weight: 700; }
  .ri .then { font-size: 12px; color: var(--muted); grid-column: 1; }
  .ri .now { text-align: right; font-weight: 700; }
  .ri .pct { text-align: right; font-size: 13px; font-weight: 700; }
  .ri .bar { grid-column: 1 / -1; height: 4px; background: #222; border-radius: 4px; margin-top: 6px; overflow: hidden; }
  .ri .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }
  .ri.base { border-style: dashed; }
  .rank { display: inline-block; width: 20px; color: var(--faint); font-weight: 600; }

  .alloc { display: grid; gap: 10px; }
  .al { display: grid; grid-template-columns: 92px 1fr 64px; align-items: center; gap: 10px; }
  .al span { font-size: 14px; font-weight: 600; }
  .al span small { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 1px; }
  .al input[type=range] { width: 100%; accent-color: var(--accent); }
  .al input[type=number] { padding: 8px 6px; text-align: right; font-size: 15px; }
  .sum { display: flex; justify-content: space-between; align-items: center; margin: 12px 0; font-size: 14px; }
  .sum b.bad { color: var(--down); }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
  .presets button { padding: 6px 10px; border-radius: 14px; background: var(--field); border: 1px solid var(--line); color: var(--ink); font-size: 12px; cursor: pointer; }
  .hero { text-align: center; padding: 14px 0 8px; }
  .hero .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
  .hero .big { font-size: 32px; font-weight: 800; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 14px; }
  .stats div { background: var(--field); border: 1px solid var(--line); border-radius: 12px; padding: 9px; text-align: center; }
  .stats small { display: block; font-size: 11px; color: var(--muted); }
  .stats b { font-size: 16px; }
  .note { font-size: 12px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .stick { position: sticky; top: 0; z-index: 30; background: #000; margin: 0 -16px 12px; padding: 10px 16px; border-bottom: 1px solid transparent; transition: border-color .2s, box-shadow .2s; }
  .stick.stuck { border-bottom-color: #222; box-shadow: 0 8px 18px rgba(0,0,0,.55); }
  .stick > :last-child { margin-bottom: 0; }
</style>

    <h1>💱 Döviz &amp; Altın</h1>
    <span style="width:46px"></span>
  </header>

  </div>

<script>
const A = [
  { k: "usd", n: "Dolar", s: "USD", u: "", d: 4, ic: "💵" },
  { k: "eur", n: "Euro", s: "EUR", u: "", d: 4, ic: "💶" },
  { k: "gbp", n: "Sterlin", s: "GBP", u: "", d: 4, ic: "💷" },
  { k: "xau", n: "Altın", s: "gr", u: "/gr", d: 2, ic: "🥇" },
  { k: "xag", n: "Gümüş", s: "gr", u: "/gr", d: 2, ic: "🥈" },
  { k: "xpt", n: "Platin", s: "gr", u: "/gr", d: 2, ic: "⚪" },
  { k: "xpd", n: "Paladyum", s: "gr", u: "/gr", d: 2, ic: "🔘" },
];
const AK = Object.fromEntries(A.map((a) => [a.k, a]));
let D = null, N = 0;
const S = load("piyasa_v1", { sel: "xau", range: "5Y", tmode: "pct", amt: 100000, date: null, mode: "tek", w: { usd: 20, eur: 20, gbp: 0, xau: 40, xag: 10, xpt: 5, xpd: 5 } });

function load(k, def) { try { return Object.assign(def, JSON.parse(localStorage.getItem(k) || "{}")); } catch (e) { return def; } }
function save() { try { localStorage.setItem("piyasa_v1", JSON.stringify(S)); } catch (e) {} }
const $ = (x) => document.getElementById(x);
const nf = (v, d = 2) => Number(v).toLocaleString("tr-TR", { minimumFractionDigits: d, maximumFractionDigits: d });
const tl = (v) => nf(v, v >= 1000 ? 0 : 2) + " TL";
const pct = (v, d = 1) => (v > 0 ? "+" : v < 0 ? "−" : "") + nf(Math.abs(v), d) + "%";
const cls = (v) => (v > 0 ? "up" : v < 0 ? "down" : "");
const arrow = (v) => (v > 0 ? "▲" : v < 0 ? "▼" : "•");
const fdate = (s, o = { day: "numeric", month: "long", year: "numeric" }) => new Date(s + "T12:00:00").toLocaleDateString("tr-TR", o);
const iso = (d) => d.toISOString().slice(0, 10);

function idxOn(s) { // tarih <= s olan son gün
  let lo = 0, hi = N - 1;
  if (s < D.dates[0]) return 0;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (D.dates[m] <= s) lo = m; else hi = m - 1; }
  return lo;
}
function shiftYears(s, y) { const d = new Date(s + "T12:00:00"); d.setFullYear(d.getFullYear() + y); return iso(d); }
function chgSince(k, s) { const i = idxOn(s); return (D[k][N - 1] / D[k][i] - 1) * 100; }

/* ---------- TÜFE ---------- */
let T = null;
const AYLAR = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
function ymPrev(ym) { let [y, m] = ym.split("-").map(Number); m--; if (!m) { y--; m = 12; } return `${y}-${String(m).padStart(2, "0")}`; }
function buildCpi(j) {
  const ms = Object.keys(j.monthly).sort(), lv = {};
  const first = ymPrev(ms[0]); let L = 100; lv[first] = L;
  for (const k of ms) { L *= 1 + j.monthly[k] / 100; lv[k] = L; }
  T = { lv, first, last: ms[ms.length - 1] };
}
function cpiAt(s) { // ay sonu endeksleri arasında gün bazında geometrik ara değer
  const ym = s.slice(0, 7);
  if (ym <= T.first) return T.lv[T.first];
  if (ym > T.last) return T.lv[T.last];
  const a = T.lv[ymPrev(ym)], b = T.lv[ym];
  const d = +s.slice(8, 10), dim = new Date(+s.slice(0, 4), +s.slice(5, 7), 0).getDate();
  return a * Math.pow(b / a, d / dim);
}
const cpiChg = (s0, s1) => (cpiAt(s1) / cpiAt(s0) - 1) * 100;
const real = (p, c) => ((1 + p / 100) / (1 + c / 100) - 1) * 100;
const cpiLast = () => { const [y, m] = T.last.split("-"); return AYLAR[+m - 1] + " " + y; };

/* ---------- Grafik ---------- */
function drawLine(el, xs, ys, fmt, opt = {}) {
  const W = el.clientWidth || 320, H = el.clientHeight || 220;
  const pl = 6, pr = 54, pt = 10, pb = 22;
  let min = Math.min(...ys), max = Math.max(...ys);
  if (opt.base != null) { min = Math.min(min, opt.base); max = Math.max(max, opt.base); }
  if (opt.ref) { min = Math.min(min, ...opt.ref); max = Math.max(max, ...opt.ref); }
  const pad = (max - min) * 0.08 || 1; min -= pad; max += pad;
  const X = (i) => pl + (i / Math.max(1, xs.length - 1)) * (W - pl - pr);
  const Y = (v) => pt + (1 - (v - min) / (max - min)) * (H - pt - pb);
  // y eksen: 4 düzgün çizgi
  const step = niceStep((max - min) / 4);
  let grid = "";
  for (let j = Math.ceil(min / step); j * step <= max; j++) {
    const v = j * step;
    grid += `<line x1="${pl}" x2="${W - pr}" y1="${Y(v)}" y2="${Y(v)}" stroke="#1f1f1f"/>`
      + `<text x="${W - pr + 6}" y="${Y(v) + 4}" fill="#6f6f6f" font-size="11">${shortNum(v)}</text>`;
  }
  // x eksen: yıllar
  let xl = "", lastY = "";
  xs.forEach((s, i) => {
    const y = s.slice(0, 4);
    if (y !== lastY && i > 0) {
      xl += `<line x1="${X(i)}" x2="${X(i)}" y1="${pt}" y2="${H - pb}" stroke="#181818"/>`
        + `<text x="${X(i) + 3}" y="${H - 6}" fill="#6f6f6f" font-size="11">${y}</text>`;
    }
    lastY = y;
  });
  let d = "";
  ys.forEach((v, i) => (d += (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1)));
  const area = d + `L${X(ys.length - 1)},${H - pb}L${X(0)},${H - pb}Z`;
  const base = opt.base != null ? `<line x1="${pl}" x2="${W - pr}" y1="${Y(opt.base)}" y2="${Y(opt.base)}" stroke="#8a8a8a" stroke-dasharray="4 4"/><text x="${pl + 2}" y="${Y(opt.base) - 5}" fill="#8a8a8a" font-size="11">${opt.baseLabel || ""}</text>` : "";
  let ref = "";
  if (opt.ref) {
    let rd = ""; opt.ref.forEach((v, i) => (rd += (i ? "L" : "M") + X(i).toFixed(1) + "," + Y(v).toFixed(1)));
    const ly = Y(opt.ref[opt.ref.length - 1]);
    ref = `<path d="${rd}" fill="none" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="5 4"/>`
      + `<text x="${X(opt.ref.length - 1) - 4}" y="${ly + (ly < pt + 20 ? 16 : -7)}" text-anchor="end" fill="#bdbdbd" font-size="11">${opt.refLabel || ""}</text>`;
  }
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="${opt.label || ""}">
    <defs><linearGradient id="g_${el.id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e0a24f" stop-opacity=".22"/><stop offset="1" stop-color="#e0a24f" stop-opacity="0"/></linearGradient></defs>
    ${grid}${xl}${base}
    <path d="${area}" fill="url(#g_${el.id})"/>
    ${ref}
    <path d="${d}" fill="none" stroke="#e0a24f" stroke-width="2" stroke-linejoin="round"/>
    <line class="cx" y1="${pt}" y2="${H - pb}" stroke="#bdbdbd" stroke-width="1" visibility="hidden"/>
    <circle class="cd" r="5" fill="#e0a24f" stroke="#0d0d0d" stroke-width="2" visibility="hidden"/>
  </svg><div class="tip"></div>`;
  const svg = el.querySelector("svg"), cx = svg.querySelector(".cx"), cd = svg.querySelector(".cd"), tip = el.querySelector(".tip");
  const move = (e) => {
    const r = svg.getBoundingClientRect();
    const px = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) * (W / r.width);
    const i = Math.max(0, Math.min(xs.length - 1, Math.round(((px - pl) / (W - pl - pr)) * (xs.length - 1))));
    cx.setAttribute("x1", X(i)); cx.setAttribute("x2", X(i)); cx.setAttribute("visibility", "visible");
    cd.setAttribute("cx", X(i)); cd.setAttribute("cy", Y(ys[i])); cd.setAttribute("visibility", "visible");
    tip.innerHTML = `<b>${fmt(ys[i])}</b>${opt.ref ? `<span style="color:#bdbdbd">${opt.refLabel}: ${fmt(opt.ref[i])}</span><br>` : ""}${fdate(xs[i])}`;
    tip.style.display = "block";
    const left = (X(i) / W) * r.width;
    tip.style.left = Math.max(60, Math.min(r.width - 60, left)) + "px";
  };
  const hide = () => { cx.setAttribute("visibility", "hidden"); cd.setAttribute("visibility", "hidden"); tip.style.display = "none"; };
  svg.addEventListener("pointermove", move);
  svg.addEventListener("pointerdown", move);
  svg.addEventListener("pointerleave", hide);
  svg.addEventListener("touchmove", move, { passive: true });
  svg.addEventListener("touchend", () => setTimeout(hide, 1500));
}
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p; }
function shortNum(v) {
  const a = Math.abs(v);
  if (a < 1e-9) return "0";
  if (a >= 1e6) return nf(v / 1e6, 1) + " mn";
  if (a >= 1e4) return nf(v / 1e3, 0) + " bin";
  if (a >= 100) return nf(v, 0);
  return nf(v, a >= 10 ? 1 : 2);
}
function sample(lo, hi, max = 260) { // grafik için en fazla ~260 nokta
  const out = [], step = Math.max(1, Math.ceil((hi - lo + 1) / max));
  for (let i = lo; i <= hi; i += step) out.push(i);
  if (out[out.length - 1] !== hi) out.push(hi);
  return out;
}

/* ---------- Bölümler ---------- */
function renderTiles() {
  const last = D.dates[N - 1];
  $("tiles").innerHTML = A.map((a) => {
    const v = D[a.k][N - 1], c1 = chgSince(a.k, shiftYears(last, -1)), c5 = chgSince(a.k, shiftYears(last, -5));
    return `<button class="tile ${S.sel === a.k ? "sel" : ""}" data-k="${a.k}">
      <div class="n"><span>${a.ic} ${a.n}</span><span>${a.u ? "TL/gr" : a.s + "/TL"}</span></div>
      <div class="v num">${nf(v, a.d)}</div>
      <div class="c num"><span class="${cls(c1)}">1Y ${pct(c1, 0)}</span><span class="${cls(c5)}">5Y ${pct(c5, 0)}</span></div>
    </button>`;
  }).join("");
}

function renderChart() {
  const a = AK[S.sel], last = D.dates[N - 1];
  const from = { "1Y": shiftYears(last, -1), "3Y": shiftYears(last, -3), "5Y": shiftYears(last, -5), "Tümü": D.dates[0] }[S.range];
  const lo = idxOn(from), idx = sample(lo, N - 1);
  const ys = idx.map((i) => D[a.k][i]), xs = idx.map((i) => D.dates[i]);
  const ch = (D[a.k][N - 1] / D[a.k][lo] - 1) * 100;
  $("chead").innerHTML = `<div><div style="font-size:13px;color:var(--muted)">${a.ic} ${a.n} ${a.u ? "(TL/gram)" : "(TL)"}</div><div class="big num">${nf(D[a.k][N - 1], a.d)} TL</div></div>
    <div class="chg num ${cls(ch)}" style="text-align:right">${arrow(ch)} ${pct(ch)}<div style="color:var(--muted);font-size:11px">${S.range === "Tümü" ? fdate(D.dates[0], { month: "short", year: "numeric" }) + "'den beri" : S.range.replace("Y", " yılda")}</div></div>`;
  document.querySelectorAll("#ranges .chip").forEach((c) => c.classList.toggle("on", c.dataset.r === S.range));
  drawLine($("chart"), xs, ys, (v) => nf(v, a.d) + " TL", { label: a.n + " fiyat grafiği" });
}

function yearEnds() {
  const last = D.dates[N - 1], ly = +last.slice(0, 4);
  const rows = [];
  for (let y = 2021; y <= ly; y++) {
    const i0 = idxOn(`${y - 1}-12-31`), i1 = y === ly ? N - 1 : idxOn(`${y}-12-31`);
    rows.push({ y, i0, i1, ytd: y === ly });
  }
  return rows;
}
function renderTable() {
  const rows = yearEnds(), last = D.dates[N - 1], m = S.tmode;
  document.querySelectorAll("#tmode button").forEach((b) => b.classList.toggle("on", b.dataset.m === m));
  const cell = (p, d = 1) => `<td class="p ${p >= 0 ? "pos" : "neg"}">${pct(p, d)}</td>`;
  const cpiCell = (c, d = 1) => `<td class="p" style="background:#1c1c1c;color:#d0d0d0">${pct(c, d)}</td>`;
  let h = `<table class="num"><thead><tr><th>Yıl</th>${A.map((a) => `<th>${a.n}</th>`).join("")}<th>TL${m === "val" ? " (100 TL)" : ""}</th>${m !== "val" ? "<th>TÜFE</th>" : ""}</tr></thead><tbody>`;
  const tlCell = (v) => `<td class="p" style="background:rgba(224,71,58,.08)">${v}</td>`;
  const row = (label, i0, i1, d, c0, c1) => {
    const c = cpiChg(c0 || D.dates[i0], c1 || D.dates[i1]);
    let r = `<tr${d === 0 ? ' class="tot"' : ""}><td>${label}</td>`;
    for (const a of A) {
      const v0 = D[a.k][i0], v1 = D[a.k][i1], p = (v1 / v0 - 1) * 100;
      r += m === "pct" ? cell(p, d) : m === "reel" ? cell(real(p, c), d) : `<td>${nf(v1, v1 >= 1000 ? 0 : 2)}</td>`;
    }
    // TL (yastık altı): nominal 0, reel = enflasyon kadar kayıp; değer modunda 2020 sonundaki 100 TL'nin alım gücü
    if (m === "pct") r += tlCell(`${pct(0, d)}`);
    else if (m === "reel") r += `<td class="p neg" style="background:rgba(224,71,58,.08)">${pct(real(0, c), d)}</td>`;
    else r += tlCell(nf(100 * cpiAt(d === 0 ? D.dates[i0] : "2020-12-31") / cpiAt(c1 || D.dates[i1]), 1));
    if (m !== "val") r += cpiCell(c, d);
    return r + "</tr>";
  };
  for (const r of rows) h += row(`${r.y}${r.ytd ? ' <span style="color:var(--muted);font-size:11px">(bugüne)</span>' : ""}`, r.i0, r.i1, 1, `${r.y - 1}-12-31`, r.ytd ? last : `${r.y}-12-31`);
  const s5 = shiftYears(last, -5);
  if (m === "val") {
    // Değer modunda başlangıç (5 yıl önce) fiyatlarını ayrıca göster: yıl sonu değerleriyle karışmasın
    const i5 = idxOn(s5);
    h += `<tr class="tot"><td>5 yıl önce<br><span style="color:var(--muted);font-size:11px">${fdate(D.dates[i5], { day: "numeric", month: "short", year: "numeric" })}</span></td>${A.map((a) => { const v = D[a.k][i5]; return `<td>${nf(v, v >= 1000 ? 0 : 2)}</td>`; }).join("")}<td class="p" style="background:rgba(224,71,58,.08)">100,0</td></tr>`;
    h += `<tr class="tot"><td>Bugün</td>${A.map((a) => { const v = D[a.k][N - 1]; return `<td>${nf(v, v >= 1000 ? 0 : 2)}</td>`; }).join("")}<td class="p" style="background:rgba(224,71,58,.08)">${nf(100 * cpiAt(D.dates[i5]) / cpiAt(last), 1)}</td></tr>`;
  } else h += row("5 yıl", idxOn(s5), N - 1, 0);
  h += `</tbody></table>`;
  $("table").innerHTML = h;
  const d5 = fdate(D.dates[idxOn(s5)]);
  $("tnote").textContent = m === "pct"
    ? `Her yıl, bir önceki yıl sonuna göre TL bazında değişim; TL sütunu yastık altında tutulan parayı gösterir (nominal %0); son sütun aynı dönemin TÜFE enflasyonu. "5 yıl" satırı ${d5}'den bugüne. TÜFE ${cpiLast()} verisine kadardır.`
    : m === "reel"
    ? `Reel getiri = enflasyondan arındırılmış getiri. Pozitifse varlık enflasyonu yenmiş, alım gücü artmış demektir. TL sütunu, yastık altındaki paranın yıllık alım gücü kaybıdır. TÜFE ${cpiLast()} verisine kadardır.`
    : `Yıl satırları o yılın 31 Aralık kapanış fiyatıdır (TL; madenler gram) — alış tarihi değildir. Alış fiyatı için "5 yıl önce" satırına bak (${d5}). TL sütunu: 2020 sonunda (alt iki satırda ${d5}'de) cebinde olan 100 TL'nin o tarihteki alım gücü.`;
}

function simInputs() {
  const amt = Math.max(0, Number(String($("amt").value).replace(/\./g, "").replace(",", ".")) || 0);
  let date = $("sdate").value || shiftYears(D.dates[N - 1], -5);
  if (date < D.dates[0]) date = D.dates[0];
  return { amt, i0: idxOn(date) };
}

function renderSingle() {
  const { amt, i0 } = simInputs();
  const c = cpiChg(D.dates[i0], D.dates[N - 1]), need = amt * (1 + c / 100);
  const list = A.map((a) => {
    const p0 = D[a.k][i0], p1 = D[a.k][N - 1], units = amt / p0, now = units * p1;
    return { a, units, now, p: (now / amt - 1) * 100 };
  });
  list.push({ cpi: true, now: need, p: c });
  list.sort((x, y) => y.p - x.p);
  const maxNow = Math.max(amt, ...list.map((x) => x.now));
  let r = 0;
  let h = list.map((x) => {
    if (x.cpi) return `<div class="ri base" style="border-color:#6a6a6a">
      <div class="a"><span class="rank"></span>📈 Enflasyon (TÜFE)</div><div class="now num">${tl(x.now)}</div>
      <div class="then">Alım gücünü korumak için gereken tutar</div><div class="pct num" style="color:#d0d0d0">${pct(x.p)}</div>
      <div class="bar"><i style="width:${(x.now / maxNow) * 100}%;background:#8a8a8a"></i></div></div>
      <div class="note" style="text-align:center;margin:-2px 0">▲ Üsttekiler enflasyonu yendi · alttakiler alım gücü kaybettirdi ▼</div>`;
    r++;
    const rp = real(x.p, c);
    return `<div class="ri">
      <div class="a"><span class="rank">${r}.</span>${x.a.ic} ${x.a.n}</div>
      <div class="now num">${tl(x.now)}</div>
      <div class="then num">O gün ${nf(x.units, 2)} ${x.a.u ? "gram" : x.a.s} alırdın · reel <span class="${cls(rp)}">${pct(rp)}</span></div>
      <div class="pct num ${cls(x.p)}">${pct(x.p)}</div>
      <div class="bar"><i style="width:${(x.now / maxNow) * 100}%"></i></div>
    </div>`;
  }).join("");
  const tlReal = amt / (1 + c / 100);
  h += `<div class="ri base" style="border-color:#7a2e28;background:rgba(224,71,58,.06)"><div class="a"><span class="rank"></span>💴 TL olarak tutsaydın</div><div class="now num">${tl(amt)}</div>
      <div class="then num">Faizsiz, yastık altı · bugünkü alım gücü <b class="down">${tl(tlReal)}</b> · ${tl(amt - tlReal)} değer kaybı</div><div class="pct num down">${pct(real(0, c))}</div>
      <div class="bar"><i style="width:${(tlReal / maxNow) * 100}%;background:#e0473a"></i></div></div>
      <div class="note" style="text-align:center;margin:2px 0 0">TL'de tutulan ${tl(amt)}, enflasyon yüzünden bugün ${fdate(D.dates[i0])} tarihindeki ${tl(tlReal)} kadar mal alabiliyor.</div>`;
  $("single").innerHTML = h;
}

const BA = [...A, { k: "try", n: "TL (yastık altı)", s: "TL", u: "", ic: "💴" }];
const price = (k, i) => (k === "try" ? 1 : D[k][i]);
function renderBasket() {
  const { amt, i0 } = simInputs();
  const sumAll = BA.reduce((s, a) => s + (Number(S.w[a.k]) || 0), 0);
  const kalan = Math.max(0, 100 - sumAll);
  $("wsum").innerHTML = sumAll > 100
    ? `<span>Toplam: <b class="bad">%${sumAll}</b> <span style="color:var(--muted);font-size:12px">(%${sumAll - 100} fazla — oranlar %100'e ölçeklendi)</span></span>`
    : `<span>Dağıtılan: <b>%${sumAll}</b> = ${tl(amt * sumAll / 100)}${kalan ? ` <span style="color:var(--muted);font-size:12px">· kalan <b style="color:var(--ink)">%${kalan} (${tl(amt * kalan / 100)})</b> TL olarak kalır</span>` : " ✓"}<br><span style="color:var(--muted);font-size:12px">Toplam yatırım ${tl(amt)}'yi geçemez; payların toplamı en fazla %100 olabilir.</span></span>`;
  BA.forEach((a) => {
    $("r_" + a.k).value = S.w[a.k] || 0; $("n_" + a.k).value = S.w[a.k] || 0;
    const w = (Number(S.w[a.k]) || 0) + (a.k === "try" ? kalan : 0);
    $("m_" + a.k).textContent = w ? tl(amt * w / Math.max(100, sumAll)) + (a.k === "try" && kalan ? " (kalan dahil)" : "") : "";
  });
  if (!amt) { $("bres").innerHTML = '<div class="note" style="text-align:center;padding:16px 0">Tutar gir.</div>'; return; }
  // Oranlar %100'den azsa kalan kısım TL olarak durur (ölçeklenmez); fazlaysa %100'e ölçeklenir
  const div = Math.max(100, sumAll);
  const wOf = (k) => ((Number(S.w[k]) || 0) + (k === "try" ? kalan : 0)) / div;
  const units = {};
  BA.forEach((a) => { units[a.k] = (amt * wOf(a.k)) / price(a.k, i0); });
  const valAt = (i) => BA.reduce((s, a) => s + units[a.k] * price(a.k, i), 0);
  const now = valAt(N - 1), p = (now / amt - 1) * 100;
  const yrs = (new Date(D.dates[N - 1]) - new Date(D.dates[i0])) / (365.25 * 864e5);
  const cagr = yrs > 0.1 ? (Math.pow(now / amt, 1 / yrs) - 1) * 100 : p;
  const usdNow = amt / D.usd[i0] * D.usd[N - 1];
  const vsUsd = (now / usdNow - 1) * 100;
  const c = cpiChg(D.dates[i0], D.dates[N - 1]), rp = real(p, c), need = amt * (1 + c / 100);
  const parts = BA.filter((a) => units[a.k] > 0).map((a) => {
    const v = units[a.k] * price(a.k, N - 1), inv = amt * wOf(a.k), isT = a.k === "try";
    const rr = real((v / inv - 1) * 100, c);
    return `<div class="ri"${isT ? ' style="border-color:#7a2e28;background:rgba(224,71,58,.06)"' : ""}><div class="a">${a.ic} ${a.n} <span style="color:var(--muted);font-weight:500;font-size:12px">%${nf(wOf(a.k) * 100, 0)}</span></div>
      <div class="now num">${tl(v)}</div>
      <div class="then num">${isT ? `Alım gücü bugün <b class="down">${tl(inv / (1 + c / 100))}</b>` : `${tl(inv)} → ${nf(units[a.k], 2)} ${a.u ? "gram" : a.s}`} · reel <span class="${cls(rr)}">${pct(rr)}</span></div>
      <div class="pct num ${cls(v / inv - 1)}">${pct((v / inv - 1) * 100)}</div></div>`;
  }).join("");
  $("bres").innerHTML = `
    <div class="hero"><div class="l">Sepetinin bugünkü değeri</div><div class="big num">${tl(now)}</div>
      <div class="num ${cls(p)}" style="font-weight:700">${arrow(p)} ${pct(p)} · ${tl(now - amt)} ${now >= amt ? "kazanç" : "kayıp"}</div></div>
    <div class="ri base" style="border-color:#7a2e28;background:rgba(224,71,58,.06);margin:-4px 0 12px">
      <div class="a"><span class="rank"></span>💴 Aynı parayı TL (yastık altı) tutsaydın</div><div class="now num">${tl(amt)}</div>
      <div class="then num">Bugünkü alım gücü <b class="down">${tl(amt / (1 + c / 100))}</b> · sepet TL'ye göre <b class="${cls(now - amt)}">${now >= amt ? "+" : "−"}${tl(Math.abs(now - amt))}</b></div>
      <div class="pct num down">${pct(real(0, c))}</div></div>
    <div class="stats num" style="grid-template-columns:repeat(2,1fr)">
      <div><small>Enflasyondan arındırılmış</small><b class="${cls(rp)}">${pct(rp)}</b></div>
      <div><small>Aynı dönemde TÜFE</small><b>${pct(c)}</b></div>
      <div><small>Yıllık ortalama (${nf(yrs, 1)} yıl)</small><b class="${cls(cagr)}">${pct(cagr)}</b></div>
      <div><small>Dolara göre</small><b class="${cls(vsUsd)}">${pct(vsUsd)}</b></div>
    </div>
    <div class="note" style="text-align:center;margin:-4px 0 12px">${rp >= 0 ? "✅ Sepetin enflasyonu yendi" : "⚠️ Sepetin enflasyonun gerisinde kaldı"}: alım gücünü korumak için ${tl(need)} gerekiyordu.</div>
    <div class="chart" id="bchart" style="height:180px"></div>
    <div class="note" style="margin:6px 0 12px"><span style="color:var(--accent)">━</span> Sepet değeri · <span style="color:#9a9a9a">╍</span> Enflasyonla aynı hızda artsaydı · alttaki ince kesikli çizgi başlangıçtaki ${tl(amt)}</div>
    <div class="res">${parts}</div>`;
  const idx = sample(i0, N - 1, 200);
  const d0 = D.dates[i0];
  drawLine($("bchart"), idx.map((i) => D.dates[i]), idx.map(valAt), (v) => tl(v), { base: amt, baseLabel: "Başlangıç", label: "Sepet değeri", ref: idx.map((i) => amt * cpiAt(D.dates[i]) / cpiAt(d0)), refLabel: "Enflasyon" });
}

function markQuick() {
  const last = D.dates[N - 1], cur = $("sdate").value;
  document.querySelectorAll("#quick button").forEach((b) => b.classList.toggle("on", cur === shiftYears(last, -b.dataset.y)));
}
function renderSim() {
  markQuick();
  document.querySelectorAll("#smode button").forEach((b) => b.classList.toggle("on", b.dataset.m === S.mode));
  $("singleBox").style.display = S.mode === "tek" ? "" : "none";
  $("basketBox").style.display = S.mode === "sepet" ? "" : "none";
  const { i0 } = simInputs();
  $("simnote").textContent = `Hesap ${fdate(D.dates[i0])} kapanışı ile ${fdate(D.dates[N - 1])} arasındadır. Enflasyon TÜİK TÜFE, ${cpiLast()} verisine kadar.`;
  if (S.mode === "tek") renderSingle(); else renderBasket();
}

function build() {
  const last = D.dates[N - 1];
  if (!S.date) S.date = shiftYears(last, -5);
  $("upd").textContent = `Son veri: ${fdate(last)} · güncelleme ${D.updated.slice(11)}`;
  $("app").innerHTML = `
  <div class="card"><h2>Güncel</h2><div class="grid" id="tiles"></div>
    <div class="note" style="margin-top:8px">1Y: son 1 yıl, 5Y: son 5 yıl TL bazında değişim. Bir kutuya dokununca grafiği açılır.</div></div>

  <div class="card"><div class="chead" id="chead"></div>
    <div class="chips" id="ranges">${["1Y", "3Y", "5Y", "Tümü"].map((r) => `<span class="chip" data-r="${r}">${r === "Tümü" ? "Tümü" : r.replace("Y", " yıl")}</span>`).join("")}</div>
    <div class="chart" id="chart"></div></div>

  <div class="card"><h2>Yıllık görünüm</h2>
    <div class="seg" id="tmode"><button data-m="pct">Getiri %</button><button data-m="reel">Reel %</button><button data-m="val">Değer</button></div>
    <div class="tbl" id="table"></div>
    <div class="note" id="tnote" style="margin-top:8px"></div></div>

  <div class="card"><h2>Geçmişte yatırsaydın</h2>
    <div class="inrow">
      <div><label class="f" for="amt">Tutar (TL)</label><input id="amt" type="text" inputmode="numeric" value="${nf(S.amt, 0)}"></div>
      <div><label class="f" for="sdate">Başlangıç tarihi</label><input id="sdate" type="date" min="${D.dates[0]}" max="${last}" value="${S.date}"></div>
    </div>
    <div class="quick" id="quick">${[1, 2, 3, 4, 5].map((y) => `<button data-y="${y}">${y} yıl önce</button>`).join("")}</div>
    <div class="seg" id="smode"><button data-m="tek">Tek tek</button><button data-m="sepet">🧺 Sepetim</button></div>
    <div id="singleBox"><div class="res" id="single"></div></div>
    <div id="basketBox">
      <div class="presets" id="presets">
        <button data-p="esit">Eşit dağıt</button>
        <button data-p="klasik">Klasik (½ altın, ¼ $, ¼ €)</button>
        <button data-p="maden">Sadece madenler</button>
        <button data-p="doviz">Sadece döviz</button>
        <button data-p="tl">Sadece TL</button>
        <button data-p="sifir">Sıfırla</button>
      </div>
      <div class="alloc">${BA.map((a) => `<div class="al"><span>${a.ic} ${a.n}<small id="m_${a.k}"></small></span>
        <input type="range" min="0" max="100" step="5" id="r_${a.k}" data-k="${a.k}" aria-label="${a.n} oranı">
        <input type="number" min="0" max="100" id="n_${a.k}" data-k="${a.k}" inputmode="numeric" aria-label="${a.n} yüzde"></div>`).join("")}</div>
      <div class="sum" id="wsum"></div>
      <div id="bres"></div>
    </div>
    <div class="note" id="simnote" style="margin-top:10px"></div></div>

  <div class="note" style="text-align:center;padding:0 8px">${D.source} Altın gram fiyatı uluslararası ons fiyatından hesaplanır; kuyumcu ve banka alış-satış fiyatları farklıdır. Enflasyon: TÜİK TÜFE aylık değişimleri. Yatırım tavsiyesi değildir.</div>`;

  $("tiles").onclick = (e) => { const b = e.target.closest(".tile"); if (!b) return; S.sel = b.dataset.k; save(); renderTiles(); renderChart(); $("chart").scrollIntoView({ behavior: "smooth", block: "center" }); };
  $("ranges").onclick = (e) => { const c = e.target.closest(".chip"); if (!c) return; S.range = c.dataset.r; save(); renderChart(); };
  $("tmode").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S.tmode = b.dataset.m; save(); renderTable(); };
  $("smode").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S.mode = b.dataset.m; save(); renderSim(); };
  $("amt").addEventListener("input", () => { const v = simInputs().amt; S.amt = v; save(); renderSim(); });
  $("amt").addEventListener("blur", () => { $("amt").value = nf(S.amt, 0); });
  $("sdate").addEventListener("change", () => { S.date = $("sdate").value; save(); renderSim(); });
  $("quick").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; S.date = shiftYears(last, -b.dataset.y); $("sdate").value = S.date; save(); renderSim(); };
  // Toplam %100'ü (yani yatırılan tutarı) geçemez: bir kalemi artırınca en fazla kalan pay kadar artar
  const setW = (k, v) => {
    const others = BA.reduce((t, a) => t + (a.k === k ? 0 : Number(S.w[a.k]) || 0), 0);
    S.w[k] = Math.max(0, Math.min(100 - others, Math.round(Number(v) || 0)));
    save(); renderBasket();
  };
  document.querySelectorAll(".al input").forEach((inp) => inp.addEventListener("input", () => setW(inp.dataset.k, inp.value)));
  $("presets").onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const P = {
      esit: { usd: 15, eur: 15, gbp: 10, xau: 15, xag: 15, xpt: 10, xpd: 5, try: 15 },
      klasik: { usd: 25, eur: 25, gbp: 0, xau: 50, xag: 0, xpt: 0, xpd: 0, try: 0 },
      maden: { usd: 0, eur: 0, gbp: 0, xau: 55, xag: 25, xpt: 10, xpd: 10, try: 0 },
      doviz: { usd: 40, eur: 40, gbp: 20, xau: 0, xag: 0, xpt: 0, xpd: 0, try: 0 },
      tl: { usd: 0, eur: 0, gbp: 0, xau: 0, xag: 0, xpt: 0, xpd: 0, try: 100 },
      sifir: { usd: 0, eur: 0, gbp: 0, xau: 0, xag: 0, xpt: 0, xpd: 0, try: 0 },
    };
    S.w = { ...P[b.dataset.p] }; save(); renderBasket();
  };
  let rt; window.addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(() => { renderChart(); if (S.mode === "sepet") renderBasket(); }, 150); });

  renderTiles(); renderChart(); renderTable(); renderSim();
}

const getJ = (u) => fetch(u + "?t=" + Date.now(), { cache: "no-store" }).then((r) => r.json());
Promise.all([getJ("data/piyasa.json"), getJ("data/tufe.json")])
  .then(([j, t]) => { D = j; N = j.dates.length; buildCpi(t); build(); })
  .catch((e) => { console.error(e); $("app").innerHTML = '<div class="empty">Veriler yüklenemedi. Biraz sonra tekrar dene.</div>'; $("upd").textContent = ""; });
</script>
