  :root { --bg: #000; --card: #0d0d0d; --field: #161616; --line: #262626; --ink: #f2f2f2; --muted: #8a8a8a; --gold: #e0a24f; --up: #6ab8ff; --down: #ff8a66; --win: #3fc283; }

  /* Kasa kapısı */

  .inside { position: absolute; inset: 0; border-radius: 22px; background: radial-gradient(circle at 50% 42%, #4a3510, #1a1206 62%, #0b0703); border: 3px solid #3a2b12; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-shadow: inset 0 0 50px #000; overflow: hidden; }

  .inside small { color: #c9a66a; font-size: 12px; letter-spacing: 1px; }
  .door { position: absolute; inset: 0; border-radius: 22px; transform-origin: 0 50%; transition: transform 1.15s cubic-bezier(.3,.7,.2,1); z-index: 2;

    border: 3px solid #8a6a2f; box-shadow: inset 0 0 0 6px #1b1d21, inset 0 0 0 8px #a37a33, inset 0 10px 30px rgba(255,255,255,.05), 0 14px 30px rgba(0,0,0,.65);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px 14px; }
  .door::before { content: ""; position: absolute; inset: 13px; border-radius: 14px; pointer-events: none;
    background: radial-gradient(circle at 7px 7px, #e9c47a 0 2.6px, #6b4e1f 3.2px, transparent 4px), radial-gradient(circle at calc(100% - 7px) 7px, #e9c47a 0 2.6px, #6b4e1f 3.2px, transparent 4px),
      radial-gradient(circle at 7px calc(100% - 7px), #e9c47a 0 2.6px, #6b4e1f 3.2px, transparent 4px), radial-gradient(circle at calc(100% - 7px) calc(100% - 7px), #e9c47a 0 2.6px, #6b4e1f 3.2px, transparent 4px); }
  .door.yil { background: radial-gradient(130% 100% at 28% 18%, #6a4a2c, #3d2817 55%, #24170c); }
  .vault.open .door { transform: rotateY(-106deg); }
  .vault.shake .door { animation: shake .42s; }
  .vault.parla .door { animation: parla .6s ease-out; }
  @keyframes parla { 0% { box-shadow: inset 0 0 0 6px #1b1d21, inset 0 0 0 8px #a37a33, 0 0 0 0 rgba(63,194,131,.9); } 40% { box-shadow: inset 0 0 0 6px #1b1d21, inset 0 0 0 8px #7dffb0, 0 0 30px 8px rgba(63,194,131,.7); } }
  @keyframes shake { 20% { transform: translateX(-7px) rotate(-.6deg); } 40% { transform: translateX(6px) rotate(.5deg); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }

  .led.up { color: #8fd0ff; background: #06101a; border-color: #1b3550; }
  .led.down { color: #ffa98a; background: #1a0a06; border-color: #4d2316; }
  .led.warn { color: #ffd780; background: #171104; border-color: #4a3a12; }

  .disp span.bos { color: rgba(42,25,4,.25); }

  .heat .mk { position: absolute; top: 50%; left: 0; width: 20px; height: 20px; border-radius: 50%; background: #fff; border: 3px solid #0b0b0b; transform: translate(-50%, -50%); transition: left .55s cubic-bezier(.3,.7,.2,1); box-shadow: 0 0 12px rgba(255,255,255,.7); }
  .heat .mk.yok { opacity: 0; }
  .heat .lb { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 5px; }
  /* Cetvel: kalan aralık */

  .cet .alive { position: absolute; top: 19px; height: 12px; border-radius: 99px; background: linear-gradient(90deg, #b8862e, #f6d48d, #b8862e); box-shadow: 0 0 14px rgba(240,190,90,.5); transition: left .6s cubic-bezier(.3,.7,.2,1), width .6s cubic-bezier(.3,.7,.2,1); min-width: 6px; }
  .cet .g { position: absolute; top: 15px; width: 2px; height: 20px; margin-left: -1px; border-radius: 1px; }

  .cet .r { position: absolute; top: 0; font: 800 12px ui-monospace, Menlo, monospace; color: #ffd88a; transform: translateX(-50%); white-space: nowrap; transition: left .6s; }
  .row2 { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
  .hak { display: flex; gap: 4px; flex-wrap: wrap; }
  .hak i { width: 11px; height: 11px; border-radius: 50%; background: #262626; }

  .jok { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 10px; }
  .jok button { border: 1px dashed #5a4620; background: #120e07; color: #f0dcb3; border-radius: 12px; padding: 7px 4px 6px; font: 700 12.5px system-ui, sans-serif; cursor: pointer; line-height: 1.2; }
  .jok button small { display: block; font-weight: 500; color: #9a8763; font-size: 10.5px; margin-top: 1px; }

  .hist { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; margin-top: 10px; min-height: 26px; }
  .chip { padding: 3px 9px; border-radius: 99px; font: 700 13px ui-monospace, Menlo, monospace; background: #1a1a1a; border: 1px solid #262626; }
  .chip.up { color: var(--up); } .chip.down { color: var(--down); }

  .note { text-align: center; font-size: 12px; color: var(--muted); margin-top: 10px; line-height: 1.45; }
  .linkbtn { display: block; width: 100%; margin-top: 10px; padding: 11px; border-radius: 14px; border: 1px solid var(--gold); background: transparent; color: var(--gold); font: 700 14.5px system-ui, sans-serif; cursor: pointer; }

  /* Ters Köşe */
  .bot { display: flex; gap: 10px; align-items: flex-start; margin: 4px 0 12px; }
  .av { width: 54px; height: 54px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; font: italic 700 30px Georgia, "Times New Roman", serif; color: #1a1205; background: radial-gradient(circle at 35% 30%, #fff1c9, #e0a24f 55%, #8a5d1d); box-shadow: 0 0 0 2px #2b2110, 0 0 18px rgba(224,162,79,.4); }

  .bubble b.big { display: block; font: 800 46px/1.05 ui-monospace, "SF Mono", Menlo, monospace; color: #ffd88a; letter-spacing: 2px; margin: 4px 0 2px; text-shadow: 0 0 16px rgba(255,190,80,.35); }
  .tbtn { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .tbtn button { height: 62px; border-radius: 16px; border: 1px solid var(--line); background: #141414; color: #fff; font: 800 14px system-ui, sans-serif; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
  .tbtn button b { font-size: 22px; line-height: 1; }
  .tbtn .bu { border-color: #24456b; background: #0b1622; color: var(--up); }
  .tbtn .ku { border-color: #5a2a1a; background: #1c0d08; color: var(--down); }
  .tbtn .ok { border-color: #1f6b45; background: #0b1e14; color: #7ee2a8; }

  .tsmall { display: flex; gap: 8px; margin-top: 10px; }

  .big2 { width: 100%; height: 54px; border-radius: 16px; border: 0; background: linear-gradient(180deg, #f6d48d, #d7a046); color: #2a1a05; font: 800 17px system-ui, sans-serif; cursor: pointer; margin-top: 4px; }

  /* Yıl Avı */

<script>
const $ = (id) => document.getElementById(id);
const SITE = "sadolayn.github.io/SadoDepo/tahmin.html";
const oku = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (e) { return d; } };
const yaz = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const fmt = (n) => Number(n).toLocaleString("tr-TR");
const BUYUK = (t) => t.toLocaleUpperCase("tr-TR");
const rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const sec = (a) => a[Math.floor(Math.random() * a.length)];
function okunus(n) {
  const B = ["sıfır", "bir", "iki", "üç", "dört", "beş", "altı", "yedi", "sekiz", "dokuz"], O = ["", "on", "yirmi", "otuz", "kırk", "elli", "altmış", "yetmiş", "seksen", "doksan"];

function yilSonu() {
  ST.yil.oyun++; const rekor = Y.puan > (ST.yil.en || 0); if (rekor) ST.yil.en = Y.puan; kaydet();
  window.Rapor && Rapor.oyun("tahmin-yil", Y.puan >= 250, `${Y.puan} puan`);
  const yild = "⭐".repeat(Math.round(Y.puan / 100)) || "🌱";
  const txt = `📜 Yıl Avı · ${Y.puan}/${YSORU * 100}\n${Y.sonuc.map((p) => (p >= 85 ? "🟩" : p > 0 ? "🟨" : "⬛")).join("")} ${yild}\n${SITE}`;
  $("ov").dataset.kapanir = "0";
  pencere(`<div class="em">🏁</div><h2>${Y.puan >= 400 ? "Tarih ustası!" : Y.puan >= 250 ? "Çok iyi!" : "Tur bitti"}</h2>
    <div class="yr">${Y.puan}<small style="font-size:18px;color:#b79a74">/${YSORU * 100}</small></div>
    <p>${Y.sonuc.map((p) => (p >= 85 ? "🟩" : p > 0 ? "🟨" : "⬛")).join(" ")}${rekor ? "<br>🏆 <b style=\"color:#f0c674\">Yeni rekor!</b>" : ""}</p>
    <button class="btn" id="yPay" type="button">📤 Paylaş</button><button class="btn gh" id="yYeni" type="button">🔄 Yeni tur</button>`);
  $("yPay").onclick = () => paylas(txt);
  $("yYeni").onclick = () => { kapat(); yilKur(); renderYil(); };
}

// ======================================================================
// ⚡ 60 SANİYE — 1–99, sınırsız deneme; süre bitene kadar kaç kasa?
// ======================================================================
let Hz = null, HG = null, hzT = null;
function renderHiz() {
  const calisiyor = Hz && Hz.bas && !Hz.bitti;
  $("view").innerHTML = `
    <div class="hiz"><div class="ring" id="ring"><b id="sure">60</b></div><div class="sk"><b id="skor">${calisiyor ? Hz.skor : 0}</b><span>açılan kasa</span></div><div class="sk"><b style="font-size:24px;color:#cbbfa8">${ST.hiz.en || 0}</b><span>rekor</span></div></div>
    <div class="vault kisa" id="vault"><div class="inside"><div class="coins">🪙🪙</div></div><div class="door"><div class="led" id="led"></div><div id="inp"></div></div></div>
    <div id="kp"></div>
    <div class="act"><button class="mini" id="tusBtn" type="button">${tusIkon()}</button><button class="try" id="dene" type="button">${calisiyor ? "🔑 Dene" : "⚡ Başla"}</button></div>
    ${isiHtml()}
    <div class="hist" id="hist"></div>
    <p class="note">60 saniyen var. Şifre 1–99 arasında, deneme sınırı yok. Açtığın her kasada yeni şifre gelir. Hız için ⌨️ tuş takımı önerilir.</p>`;
  HG = Giris($("inp"), $("kp"), { max: 99, deger: 50 });
  $("tusBtn").onclick = () => { HG.degistir(); $("tusBtn").textContent = tusIkon(); };
  $("dene").onclick = () => (Hz && Hz.bas && !Hz.bitti ? hizDene() : hizBasla());
  led(calisiyor ? "Devam!" : "Hazır mısın? ⚡", "warn");
  hizSure();
}
function hizBasla() {
  Hz = { bas: Date.now(), skor: 0, s: rnd(1, 99), g: [], bitti: false };
  $("dene").textContent = "🔑 Dene"; $("skor").textContent = 0; $("hist").innerHTML = "";
  led("Şifre 1–99 · çabuk!", "warn"); Ses.bip(true);
  clearInterval(hzT); hzT = setInterval(hizSure, 100);
}
function hizSure() {
  const r = $("ring"); if (!r) return;
  if (!Hz || !Hz.bas) { r.style.setProperty("--p", 1); $("sure").textContent = 60; return; }
  const kal = Math.max(0, 60 - (Date.now() - Hz.bas) / 1000);
  r.style.setProperty("--p", kal / 60); r.style.setProperty("--rc", kal <= 10 ? "#ff5a3c" : "var(--gold)");
  $("sure").textContent = Math.ceil(kal);
  if (kal <= 0 && !Hz.bitti) hizBitti();
}
function hizDene() {
  const n = HG.deger();
  if (!(n >= 1 && n <= 99)) { led("1–99 arası", "warn"); return; }
  if (n === Hz.s) {
    Hz.skor++; Hz.g = []; Hz.s = rnd(1, 99); $("skor").textContent = Hz.skor; $("hist").innerHTML = "";
    led(`🔓 ${n} · yeni kasa!`); Ses.acil(); Ses.titre([30, 30, 30]); yagmur(["🪙"], 6); isiGoster(null);
    const v = $("vault"); v.classList.remove("parla"); void v.offsetWidth; v.classList.add("parla");
  } else {
    const d = n < Hz.s ? "up" : "down"; Hz.g.push({ n, d });
    led(d === "up" ? "⬆️ Büyük" : "⬇️ Küçük", d); Ses.tik(); isiGoster(isiKasa(n, Hz.s, 99), d);
    $("hist").innerHTML = Hz.g.map((z) => `<span class="chip ${z.d}">${z.n}${z.d === "up" ? "↑" : "↓"}</span>`).join("");
  }
  if (HG.tip() === "tus") HG.temizle();
}
function hizBitti() {
  Hz.bitti = true; clearInterval(hzT);
  const rekor = Hz.skor > (ST.hiz.en || 0); if (rekor) ST.hiz.en = Hz.skor; kaydet();
  window.Rapor && Rapor.oyun("tahmin-60", Hz.skor > 0, `${Hz.skor} kasa`);
  Ses.kapali();
  const txt = `⚡ 60 saniyede ${Hz.skor} kasa açtım! 🏦\nSen kaç açarsın?\n${SITE}`;
  $("ov").dataset.kapanir = "0";
  pencere(`<div class="em">⏱️</div><h2>Süre bitti!</h2><div class="yr">${Hz.skor}</div><p>kasa açtın${rekor ? "<br>🏆 <b style=\"color:#f0c674\">Yeni rekor!</b>" : ` · rekorun ${ST.hiz.en}`}</p>
    <button class="btn" id="hPay" type="button">📤 Paylaş</button><button class="btn gh" id="hYeni" type="button">⚡ Tekrar</button>`);
  $("hPay").onclick = () => paylas(txt);
  $("hYeni").onclick = () => { kapat(); Hz = null; renderHiz(); };
}

// ---------- Modlar ----------
const MOD = { kasa: renderKasa, ters: renderTers, yil: renderYil, hiz: renderHiz };
let mod = oku("tahminMod", "kasa"); if (!MOD[mod]) mod = "kasa";
function ac(m) {
  if (m !== "hiz" && Hz && Hz.bas && !Hz.bitti) { clearInterval(hzT); Hz = null; toast("⚡ 60 saniye turu bırakıldı"); }
  mod = m; yaz("tahminMod", m);
  document.querySelectorAll("#modes button").forEach((b) => b.classList.toggle("on", b.dataset.m === m));
  window.Rapor && Rapor.bolum && Rapor.bolum("tahmin-" + m);
  MOD[m]();
}
document.querySelectorAll("#modes button").forEach((b) => (b.onclick = () => ac(b.dataset.m)));
document.addEventListener("keydown", (e) => {
  if ($("ov").classList.contains("show")) return;
  const btn = $("dene"); if (e.key === "Enter" && btn && !btn.disabled) { e.preventDefault(); btn.click(); return; }
  const k = /^\d$/.test(e.key) ? e.key : e.key === "Backspace" ? "sil" : null, kb = k && document.querySelector(`.kp [data-k="${k}"]`);
  if (kb) { e.preventDefault(); kb.click(); }
});
// Gece yarısı geçince Günün Kasası yenilensin
document.addEventListener("visibilitychange", () => { if (!document.hidden && mod === "kasa" && K && K.tur === "gunluk" && K.n !== gunNo()) { K = null; renderKasa(); } });
ac(mod);
</script>
