<style>
  /* Asal Tahmin: tuttuğum asal sayıyı bul. Sade tek ekran: sayı tablosuna dokun. */
  :root { --bg: #000; --card: #0d0d0d; --field: #141414; --line: #262626; --ink: #f2f2f2; --muted: #8a8a8a; --gold: #e0a24f; --up: #5aa9f0; --down: #ef6a4c; --win: #3fc283; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 460px; margin: 0 auto; padding: 8px 14px calc(18px + env(safe-area-inset-bottom)); min-height: 100vh; user-select: none; -webkit-user-select: none; }
  .top { display: flex; align-items: center; gap: 8px; }
  .top h1 { flex: 1; text-align: center; margin: 0; font-size: 21px; }
  .home { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 13px; background: #161616; border: 1px solid var(--gold); display: inline-flex; align-items: center; justify-content: center; font-size: 20px; text-decoration: none; }
  .sub { text-align: center; color: var(--muted); font-size: 14.5px; margin: 8px 0 12px; }
  .sub b { color: var(--ink); }
  .seg { display: flex; gap: 4px; padding: 3px; background: #111; border: 1px solid var(--line); border-radius: 12px; margin-bottom: 12px; }
  .seg button { flex: 1; border: 0; background: none; color: #a8a8a8; padding: 9px 4px; border-radius: 9px; font: 700 14px system-ui, sans-serif; cursor: pointer; }
  .seg button.on { background: var(--gold); color: #1a1205; }
  .msg { min-height: 48px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; font-size: 18px; font-weight: 700; margin-bottom: 10px; line-height: 1.3; }
  .msg small { font-size: 13px; font-weight: 500; color: var(--muted); margin-top: 3px; }
  .msg.up { color: var(--up); } .msg.down { color: var(--down); } .msg.win { color: var(--win); } .msg.lose { color: var(--down); }
  /* Sayı tablosu */
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
  .grid button { aspect-ratio: 1; border-radius: 9px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font: 700 15px system-ui, sans-serif; font-variant-numeric: tabular-nums; cursor: pointer; padding: 0; transition: opacity .3s, background .2s, border-color .2s; position: relative; }
  .grid button:active { transform: scale(.94); }
  .grid.ipucu button.asal { color: var(--gold); border-color: #4a3a1c; }
  .grid button.disi { opacity: .16; cursor: default; }
  .grid button.degil { color: #5a5a5a; background: #0a0a0a; }
  .grid button.degil::after { content: ""; position: absolute; left: 22%; right: 22%; top: 50%; height: 1.5px; background: #5a5a5a; transform: rotate(-35deg); }
  .grid button.up, .grid.ipucu button.up { background: rgba(90,169,240,.16); border-color: var(--up); color: var(--up); }
  .grid button.down, .grid.ipucu button.down { background: rgba(239,106,76,.16); border-color: var(--down); color: var(--down); }
  .grid button.ok, .grid.ipucu button.ok { background: var(--win); border-color: var(--win); color: #04170d; opacity: 1; }
  .grid button.cevap, .grid.ipucu button.cevap { border: 2px solid var(--win); color: var(--win); opacity: 1; }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .alt { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 12px; font-size: 13.5px; color: var(--muted); }
  .hak { display: flex; gap: 5px; }
  .hak i { width: 12px; height: 12px; border-radius: 50%; background: #262626; }
  .hak i.on { background: var(--gold); }
  .sw { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .sw input { display: none; }
  .sw i { width: 38px; height: 22px; border-radius: 99px; background: #333; position: relative; transition: background .2s; }
  .sw i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #ddd; transition: transform .2s; }
  .sw input:checked + i { background: var(--gold); }
  .sw input:checked + i::after { transform: translateX(16px); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 14px; text-align: center; }
  .stats div { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 2px; }
  .stats b { display: block; font-size: 19px; } .stats span { font-size: 11.5px; color: var(--muted); }
  .again { display: block; width: 100%; margin-top: 12px; padding: 13px; border-radius: 14px; border: 1px solid var(--gold); background: transparent; color: var(--gold); font: 700 16px system-ui, sans-serif; cursor: pointer; }
  .again.ana { background: var(--gold); color: #1a1205; }
  .bilgi { margin-top: 14px; font-size: 12.5px; color: var(--muted); line-height: 1.5; text-align: center; }
</style>

<body>
<header class="top">
  <a class="home" href="oyunlar.html" title="Oyunlar" aria-label="Oyunlar">🎮</a>
  <h1>🔢 Asal Tahmin</h1>
  <span style="width:42px"></span>
</header>
<p class="sub" id="sub"></p>
<div class="seg" id="seg"><button type="button" data-max="50">1 – 50</button><button type="button" data-max="100">1 – 100</button></div>
<div class="msg" id="msg"></div>
<div class="grid" id="grid"></div>
<div class="alt"><span id="hakT"></span><span class="hak" id="hak"></span></div>
<div class="alt"><label class="sw"><input type="checkbox" id="ipucu"><i></i>Asal sayıları göster</label><span id="kalan"></span></div>
<button class="again" id="again" type="button">Yeni oyun</button>
<div class="stats" id="stats"></div>
<p class="bilgi">Asal sayı: 1'den büyük, yalnızca 1'e ve kendisine bölünebilen sayı.<br>Asal olmayan bir sayıya dokunursan çarpanlarını görürsün, hakkın gitmez.</p>

<script>
const $ = (id) => document.getElementById(id);
const oku = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (e) { return d; } };
const yaz = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
const HAK = { 50: 5, 100: 6 };
const asalMi = (n) => { if (n < 2) return false; for (let i = 2; i * i <= n; i++) if (n % i === 0) return false; return true; };
const carpanlar = (n) => { const f = []; for (let i = 2; n > 1; ) { if (n % i === 0) { f.push(i); n /= i; } else i++; } return f; };
const ASALLAR = Array.from({ length: 100 }, (_, i) => i + 1).filter(asalMi);
const ST = Object.assign({ kazanilan: 0, seri: 0, en: {} }, oku("asalSt", {}));
let max = oku("asalMax", 100), s, g, bitti;
if (!HAK[max]) max = 100;

function yeni() {
  const L = ASALLAR.filter((p) => p <= max);
  s = L[Math.floor(Math.random() * L.length)];
  g = []; bitti = false;
  $("sub").innerHTML = `1 ile ${max} arasında bir <b>asal sayı</b> tuttum. Bul bakalım!`;
  document.querySelectorAll("#seg button").forEach((b) => b.classList.toggle("on", +b.dataset.max === max));
  mesaj("Bir sayıya dokun", "", "");
  ciz();
}
function aralik() { let lo = 1, hi = max; g.forEach((z) => { if (z.d === "up") lo = Math.max(lo, z.n + 1); if (z.d === "down") hi = Math.min(hi, z.n - 1); }); return [lo, hi]; }
const deneme = () => g.filter((z) => z.d !== "degil").length;
function mesaj(t, cls, alt) { const m = $("msg"); m.className = "msg " + (cls || ""); m.innerHTML = t + (alt ? `<small>${alt}</small>` : ""); }
function ciz() {
  const [lo, hi] = aralik(), kalan = HAK[max] - deneme();
  const durum = Object.fromEntries(g.map((z) => [z.n, z.d]));
  $("grid").classList.toggle("ipucu", $("ipucu").checked);
  $("grid").innerHTML = Array.from({ length: max }, (_, i) => {
    const n = i + 1, d = durum[n];
    let c = asalMi(n) ? "asal" : "";
    if (d) c += " " + d; else if (n < lo || n > hi) c += " disi";
    if (bitti && n === s && d !== "ok") c += " cevap";
    return `<button type="button" data-n="${n}" class="${c}">${n}</button>`;
  }).join("");
  $("hakT").innerHTML = `Kalan hak <b style="color:#fff">${kalan}</b>`;
  $("hak").innerHTML = Array.from({ length: HAK[max] }, (_, i) => `<i class="${i < kalan ? "on" : ""}"></i>`).join("");
  const aday = ASALLAR.filter((p) => p >= lo && p <= hi && p <= max && !durum[p]).length;
  $("kalan").textContent = bitti ? "" : `${aday} aday asal`;
  $("again").classList.toggle("ana", bitti);
  $("stats").innerHTML = `<div><b>${ST.kazanilan}</b><span>Bildiğin</span></div><div><b>${ST.seri}</b><span>Seri</span></div><div><b>${ST.en[max] || "–"}</b><span>En iyi (1–${max})</span></div>`;
}
$("grid").onclick = (e) => {
  const b = e.target.closest("button[data-n]"); if (!b || bitti) return;
  const n = +b.dataset.n, [lo, hi] = aralik();
  if (g.some((z) => z.n === n)) return;
  if (n < lo || n > hi) { b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); mesaj(`${n} aralığın dışında`, "", `Sayı ${lo} ile ${hi} arasında`); return; }
  if (!asalMi(n)) {
    g.push({ n, d: "degil" });
    mesaj(`${n} asal değil`, "", n === 1 ? "1 asal sayı sayılmaz · hakkın gitmedi" : `${n} = ${carpanlar(n).join(" × ")} · hakkın gitmedi`);
    return ciz();
  }
  if (n === s) {
    g.push({ n, d: "ok" }); bitti = true;
    const k = deneme(), sira = ASALLAR.indexOf(s) + 1, ikiz = [s - 2, s + 2].filter(asalMi);
    ST.kazanilan++; ST.seri++; if (!ST.en[max] || k < ST.en[max]) ST.en[max] = k; yaz("asalSt", ST);
    mesaj(`🎉 Bildin! ${s}, ${k}. denemede`, "win", `${s}, ${sira}. asal sayı${ikiz.length ? ` · ikiz asalı ${ikiz.join(" ve ")}` : ""}`);
    window.Rapor && Rapor.oyun("tahmin", true, `${k}. denemede`);
    return ciz();
  }
  const d = n < s ? "up" : "down";
  g.push({ n, d });
  if (deneme() >= HAK[max]) {
    bitti = true; ST.seri = 0; yaz("asalSt", ST);
    mesaj(`Hakkın bitti · sayı ${s} idi`, "lose", "Yeşil çerçeveli sayı");
    window.Rapor && Rapor.oyun("tahmin", false, `Sayı ${s} idi`);
  } else mesaj(d === "up" ? "Daha büyük ⬆️" : "Daha küçük ⬇️", d, "");
  ciz();
};
$("ipucu").checked = oku("asalIpucu", false);
$("ipucu").onchange = (e) => { yaz("asalIpucu", e.target.checked); ciz(); };
document.querySelectorAll("#seg button").forEach((b) => (b.onclick = () => { max = +b.dataset.max; yaz("asalMax", max); yeni(); }));
$("again").onclick = yeni;
yeni();
</script>
<script data-goatcounter="https://sadolayn.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
