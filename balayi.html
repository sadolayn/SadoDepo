  .table { --cw: 56px; --gap: 6px; position: relative; border-radius: 20px; border: 1px solid; overflow: hidden; padding: 6px 8px 7px; display: flex; flex-direction: column; gap: 5px; }
  .table::before { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0; background: url("img/logo.png") center 50% / 70% auto no-repeat; opacity: .2; filter: grayscale(1) brightness(2.4); }
  .table > * { position: relative; z-index: 1; }

  .mini { width: 13px; height: 18px; border-radius: 3px; border-width: 1px !important; }

  .pile.empty::before { content: ""; position: absolute; inset: 0 0 4px; border: 1px dashed rgba(255,255,255,.25); border-radius: 7px; }
  .pile .back { position: absolute; top: 4px; left: 0; }
  .pile .card.top { position: absolute; top: 0; left: 0; }
  .mid { display: flex; justify-content: center; align-items: center; gap: 22px; height: calc(var(--cw) * 1.45 + 10px); }
  .slot { width: var(--cw); height: calc(var(--cw) * 1.45); border-radius: 7px; border: 1px dashed rgba(255,255,255,.18); }
  .mid.choosing .slot { display: none; }

  .card.win { box-shadow: 0 0 0 3px var(--win), 0 4px 12px rgba(0,0,0,.4); }

  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .status { min-height: 34px; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 15px; padding: 4px; }
  .panel { display: none; grid-template-columns: repeat(5, 1fr); gap: 6px; width: 100%; }
  .panel.show { display: grid; }
  .panel button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 7px 2px 6px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(0,0,0,.45); color: #fff; font: 700 12px system-ui, sans-serif; cursor: pointer; backdrop-filter: blur(3px); }
  .panel button b { font-size: 24px; line-height: 1.05; }
  .panel button small { font-weight: 600; color: var(--accent); font-size: 12px; }
  .panel button.red b { color: #ff6b5e; }
  .panel button:disabled { opacity: .3; cursor: default; }
  .panel button:not(:disabled):active { transform: scale(.96); }
  .hand { --cw: 56px; position: relative; height: calc(var(--cw) * 1.45 + 12px); margin-top: 2px; }
  .hand .card { position: absolute; top: 8px; transition: left .2s, transform .12s; }
  .lbl { text-align: center; font-size: 11px; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
  .btn { min-width: 44px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 16px; font-weight: 600; cursor: pointer; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.8); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
  .overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 20px; width: 100%; max-width: 360px; text-align: center; max-height: 90vh; overflow: auto; }

  /* Pencere, tarayıcının araç çubukları arasında kalan görünür alana sığar; sığmazsa kaydırılır (vh yerine dvh) */
  .overlay, .ov { overflow-y: auto; overscroll-behavior: contain; }

<script>
const SUITS = ["♠", "♥", "♣", "♦"];
const SUIT_NAMES = { "♠": "Maça", "♥": "Kupa", "♣": "Sinek", "♦": "Karo" };
const RANKS = { 11: "J", 12: "Q", 13: "K", 14: "A" };
let NAMES = [];
// Rakip her zaman Sadolayn; senin adını yazabilirsin (en fazla 8 karakter)
function setNames() { NAMES = [ISIM.ben(), "Sadolayn"]; }
setNames();
// Oyunlar ve çarpanları
const GAMES = [
  { k: "♣", ad: "Sinek koz", x: 1 },
  { k: "♦", ad: "Karo koz", x: 2 },
  { k: "♥", ad: "Kupa koz", x: 3 },
  { k: "♠", ad: "Maça koz", x: 4 },
  { k: "NT", ad: "Kozsuz", x: 5 },
];
const GK = Object.fromEntries(GAMES.map((g) => [g.k, g]));
const DEALS = 10;
const isRed = (s) => s === "♥" || s === "♦";
const rankText = (r) => RANKS[r] || String(r);
const id = (c) => c.s + c.r;
const $ = (x) => document.getElementById(x);
const wait = (ms) => KartMasa.wait(ms);

let G, hands, piles, trick, turn, tricksWon, played, game, trump, trumpBroken, chooser, phase = "idle", busy = false;
let voids = [{}, {}];

function newGame() { G = { round: 0, scores: [0, 0], used: [[], []], history: [] }; save(); }
function save() { try { localStorage.setItem("balayiGame", JSON.stringify(G)); } catch (e) {} }
function load() {
  try { const g = JSON.parse(localStorage.getItem("balayiGame") || "null"); if (g && typeof g.round === "number" && g.round < DEALS) return g; } catch (e) {}
  return null;
}

// ---------- Kartlar ----------
function newDeck() {
  const d = [];
  for (const s of SUITS) for (let r = 2; r <= 14; r++) d.push({ s, r });
  for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  return d;
}
function sortHand(h) { h.sort((a, b) => SUITS.indexOf(a.s) - SUITS.indexOf(b.s) || b.r - a.r); }
const cardEl = (c) => KartMasa.el(c);
const backEl = () => KartMasa.back();

// Oynanabilir kartlar: el + masadaki açık (üstteki) kartlar
const tops = (p) => piles[p].filter((st) => st.length).map((st) => st[st.length - 1]);
const playable = (p) => [...hands[p], ...tops(p)];

// ---------- Kurallar ----------
function beats(a, b) {
  if (a.s === b.s) return a.r > b.r;
  if (trump && a.s === trump) return true;
  return false;
}
function legal(p) {
  const cs = playable(p);
  if (!trick.length) {
    if (trump && !trumpBroken) { const nt = cs.filter((c) => c.s !== trump); if (nt.length) return nt; }
    return cs;
  }
  const lead = trick[0].card;
  const same = cs.filter((c) => c.s === lead.s);
  if (same.length) {
    const higher = same.filter((c) => c.r > lead.r);
    return higher.length ? higher : same; // renge uy, mümkünse yükselt
  }
  if (trump) { const tr = cs.filter((c) => c.s === trump); if (tr.length) return tr; } // renk yoksa koz at
  return cs;
}

// ---------- Bilgisayar ----------
function known(p) { return playable(p); }
function outstanding(p, suit) {
  const mine = new Set(known(p).map(id));
  const out = [];
  for (let r = 2; r <= 14; r++) { const k = suit + r; if (!played.has(k) && !mine.has(k) && !trick.some((t) => id(t.card) === k)) out.push(r); }
  return out;
}
function strength(cards, t) {
  let e = 0;
  for (const s of SUITS) {
    const cs = cards.filter((c) => c.s === s);
    for (const c of cs) {
      if (t && s === t) e += 0.55 + (c.r - 2) / 24;
      else if (c.r === 14) e += 0.95;
      else if (c.r === 13) e += cs.length >= 2 ? 0.55 : 0.3;
      else if (c.r === 12) e += cs.length >= 3 ? 0.3 : 0.1;
      else if (c.r === 11 && !t) e += 0.12;
    }
    if (!t && cs.length >= 5) e += (cs.length - 4) * 0.35;
    if (t && s !== t && cs.length <= 1) e += Math.min(cards.filter((c) => c.s === t).length, 3) * 0.15;
  }
  return e;
}
function botChoose(p) {
  const av = GAMES.filter((g) => !G.used[p].includes(g.k));
  const me = known(p), opp = tops(1 - p);
  let best = null;
  for (const g of av) {
    const t = g.k === "NT" ? null : g.k;
    const a = strength(me, t), b = strength(opp, t) * 1.6;
    const share = a / Math.max(0.1, a + b);
    const v = (share - 0.5) * g.x;
    if (!best || v > best.v) best = { g, v };
  }
  return best.g.k;
}
function isBoss(p, c) { return outstanding(p, c.s).every((r) => r < c.r); }
function botPick(p) {
  const L = legal(p);
  if (L.length === 1) return L[0];
  const inPile = new Set(tops(p).map(id));
  // eşitlikte masadaki kartı tercih et (altındaki kart açılır)
  const pref = (a, b) => (inPile.has(id(b)) - inPile.has(id(a)));
  const opp = 1 - p;
  const oppTrumps = trump ? outstanding(p, trump).length : 0;
  if (!trick.length) {
    const boss = L.filter((c) => c.s !== trump && isBoss(p, c) && (!trump || oppTrumps === 0 || !voids[opp][c.s]));
    if (boss.length) return boss.sort((a, b) => b.r - a.r || pref(a, b))[0];
    if (trump) {
      const myTr = L.filter((c) => c.s === trump);
      const allMy = known(p).filter((c) => c.s === trump).length;
      if (myTr.length && allMy >= oppTrumps && oppTrumps > 0) {
        const tb = myTr.filter((c) => isBoss(p, c));
        return (tb.length ? tb : myTr).sort((a, b) => b.r - a.r)[0];
      }
    }
    const side = L.filter((c) => c.s !== trump);
    const pool = side.length ? side : L;
    return [...pool].sort((a, b) => a.r - b.r || pref(a, b))[0];
  }
  const lead = trick[0].card;
  const win = L.filter((c) => beats(c, lead)).sort((a, b) => (a.s === trump) - (b.s === trump) || a.r - b.r || pref(a, b));
  if (win.length) return win[0];
  return [...L].sort((a, b) => (a.s === trump) - (b.s === trump) || a.r - b.r || pref(a, b))[0];
}

// ---------- Ekran ----------
function setStatus(t) { $("status").innerHTML = t ? `<span>${t}</span>` : ""; }
function gameName() { return game ? (GK[game].ad + (game !== "NT" ? " " + game : "") + ` ×${GK[game].x}`) : "–"; }
function renderInfo() {
  $("info").innerHTML = `<span style="white-space:nowrap">El: <b>${Math.min(G.round + 1, DEALS)}/${DEALS}</b>${G.stake ? `<small style="font-size:11px"> · ⭐${Token.fmt(G.stake)}</small>` : ""}</span><br>${phase === "play" || phase === "end" ? `<b>${game === "NT" ? "Kozsuz" : "Koz " + game}</b> ×${GK[game].x}` : "Seçim: " + (chooser != null ? NAMES[chooser] : "–")}`;
  $("scores").innerHTML = G.scores.map((s, p) => `<div>${NAMES[p]}<b class="${s > G.scores[1 - p] ? "pos" : ""}">${s}</b></div>`).join("");
}
function renderWho() {
  for (const p of [0, 1]) {
    const el = $("who" + p);
    const handInfo = p === 1 && hands ? `<span class="oppHand">${hands[1].map(() => '<i class="mini kb"></i>').join("")}</span>` : "";
    const used = GAMES.map((g) => G.used[p].includes(g.k) ? `<s style="opacity:.45">${g.k === "NT" ? "KZ" : g.k}</s>` : (g.k === "NT" ? "KZ" : g.k + "\uFE0E")).join(" ");
    el.innerHTML = `<span><span class="nm">${NAMES[p]}${p === chooser && phase !== "idle" ? " 👑" : ""}</span> <span class="bd">· El: ${tricksWon ? tricksWon[p] : 0}</span></span>${handInfo || `<span class="bd" style="font-size:12px">${used}</span>`}`;
    el.classList.toggle("turn", turn === p && phase === "play");
  }
}
function renderPiles() {
  const myTurn = phase === "play" && turn === 0 && !busy;
  const ok = myTurn ? new Set(legal(0).map(id)) : null;
  for (const p of [0, 1]) {
    const box = $("piles" + p);
    box.innerHTML = "";
    piles[p].forEach((st) => {
      const d = document.createElement("div");
      d.className = "pile" + (st.length ? "" : " empty");
      if (st.length === 2) d.appendChild(backEl());
      if (st.length) {
        const c = st[st.length - 1], el = cardEl(c);
        el.classList.add("top");
        if (p === 0 && myTurn) {
          if (ok.has(id(c))) { el.classList.add("ok"); el.onclick = () => humanPlay(c); } else el.classList.add("no");
        }
        d.appendChild(el);
      }
      box.appendChild(d);
    });
  }
}
function renderHand() {
  const h = $("hand"); h.innerHTML = "";
  const myTurn = phase === "play" && turn === 0 && !busy;
  const ok = myTurn ? new Set(legal(0).map(id)) : null;
  const n = hands[0].length, W = h.clientWidth, cw = parseFloat(getComputedStyle(h).getPropertyValue("--cw")) || 56;
  const step = n > 1 ? Math.min(cw + 6, (W - cw) / (n - 1)) : 0;
  const x0 = (W - (cw + step * (n - 1))) / 2;
  hands[0].forEach((c, i) => {
    const el = cardEl(c);
    el.style.left = Math.round(x0 + i * step) + "px";
    if (myTurn) { if (ok.has(id(c))) { el.classList.add("ok"); el.onclick = () => humanPlay(c); } else el.classList.add("no"); }
    h.appendChild(el);
  });
}
// Ekrana sığdır: kart boyu önce genişliğe, sonra ekran yüksekliğine göre ayarlanır
function fit() {
  const t = $("table"), h = $("hand");
  const W = t.clientWidth - 16, gap = 6;
  let cw = Math.min(66, Math.floor((W - gap * 4) / 5));
  const set = (v) => { t.style.setProperty("--cw", v + "px"); h.style.setProperty("--cw", v + "px"); };
  set(cw);
  const over = () => h.getBoundingClientRect().bottom + window.scrollY - window.innerHeight + 8;
  while (cw > 40 && over() > 0) set((cw -= 2));
}
function renderTrick(w) {
  for (const p of [0, 1]) $("slot" + p).innerHTML = "";
  for (const t of trick) {
    const el = cardEl(t.card);
    if (t.fresh) { el.classList.add("pop"); t.fresh = false; }
    if (w === t.p) el.classList.add("win");
    $("slot" + t.p).appendChild(el);
  }
}
function render() { renderInfo(); renderWho(); renderPiles(); renderHand(); }

// ---------- El akışı ----------
function newRound() {
  if (G.round >= DEALS) return gameOver();
  chooser = G.round % 2;
  // Sadolayn şanslıdır: 4 karıştırmadan ona en güçlü kartları veren dağıtım seçilir
  const pow = (d) => { let a = 0, b = 0; d.forEach((c, i) => { const v = Math.max(0, c.r - 9) ** 1.6; const p = i < 40 ? (i % 20 < 10 ? 0 : 1) : (i < 46 ? 0 : 1); if (p) b += v; else a += v; }); return b - a; };
  let d = newDeck(); for (let i = 0; i < 3; i++) { const e = newDeck(); if (pow(e) > pow(d)) d = e; }
  // her oyuncuya 10 kapalı + üstüne 10 açık, kalan 12 kart 6'şar ele
  piles = [[], []];
  let k = 0;
  for (const p of [0, 1]) for (let i = 0; i < 10; i++) piles[p].push([d[k++]]);
  for (const p of [0, 1]) for (let i = 0; i < 10; i++) piles[p][i].push(d[k++]);
  hands = [d.slice(40, 46), d.slice(46, 52)];
  hands.forEach(sortHand);
  trick = []; tricksWon = [0, 0]; played = new Set(); voids = [{}, {}];
  game = null; trump = null; trumpBroken = false;
  phase = "choose"; turn = -1;
  if (window.CardSfx) CardSfx.deal(13);
  renderTrick(); render();
  if (chooser === 0) showChoosePanel();
  else { setStatus(`${NAMES[1]} oyun seçiyor…`); setTimeout(() => startPlay(botChoose(1)), 1000 * KartMasa.hiz()); }
}
function hidePanel() { $("ctPanel").classList.remove("show"); $("mid").classList.remove("choosing"); }
function showChoosePanel() {
  setStatus("Seçim sende. Açık kartlarına ve eline bakıp oyunu seç:");
  const panel = $("ctPanel"); panel.innerHTML = "";
  for (const g of GAMES) {
    const b = document.createElement("button");
    if (g.k === "♥" || g.k === "♦") b.className = "red";
    b.innerHTML = `<b>${g.k === "NT" ? "KZ" : g.k + "\uFE0E"}</b>${g.k === "NT" ? "Kozsuz" : SUIT_NAMES[g.k]}<small>×${g.x}</small>`;
    if (G.used[0].includes(g.k)) b.disabled = true;
    else b.onclick = () => { hidePanel(); startPlay(g.k); };
    panel.appendChild(b);
  }
  panel.classList.add("show"); $("mid").classList.add("choosing");
}
async function startPlay(k) {
  game = k; trump = k === "NT" ? null : k;
  G.used[chooser].push(k);
  phase = "play";
  turn = 1 - chooser; // seçmeyen oyuncu ilk kartı açar
  setStatus(`${chooser === 0 ? "Sen" : NAMES[chooser]} <b>${GK[k].ad}${trump ? " " + trump : ""}</b> seçti${chooser === 0 ? "n" : ""} · her el ×${GK[k].x} puan`);
  render();
  await wait(1300);
  playTurn();
}
async function playTurn() {
  renderWho();
  if (turn === 0) { setStatus(trick.length ? "Sıra sende." : "Sıra sende, bir kart aç."); renderPiles(); renderHand(); }
  else { renderPiles(); renderHand(); await wait(650); playCard(1, botPick(1)); }
}
function humanPlay(c) { if (phase === "play" && turn === 0 && !busy) playCard(0, c); }
async function playCard(p, c) {
  if (window.CardSfx) CardSfx.play();
  const hi = hands[p].findIndex((x) => id(x) === id(c));
  if (hi >= 0) hands[p].splice(hi, 1);
  else {
    const st = piles[p].find((s) => s.length && id(s[s.length - 1]) === id(c));
    st.pop();
    if (st.length && window.CardSfx) setTimeout(() => CardSfx.flip && CardSfx.flip(), 150);
  }
  if (trick.length && c.s !== trick[0].card.s) voids[p][trick[0].card.s] = true;
  trick.push({ p, card: c, fresh: true });
  played.add(id(c));
  if (trump && c.s === trump) trumpBroken = true;
  renderTrick();
  if (trick.length < 2) { turn = 1 - p; return playTurn(); }
  busy = true;
  const w = beats(trick[1].card, trick[0].card) ? trick[1].p : trick[0].p;
  tricksWon[w]++;
  turn = -1;
  renderTrick(w); render();
  setStatus((w === 0 ? "Eli <b>sen</b> aldın" : `Eli <b>${NAMES[1]}</b> aldı`) + ` <span style="color:var(--muted)">(+${GK[game].x})</span>`);
  await wait(1000);
  if (window.CardSfx) CardSfx.collect();
  trick = []; renderTrick(); busy = false;
  if (!playable(0).length && !playable(1).length) return endRound();
  turn = w; playTurn();
}
function endRound() {
  phase = "end";
  const x = GK[game].x;
  const deltas = [tricksWon[0] * x, tricksWon[1] * x];
  deltas.forEach((d, p) => (G.scores[p] += d));
  G.history.push({ el: G.round + 1, secen: chooser, oyun: game, tricks: [...tricksWon], deltas });
  G.round++;
  if (G.round >= DEALS && !G.sonuc) {
    // Yıldız: kazanan koyduğunun 2 katını alır; berabere biterse iade (sayfa kapansa da kaybolmasın diye hemen ödenir)
    const [a, b] = G.scores;
    G.sonuc = Token.sonuc("balayi", G.stake || 0, 2, a > b ? 2 : a === b ? 1 : 0);
  }
  save(); render();
  const last = G.round >= DEALS;
  const rows = [0, 1].map((p) => `<tr><td style="text-align:left">${NAMES[p]}${p === chooser ? " 👑" : ""}</td><td>${tricksWon[p]} el</td><td class="pos">+${deltas[p]}</td><td><b>${G.scores[p]}</b></td></tr>`).join("");
  $("modal").innerHTML = `<h2>${GK[game].ad}${trump ? " " + trump : ""} bitti</h2><p>El ${G.round}/${DEALS} · ×${x} · Seçen: ${NAMES[chooser]}</p>
    <table><tr><th></th><th>Aldığı</th><th>Puan</th><th>Toplam</th></tr>${rows}</table>
    <button class="btn" id="next">${last ? "Sonucu gör" : "Sonraki el"}</button>`;
  $("overlay").classList.add("show");
  $("next").onclick = () => { $("overlay").classList.remove("show"); last ? gameOver() : newRound(); };
  setStatus("");
}
function gameOver() {
  phase = "idle";
  const [a, b] = G.scores;
  const w = a === b ? -1 : a > b ? 0 : 1;
  window.Rapor && Rapor.oyun("balayi", w === 0);
  $("modal").innerHTML = `<h2>${w === 0 ? "🎉 Kazandın!" : w === 1 ? `${NAMES[1]} kazandı` : "Berabere!"}</h2><p>${DEALS} el tamamlandı</p>
    <table>${[0, 1].map((p) => `<tr><td style="text-align:left">${p === w ? "🥇 " : ""}${NAMES[p]}</td><td><b>${G.scores[p]}</b></td></tr>`).join("")}</table>
    ${(G.sonuc && G.sonuc.html) || ""}
    <button class="btn" id="again">${Token.yeter() ? "Yeni oyun" : "Devam"}</button>`;
  $("overlay").classList.add("show");
  $("again").onclick = () => showRules(false);
  try { localStorage.removeItem("balayiGame"); } catch (e) {}
}
function showRules(resume) {
  // Yeni oyun Yıldız ister (token.js); Yıldız bittiyse bekleme ya da İş Bankası sorusu gelir
  const goster = () => $("overlay").classList.add("show");
  if (!resume && !Token.yeter()) return Token.kilit($("modal"), { goster, devam: () => showRules(false) });
  const stake = resume && G && G.stake;
  // Kısa pencere: Yıldız ve Başla üstte/altta hep görünür; isimler ve kurallar açılır kutuda
  $("modal").innerHTML = `<h2>💞 Balayı King</h2>
    ${resume ? (stake ? `<div class="tkBox">⭐ Ortada <b>${Token.fmt(stake)}</b> Yıldız var; oyunu bitirince sonucunu alırsın.</div>` : "") : '<div id="tkSec"></div><div class="tkNot">Kazanırsan <b>2 katı</b> · berabere biterse iade. Bakiyen bütün kart oyunlarında ortak.</div>'}
    <details class="mDet"><summary>👥 Oyuncu isimleri</summary>${ISIM.html([["ben", "Sen", "Senin adın"], [null, "Sadolayn", "Rakibin"]])}</details>
    <details class="mDet"><summary>📖 Kurallar</summary><ul class="rules">
      <li>İki kişilik King. Her oyuncunun önünde <b>10 kapalı kart</b>, üstlerinde <b>10 açık kart</b> ve elinde <b>6 kart</b> olur (26 kart, 26 el).</li>
      <li>Açık kartlar ve elindeki kartlar oynanabilir. Açık kart oynanınca altındaki kapalı kart açılır.</li>
      <li>${DEALS} el oynanır. Her oyuncu sırayla seçer ve her oyunu bir kez seçebilir: <b>♣ ×1, ♦ ×2, ♥ ×3, ♠ ×4, Kozsuz ×5</b>.</li>
      <li>Aldığın her el, oyunun çarpanı kadar puan. En çok puanı toplayan kazanır.</li>
      <li>Renge uymak ve mümkünse yükseltmek zorunlu. Renk yoksa koz atılır. Koz kırılmadan kozla açılmaz.</li>
      <li><b>Yıldız:</b> Oyuna Yıldız koyarak başlarsın. Kazanırsan koyduğunun <b>2 katını</b> alırsın, berabere biterse Yıldızın iade edilir. Bakiyen Batak ve King'le ortak; biterse 1 gün sonra İş Bankası sorusu gelir.</li>
    </ul></details>
    <div class="tkAlt"><button class="btn" id="start">${resume ? "Devam et" : "Başla"}</button>
    ${resume ? `<button class="btn" id="fresh" style="margin-top:8px;background:transparent;color:var(--muted);border-color:var(--line)">Yeni oyun başlat</button>${stake ? `<p style="font-size:12px;margin:8px 0 0">Yeni oyunda yarım kalan ${Token.fmt(stake)} Yıldız geri gelmez.</p>` : ""}` : ""}</div>`;
  goster();
  ISIM.bind($("modal"), () => { setNames(); try { renderInfo(); } catch (e) {} });
  if (resume) {
    $("start").onclick = () => { $("overlay").classList.remove("show"); newRound(); };
    $("fresh").onclick = () => showRules(false);
    return;
  }
  const sec = Token.secici($("tkSec"), "balayi");
  sec.onChange = (v) => ($("start").textContent = `Başla · ${Token.fmt(v)} Yıldız`); sec.sync();
  $("start").onclick = () => {
    const v = sec.deger();
    if (!Token.koy(v)) return showRules(false);
    newGame(); G.stake = v; save();
    $("overlay").classList.remove("show"); newRound();
  };
}
const saved = load();
if (saved) G = saved; else newGame();
hands = [[], []]; piles = [[], []];
renderInfo(); renderWho(); fit();
let fitT; window.addEventListener("resize", () => { clearTimeout(fitT); fitT = setTimeout(() => { fit(); if (hands[0].length) render(); }, 120); });
KartMasa.onChange = () => {};
showRules(!!saved && (saved.round > 0 || !!saved.stake));
</script>
