<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>King</title>
<style>
  :root {
    --bg: #000000;
    --felt: #0b2a1c;
    --felt-line: #164a33;
    --card: #0d0d0d;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --red: #e0473a;
    --win: #3fc283;
    --line: #262626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    padding: 10px 10px 14px;
    user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  .info { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.3; }
  .info b { color: var(--accent); }
  .scores {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    margin: 8px 0; font-size: 12px; text-align: center;
  }
  .scores div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 2px; }
  .scores b { display: block; font-size: 15px; }

  .table {
    flex: 1;
    min-height: 330px;
    position: relative;
    background: radial-gradient(ellipse at center, var(--felt-line) 0%, var(--felt) 70%);
    border-radius: 22px;
    border: 1px solid var(--felt-line);
  }
  .seat {
    position: absolute;
    background: rgba(0,0,0,.55);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 5px 8px;
    font-size: 12px;
    text-align: center;
    min-width: 78px;
    transition: border-color .2s, box-shadow .2s;
  }
  .seat .nm { font-weight: 700; font-size: 13px; }
  .seat .bd { color: var(--muted); }
  .seat.turn { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224,162,79,.35); }
  .seat.bidder .nm::after { content: " 👑"; }
  .seat-n { top: 8px; left: 50%; transform: translateX(-50%); }
  .seat-w { left: 6px; top: 50%; transform: translateY(-50%); }
  .seat-e { right: 6px; top: 50%; transform: translateY(-50%); }
  .seat-s { bottom: 8px; left: 50%; transform: translateX(-50%); }

  .slot { position: absolute; width: 56px; height: 84px; }
  .slot-n { top: 64px; left: 50%; transform: translateX(-50%); }
  .slot-s { bottom: 64px; left: 50%; transform: translateX(-50%); }
  .slot-w { left: 90px; top: 50%; transform: translateY(-50%); }
  .slot-e { right: 90px; top: 50%; transform: translateY(-50%); }

  .card {
    width: 56px; height: 84px;
    background: #f7f4ee;
    color: #111;
    border-radius: 7px;
    border: 1px solid #bbb;
    position: relative;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
    flex: none;
  }
  .card.red { color: var(--red); }
  .card .r { position: absolute; top: 3px; left: 3px; font-size: 29px; line-height: 1; letter-spacing: -1px; transform-origin: left top; }
  .card .r.ten { transform: scaleX(.72); letter-spacing: -2px; }
  .card .s1 { position: absolute; top: 32px; left: 2px; font-size: 26px; line-height: 1; }
  .card .s2 { position: absolute; bottom: 3px; right: 4px; font-size: 34px; line-height: 1; }
  .card.win { outline: 3px solid var(--win); }
  .pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .status {
    min-height: 40px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 15px; padding: 6px 4px;
  }
  .panel { display: none; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .panel.show { display: flex; }
  .panel button, .btn {
    min-width: 44px; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .panel button.pass { border-color: var(--red); color: var(--red); }
  .panel button.suit { font-size: 26px; padding: 6px 16px; }
  .panel button.suit.red { color: var(--red); }

  .hand {
    display: flex; justify-content: center;
    padding: 14px 0 4px; min-height: 90px;
  }
  .hand .card:not(:last-child) .s2 { display: none; }
  .hand .card { margin-left: -30px; transition: transform .12s, opacity .12s; cursor: pointer; }
  .hand .card:first-child { margin-left: 0; }
  .hand .card.ok { transform: translateY(-10px); }
  .hand .card.no { opacity: .4; cursor: default; }
  .hand .card.ok:active { transform: translateY(-16px); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; width: 100%; max-width: 360px; text-align: center;
  }
  .modal h2 { margin: 0 0 6px; font-size: 20px; }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .modal table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 14px; }
  .modal td, .modal th { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .modal th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .pos { color: var(--win); }
  .neg { color: var(--red); }
  .modal .btn { width: 100%; background: var(--accent); border-color: var(--accent); color: #000; }
  .rules { font-size: 13px; color: var(--muted); text-align: left; line-height: 1.5; margin: 0 0 14px; padding-left: 18px; }
  .panel button small { font-weight: 400; }
  #ctPanel button { font-size: 14px; padding: 10px; }
</style>
<script src="cardsound.js"></script>
</head>
<body>
<header>
  <a href="oyunlar.html">← Oyunlar</a>
  <h1>👑 King</h1>
  <div class="info" id="info">El: –<br>Oyun: –</div>
</header>

<div class="scores" id="scores"></div>

<div class="table" id="table">
  <div class="seat seat-n" id="seat2"></div>
  <div class="seat seat-w" id="seat3"></div>
  <div class="seat seat-e" id="seat1"></div>
  <div class="seat seat-s" id="seat0"></div>
  <div class="slot slot-s" id="slot0"></div>
  <div class="slot slot-e" id="slot1"></div>
  <div class="slot slot-n" id="slot2"></div>
  <div class="slot slot-w" id="slot3"></div>
</div>

<div class="status" id="status"></div>
<div class="panel" id="ctPanel"></div>
<div class="panel" id="trumpPanel"></div>
<div class="hand" id="hand"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const SUITS = ["♠", "♥", "♣", "♦"];
const SUIT_NAMES = { "♠": "Maça", "♥": "Kupa", "♣": "Sinek", "♦": "Karo" };
const RANKS = { 11: "J", 12: "Q", 13: "K", 14: "A" };
const NAMES = ["Sen", "Sadosan", "Sadolayn", "Sadocan"];
const CEZALAR = {
  el:    { ad: "El almaz",    kisa: "El",     puan: 50,  aciklama: "Aldığın her el −50" },
  kupa:  { ad: "Kupa almaz",  kisa: "Kupa",   puan: 30,  aciklama: "Aldığın her kupa −30" },
  erkek: { ad: "Erkek almaz", kisa: "Erkek",  puan: 60,  aciklama: "Her papaz ve vale −60" },
  kiz:   { ad: "Kız almaz",   kisa: "Kız",    puan: 100, aciklama: "Her kız −100" },
  rifki: { ad: "Rifki",       kisa: "Rifki",  puan: 320, aciklama: "Kupa papazı −320" },
  son:   { ad: "Son iki",     kisa: "Son 2",  puan: 180, aciklama: "Son iki elin her biri −180" },
};
const CEZA_KEYS = Object.keys(CEZALAR);
const isRed = (s) => s === "♥" || s === "♦";
const rankText = (r) => RANKS[r] || String(r);
const id = (c) => c.s + c.r;
const $ = (x) => document.getElementById(x);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

let G; // oyun durumu
let voids = [{}, {}, {}, {}];
let hands, trick, turn, tricksWon, taken, played, contract, trump, trumpBroken, heartsBroken, chooser, busy = false, phase = "idle";

function newGame() {
  G = {
    round: 0,
    scores: [0, 0, 0, 0],
    kozCount: [0, 0, 0, 0],
    cezaCount: [0, 0, 0, 0],
    typeUsed: Object.fromEntries(CEZA_KEYS.map((k) => [k, 0])),
    history: [],
  };
  save();
}
function save() { try { localStorage.setItem("kingGame", JSON.stringify(G)); } catch (e) {} }
function load() {
  try {
    const g = JSON.parse(localStorage.getItem("kingGame") || "null");
    if (g && typeof g.round === "number" && g.round < 20) return g;
  } catch (e) {}
  return null;
}

// ---------- Kartlar ----------
function newDeck() {
  const d = [];
  for (const s of SUITS) for (let r = 2; r <= 14; r++) d.push({ s, r });
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
function sortHand(h) { h.sort((a, b) => SUITS.indexOf(a.s) - SUITS.indexOf(b.s) || b.r - a.r); }
function cardEl(c) {
  const el = document.createElement("div");
  el.className = "card" + (isRed(c.s) ? " red" : "");
  el.innerHTML = `<span class="r${c.r === 10 ? " ten" : ""}">${rankText(c.r)}</span><span class="s1">${c.s}</span><span class="s2">${c.s}</span>`;
  return el;
}

// ---------- Kontrat ----------
function contractName(ct) {
  if (!ct) return "–";
  if (ct === "koz") return trump ? `Koz ${trump}` : "Koz";
  return CEZALAR[ct].ad;
}
function available(p) {
  const needKoz = 2 - G.kozCount[p], needCeza = 3 - G.cezaCount[p];
  const out = [];
  if (needKoz > 0) out.push("koz");
  if (needCeza > 0) for (const k of CEZA_KEYS) if (G.typeUsed[k] < 2) out.push(k);
  return out;
}
// Ceza puanı (bir kartın/elin değeri)
function penaltyOf(ct, cards, trickNo) {
  let n = 0;
  if (ct === "el") n = 1;
  else if (ct === "kupa") n = cards.filter((c) => c.s === "♥").length;
  else if (ct === "erkek") n = cards.filter((c) => c.r === 13 || c.r === 11).length;
  else if (ct === "kiz") n = cards.filter((c) => c.r === 12).length;
  else if (ct === "rifki") n = cards.some((c) => c.s === "♥" && c.r === 13) ? 1 : 0;
  else if (ct === "son") n = trickNo >= 12 ? 1 : 0;
  return n;
}
const MAX_ITEMS = { el: 13, kupa: 13, erkek: 8, kiz: 4, rifki: 1, son: 2 };

// ---------- Kurallar ----------
function beats(a, b) {
  if (a.s === b.s) return a.r > b.r;
  if (contract === "koz" && a.s === trump) return true;
  return false;
}
function trickWinner(t) {
  let best = t[0];
  for (const x of t) if (beats(x.card, best.card)) best = x;
  return best;
}
const isPenaltyCard = (c, ct = contract) =>
  (ct === "kupa" && c.s === "♥") ||
  (ct === "erkek" && (c.r === 13 || c.r === 11)) ||
  (ct === "kiz" && c.r === 12) ||
  (ct === "rifki" && c.s === "♥" && c.r === 13);

function legal(hand) {
  if (trick.length === 0) {
    if (contract === "koz" && !trumpBroken) {
      const nt = hand.filter((c) => c.s !== trump);
      if (nt.length) return nt;
    }
    if ((contract === "kupa" || contract === "rifki") && !heartsBroken) {
      const nh = hand.filter((c) => c.s !== "♥");
      if (nh.length) return nh;
    }
    return hand;
  }
  const led = trick[0].card.s;
  const best = trickWinner(trick).card;
  const same = hand.filter((c) => c.s === led);
  if (same.length) {
    if (contract === "koz" && best.s === led) {
      const higher = same.filter((c) => c.r > best.r);
      if (higher.length) return higher;
    }
    // Rifki: kupa açıldı, as yerdeyse papaz atılmak zorunda
    if (contract === "rifki" && led === "♥") {
      const kh = same.find((c) => c.r === 13);
      if (kh && trick.some((t) => t.card.s === "♥" && t.card.r === 14)) return [kh];
    }
    // Kız almaz: yerde o rengin papazı/ası varsa kız atılmak zorunda
    if (contract === "kiz") {
      const q = same.find((c) => c.r === 12);
      if (q && trick.some((t) => t.card.s === led && t.card.r > 12)) return [q];
    }
    return same;
  }
  // Renk yok
  if (contract === "koz") {
    const tr = hand.filter((c) => c.s === trump);
    if (tr.length) {
      if (best.s === trump) {
        const higher = tr.filter((c) => c.r > best.r);
        if (higher.length) return higher;
      }
      return tr;
    }
    return hand;
  }
  if (contract === "rifki") {
    const kh = hand.find((c) => c.s === "♥" && c.r === 13);
    if (kh) return [kh];
  }
  if (contract === "kupa") {
    const h = hand.filter((c) => c.s === "♥");
    if (h.length) return h;
  }
  if (contract === "kiz") {
    const q = hand.filter((c) => c.r === 12);
    if (q.length) return q;
  }
  if (contract === "erkek") {
    const m = hand.filter((c) => c.r === 13 || c.r === 11);
    if (m.length) return m;
  }
  return hand;
}

// ---------- Bilgisayar ----------
function kozEstimate(hand) {
  let best = { s: SUITS[0], est: -1 };
  for (const t of SUITS) {
    let est = 0;
    for (const s of SUITS) {
      const cs = hand.filter((c) => c.s === s);
      const has = (r) => cs.some((c) => c.r === r);
      if (has(14)) est += 1;
      if (has(13)) est += cs.length >= 2 ? 0.75 : 0.2;
      if (has(12)) est += cs.length >= 3 ? 0.4 : 0;
      if (s === t) est += Math.max(0, cs.length - 3) * 0.9;
      if (s !== t && cs.length <= 1) est += hand.filter((c) => c.s === t).length >= 3 ? 0.6 : 0;
    }
    if (est > best.est) best = { s: t, est };
  }
  return best;
}
function cezaRisk(hand, k) {
  const by = (s) => hand.filter((c) => c.s === s);
  const low = (cs) => cs.filter((c) => c.r <= 7).length;
  let r = 0;
  if (k === "el") r = hand.filter((c) => c.r >= 12).length * 1.2 + hand.filter((c) => c.r === 14).length;
  if (k === "kupa") { const h = by("♥"); r = h.filter((c) => c.r >= 10).length * 1.5 - low(h) * 0.5 + 1; }
  if (k === "erkek") r = hand.filter((c) => c.r === 13 || c.r === 11).reduce((a, c) => a + (by(c.s).length <= 2 ? 2 : 1), 0);
  if (k === "kiz") r = hand.filter((c) => c.r === 12).reduce((a, c) => a + (by(c.s).length <= 3 ? 2.2 : 1), 0);
  if (k === "rifki") { const h = by("♥"); const kh = h.some((c) => c.r === 13); r = kh ? (h.length <= 3 ? 5 : 2.5) : (h.length <= 1 ? 1.5 : 0.5); }
  if (k === "son") r = hand.filter((c) => c.r >= 13).length * 0.6 + 1;
  return r * CEZALAR[k].puan / 100;
}
function botChoose(p) {
  const av = available(p);
  const hand = hands[p];
  const kz = kozEstimate(hand);
  if (av.includes("koz") && (av.length === 1 || kz.est >= 4.6)) return { ct: "koz", trump: kz.s };
  const cz = av.filter((x) => x !== "koz");
  if (!cz.length) return { ct: "koz", trump: kz.s };
  cz.sort((a, b) => cezaRisk(hand, a) - cezaRisk(hand, b));
  return { ct: cz[0] };
}
function isBoss(c, hand) {
  for (let r = c.r + 1; r <= 14; r++) {
    const k = c.s + r;
    if (!played.has(k) && !hand.some((h) => id(h) === k)) return false;
  }
  return true;
}
// Henüz oynanmamış ve bu oyuncunun elinde olmayan kartlar
function outstanding(hand, suit) {
  const out = [];
  for (let r = 2; r <= 14; r++) {
    const k = suit + r;
    if (!played.has(k) && !hand.some((h) => id(h) === k) && !trick.some((t) => id(t.card) === k)) out.push(r);
  }
  return out;
}
function playersAfter(p) {
  const out = [];
  for (let i = trick.length + 1; i < 4; i++) out.push((p + (i - trick.length)) % 4);
  return out;
}
function botPick(p) {
  const hand = hands[p];
  const L = legal(hand);
  if (L.length === 1) return L[0];
  const trickNo = 14 - hand.length; // 1..13

  // ---------- KOZ ----------
  if (contract === "koz") {
    const lowest = (cs) => [...cs].sort((a, b) => (a.s === trump) - (b.s === trump) || a.r - b.r)[0];
    const myTrumps = hand.filter((c) => c.s === trump).length;
    const outTrumps = outstanding(hand, trump).length;
    if (trick.length === 0) {
      // Rakiplerde koz kalmadıysa her büyük kart kazanır
      const boss = L.filter((c) => isBoss(c, hand) && c.s !== trump && (outTrumps === 0 || !opponents(p).some((o) => voids[o][c.s])));
      if (boss.length) return boss.sort((a, b) => b.r - a.r)[0];
      const trumpsOk = L.filter((c) => c.s === trump);
      if (trumpsOk.length && myTrumps >= outTrumps && outTrumps > 0) {
        const tb = trumpsOk.filter((c) => isBoss(c, hand));
        return (tb.length ? tb : trumpsOk).sort((a, b) => b.r - a.r)[0];
      }
      // Kısa renkten aç (koz kesmek için boşluk yarat), yoksa en düşük
      const side = L.filter((c) => c.s !== trump);
      if (side.length && myTrumps > 0) {
        const len = (s) => hand.filter((c) => c.s === s).length;
        const short = [...side].sort((a, b) => len(a.s) - len(b.s) || a.r - b.r);
        if (len(short[0].s) <= 2 && short[0].r < 12) return short[0];
      }
      return lowest(L);
    }
    const best = trickWinner(trick).card;
    const led = trick[0].card.s;
    const win = L.filter((c) => beats(c, best)).sort((a, b) => (a.s === trump) - (b.s === trump) || a.r - b.r);
    if (win.length) {
      if (trick.length === 3) return win[0];
      const after = playersAfter(p);
      // Arkadakiler kesebilir mi / yükseltebilir mi?
      const safe = win.filter((c) => {
        if (c.s === trump) return outstanding(hand, trump).filter((r) => r > c.r).length === 0 || after.every((o) => voids[o][trump]);
        const higher = outstanding(hand, c.s).filter((r) => r > c.r).length;
        const canRuff = after.some((o) => voids[o][c.s] && !voids[o][trump]) && outTrumps > 0;
        return higher === 0 && !canRuff;
      });
      if (safe.length) return safe[0];
      // Garanti değil: renk kartıysa en yükseğiyle dene, kozsa en düşük kazananla
      const nonTrump = win.filter((c) => c.s !== trump);
      if (nonTrump.length) return nonTrump[nonTrump.length - 1];
      return win[0];
    }
    return lowest(L);
  }

  // ---------- CEZA ----------
  const pen = (c) => isPenaltyCard(c);
  // Son iki: ilk 11 elde büyük kartlardan kurtul (el almanın cezası yok)
  if (contract === "son" && trickNo <= 11) {
    if (trick.length === 0) return [...L].sort((a, b) => b.r - a.r)[0];
    const best = trickWinner(trick).card;
    const win = L.filter((c) => beats(c, best));
    if (win.length) return win.sort((a, b) => b.r - a.r)[0];
    return [...L].sort((a, b) => b.r - a.r)[0];
  }
  const opps = opponents(p);
  if (trick.length === 0) {
    // Kazanma ihtimali en düşük kartla aç
    let bestC = null, bestScore = Infinity;
    for (const c of L) {
      const out = outstanding(hand, c.s);
      if (!out.length) { // bu renkte kimsede kart yok: kesin alırsın
        const sc = 1000 + c.r;
        if (sc < bestScore) { bestScore = sc; bestC = c; }
        continue;
      }
      const lower = out.filter((r) => r < c.r).length;
      const higher = out.length - lower;
      let sc = (higher === 0 ? 500 : 0) + (lower / out.length) * 100;
      sc += opps.filter((o) => voids[o][c.s]).length * 40; // boş olan ceza kartı atar
      if (pen(c)) sc += 200;
      // Kız/erkek almaz: o rengin cezası dışarıdaysa ve sende büyük kart varsa açma
      if (contract === "kiz" && out.includes(12) && c.r > 12) sc += 300;
      if (contract === "erkek" && (out.includes(13) || out.includes(11)) && c.r > 11) sc += 150;
      if (contract === "rifki" && c.s === "♥" && c.r === 14 && out.includes(13)) sc += 400;
      sc += c.r * 0.5;
      if (sc < bestScore) { bestScore = sc; bestC = c; }
    }
    return bestC;
  }
  const led = trick[0].card.s;
  const best = trickWinner(trick).card;
  const loses = L.filter((c) => !beats(c, best));
  const danger = (c) => {
    let d = (pen(c) ? 200 : 0) + c.r;
    const out = outstanding(hand, c.s);
    if (out.filter((r) => r < c.r).length >= 2) d += 20; // ileride ele girme riski yüksek
    if (hand.filter((h) => h.s === c.s).length === 1 && c.r >= 11) d += 15; // tek kalmış büyük kart
    return d;
  };
  if (loses.length) {
    if (loses.some((c) => c.s === led)) {
      // Renge uyuyorsan: kaybeden en büyük kartı bırak
      return [...loses].sort((a, b) => (pen(b) - pen(a)) || b.r - a.r)[0];
    }
    return [...loses].sort((a, b) => danger(b) - danger(a))[0];
  }
  // Tüm kartlar kazanıyor
  const after = playersAfter(p);
  const canBeOvertaken = (c) => after.some((o) => !voids[o][led]) && outstanding(hand, led).some((r) => r > c.r);
  const nonPen = L.filter((c) => !pen(c));
  if (trick.length === 3 || !L.some(canBeOvertaken)) {
    // Eli zaten alacaksın: en büyük, cezasız kartı harca
    const pool = nonPen.length ? nonPen : L;
    return [...pool].sort((a, b) => b.r - a.r)[0];
  }
  // Arkadan biri büyük atabilir: en küçükle dene
  return [...(nonPen.length ? nonPen : L)].sort((a, b) => a.r - b.r)[0];
}
const opponents = (p) => [0, 1, 2, 3].filter((x) => x !== p);

// ---------- Ekran ----------
function setStatus(t) { $("status").innerHTML = t; }
function renderInfo() {
  $("info").innerHTML = `El: <b>${Math.min(G.round + 1, 20)}/20</b><br>${phase === "play" || phase === "end" ? `<b>${contractName(contract)}</b>` : "Seçim: " + (chooser != null ? NAMES[chooser] : "–")}`;
  $("scores").innerHTML = G.scores.map((s, p) => `<div>${NAMES[p]}<b class="${s < 0 ? "neg" : s > 0 ? "pos" : ""}">${s}</b></div>`).join("");
}
function renderSeats() {
  for (let p = 0; p < 4; p++) {
    const el = $("seat" + p);
    let bd = "";
    if (phase === "play" || phase === "end") {
      if (contract === "koz") bd = `El: ${tricksWon[p]}`;
      else if (contract === "el" || contract === "son") bd = `${contract === "el" ? "El" : "Ceza"}: ${taken[p]}`;
      else bd = `${CEZALAR[contract].kisa}: ${taken[p]}`;
    } else {
      bd = `Koz ${G.kozCount[p]}/2 · Ceza ${G.cezaCount[p]}/3`;
    }
    el.innerHTML = `<div class="nm">${NAMES[p]}</div><div class="bd">${bd}</div>`;
    el.classList.toggle("turn", turn === p && phase === "play");
    el.classList.toggle("bidder", p === chooser && phase !== "idle");
  }
}
function renderTrick(winnerP) {
  for (let p = 0; p < 4; p++) $("slot" + p).innerHTML = "";
  for (const t of trick) {
    const el = cardEl(t.card);
    if (t.fresh) { el.classList.add("pop"); t.fresh = false; }
    if (winnerP === t.p) el.classList.add("win");
    $("slot" + t.p).appendChild(el);
  }
}
function renderHand() {
  const h = $("hand");
  h.innerHTML = "";
  const myTurn = phase === "play" && turn === 0 && !busy;
  const ok = myTurn ? new Set(legal(hands[0]).map(id)) : null;
  for (const c of hands[0]) {
    const el = cardEl(c);
    if (myTurn) {
      if (ok.has(id(c))) { el.classList.add("ok"); el.onclick = () => humanPlay(c); }
      else el.classList.add("no");
    }
    h.appendChild(el);
  }
}
function render() { renderInfo(); renderSeats(); renderHand(); }

// ---------- El akışı ----------
function newRound() {
  if (G.round >= 20) return gameOver();
  chooser = G.round % 4;
  const d = newDeck();
  hands = [0, 1, 2, 3].map((i) => d.slice(i * 13, i * 13 + 13));
  hands.forEach(sortHand);
  trick = []; tricksWon = [0, 0, 0, 0]; taken = [0, 0, 0, 0]; played = new Set();
  voids = [{}, {}, {}, {}];
  contract = null; trump = null; trumpBroken = false; heartsBroken = false;
  phase = "choose"; turn = -1;
  if (window.CardSfx) CardSfx.deal(13);
  renderTrick(); render();
  if (chooser === 0) showChoosePanel();
  else {
    setStatus(`${NAMES[chooser]} oyun seçiyor…`);
    setTimeout(() => { const c = botChoose(chooser); startPlay(c.ct, c.trump); }, 900);
  }
}
function showChoosePanel() {
  const av = available(0);
  setStatus("Seçim sende. Ne oynayalım?");
  const panel = $("ctPanel");
  panel.innerHTML = "";
  for (const k of av) {
    const b = document.createElement("button");
    if (k === "koz") b.innerHTML = `Koz <small style="opacity:.6">(${2 - G.kozCount[0]} hak)</small>`;
    else b.innerHTML = `${CEZALAR[k].ad} <small style="opacity:.6">${2 - G.typeUsed[k]}</small>`;
    if (k === "koz") b.style.borderColor = "var(--accent)";
    b.onclick = () => {
      panel.classList.remove("show");
      if (k === "koz") showTrumpPanel(); else startPlay(k);
    };
    panel.appendChild(b);
  }
  panel.classList.add("show");
}
function showTrumpPanel() {
  setStatus("Kozu seç:");
  const panel = $("trumpPanel");
  panel.innerHTML = "";
  for (const s of SUITS) {
    const b = document.createElement("button");
    b.className = "suit" + (isRed(s) ? " red" : "");
    b.textContent = s;
    b.onclick = () => { panel.classList.remove("show"); startPlay("koz", s); };
    panel.appendChild(b);
  }
  panel.classList.add("show");
}
async function startPlay(ct, t) {
  contract = ct; trump = ct === "koz" ? t : null;
  if (ct === "koz") G.kozCount[chooser]++;
  else { G.cezaCount[chooser]++; G.typeUsed[ct]++; }
  phase = "play";
  turn = chooser;
  const desc = ct === "koz" ? `koz <b>${t} ${SUIT_NAMES[t]}</b>` : `<b>${CEZALAR[ct].ad}</b> (${CEZALAR[ct].aciklama})`;
  setStatus(`${chooser === 0 ? "Sen" : NAMES[chooser]} ${desc} seçti${chooser === 0 ? "n" : ""}.`);
  render();
  await wait(1200);
  playTurn();
}
async function playTurn() {
  renderSeats();
  if (turn === 0) {
    setStatus(trick.length === 0 ? "Sıra sende, bir kart aç." : "Sıra sende.");
    renderHand();
  } else {
    if (trick.length) setStatus(`${NAMES[turn]} oynuyor…`);
    renderHand();
    await wait(600);
    playCard(turn, botPick(turn));
  }
}
function humanPlay(c) {
  if (phase !== "play" || turn !== 0 || busy) return;
  playCard(0, c);
}
function handOver() {
  if (contract === "koz" || contract === "el" || contract === "son") return hands[0].length === 0;
  const total = taken.reduce((a, b) => a + b, 0);
  return total >= MAX_ITEMS[contract] || hands[0].length === 0;
}
async function playCard(p, c) {
  if (window.CardSfx) CardSfx.play();
  hands[p] = hands[p].filter((x) => id(x) !== id(c));
  if (trick.length && c.s !== trick[0].card.s) voids[p][trick[0].card.s] = true;
  trick.push({ p, card: c, fresh: true });
  played.add(id(c));
  if (contract === "koz" && c.s === trump) trumpBroken = true;
  if (c.s === "♥") heartsBroken = true;
  renderTrick();
  if (trick.length < 4) {
    turn = (p + 1) % 4;
    renderHand();
    return playTurn();
  }
  busy = true;
  const w = trickWinner(trick).p;
  const trickNo = 13 - hands[0].length; // 1..13
  tricksWon[w]++;
  const pen = contract === "koz" ? 0 : penaltyOf(contract, trick.map((t) => t.card), trickNo);
  taken[w] += pen;
  turn = -1;
  renderTrick(w);
  render();
  let msg = w === 0 ? "Eli <b>sen</b> aldın" : `Eli <b>${NAMES[w]}</b> aldı`;
  if (contract === "koz") msg += w === 0 ? " 👏" : ".";
  else if (pen) msg += ` <span class="neg">(−${pen * CEZALAR[contract].puan})</span>`;
  else msg += ".";
  setStatus(msg);
  await wait(1100);
  if (window.CardSfx) CardSfx.collect();
  trick = [];
  renderTrick();
  busy = false;
  if (handOver()) return endRound();
  turn = w;
  playTurn();
}
function endRound() {
  phase = "end";
  const deltas = [0, 1, 2, 3].map((p) => contract === "koz" ? tricksWon[p] * 50 : -taken[p] * CEZALAR[contract].puan);
  deltas.forEach((d, p) => (G.scores[p] += d));
  G.history.push({ el: G.round + 1, secen: chooser, oyun: contract === "koz" ? "Koz " + trump : CEZALAR[contract].ad, deltas });
  G.round++;
  save();
  render();
  const rows = [0, 1, 2, 3].map((p) => `
    <tr><td style="text-align:left">${NAMES[p]}${p === chooser ? " 👑" : ""}</td>
    <td class="${deltas[p] < 0 ? "neg" : deltas[p] > 0 ? "pos" : ""}">${deltas[p] > 0 ? "+" : ""}${deltas[p]}</td>
    <td><b>${G.scores[p]}</b></td></tr>`).join("");
  const last = G.round >= 20;
  $("modal").innerHTML = `
    <h2>${contractName(contract)} bitti</h2>
    <p>El ${G.round}/20 · Seçen: ${NAMES[chooser]}</p>
    <table><tr><th></th><th>Bu el</th><th>Toplam</th></tr>${rows}</table>
    <button class="btn" id="next">${last ? "Sonucu gör" : "Sonraki el"}</button>`;
  $("overlay").classList.add("show");
  $("next").onclick = () => { $("overlay").classList.remove("show"); last ? gameOver() : newRound(); };
  setStatus("");
}
function gameOver() {
  phase = "idle";
  const order = [0, 1, 2, 3].sort((a, b) => G.scores[b] - G.scores[a]);
  const winner = order[0];
  const rows = order.map((p, i) => `<tr><td style="text-align:left">${["🥇", "🥈", "🥉", "4."][i]} ${NAMES[p]}</td><td class="${G.scores[p] < 0 ? "neg" : "pos"}"><b>${G.scores[p]}</b></td></tr>`).join("");
  $("modal").innerHTML = `
    <h2>${winner === 0 ? "🎉 Kazandın!" : `${NAMES[winner]} kazandı`}</h2>
    <p>20 el tamamlandı</p>
    <table>${rows}</table>
    <button class="btn" id="again">Yeni oyun</button>`;
  $("overlay").classList.add("show");
  $("again").onclick = () => { $("overlay").classList.remove("show"); newGame(); newRound(); };
  try { localStorage.removeItem("kingGame"); } catch (e) {}
}

function showRules(resume) {
  $("modal").innerHTML = `
    <h2>👑 King</h2>
    <ul class="rules">
      <li>20 el oynanır. Her oyuncu sırayla 5 kez oyun seçer: <b>2 koz</b> ve <b>3 ceza</b>. Her ceza oyunda toplam 2 kez oynanabilir.</li>
      <li><b>Cezalar:</b> El almaz (el başı −50), Kupa almaz (kupa başı −30), Erkek almaz (papaz/vale −60), Kız almaz (kız −100), Rifki (kupa papazı −320), Son iki (son iki el −180).</li>
      <li><b>Koz:</b> Aldığın her el +50.</li>
      <li>Renge uymak zorunlu. Koz oyununda renk yoksa koz atılır ve yükseltmek gerekir.</li>
      <li>Ceza oyunlarında renk yoksa ceza kartı varsa onu atmak zorundasın (kupa, kız, erkek, rifki).</li>
    </ul>
    <button class="btn" id="start">${resume ? "Devam et" : "Başla"}</button>
    ${resume ? '<button class="btn" id="fresh" style="margin-top:8px;background:transparent;color:var(--muted);border-color:var(--line)">Yeni oyun başlat</button>' : ""}`;
  $("overlay").classList.add("show");
  $("start").onclick = () => { $("overlay").classList.remove("show"); newRound(); };
  if (resume) $("fresh").onclick = () => { $("overlay").classList.remove("show"); newGame(); newRound(); };
}

const saved = load();
if (saved) G = saved; else newGame();
renderInfo();
showRules(!!saved && saved.round > 0);
</script>
