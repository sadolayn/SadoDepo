  .seat, .slot { z-index: 1; }
  .seat {

  .seat .nm { font-weight: 700; font-size: 13px; }
  .seat .bd { color: var(--muted); }
  .seat .mini { display: flex; align-items: center; justify-content: center; gap: 1px; margin-top: 2px; }
  .seat .mini i { width: 4px; }
  .seat.turn { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224,162,79,.35); }
  .seat.bidder .nm::after { content: " 👑"; }
  .seat-n { top: 8px; left: 50%; transform: translateX(-50%); }
  .seat-w { left: 6px; top: 50%; transform: translateY(-50%); }
  .seat-e { right: 6px; top: 50%; transform: translateY(-50%); }
  .seat-s { bottom: 8px; left: 50%; transform: translateX(-50%); }

  .slot { position: absolute; width: 56px; height: 84px; }

  .slot-s { bottom: 76px; left: 50%; transform: translateX(-50%); }

  .card {

  .card .r { position: absolute; top: 3px; left: 3px; font-size: 29px; line-height: 1; letter-spacing: -1px; transform-origin: left top; }
  .card .r.ten { transform: scaleX(.72); letter-spacing: -2px; }
  .card .s1 { position: absolute; top: 32px; left: 2px; font-size: 26px; line-height: 1; }

  .cet th { color: var(--muted); font-weight: 600; font-size: 11px; position: sticky; top: -16px; background: var(--card); }
  .cet td.oy { text-align: left; white-space: normal; }

  .grid4 { display: grid; grid-template-columns: 1fr 1fr; margin-bottom: 6px; }
  .grid4 .blk { padding: 3px 3px 4px; text-align: center; }
  .grid4 .blk:nth-child(1) { border-right: 2px solid #3a50f0; border-bottom: 2px solid #3a50f0; }

  .grid4 .blk:nth-child(3) { border-right: 2px solid #3a50f0; }
  .grid4 .blk.cur .bn::after { content: " 👑"; }
  .blk .bn { font-weight: 700; font-size: 12px; margin-bottom: 1px; }
  .blk .syms { display: flex; justify-content: center; gap: 1px; }
  .blk .syms .sp { width: 4px; }
  .blk .sym { display: flex; flex-direction: column; align-items: center; width: 22px; }
  .blk .sym i { font-style: normal; font-size: 7.5px; color: var(--muted); line-height: 1.1; height: 9px; overflow: hidden; white-space: nowrap; }
  .blk .bt2 { display: flex; align-items: baseline; justify-content: space-between; gap: 4px; font-size: 10px; color: var(--muted); padding: 1px 4px 0; border-top: 1px solid var(--line); margin-top: 2px; }
  .blk .bt2 b { font-size: 10.5px; }
  .blk .bt2 .pp { font-size: 15px; font-weight: 700; color: var(--ink); }
  .blk .bt2 .pp.neg { color: #e0473a; } .blk .bt2 .pp.pos { color: var(--win); }
  .blk .bt { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); padding: 1px 6px; }
  .blk .bt b { font-size: 12px; }
  .blk .bt.tot { border-top: 1px solid var(--line); margin-top: 3px; padding-top: 3px; color: var(--ink); }
  .blk .bt.tot b { font-size: 15px; }
  .czl { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 10px; text-align: left; font-size: 11px; margin-bottom: 5px; }
  .czl .cz { display: flex; align-items: center; gap: 5px; }
  .czl .cn { flex: 1; }
  .czl .cz.done .cn { text-decoration: line-through; text-decoration-color: #e0473a; text-decoration-thickness: 2px; color: var(--muted); }
  .czl .mk { width: 9px; height: 9px; border: 1.5px solid #666; border-radius: 3px; }
  .czl .mk.on { background: #e0473a; border-color: #e0473a; }
  .potk { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-bottom: 5px; }
  .potk div { background: #111; border: 1px solid var(--line); border-radius: 8px; padding: 3px 6px; font-size: 9.5px; color: var(--muted); line-height: 1.3; }
  .potk b { color: var(--ink); font-size: 12px; margin: 0 3px; }
  .potk i { font-style: normal; }
  .hak { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; text-align: left; font-size: 12px; margin-bottom: 12px; }
  .hak div { background: #111; border: 1px solid var(--line); border-radius: 10px; padding: 7px 8px; }
  .hak b { color: var(--ink); }
  .hak .ok { color: var(--win); }
  .hak .no { color: var(--muted); }
</style>

<script>
const SUITS = ["♠", "♥", "♣", "♦"];
const SUIT_NAMES = { "♠": "Maça", "♥": "Kupa", "♣": "Sinek", "♦": "Karo" };
const RANKS = { 11: "J", 12: "Q", 13: "K", 14: "A" };
let NAMES = [];
// İsimler: Sadolayn sabit; diğerlerini kullanıcı yazar (en fazla 8 karakter, tüm oyunlarda ortak)
function setNames() { NAMES = [ISIM.ben(), ISIM.get("sag", "Sadosan"), "Sadolayn", ISIM.get("sol", "Sadocan")]; }
setNames();
const CEZALAR = {
  el:    { ad: "El almaz",    kisa: "El",     puan: 50,  aciklama: "Aldığın her el −50" },
  kupa:  { ad: "Kupa almaz",  kisa: "Kupa",   puan: 30,  aciklama: "Aldığın her kupa −30" },
  erkek: { ad: "Erkek almaz", kisa: "Erkek",  puan: 60,  aciklama: "Her papaz ve vale −60" },
  kiz:   { ad: "Kız almaz",   kisa: "Kız",    puan: 100, aciklama: "Her kız −100" },
  rifki: { ad: "Rifki",       kisa: "Rifki",  puan: 320, aciklama: "Kupa papazı −320" },
  son:   { ad: "Son iki",     kisa: "Son 2",  puan: 180, aciklama: "Son iki elin her biri −180" },
};
const CEZA_KEYS = Object.keys(CEZALAR);
const isRed = (s) => s === "♥" || s === "♦";
const rankText = (r) => RANKS[r] || String(r);
const id = (c) => c.s + c.r;
const $ = (x) => document.getElementById(x);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

let G; // oyun durumu
let takenBy = {}; // ceza kartı → alan oyuncu (bu el)
let voids = [{}, {}, {}, {}];
let hands, trick, turn, tricksWon, taken, played, contract, trump, trumpBroken, heartsBroken, chooser, busy = false, phase = "idle";

function newGame() {
  G = {
    round: 0,
    scores: [0, 0, 0, 0],
    kozCount: [0, 0, 0, 0],
    cezaCount: [0, 0, 0, 0],
    typeUsed: Object.fromEntries(CEZA_KEYS.map((k) => [k, 0])),
    history: [],
  };
  save();
}
function save() { try { localStorage.setItem("kingGame", JSON.stringify(G)); } catch (e) {} }
function load() {
  try {
    const g = JSON.parse(localStorage.getItem("kingGame") || "null");
    if (g && typeof g.round === "number" && g.round < 20) return g;
  } catch (e) {}
  return null;
}

// ---------- Kartlar ----------
function newDeck() {
  const d = [];
  for (const s of SUITS) for (let r = 2; r <= 14; r++) d.push({ s, r });
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
function sortHand(h) { h.sort((a, b) => SUITS.indexOf(a.s) - SUITS.indexOf(b.s) || b.r - a.r); }
function cardEl(c) {
  const el = document.createElement("div");
  el.className = "card" + (isRed(c.s) ? " red" : "");
  el.innerHTML = `<span class="r${c.r === 10 ? " ten" : ""}">${rankText(c.r)}</span><span class="s1">${c.s}</span><span class="s2">${c.s}</span>`;
  return el;
}

// ---------- Kontrat ----------
function contractName(ct) {
  if (!ct) return "–";
  if (ct === "koz") return trump ? `Koz ${trump}` : "Koz";
  return CEZALAR[ct].ad;
}
// Kural: her oyuncunun ilk seçimi koz olamaz (ilk turda herkes ceza seçer)
const ilkSecim = (p) => G.kozCount[p] + G.cezaCount[p] === 0;
function available(p) {
  const needKoz = 2 - G.kozCount[p], needCeza = 3 - G.cezaCount[p];
  const out = [];
  if (needKoz > 0 && !ilkSecim(p)) out.push("koz");
  if (needCeza > 0) for (const k of CEZA_KEYS) if (G.typeUsed[k] < 2) out.push(k);
  return out;
}
// Ceza puanı (bir kartın/elin değeri)
function penaltyOf(ct, cards, trickNo) {
  let n = 0;
  if (ct === "el") n = 1;
  else if (ct === "kupa") n = cards.filter((c) => c.s === "♥").length;
  else if (ct === "erkek") n = cards.filter((c) => c.r === 13 || c.r === 11).length;
  else if (ct === "kiz") n = cards.filter((c) => c.r === 12).length;
  else if (ct === "rifki") n = cards.some((c) => c.s === "♥" && c.r === 13) ? 1 : 0;
  else if (ct === "son") n = trickNo >= 12 ? 1 : 0;
  return n;
}
const CEZA_TOPLAM = { el: 13 * 50, kupa: 13 * 30, erkek: 8 * 60, kiz: 4 * 100, rifki: 320, son: 2 * 180 };
const MAX_ITEMS = { el: 13, kupa: 13, erkek: 8, kiz: 4, rifki: 1, son: 2 };

// ---------- Kurallar ----------
function beats(a, b) {
  if (a.s === b.s) return a.r > b.r;
  if (contract === "koz" && a.s === trump) return true;
  return false;
}
function trickWinner(t) {
  let best = t[0];
  for (const x of t) if (beats(x.card, best.card)) best = x;
  return best;
}
const isPenaltyCard = (c, ct = contract) =>
  (ct === "kupa" && c.s === "♥") ||
  (ct === "erkek" && (c.r === 13 || c.r === 11)) ||
  (ct === "kiz" && c.r === 12) ||
  (ct === "rifki" && c.s === "♥" && c.r === 13);

function legal(hand) {
  if (trick.length === 0) {
    if (contract === "koz" && !trumpBroken) {
      const nt = hand.filter((c) => c.s !== trump);
      if (nt.length) return nt;
    }
    if ((contract === "kupa" || contract === "rifki") && !heartsBroken) {
      const nh = hand.filter((c) => c.s !== "♥");
      if (nh.length) return nh;
    }
    return hand;
  }
  const led = trick[0].card.s;
  const best = trickWinner(trick).card;
  const same = hand.filter((c) => c.s === led);
  if (same.length) {
    if (contract === "koz" && best.s === led) {
      const higher = same.filter((c) => c.r > best.r);
      if (higher.length) return higher;
    }
    // Rifki: kupa açıldı, as yerdeyse papaz atılmak zorunda
    if (contract === "rifki" && led === "♥") {
      const kh = same.find((c) => c.r === 13);
      if (kh && trick.some((t) => t.card.s === "♥" && t.card.r === 14)) return [kh];
    }
    // Kız almaz: yerde o rengin papazı/ası varsa kız atılmak zorunda
    if (contract === "kiz") {
      const q = same.find((c) => c.r === 12);
      if (q && trick.some((t) => t.card.s === led && t.card.r > 12)) return [q];
    }
    return same;
  }
  // Renk yok
  if (contract === "koz") {
    const tr = hand.filter((c) => c.s === trump);
    if (tr.length) {
      if (best.s === trump) {
        const higher = tr.filter((c) => c.r > best.r);
        if (higher.length) return higher;
      }
      return tr;
    }
    return hand;
  }
  if (contract === "rifki") {
    const kh = hand.find((c) => c.s === "♥" && c.r === 13);
    if (kh) return [kh];
  }
  if (contract === "kupa") {
    const h = hand.filter((c) => c.s === "♥");
    if (h.length) return h;
  }
  if (contract === "kiz") {
    const q = hand.filter((c) => c.r === 12);

      panel.classList.remove("show");
      if (k === "koz") showTrumpPanel(); else startPlay(k);
    };
    panel.appendChild(b);
  }
  panel.classList.add("show");
}
function showTrumpPanel() {
  setStatus("Kozu seç:");
  const panel = $("trumpPanel");
  panel.innerHTML = "";
  for (const s of SUITS) {
    const b = document.createElement("button");
    b.className = "suit" + (isRed(s) ? " red" : "");
    b.textContent = s;
    b.onclick = () => { panel.classList.remove("show"); startPlay("koz", s); };
    panel.appendChild(b);
  }
  panel.classList.add("show");
}
async function startPlay(ct, t) {
  contract = ct; trump = ct === "koz" ? t : null;
  if (ct === "koz") G.kozCount[chooser]++;
  else { G.cezaCount[chooser]++; G.typeUsed[ct]++; }
  phase = "play";
  turn = chooser;
  const desc = ct === "koz" ? `koz <b>${t} ${SUIT_NAMES[t]}</b>` : `<b>${CEZALAR[ct].ad}</b> (${CEZALAR[ct].aciklama})`;
  setStatus(`${chooser === 0 ? "Sen" : NAMES[chooser]} ${desc} seçti${chooser === 0 ? "n" : ""}.`);
  render();
  await wait(1200);
  playTurn();
}
async function playTurn() {
  renderSeats();
  if (turn === 0) {
    setStatus(trick.length === 0 ? "Sıra sende, bir kart aç." : "Sıra sende.");
    renderHand();
  } else {
    if (trick.length) setStatus(`${NAMES[turn]} oynuyor…`);
    renderHand();
    const me = turn;
    await wait(380);
    if (phase !== "play" || turn !== me || me <= 0 || !hands[me]) return;
    playCard(turn, mcPick(turn));
  }
}
function humanPlay(c) {
  if (phase !== "play" || turn !== 0 || busy) return;
  playCard(0, c);
}
function handOver() {
  if (contract === "koz" || contract === "el" || contract === "son") return hands[0].length === 0;
  const total = taken.reduce((a, b) => a + b, 0);
  return total >= MAX_ITEMS[contract] || hands[0].length === 0;
}
async function playCard(p, c) {
  if (window.CardSfx) CardSfx.play();
  hands[p] = hands[p].filter((x) => id(x) !== id(c));
  if (trick.length && c.s !== trick[0].card.s) voids[p][trick[0].card.s] = true;
  trick.push({ p, card: c, fresh: true });
  played.add(id(c));
  if (contract === "koz" && c.s === trump) trumpBroken = true;
  if (c.s === "♥") heartsBroken = true;
  renderTrick();
  if (trick.length < 4) {
    turn = (p + 1) % 4;
    renderHand();
    return playTurn();
  }
  busy = true;
  const w = trickWinner(trick).p;
  const trickNo = 13 - hands[0].length; // 1..13
  tricksWon[w]++;
  const pen = contract === "koz" ? 0 : penaltyOf(contract, trick.map((t) => t.card), trickNo);
  taken[w] += pen;
  if (contract !== "koz") trick.forEach((t) => { if (isPenaltyCard(t.card) || (contract === "kupa" && t.card.s === "♥")) takenBy[id(t.card)] = w; });
  turn = -1;
  renderTrick(w);
  render();
  let msg = w === 0 ? "Eli <b>sen</b> aldın" : `Eli <b>${NAMES[w]}</b> aldı`;
  if (contract === "koz") msg += w === 0 ? " 👏" : ".";
  else if (pen) msg += ` <span class="neg">(−${pen * CEZALAR[contract].puan})</span>`;
  else msg += ".";
  setStatus(msg);
  await wait(1100);
  if (window.CardSfx) CardSfx.collect();
  trick = [];
  renderTrick();
  busy = false;
  if (handOver()) return endRound();
  turn = w;
  playTurn();
}
function endRound() {
  phase = "end";
  const deltas = [0, 1, 2, 3].map((p) => contract === "koz" ? tricksWon[p] * 50 : -taken[p] * CEZALAR[contract].puan);
  deltas.forEach((d, p) => (G.scores[p] += d));
  G.history.push({ el: G.round + 1, secen: chooser, ct: contract, trump, oyun: contract === "koz" ? "Koz " + trump : CEZALAR[contract].ad, deltas });
  G.round++;
  save();
  render();
  const rows = [0, 1, 2, 3].map((p) => `
    <tr><td style="text-align:left">${NAMES[p]}${p === chooser ? " 👑" : ""}</td>
    <td class="${deltas[p] < 0 ? "neg" : deltas[p] > 0 ? "pos" : ""}">${deltas[p] > 0 ? "+" : ""}${deltas[p]}</td>
    <td><b>${G.scores[p]}</b></td></tr>`).join("");
  const last = G.round >= 20;
  $("modal").innerHTML = `
    <h2>${contractName(contract)} bitti</h2>
    <p>El ${G.round}/20 · Seçen: ${NAMES[chooser]}</p>
    <table><tr><th></th><th>Bu el</th><th>Toplam</th></tr>${rows}</table>
    <button class="btn" id="next">${last ? "Sonucu gör" : "Sonraki el"}</button>
    <button class="btn" id="cet2" style="margin-top:8px;background:transparent;color:var(--ink);border-color:var(--line)">📋 Cetveli gör</button>`;
  $("overlay").classList.add("show");
  $("cet2").onclick = showCetvel;
  $("next").onclick = () => { $("overlay").classList.remove("show"); last ? gameOver() : newRound(); };
  setStatus("");
}
function gameOver() {
  phase = "idle";
  const order = [0, 1, 2, 3].sort((a, b) => G.scores[b] - G.scores[a]);
  const winner = order[0];
  window.Rapor && Rapor.oyun("king", winner === 0);
  const rows = order.map((p, i) => `<tr><td style="text-align:left">${["🥇", "🥈", "🥉", "4."][i]} ${NAMES[p]}</td><td class="${G.scores[p] < 0 ? "neg" : "pos"}"><b>${G.scores[p]}</b></td></tr>`).join("");
  $("modal").innerHTML = `
    <h2>${winner === 0 ? "🎉 Kazandın!" : `${NAMES[winner]} kazandı`}</h2>
    <p>20 el tamamlandı</p>
    <table>${rows}</table>
    <button class="btn" id="again">Yeni oyun</button>
    <button class="btn" id="cet3" style="margin-top:8px;background:transparent;color:var(--ink);border-color:var(--line)">📋 Cetveli gör</button>`;
  $("cet3").onclick = showCetvel;
  $("overlay").classList.add("show");
  $("again").onclick = () => { $("overlay").classList.remove("show"); newGame(); newRound(); };
  try { localStorage.removeItem("kingGame"); } catch (e) {}
}

// ---------- Cetvel ----------
const isKozH = (h) => h.ct === "koz" || (h.oyun || "").startsWith("Koz");
const ctKey = (h) => h.ct || CEZA_KEYS.find((k) => CEZALAR[k].ad === h.oyun);
function tri(h) {
  const on = !!h;
  const lbl = on ? CEZALAR[ctKey(h)]?.kisa || "" : "";
  return `<div class="sym"><svg viewBox="0 0 40 36" width="18" height="16"><polygon points="20,3 37,33 3,33" fill="${on ? "rgba(224,71,58,.85)" : "none"}" stroke="${on ? "#e0473a" : "#666"}" stroke-width="2.5" stroke-linejoin="round"/></svg><i>${lbl || "&nbsp;"}</i></div>`;
}
function circ(h) {
  const on = !!h, t = on ? (h.trump || h.oyun.replace("Koz ", "")) : "";
  const red = t === "♥" || t === "♦";
  return `<div class="sym"><svg viewBox="0 0 36 36" width="16" height="16"><circle cx="18" cy="18" r="15" fill="${on ? "#e0a24f" : "none"}" stroke="${on ? "#e0a24f" : "#666"}" stroke-width="2.5"/>${on ? `<text x="18" y="25" text-anchor="middle" font-size="19" fill="${red ? "#b3261e" : "#000"}">${t}</text>` : ""}</svg><i>${on ? "Koz" : "&nbsp;"}</i></div>`;
}
function showCetvel() {
  const H = G.history || [];
  const HC = histCur();
  const blocks = [0, 1, 2, 3].map((p) => {
    const mine = HC.filter((h) => h.secen === p);
    const cz = mine.filter((h) => !isKozH(h)), kz = mine.filter(isKozH);
    let topCeza = 0, topKoz = 0;
    H.forEach((h) => (isKozH(h) ? (topKoz += h.deltas[p]) : (topCeza += h.deltas[p])));
    const sc = G.scores[p];
    return `<div class="blk${p === chooser && phase !== "idle" ? " cur" : ""}">
      <div class="bn">${NAMES[p]}</div>
      <div class="syms">${[0, 1, 2].map((i) => tri(cz[i])).join("")}<span class="sp"></span>${[0, 1].map((i) => circ(kz[i])).join("")}</div>
      <div class="bt2"><span>C <b class="neg">${topCeza}</b></span><span>K <b class="pos">+${topKoz}</b></span><span class="pp ${sc < 0 ? "neg" : sc > 0 ? "pos" : ""}">${sc}</span></div>
    </div>`;
  }).join("");
  // Ceza listesi: her ceza 2 kez; kullanılanlar kırmızı çizilir
  const list = CEZA_KEYS.map((k) => {
    const u = G.typeUsed[k];
    const marks = [0, 1].map((i) => `<span class="mk${i < u ? " on" : ""}"></span>`).join("");
    return `<div class="cz${u >= 2 ? " done" : ""}"><span class="cn">${CEZALAR[k].ad}</span>${marks}</div>`;
  }).join("");
  // Kalan potansiyel
  const kozKalan = 8 - G.kozCount.reduce((a, b) => a + b, 0);
  const cezaKalan = CEZA_KEYS.reduce((a, k) => a + (2 - G.typeUsed[k]) * CEZA_TOPLAM[k], 0);
  const kozPuan = kozKalan * 13 * 50;
  const lead = Math.max(...G.scores);
  const pot = [0, 1, 2, 3].map((p) => {
    const best = G.scores[p] + kozPuan; // tüm kalan koz ellerini alırsa, hiç ceza yemezse
    const fark = lead - G.scores[p];
    const ok = best >= lead;
    return `<tr><td style="text-align:left">${NAMES[p]}</td><td>${fark ? "−" + fark : "lider"}</td><td class="${ok ? "pos" : "neg"}">${best}</td><td>${ok ? "✔" : "✘"}</td></tr>`;
  }).join("");
  const cur = phase === "play" && contract ? `<tr class="next"><td>${G.round + 1}</td><td class="oy">${contractName(contract)}<br>${NAMES[chooser]} 👑 · oynanıyor</td><td colspan="4">…</td></tr>` : "";
  const body = H.map((h) => `<tr><td>${h.el}</td><td class="oy">${isKozH(h) ? `<b style="color:var(--accent)">${h.oyun}</b>` : h.oyun}<br><span style="color:var(--muted)">${NAMES[h.secen]}</span></td>${h.deltas.map((d) => `<td class="${d < 0 ? "neg" : d > 0 ? "pos" : ""}">${d > 0 ? "+" : ""}${d || "·"}</td>`).join("")}</tr>`).join("");
  $("modal2").innerHTML = `
    <h2>📋 Cetvel</h2>
    <p>El ${Math.min(G.round, 20)}/20 · △ ceza (3) · ○ koz (2)</p>
    <div class="grid4">${blocks}</div>
    <div class="czl">${list}</div>
    <div class="potk">
      <div><span>Kalan koz</span><b>${kozKalan} el</b><br><i>${kozPuan} puan dağıtılacak</i></div>
      <div><span>Kalan ceza</span><b>${CEZA_KEYS.reduce((a, k) => a + 2 - G.typeUsed[k], 0)} oyun</b><br><i>−${cezaKalan} puan dağıtılacak</i></div>
    </div>
    <table class="cet"><tr><th style="text-align:left">Çıkabilir mi?</th><th>Lidere fark</th><th>En iyi ihtimal</th><th></th></tr>${pot}</table>
    <p style="font-size:9.5px;margin-top:-5px;color:var(--muted)">En iyi ihtimal: kalan tüm kozları alıp hiç ceza yemezse (lider sabit kalırsa).</p>
    <details><summary style="cursor:pointer;color:var(--accent);font-size:12px;margin-bottom:4px">El el detay</summary>
    <table class="cet"><tr><th>#</th><th style="text-align:left">Oyun · seçen</th>${NAMES.map((n) => `<th>${n}</th>`).join("")}</tr>${body}${cur}</table></details>
    <button class="btn" id="cetClose">Kapat</button>`;
  $("overlay2").classList.add("show");
  $("cetClose").onclick = () => $("overlay2").classList.remove("show");
}
$("cetBtn").onclick = showCetvel;
$("scores").onclick = showCetvel;

function showRules(resume) {
  $("modal").innerHTML = `
    <h2>👑 King</h2>
    ${ISIM.html([["ben", "Sen", "Senin adın"], ["sag", "Sadosan", "Sağındaki"], [null, "Sadolayn", "Karşındaki"], ["sol", "Sadocan", "Solundaki"]])}
    <ul class="rules">
      <li>20 el oynanır. Her oyuncu sırayla 5 kez oyun seçer: <b>2 koz</b> ve <b>3 ceza</b>. Her ceza oyunda toplam 2 kez oynanabilir.</li>
      <li><b>Cezalar:</b> El almaz (el başı −50), Kupa almaz (kupa başı −30), Erkek almaz (papaz/vale −60), Kız almaz (kız −100), Rifki (kupa papazı −320), Son iki (son iki el −180).</li>
      <li><b>Zor seviye:</b> Rakipler her hamlede olası kart dağılımlarını simüle ederek oynar ve birlikte senin puanını düşürmeye çalışır.</li>
      <li><b>Koz:</b> Aldığın her el +50. Her oyuncunun <b>ilk seçimi koz olamaz</b>; ilk turda herkes ceza seçer.</li>
      <li>Renge uymak zorunlu. Koz oyununda renk yoksa koz atılır ve yükseltmek gerekir.</li>
      <li>Ceza oyunlarında renk yoksa ceza kartı varsa onu atmak zorundasın (kupa, kız, erkek, rifki).</li>
    </ul>
    <button class="btn" id="start">${resume ? "Devam et" : "Başla"}</button>
    ${resume ? '<button class="btn" id="fresh" style="margin-top:8px;background:transparent;color:var(--muted);border-color:var(--line)">Yeni oyun başlat</button>' : ""}`;
  $("overlay").classList.add("show");
  ISIM.bind($("modal"), () => { setNames(); try { renderInfo(); } catch (e) {} });
  $("start").onclick = () => { $("overlay").classList.remove("show"); newRound(); };
  if (resume) $("fresh").onclick = () => { $("overlay").classList.remove("show"); newGame(); newRound(); };
}

const saved = load();
if (saved) G = saved; else newGame();
renderInfo();
showRules(!!saved && saved.round > 0);
</script>
