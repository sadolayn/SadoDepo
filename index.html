<!doctype html>
<html lang="tr">
<head>
<meta name="theme-color" content="#000000">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sayı Tahmin Oyunu</title>
<style>
  :root {
    --bg: #faf6f0;
    --card: #ffffff;
    --ink: #2b2420;
    --muted: #8a7e74;
    --accent: #c98a4b;
    --accent-dark: #a96d33;
    --up: #3b82c4;
    --down: #d1603d;
    --win: #2f9e6b;
    --line: #ece4d9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1916;
      --card: #26221e;
      --ink: #f2ebe3;
      --muted: #a39789;
      --line: #3a342e;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 28px 22px;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.06);
  }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 15px; }
  .levels { display: flex; gap: 8px; margin-bottom: 20px; }
  .levels button {
    flex: 1;
    padding: 10px 0;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    font-size: 14px;
    cursor: pointer;
  }
  .levels button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .msg {
    min-height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 16px;
    transition: color .2s;
  }
  .msg.up { color: var(--up); }
  .msg.down { color: var(--down); }
  .msg.win { color: var(--win); }
  .msg.lose { color: var(--down); }
  .row { display: flex; gap: 8px; }
  input {
    flex: 1;
    min-width: 0;
    font-size: 24px;
    text-align: center;
    padding: 14px;
    border-radius: 14px;
    border: 2px solid var(--line);
    background: var(--bg);
    color: var(--ink);
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  .go {
    padding: 0 22px;
    font-size: 18px;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  .go:active { background: var(--accent-dark); }
  .go:disabled { opacity: .4; }
  .stats {
    display: flex;
    justify-content: space-around;
    margin: 22px 0 12px;
    padding: 14px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .stat b { display: block; font-size: 22px; }
  .stat span { font-size: 12px; color: var(--muted); }
  .history { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; min-height: 30px; margin-bottom: 18px; }
  .chip { padding: 4px 10px; border-radius: 99px; font-size: 14px; background: var(--line); }
  .chip.up { color: var(--up); }
  .chip.down { color: var(--down); }
  .chip.win { background: var(--win); color: #fff; }
  .again {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border-radius: 14px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-weight: 600;
    cursor: pointer;
  }
  .shake { animation: shake .35s; }
  @keyframes shake {
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>
<main class="card">
  <h1>🎯 Sayı Tahmin</h1>
  <p class="sub" id="sub">1 ile 1000 arasında bir sayı tuttum.</p>

  <div class="levels">
    <button data-max="100" data-tries="7">Kolay</button>
    <button data-max="500" data-tries="9">Orta</button>
    <button data-max="1000" data-tries="10" class="active">Zor</button>
  </div>

  <div class="msg" id="msg">Tahminini yaz!</div>

  <form class="row" id="form">
    <input id="guess" type="number" inputmode="numeric" placeholder="?" autocomplete="off">
    <button class="go" id="go" type="submit">Dene</button>
  </form>

  <div class="stats">
    <div class="stat"><b id="left">10</b><span>Kalan hak</span></div>
    <div class="stat"><b id="wins">0</b><span>Kazanılan</span></div>
    <div class="stat"><b id="best">–</b><span>En iyi</span></div>
  </div>

  <div class="history" id="history"></div>

  <button class="again" id="again">Yeni oyun</button>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  let max = 1000, maxTries = 10, secret, left, over;
  let wins = 0, best = null;

  try {
    wins = Number(localStorage.getItem("wins")) || 0;
    best = JSON.parse(localStorage.getItem("best") || "null");
  } catch (e) {}

  function save() {
    try {
      localStorage.setItem("wins", wins);
      localStorage.setItem("best", JSON.stringify(best));
    } catch (e) {}
  }

  function setMsg(text, cls = "") {
    const m = $("msg");
    m.textContent = text;
    m.className = "msg " + cls;
  }

  function newGame() {
    secret = Math.floor(Math.random() * max) + 1;
    left = maxTries;
    over = false;
    $("sub").textContent = `1 ile ${max} arasında bir sayı tuttum.`;
    $("history").innerHTML = "";
    $("guess").value = "";
    $("guess").disabled = false;
    $("go").disabled = false;
    setMsg("Tahminini yaz!");
    render();
    $("guess").focus();
  }

  function render() {
    $("left").textContent = left;
    $("wins").textContent = wins;
    $("best").textContent = best ? best : "–";
  }

  function addChip(n, cls, arrow) {
    const c = document.createElement("span");
    c.className = "chip " + cls;
    c.textContent = n + (arrow ? " " + arrow : "");
    $("history").appendChild(c);
  }

  function shake() {
    const i = $("guess");
    i.classList.remove("shake");
    void i.offsetWidth;
    i.classList.add("shake");
  }

  function end() {
    over = true;
    $("guess").disabled = true;
    $("go").disabled = true;
  }

  $("form").addEventListener("submit", (e) => {
    e.preventDefault();
    if (over) return;
    const n = Number($("guess").value);
    if (!Number.isInteger(n) || n < 1 || n > max) {
      setMsg(`1 ile ${max} arası bir sayı gir`, "lose");
      shake();
      return;
    }
    left--;
    const used = maxTries - left;

    if (n === secret) {
      addChip(n, "win", "✓");
      wins++;
      if (!best || used < best) best = used;
      save();
      setMsg(`🎉 Bildin! ${used}. denemede`, "win");
      end();
    } else if (n < secret) {
      addChip(n, "up", "↑");
      setMsg("Daha büyük ⬆️", "up");
      shake();
    } else {
      addChip(n, "down", "↓");
      setMsg("Daha küçük ⬇️", "down");
      shake();
    }

    if (!over && left === 0) {
      setMsg(`😢 Hakkın bitti! Sayı ${secret} idi`, "lose");
      end();
    }

    render();
    $("guess").value = "";
    if (!over) $("guess").focus();
  });

  document.querySelectorAll(".levels button").forEach((b) => {
    b.addEventListener("click", () => {
      document.querySelectorAll(".levels button").forEach((x) => x.classList.remove("active"));
      b.classList.add("active");
      max = Number(b.dataset.max);
      maxTries = Number(b.dataset.tries);
      newGame();
    });
  });

  $("again").addEventListener("click", newGame);
  newGame();
</script>
</body>
</html>
