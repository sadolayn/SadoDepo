<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sado Oyunlar</title>
<style>
  :root {
    --bg: #000000;
    --card: #0d0d0d;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --line: #262626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  h1 { margin: 0 0 4px; font-size: 30px; }
  p { margin: 0 0 28px; color: var(--muted); }
  .list { width: 100%; max-width: 380px; display: grid; gap: 12px; }
  a.game {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    color: var(--ink);
    text-decoration: none;
    transition: border-color .15s, transform .1s;
  }
  a.game:active { transform: scale(.98); border-color: var(--accent); }
  .icon { font-size: 36px; width: 48px; text-align: center; }
  .t { font-size: 19px; font-weight: 700; }
  .d { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .arrow { margin-left: auto; color: var(--accent); font-size: 22px; }
</style>
</head>
<body>
  <h1>🎮 Sado Oyunlar</h1>
  <p>Bir oyun seç</p>
  <div class="list">
    <a class="game" href="batak.html">
      <div class="icon">♠️</div>
      <div><div class="t">Batak</div><div class="d">İhaleli batak, 3 rakibe karşı</div></div>
      <div class="arrow">›</div>
    </a>
    <a class="game" href="tahmin.html">
      <div class="icon">🎯</div>
      <div><div class="t">Sayı Tahmin</div><div class="d">Tuttuğum sayıyı bul</div></div>
      <div class="arrow">›</div>
    </a>
  </div>
</body>
</html>
