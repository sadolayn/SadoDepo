<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Batak</title>
<style>
  :root {
    --bg: #000000;
    --felt: #0b2a1c;
    --felt-line: #164a33;
    --card: #0d0d0d;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --red: #e0473a;
    --win: #3fc283;
    --line: #262626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    padding: 10px 10px 14px;
    user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  .info { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.3; }
  .info b { color: var(--accent); }
  .scores {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    margin: 8px 0; font-size: 12px; text-align: center;
  }
  .scores div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 2px; }
  .scores b { display: block; font-size: 15px; }

  .table {
    flex: 1;
    min-height: 330px;
    position: relative;
    background: radial-gradient(ellipse at center, var(--felt-line) 0%, var(--felt) 70%);
    border-radius: 22px;
    border: 1px solid var(--felt-line);
  }
  .seat {
    position: absolute;
    background: rgba(0,0,0,.55);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 5px 8px;
    font-size: 12px;
    text-align: center;
    min-width: 78px;
    transition: border-color .2s, box-shadow .2s;
  }
  .seat .nm { font-weight: 700; font-size: 13px; }
  .seat .bd { color: var(--muted); }
  .seat.turn { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224,162,79,.35); }
  .seat.bidder .nm::after { content: " 👑"; }
  .seat-n { top: 8px; left: 50%; transform: translateX(-50%); }
  .seat-w { left: 6px; top: 50%; transform: translateY(-50%); }
  .seat-e { right: 6px; top: 50%; transform: translateY(-50%); }
  .seat-s { bottom: 8px; left: 50%; transform: translateX(-50%); }

  .slot { position: absolute; width: 52px; height: 76px; }
  .slot-n { top: 68px; left: 50%; transform: translateX(-50%); }
  .slot-s { bottom: 68px; left: 50%; transform: translateX(-50%); }
  .slot-w { left: 92px; top: 50%; transform: translateY(-50%); }
  .slot-e { right: 92px; top: 50%; transform: translateY(-50%); }

  .card {
    width: 52px; height: 76px;
    background: #f7f4ee;
    color: #111;
    border-radius: 7px;
    border: 1px solid #bbb;
    position: relative;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
    flex: none;
  }
  .card.red { color: var(--red); }
  .card .r { position: absolute; top: 3px; left: 4px; font-size: 22px; line-height: 1; letter-spacing: -1px; }
  .card .s1 { position: absolute; top: 25px; left: 4px; font-size: 19px; line-height: 1; }
  .card .s2 { position: absolute; bottom: 3px; right: 4px; font-size: 30px; line-height: 1; }
  .card.win { outline: 3px solid var(--win); }
  .pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .status {
    min-height: 40px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 15px; padding: 6px 4px;
  }
  .panel { display: none; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .panel.show { display: flex; }
  .panel button, .btn {
    min-width: 44px; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .panel button.pass { border-color: var(--red); color: var(--red); }
  .panel button.suit { font-size: 26px; padding: 6px 16px; }
  .panel button.suit.red { color: var(--red); }

  .hand {
    display: flex; justify-content: center;
    padding: 14px 0 4px; min-height: 90px;
  }
  .hand .card:not(:last-child) .s2 { display: none; }
  .hand .card { margin-left: -26px; transition: transform .12s, opacity .12s; cursor: pointer; }
  .hand .card:first-child { margin-left: 0; }
  .hand .card.ok { transform: translateY(-10px); }
  .hand .card.no { opacity: .4; cursor: default; }
  .hand .card.ok:active { transform: translateY(-16px); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; width: 100%; max-width: 360px; text-align: center;
  }
  .modal h2 { margin: 0 0 6px; font-size: 20px; }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .modal table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 14px; }
  .modal td, .modal th { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .modal th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .pos { color: var(--win); }
  .neg { color: var(--red); }
  .modal .btn { width: 100%; background: var(--accent); border-color: var(--accent); color: #000; }
  .rules { font-size: 13px; color: var(--muted); text-align: left; line-height: 1.5; margin: 0 0 14px; padding-left: 18px; }
</style>
</head>
<body>
<header>
  <a href="index.html">← Menü</a>
  <h1>♠ Batak</h1>
  <div class="info" id="info">Koz: –<br>İhale: –</div>
</header>

<div class="scores" id="scores"></div>

<div class="table" id="table">
  <div class="seat seat-n" id="seat2"></div>
  <div class="seat seat-w" id="seat3"></div>
  <div class="seat seat-e" id="seat1"></div>
  <div class="seat seat-s" id="seat0"></div>
  <div class="slot slot-s" id="slot0"></div>
  <div class="slot slot-e" id="slot1"></div>
  <div class="slot slot-n" id="slot2"></div>
  <div class="slot slot-w" id="slot3"></div>
</div>

<div class="status" id="status"></div>
<div class="panel" id="bidPanel"></div>
<div class="panel" id="trumpPanel"></div>
<div class="hand" id="hand"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const SUITS = ["♠", "♥", "♣", "♦"];
const SUIT_NAMES = { "♠": "Maça", "♥": "Kupa", "♣": "Sinek", "♦": "Karo" };
const RANKS = { 11: "J", 12: "Q", 13: "K", 14: "A" };
const NAMES = ["Sen", "Sadosan", "Sadolayn", "Sadocan"];
const isRed = (s) => s === "♥" || s === "♦";
const rankText = (r) => RANKS[r] || String(r);
const id = (c) => c.s + c.r;
const $ = (x) => document.getElementById(x);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

let scores = [0, 0, 0, 0];
let dealer = 3;
let hands, bids, active, highBid, highBidder, bidder, contract, trump, trumpBroken;
let trick, turn, tricks, played, phase, busy = false;

try {
  const s = JSON.parse(localStorage.getItem("batakScores") || "null");
  if (Array.isArray(s) && s.length === 4) scores = s;
} catch (e) {}
function saveScores() {
  try { localStorage.setItem("batakScores", JSON.stringify(scores)); } catch (e) {}
}

// ---------- Kartlar ----------
function newDeck() {
  const d = [];
  for (const s of SUITS) for (let r = 2; r <= 14; r++) d.push({ s, r });
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
function sortHand(h) {
  h.sort((a, b) => SUITS.indexOf(a.s) - SUITS.indexOf(b.s) || b.r - a.r);
}
function cardEl(c) {
  const el = document.createElement("div");
  el.className = "card" + (isRed(c.s) ? " red" : "");
  el.innerHTML = `<span class="r">${rankText(c.r)}</span><span class="s1">${c.s}</span><span class="s2">${c.s}</span>`;
  return el;
}

// ---------- Kurallar ----------
function beats(a, b, led) {
  if (a.s === b.s) return a.r > b.r;
  if (a.s === trump) return true;
  return false;
}
function trickWinner(t) {
  const led = t[0].card.s;
  let best = t[0];
  for (const x of t) if (beats(x.card, best.card, led)) best = x;
  return best;
}
function legal(hand) {
  if (trick.length === 0) {
    if (!trumpBroken) {
      const nt = hand.filter((c) => c.s !== trump);
      if (nt.length) return nt;
    }
    return hand;
  }
  const led = trick[0].card.s;
  const best = trickWinner(trick).card;
  const same = hand.filter((c) => c.s === led);
  if (same.length) {
    if (best.s === led) {
      const higher = same.filter((c) => c.r > best.r);
      if (higher.length) return higher;
    }
    return same;
  }
  const tr = hand.filter((c) => c.s === trump);
  if (tr.length) {
    if (best.s === trump) {
      const higher = tr.filter((c) => c.r > best.r);
      if (higher.length) return higher;
    }
    return tr;
  }
  return hand;
}

// ---------- Bilgisayar ----------
function estimate(hand) {
  let est = 0, longest = 0;
  for (const s of SUITS) {
    const cs = hand.filter((c) => c.s === s);
    const len = cs.length;
    const has = (r) => cs.some((c) => c.r === r);
    if (has(14)) est += 1;
    if (has(13)) est += len >= 2 ? 0.8 : 0.2;
    if (has(12)) est += len >= 3 ? 0.5 : 0;
    if (has(11)) est += len >= 4 ? 0.3 : 0;
    longest = Math.max(longest, len);
  }
  if (longest > 4) est += (longest - 4) * 0.9;
  return est;
}
function botChooseTrump(hand) {
  let best = SUITS[0], bestScore = -1;
  for (const s of SUITS) {
    const cs = hand.filter((c) => c.s === s);
    const sc = cs.length * 2 + cs.reduce((a, c) => a + Math.max(0, c.r - 10), 0);
    if (sc > bestScore) { bestScore = sc; best = s; }
  }
  return best;
}
function isBoss(c, hand) {
  for (let r = c.r + 1; r <= 14; r++) {
    const k = c.s + r;
    if (!played.has(k) && !hand.some((h) => id(h) === k)) return false;
  }
  return true;
}
function lowest(cards) {
  return [...cards].sort((a, b) => (a.s === trump) - (b.s === trump) || a.r - b.r)[0];
}
function botPick(p) {
  const hand = hands[p];
  const L = legal(hand);
  if (trick.length === 0) {
    const bosses = L.filter((c) => isBoss(c, hand));
    const nonTrumpBoss = bosses.filter((c) => c.s !== trump);
    if (nonTrumpBoss.length) return nonTrumpBoss[0];
    if (bosses.length && p === bidder) return bosses[0];
    return lowest(L);
  }
  const led = trick[0].card.s;
  const best = trickWinner(trick).card;
  const winning = L.filter((c) => beats(c, best, led));
  if (winning.length) {
    const asc = [...winning].sort((a, b) => a.r - b.r);
    if (trick.length === 3) return asc[0];
    const boss = asc.find((c) => isBoss(c, hand));
    return boss || asc[asc.length - 1];
  }
  return lowest(L);
}

// ---------- Ekran ----------
function setStatus(t) { $("status").innerHTML = t; }

function renderInfo() {
  const k = trump ? `<b style="color:${isRed(trump) ? "var(--red)" : "var(--ink)"}">${trump} ${SUIT_NAMES[trump]}</b>` : "–";
  const i = bidder != null && contract ? `<b>${contract}</b> · ${NAMES[bidder]}` : "–";
  $("info").innerHTML = `Koz: ${k}<br>İhale: ${i}`;
  $("scores").innerHTML = scores
    .map((s, p) => `<div>${NAMES[p]}<b class="${s < 0 ? "neg" : ""}">${s}</b></div>`)
    .join("");
}
function renderSeats() {
  for (let p = 0; p < 4; p++) {
    const el = $("seat" + p);
    let bd = "";
    if (phase === "bid") {
      bd = bids[p] == null ? "…" : bids[p] === "pas" ? "Pas" : `İhale ${bids[p]}`;
    } else {
      bd = `Aldı: ${tricks[p]}` + (p === bidder ? ` / ${contract}` : "");
    }
    el.innerHTML = `<div class="nm">${NAMES[p]}</div><div class="bd">${bd}</div>`;
    el.classList.toggle("turn", turn === p && (phase === "bid" || phase === "play"));
    el.classList.toggle("bidder", phase !== "bid" && p === bidder);
  }
}
function renderTrick(winnerP) {
  for (let p = 0; p < 4; p++) $("slot" + p).innerHTML = "";
  for (const t of trick) {
    const el = cardEl(t.card);
    if (t.fresh) { el.classList.add("pop"); t.fresh = false; }
    if (winnerP === t.p) el.classList.add("win");
    $("slot" + t.p).appendChild(el);
  }
}
function renderHand() {
  const h = $("hand");
  h.innerHTML = "";
  const myTurn = phase === "play" && turn === 0 && !busy;
  const ok = myTurn ? new Set(legal(hands[0]).map(id)) : null;
  for (const c of hands[0]) {
    const el = cardEl(c);
    if (myTurn) {
      if (ok.has(id(c))) {
        el.classList.add("ok");
        el.onclick = () => humanPlay(c);
      } else el.classList.add("no");
    }
    h.appendChild(el);
  }
}
function render() { renderInfo(); renderSeats(); renderHand(); }

// ---------- El dağıtımı ----------
function newRound() {
  dealer = (dealer + 1) % 4;
  const d = newDeck();
  hands = [0, 1, 2, 3].map((i) => d.slice(i * 13, i * 13 + 13));
  hands.forEach(sortHand);
  bids = [null, null, null, null];
  active = [true, true, true, true];
  highBid = 0; highBidder = -1;
  bidder = null; contract = 0; trump = null; trumpBroken = false;
  trick = []; tricks = [0, 0, 0, 0]; played = new Set();
  phase = "bid";
  turn = (dealer + 1) % 4;
  renderTrick();
  render();
  bidTurn();
}

// ---------- İhale ----------
async function bidTurn() {
  const act = [0, 1, 2, 3].filter((i) => active[i]);
  if (highBidder >= 0 && act.length === 1) return endBidding();
  if (act.length === 0) {
    highBid = 4; highBidder = dealer;
    setStatus(`Herkes pas geçti, ihale ${NAMES[dealer]}'e 4 ile kaldı.`);
    await wait(1200);
    return endBidding();
  }
  while (!active[turn]) turn = (turn + 1) % 4;
  renderSeats();
  if (turn === 0) {
    showBidPanel();
  } else {
    setStatus(`${NAMES[turn]} düşünüyor…`);
    await wait(750);
    const want = Math.floor(estimate(hands[turn]));
    const min = Math.max(4, highBid + 1);
    doBid(turn, want >= min && min <= 13 ? min : "pas");
  }
}
function showBidPanel() {
  const min = Math.max(4, highBid + 1);
  setStatus(highBid ? `En yüksek ihale: <b>${highBid}</b> (${NAMES[highBidder]}). Senin sıran.` : "İhale sende. Kaç el alırsın?");
  const panel = $("bidPanel");
  panel.innerHTML = "";
  for (let v = min; v <= 13; v++) {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => { panel.classList.remove("show"); doBid(0, v); };
    panel.appendChild(b);
  }
  const ps = document.createElement("button");
  ps.textContent = "Pas";
  ps.className = "pass";
  ps.onclick = () => { panel.classList.remove("show"); doBid(0, "pas"); };
  panel.appendChild(ps);
  panel.classList.add("show");
}
function doBid(p, v) {
  if (v === "pas") { active[p] = false; bids[p] = "pas"; }
  else { highBid = v; highBidder = p; bids[p] = v; }
  turn = (p + 1) % 4;
  renderSeats();
  bidTurn();
}
async function endBidding() {
  bidder = highBidder; contract = highBid;
  phase = "trump";
  turn = bidder;
  if (bidder === 0) {
    setStatus(`İhaleyi <b>${contract}</b> ile aldın. Kozu seç:`);
    const panel = $("trumpPanel");
    panel.innerHTML = "";
    for (const s of SUITS) {
      const b = document.createElement("button");
      b.className = "suit" + (isRed(s) ? " red" : "");
      b.textContent = s;
      b.onclick = () => { panel.classList.remove("show"); startPlay(s); };
      panel.appendChild(b);
    }
    panel.classList.add("show");
    render();
  } else {
    render();
    const t = botChooseTrump(hands[bidder]);
    setStatus(`${NAMES[bidder]} ihaleyi <b>${contract}</b> ile aldı, koz <b>${t} ${SUIT_NAMES[t]}</b>.`);
    await wait(1500);
    startPlay(t);
  }
}

// ---------- Oyun ----------
function startPlay(t) {
  trump = t;
  phase = "play";
  turn = bidder;
  render();
  playTurn();
}
async function playTurn() {
  renderSeats();
  if (turn === 0) {
    setStatus(trick.length === 0 ? "Sıra sende, bir kart aç." : "Sıra sende.");
    renderHand();
  } else {
    setStatus(`${NAMES[turn]} oynuyor…`);
    renderHand();
    await wait(650);
    playCard(turn, botPick(turn));
  }
}
function humanPlay(c) {
  if (phase !== "play" || turn !== 0 || busy) return;
  playCard(0, c);
}
async function playCard(p, c) {
  hands[p] = hands[p].filter((x) => id(x) !== id(c));
  trick.push({ p, card: c, fresh: true });
  played.add(id(c));
  if (c.s === trump) trumpBroken = true;
  renderTrick();
  if (trick.length < 4) {
    turn = (p + 1) % 4;
    renderHand();
    return playTurn();
  }
  busy = true;
  const w = trickWinner(trick).p;
  tricks[w]++;
  turn = -1;
  renderTrick(w);
  render();
  setStatus(w === 0 ? "Eli <b>sen</b> aldın! 👏" : `Eli <b>${NAMES[w]}</b> aldı.`);
  await wait(1100);
  trick = [];
  renderTrick();
  busy = false;
  if (hands[0].length === 0) return endRound();
  turn = w;
  playTurn();
}

// ---------- Puanlama ----------
function endRound() {
  phase = "end";
  const deltas = [0, 1, 2, 3].map((p) => {
    if (p === bidder) return tricks[p] >= contract ? tricks[p] : -contract;
    return tricks[p];
  });
  deltas.forEach((d, p) => (scores[p] += d));
  saveScores();
  render();
  const made = tricks[bidder] >= contract;
  const title = made
    ? (bidder === 0 ? "🎉 İhaleyi tuttun!" : `${NAMES[bidder]} ihaleyi tuttu`)
    : (bidder === 0 ? "😬 Battın!" : `${NAMES[bidder]} battı!`);
  const rows = [0, 1, 2, 3].map((p) => `
    <tr><td style="text-align:left">${NAMES[p]}${p === bidder ? " 👑" : ""}</td>
    <td>${tricks[p]}</td>
    <td class="${deltas[p] < 0 ? "neg" : "pos"}">${deltas[p] > 0 ? "+" : ""}${deltas[p]}</td>
    <td><b>${scores[p]}</b></td></tr>`).join("");
  $("modal").innerHTML = `
    <h2>${title}</h2>
    <p>İhale ${contract} · Alınan ${tricks[bidder]} · Koz ${trump}</p>
    <table><tr><th></th><th>El</th><th>Puan</th><th>Toplam</th></tr>${rows}</table>
    <button class="btn" id="next">Sonraki el</button>
    <button class="btn" id="reset" style="margin-top:8px;background:transparent;color:var(--muted);border-color:var(--line)">Puanları sıfırla</button>`;
  $("overlay").classList.add("show");
  $("next").onclick = () => { $("overlay").classList.remove("show"); newRound(); };
  $("reset").onclick = () => { scores = [0, 0, 0, 0]; saveScores(); $("overlay").classList.remove("show"); newRound(); };
  setStatus("");
}

// ---------- Başlangıç ----------
function showRules() {
  $("modal").innerHTML = `
    <h2>♠ İhaleli Batak</h2>
    <ul class="rules">
      <li>Herkese 13 kart dağıtılır. En yüksek ihaleyi (en az 4) veren kozu seçer ve ilk kartı açar.</li>
      <li>Yerdeki rengi atmak zorundasın; atabiliyorsan <b>yükseltmek</b> zorundasın.</li>
      <li>O renk yoksa <b>koz</b> atmalısın (yükseltebiliyorsan yükselt).</li>
      <li>Koz oynanmadan kozla el açılamaz.</li>
      <li>İhaleyi tutan aldığı el kadar, tutamayan ihale kadar eksi yazar. Diğerleri aldığı el kadar puan alır.</li>
    </ul>
    <button class="btn" id="start">Başla</button>`;
  $("overlay").classList.add("show");
  $("start").onclick = () => { $("overlay").classList.remove("show"); newRound(); };
}
renderInfo();
showRules();
</script>
<script data-goatcounter="https://sadolayn.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
