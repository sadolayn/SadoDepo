<style>
  :root {
    --bg: #000000;
    --felt: #0b2a1c;
    --felt-line: #164a33;
    --card: #0d0d0d;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --red: #e0473a;
    --win: #3fc283;
    --line: #262626;
    --cw: 56px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    padding: 10px 10px 14px;
    user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  .info { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.3; }
  .info b { color: var(--accent); }
  .scores {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    margin: 8px 0; font-size: 12px; text-align: center;
  }
  .scores div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 2px; }
  .scores b { display: block; font-size: 15px; }

  .table {
    flex: 1;
    min-height: 330px;
    position: relative;
    background: linear-gradient(135deg, #2a3fe0 0%, #1a2bb8 55%, #13208f 100%);
    border-radius: 22px;
    border: 1px solid #3a50f0;
    overflow: hidden;
  }
  /* Arka planda SADOLAYN gölgesi */
  .table::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: url("img/logo.png") center 77% / 70% auto no-repeat;
    opacity: .2; filter: grayscale(1) brightness(2.4);
  }
  .seat, .slot { z-index: 1; }
  .seat {
    position: absolute;
    background: rgba(0,0,0,.55);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 5px 8px;
    font-size: 12px;
    text-align: center;
    min-width: 78px;
    transition: border-color .2s, box-shadow .2s;
  }
  .seat .nm { font-weight: 700; font-size: 13px; }
  .seat .bd { color: var(--muted); }
  .seat.turn { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224,162,79,.35); }
  .seat.bidder .nm::after { content: " 👑"; }
  .seat-n { top: 8px; left: 50%; transform: translateX(-50%); }
  .seat-w { left: 6px; top: 50%; transform: translateY(-50%); }
  .seat-e { right: 6px; top: 50%; transform: translateY(-50%); }
  .seat-s { bottom: 8px; left: 50%; transform: translateX(-50%); }

  .slot { position: absolute; width: var(--cw); height: calc(var(--cw) * 1.45); }
  .slot-n { top: 64px; left: 50%; transform: translateX(-50%); }
  .slot-s { bottom: 64px; left: 50%; transform: translateX(-50%); }
  .slot-w { left: 90px; top: 50%; transform: translateY(-50%); }
  .slot-e { right: 90px; top: 50%; transform: translateY(-50%); }

  /* Kart yüzü, masa rengi ve kart arkası ortak ayarlardan (kartmasa.js) gelir */
  .card.win { outline: 3px solid var(--win); }
  .pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .status {
    min-height: 40px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 15px; padding: 6px 4px;
  }
  .panel { display: none; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .panel.show { display: flex; }
  .panel button, .btn {
    min-width: 44px; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .panel button.pass { border-color: var(--red); color: var(--red); }
  .panel button.suit { font-size: 26px; padding: 6px 16px; }
  .panel button.suit.red { color: var(--red); }

  /* Kısa ekranda (tarayıcı çubukları açıkken) masa biraz küçülür, eldeki kartlar hep görünür */
  @media (max-height: 760px) { .table { min-height: 250px; } }
  .hand {
    display: flex; justify-content: center;
    padding: 14px 0 4px; min-height: 90px;
  }
  .hand .card { margin-left: -30px; transition: transform .12s, opacity .12s; cursor: pointer; }
  .hand .card:first-child { margin-left: 0; }
  .hand .card.ok { transform: translateY(-10px); }
  .hand .card.no { opacity: .4; cursor: default; }
  .hand .card.ok:active { transform: translateY(-16px); }
  /* Kendi elin: yelpaze (oval) diziliş; parmağın altındaki kart kalkar, bırakınca atılır */
  .hand.yelpaze { display: block; position: relative; padding: 0; min-height: 0; height: calc(var(--cw) * 1.45 + var(--cw) * .3 + 18px); touch-action: none; }
  .hand.yelpaze .card { position: absolute; margin-left: 0; top: 12px; transform-origin: 50% 115%; transform: rotate(var(--rot, 0deg)); transition: transform .12s, opacity .12s, left .2s, top .2s; }
  .hand.yelpaze .card.ok { transform: rotate(var(--rot, 0deg)) translateY(-10px); }
  .hand.yelpaze .card.ok:active { transform: rotate(var(--rot, 0deg)) translateY(-10px); }
  .hand.yelpaze .card.sec { transform: rotate(var(--rot, 0deg)) translateY(-26px) scale(1.1); z-index: 40; box-shadow: 0 0 0 3px var(--accent), 0 12px 22px rgba(0,0,0,.6); }
  .hand.yelpaze .card.no.sec { transform: rotate(var(--rot, 0deg)) translateY(-6px); box-shadow: 0 0 0 2px var(--red); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; width: 100%; max-width: 360px; text-align: center;
  }
  .modal h2 { margin: 0 0 6px; font-size: 20px; }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .modal table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 14px; }
  .modal td, .modal th { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .modal th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .pos { color: var(--win); }
  .neg { color: var(--red); }
  .opts { text-align: left; margin-bottom: 10px; }
  .opts label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 5px; }
  .seg { display: flex; gap: 4px; background: #111; border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .seg button { flex: 1; padding: 8px 4px; border: none; border-radius: 9px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #000; }
  /* Pencere, tarayıcının araç çubukları arasında kalan görünür alana sığar; sığmazsa kaydırılır (vh yerine dvh) */
  .overlay, .ov { overflow-y: auto; overscroll-behavior: contain; }
  .modal { margin: auto; max-height: 92vh; max-height: calc(100dvh - 32px); overflow-y: auto; }
  /* Masa kur — Sadolayn teması (koyu mürdüm, altın vurgu, serif başlık) */
  .modal.ayar { max-width: 560px; padding: 0 0 16px; background: radial-gradient(120% 80% at 50% 0%, #2a1b33, #160f1d 70%); border: 1px solid #5b3f22; border-radius: 22px; color: #f3e9d8; text-align: left; overflow-x: hidden; box-shadow: 0 20px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,220,160,.12); }
  .ayar .ah { position: relative; padding: 16px 52px 12px; text-align: center; border-bottom: 1px solid rgba(224,162,79,.25); }
  .ayar .ah h2 { margin: 0; font-family: Georgia, "Times New Roman", serif; font-style: italic; font-weight: 700; font-size: 26px; color: #f0c674; letter-spacing: .5px; }
  .ayar .aw { display: inline-block; margin-top: 6px; font-size: 12px; color: #d9c7ad; background: rgba(224,162,79,.12); border: 1px solid rgba(224,162,79,.3); border-radius: 999px; padding: 3px 10px; }
  .ayar .ax { position: absolute; right: 12px; top: 14px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(240,198,116,.5); background: transparent; color: #f0c674; font-size: 15px; cursor: pointer; }
  .ayar .abal { display: flex; justify-content: space-between; align-items: center; margin: 12px 14px 0; padding: 10px 14px; border-radius: 14px; background: linear-gradient(90deg, rgba(240,198,116,.16), rgba(240,198,116,.04)); font-size: 13px; color: #d9c7ad; }
  .ayar .abal b { font-size: 17px; color: #ffe2a6; }
  .ayar .asec { margin: 14px 16px 2px; font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; color: #b79a74; }
  .ayar .agrid { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 8px 16px 4px; }
  @media (min-width: 520px) { .ayar .agrid { grid-template-columns: 1fr 1fr; column-gap: 22px; } }
  .ayar .arow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px; }
  .ayar .arow > span { white-space: nowrap; color: #eadcc6; }
  .ayar .step { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.28); border: 1px solid rgba(240,198,116,.2); border-radius: 999px; padding: 3px; }
  .ayar .step button { width: 32px; height: 32px; border-radius: 50%; border: none; background: linear-gradient(180deg, #f3cf86, #d9a54a); color: #2a1a05; font-size: 18px; font-weight: 800; line-height: 1; cursor: pointer; }
  .ayar .step button:active { transform: scale(.92); }
  .ayar .step b { min-width: 74px; text-align: center; font-size: 16px; color: #fff3dc; font-variant-numeric: tabular-nums; }
  .ayar .chk { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; margin: 0; color: #eadcc6; }
  .ayar .chk input { display: none; }
  .ayar .chk i { width: 42px; height: 24px; border-radius: 999px; background: #3b2f45; flex: none; position: relative; transition: background .2s; }
  .ayar .chk i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #cbbba6; transition: transform .2s, background .2s; }
  .ayar .chk input:checked + i { background: #d9a54a; }
  .ayar .chk input:checked + i::after { transform: translateX(18px); background: #fff7e6; }
  .ayar .chk small { opacity: .65; font-size: 12px; }
  .ayar .chk.off { opacity: .4; cursor: default; }
  .ayar .ahint { margin: 10px 16px 0; font-size: 12.5px; color: #e3d3bb; background: rgba(0,0,0,.22); border-radius: 12px; padding: 8px 12px; }
  .ayar .adet { margin: 8px 16px 0; background: rgba(0,0,0,.22); border-radius: 12px; padding: 6px 12px; }
  .ayar .adet summary { cursor: pointer; font-size: 14px; font-weight: 600; padding: 4px 0; color: #f0c674; }
  .ayar .rules { color: #e8dccb; }
  .ayar .abtn { display: block; box-sizing: border-box; width: calc(100% - 32px) !important; margin: 16px 16px 0; border-radius: 999px; background: linear-gradient(180deg, #f3cf86, #d9a54a); color: #2a1a05; border: none; font-family: Georgia, serif; font-style: italic; font-size: 18px; font-weight: 700; padding: 13px; box-shadow: 0 6px 18px rgba(217,165,74,.25); }
  .ayar .aAlt [data-cikis] { display: block; box-sizing: border-box; width: calc(100% - 32px) !important; margin: 8px 16px 0 !important; border-radius: 999px; padding: 11px; font-size: 15px; }
  .ayar .kasa { margin: 10px 16px 0; font-size: 12px; color: #b79a74; text-align: center; }
  /* Başla düğmesi pencerenin altında hep görünür */
  .ayar .aAlt { position: sticky; bottom: -16px; z-index: 2; margin: 8px 0 -16px; padding: 4px 0 16px; background: linear-gradient(rgba(22,15,29,0), rgba(22,15,29,.97) 14px); }
  .mpbox { background: linear-gradient(135deg, #1a2a4a, #0f1a30); border: 1px solid #2f4f8f; color: #cfdcff; border-radius: 12px; padding: 9px 12px; font-size: 14px; margin: 4px 0 8px; }
  .mpbox b { color: #fff; }
  .qopts { display: grid; gap: 8px; }
  .qopts button { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: #161616; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; text-align: left; }
  .qopts button.ok { border-color: #3fc283; background: rgba(63,194,131,.15); }
  .qopts button.bad { border-color: #e0473a; background: rgba(224,71,58,.15); }
  #pwrap { position: absolute; top: 58px; left: 0; right: 0; z-index: 2; display: flex; justify-content: center; pointer-events: none; }
  #phand { padding: 8px 0 0; min-height: 0; transform: scale(.76); transform-origin: top center; pointer-events: auto; }
  #phand .card { margin-left: -27px; }
  #phand .card.no { opacity: .6; }
  #phand .card:first-child { margin-left: 0; }
  #phand .card.ok { transform: translateY(8px); }
  .table.ph .slot-n { top: 140px; }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  .modal .btn { width: 100%; background: var(--accent); border-color: var(--accent); color: #000; }
  .rules { font-size: 13px; color: var(--muted); text-align: left; line-height: 1.5; margin: 0 0 14px; padding-left: 18px; }
</style>

<script>
// Kurallar: başlangıç penceresinde ve ⚙️ Ayarlar'da aynı metin
const KURAL = () => `<ul class="rules">
      <li>En yüksek ihaleyi veren kozu seçer ve ilk kartı açar (en az <b>4</b>, eşlide en az <b>7</b>). Koz oynanmadan kozla el açılamaz; eşlide <b>Kozla başlanabilir</b> açıksa açılabilir.</li>
      <li><b>Yükseltme zorunlu:</b> yerdeki rengi atarken büyüğünü atmak zorundasın. Kapalıysa renge uyman yeter; yalnızca <b>koz</b> yükseltilir.</li>
      <li>O renk yoksa koz atmalısın (yükseltebiliyorsan yükselt).</li>
      <li><b>El dağılımı:</b> Dengeli'de her oyuncuya her renkten 2–5 kart düşer, kozlar herkese benzer sayıda gelir. Rastgele'de kartlar tamamen şansa dağılır; bir oyuncuya çok koz gelebilir.</li>
      <li><b>Puan:</b> ihaleyi tutan, söz verdiği her el için 15, fazla her el için 10 puan alır; tutamayan ihale × 10 eksi yazar. Diğerleri aldıkları her el için 10 puan alır; <b>hiç el alamayan −50</b> yazar.</li>
      <li><b>Eşli:</b> karşındaki oyuncu eşindir, ellerin toplamı sayılır. İhaleyi alan eşinin kartlarını açık görür ve iki eli de o oynar.</li>
      <li><b>Yıldız:</b> İlk girişte 1.000 Yıldız ve bir kerelik 2.000 Yıldız hediyeyle başlarsın. Tekli oyunda birinci olursan ayırdığın Yıldızın <b>3 katını</b>, eşlide tarafın kazanırsa <b>2 katını</b> alırsın. Berabere biterse Yıldızın iade edilir.</li>
      <li>İstatistik için yalnızca isimsiz "oyun bitti" sayısı tutulur; Yıldız, sonuç ve ad hiçbir yere gönderilmez.</li>
      <li>Yıldız biterse 3 saat sonra İş Bankası sorusu gelir; doğru cevap 1.000 Yıldız kazandırır. Bakiyen King ve Balayı King'le ortaktır.</li>
    </ul>`;
if (window.KartMasa) KartMasa.kurallar = KURAL;
const SUITS = ["♠", "♥", "♣", "♦"];
const SUIT_NAMES = { "♠": "Maça", "♥": "Kupa", "♣": "Sinek", "♦": "Karo" };
const RANKS = { 11: "J", 12: "Q", 13: "K", 14: "A" };
let NAMES = [];
// İsimler: Sadolayn sabit; diğerlerini kullanıcı yazar (en fazla 8 karakter, tüm oyunlarda ortak)
function setNames() { NAMES = [ISIM.ben(), ISIM.get("sag", "Sadosan"), "Sadolayn", ISIM.get("sol", "Sadocan")]; }
setNames();
const isRed = (s) => s === "♥" || s === "♦";
const rankText = (r) => RANKS[r] || String(r);
const id = (c) => c.s + c.r;
const $ = (x) => document.getElementById(x);
const wait = (ms) => KartMasa.wait(ms);

let scores = [0, 0, 0, 0];
let dealer = 3;
// Oyun ayarları
let OPT = { eller: 7, arti3: false, yuk: true, esli: false, yildiz: 100, dagilim: "dengeli", kozBas: false };
try { Object.assign(OPT, JSON.parse(localStorage.getItem("batakOpt") || "{}")); } catch (e) {}
if (!(OPT.eller >= 1 && OPT.eller <= 20)) OPT.eller = 7;
OPT.arti3 = false; // +3 kuralı yeni ayarlarda yok
// Oyun sayacı: yalnızca bu cihazda tutulur, hiçbir yere gönderilmez
let KASA = { oyun: 0, ucret: 0 }; try { Object.assign(KASA, JSON.parse(localStorage.getItem("batakKasa") || "{}")); } catch (e) {}
function kasaBildir(o) {
  window.Rapor && Rapor.oyun("batak", o.sonuc === "Kazandı");
  KASA.oyun++; try { localStorage.setItem("batakKasa", JSON.stringify(KASA)); } catch (e) {}
}
// ---------- Yıldız ----------
// Ortak Yıldız modülü (token.js): bakiye Batak, King ve Balayı King'de ortak
const MP = Token.MP, mpSave = Token.save, mpFmt = Token.fmt, KADEMELER = Token.KADEMELER;
let gameStake = 0;
// Açılır pencerelerden oyunlar sayfasına dönüş (pencere açıkken üstteki 🎮 düğmesine dokunulamıyor)
const CIKIS = (not) => `<button type="button" class="btn" data-cikis style="margin-top:8px;background:transparent;color:var(--ink);border-color:var(--line)">🎮 Oyunlardan çık</button>${not ? `<p style="font-size:12px;margin:6px 0 0;color:var(--muted)">${not}</p>` : ""}`;
document.addEventListener("click", (e) => { if (e.target.closest && e.target.closest("[data-cikis]")) location.href = "oyunlar.html"; });
// İş Bankası tarihçesi ve ürün soruları (internetten doğrulandı: Küre Ansiklopedi, Diken, isbank.com.tr, Teknoblog)
// 4. alan: son geçerlilik tarihi (kampanya soruları kampanya bitince sorulmaz)
let roundNo = 0;
const partner = (p) => (p + 2) % 4;
const sameSide = (a, b) => a === b || (OPT.esli && partner(a) === b);
const MINB = () => (OPT.esli ? 7 : 4);
const A3 = () => OPT.arti3 && !OPT.esli; // eşlide +3 kuralı yok
// Eşli: ihaleyi alan eşinin kartlarını da oynar
const humanCtl = (p) => p === 0 ? !(OPT.esli && bidder === 2 && phase === "play") : (p === 2 && OPT.esli && bidder === 0 && phase === "play");
const sideTricks = (p) => tricks[p] + (OPT.esli ? tricks[partner(p)] : 0);
let hands, bids, active, highBid, highBidder, bidder, contract, trump, trumpBroken;
let trick, turn, tricks, played, phase, busy = false;

try {
  const s = JSON.parse(localStorage.getItem("batakScores") || "null");
  if (Array.isArray(s) && s.length === 4) scores = s;
} catch (e) {}
function saveScores() {
  try { localStorage.setItem("batakScores", JSON.stringify(scores)); } catch (e) {}
}

// ---------- Kartlar ----------
function newDeck() {
  const d = [];
  for (const s of SUITS) for (let r = 2; r <= 14; r++) d.push({ s, r });
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
// El dağılımı: "rastgele" düz karıştırma; "dengeli" her oyuncuya her renkten 2–5 kart düşene kadar yeniden karar
// (böylece koz hangi renk olursa olsun herkese benzer sayıda gelir)
function dealHands() {
  for (let tries = 0; tries < 400; tries++) {
    const d = newDeck(), H = [0, 1, 2, 3].map((i) => d.slice(i * 13, i * 13 + 13));
    if (OPT.dagilim !== "dengeli") return H;
    if (H.every((h) => SUITS.every((su) => { const n = h.filter((c) => c.s === su).length; return n >= 2 && n <= 5; }))) return H;
  }
  const d = newDeck(); return [0, 1, 2, 3].map((i) => d.slice(i * 13, i * 13 + 13));
}
function sortHand(h) {
  h.sort((a, b) => SUITS.indexOf(a.s) - SUITS.indexOf(b.s) || b.r - a.r);
}
// Kart görünümü ⚙️ Ayarlar'dan (kartmasa.js): renk düzeni, yazı tipi, kalınlık, punto
const cardEl = (c) => KartMasa.el(c);

// ---------- Kurallar ----------
function beats(a, b, led) {
  if (a.s === b.s) return a.r > b.r;
  if (a.s === trump) return true;
  return false;
}
function trickWinner(t) {
  const led = t[0].card.s;
  let best = t[0];
  for (const x of t) if (beats(x.card, best.card, led)) best = x;
  return best;
}
function legal(hand) {
  if (trick.length === 0) {
    if (!trumpBroken && !(OPT.esli && OPT.kozBas)) {
      const nt = hand.filter((c) => c.s !== trump);
      if (nt.length) return nt;
    }
    return hand;
  }
  const led = trick[0].card.s;
  const best = trickWinner(trick).card;
  const same = hand.filter((c) => c.s === led);
  if (same.length) {
    // Yükseltmeli: renge uyarken yükseltmek zorunlu. Yükseltmesiz: yalnızca koz açıldıysa yükseltilir.
    if (best.s === led && (OPT.yuk || led === trump)) {
      const higher = same.filter((c) => c.r > best.r);
      if (higher.length) return higher;
    }
    return same;
  }
  const tr = hand.filter((c) => c.s === trump);
  if (tr.length) {
    if (best.s === trump) {
      const higher = tr.filter((c) => c.r > best.r);
      if (higher.length) return higher;
    }
    return tr;
  }
  return hand;
}

// ---------- Bilgisayar ----------
// Rakipler batakai.js ile "düşünür": görmedikleri kartları ipuçlarına uyarak yüzlerce kez dağıtıp
// her kartı elin sonuna kadar dener, ortalamada en iyisini oynar. İhalede elini dört koz için ölçer.
const AIO = () => ({ esli: OPT.esli, yuk: OPT.yuk, kozBas: OPT.kozBas });
let aiInfo = BatakAI.newInfo(), aiEv = {};
const bidEv = (p) => aiEv[p] || (aiEv[p] = BatakAI.bidEval(hands[p], p, AIO(), OPT.dagilim === "dengeli", 60));
function botPick(p) {
  // Eşlide ihaleyi alan, eşinin elini de gördüğü için iki eli birlikte hesaba katar
  const known = OPT.esli && bidder != null && sameSide(p, bidder) ? [p, partner(p)] : [p];
  return BatakAI.pick({ x: p, hands, known, counts: hands.map((h) => h.length), trick, T: trump, broken: trumpBroken, played, tk: tricks, b: bidder, k: contract, voids: aiInfo.voids, caps: aiInfo.caps, o: AIO(), ms: 300 });
}

// ---------- Ekran ----------
function setStatus(t) { $("status").innerHTML = t ? `<span>${t}</span>` : ""; }

function renderInfo() {
  const k = trump ? `<b style="color:${isRed(trump) ? "var(--red)" : "var(--ink)"}">${trump} ${SUIT_NAMES[trump]}</b>` : "–";
  const i = bidder != null && contract ? `<b>${contract}</b> · ${NAMES[bidder]}` : "–";
  $("info").innerHTML = `El: <b>${Math.max(1, roundNo)}/${OPT.eller}</b> · Koz: ${k}<br>İhale: ${i}${gameStake ? ` · ⭐ ${mpFmt(gameStake)}` : ""}`;
  $("scores").innerHTML = OPT.esli
    ? `<div style="grid-column:span 2">${NAMES[0]} + Sadolayn<b class="${scores[0] < 0 ? "neg" : ""}">${scores[0]}</b></div><div style="grid-column:span 2">${NAMES[1]} + ${NAMES[3]}<b class="${scores[1] < 0 ? "neg" : ""}">${scores[1]}</b></div>`
    : scores.map((s, p) => `<div>${NAMES[p]}<b class="${s < 0 ? "neg" : ""}">${s}</b></div>`).join("");
}
function renderSeats() {
  for (let p = 0; p < 4; p++) {
    const el = $("seat" + p);
    let bd = "";
    if (phase === "bid") {
      bd = bids[p] == null ? "…" : bids[p] === "pas" ? "Pas" : `İhale ${bids[p]}`;
    } else {
      bd = `Aldı: ${tricks[p]}` + (sameSide(p, bidder) ? ` · ${OPT.esli ? "Taraf " + sideTricks(p) : ""} / ${contract}`.replace("·  /", "/") : "");
    }
    el.innerHTML = `<div class="nm">${NAMES[p]}${OPT.esli && p === 2 ? " 🤝" : ""}</div><div class="bd">${bd}</div>`;
    el.classList.toggle("turn", turn === p && (phase === "bid" || phase === "play"));
    el.classList.toggle("bidder", phase !== "bid" && p === bidder);
  }
}
function renderTrick(winnerP) {
  for (let p = 0; p < 4; p++) $("slot" + p).innerHTML = "";
  for (const t of trick) {
    const el = cardEl(t.card);
    if (t.fresh) { el.classList.add("pop"); t.fresh = false; }
    if (winnerP === t.p) el.classList.add("win");
    $("slot" + t.p).appendChild(el);
  }
}
function handInto(elId, p) {
  const h = $(elId);
  h.innerHTML = "";
  const myTurn = phase === "play" && turn === p && humanCtl(p) && !busy;
  const ok = myTurn ? new Set(legal(hands[p]).map(id)) : null;
  if (elId === "hand") return yelpaze(h, p, myTurn, ok);
  for (const c of hands[p]) {
    const el = cardEl(c);
    if (myTurn) {
      if (ok.has(id(c))) { el.classList.add("ok"); el.onclick = () => humanPlay(c, p); }
      else el.classList.add("no");
    }
    h.appendChild(el);
  }
}
// Kendi elin yelpaze şeklinde; kart atma: bas → kart kalkar, kaydır → seçim kayar, bırak → atılır (aşağı çekip bırakmak vazgeçer)
let EL = null, BAS = null;
function yelpaze(h, p, myTurn, ok) {
  h.classList.add("yelpaze");
  const L = hands[p], n = L.length, W = h.clientWidth;
  const cw = parseFloat(getComputedStyle(h).getPropertyValue("--cw")) || 56;
  const maxA = Math.min(12, n), kavis = cw * 0.25;
  const pay = cw * (0.08 + 1.67 * Math.sin((maxA * Math.PI) / 180));
  const step = n > 1 ? Math.min(cw * 0.72, (W - cw - pay * 2) / (n - 1)) : 0;
  const x0 = (W - (cw + step * (n - 1))) / 2;
  EL = { x0, step, n, cw, els: [], ok, myTurn, p };
  L.forEach((c, i) => {
    const el = cardEl(c), t = n > 1 ? (i / (n - 1)) * 2 - 1 : 0;
    el.style.left = Math.round(x0 + i * step) + "px";
    el.style.top = Math.round(12 + kavis * t * t) + "px";
    el.style.setProperty("--rot", (t * maxA).toFixed(1) + "deg");
    if (myTurn) el.classList.add(ok.has(id(c)) ? "ok" : "no");
    EL.els.push({ el, c }); h.appendChild(el);
  });
}
function elIdx(x) {
  if (!EL || !EL.n) return -1;
  const r = $("hand").getBoundingClientRect();
  return Math.max(0, Math.min(EL.n - 1, Math.floor((x - r.left - EL.x0) / (EL.step || EL.cw))));
}
const elSec = (i) => EL && EL.els.forEach((o, k) => o.el.classList.toggle("sec", k === i));
$("hand").addEventListener("pointerdown", (e) => {
  if (!EL || !EL.n || e.button > 0) return;
  BAS = { pid: e.pointerId, i: elIdx(e.clientX) };
  try { $("hand").setPointerCapture(e.pointerId); } catch (er) {}
  elSec(BAS.i); e.preventDefault();
});
$("hand").addEventListener("pointermove", (e) => {
  if (!BAS || e.pointerId !== BAS.pid) return;
  const i = elIdx(e.clientX); if (i !== BAS.i) { BAS.i = i; elSec(i); if (navigator.vibrate) try { navigator.vibrate(5); } catch (er) {} }
});
function elBirak(e, iptal) {
  if (!BAS || e.pointerId !== BAS.pid) return;
  const b = BAS; BAS = null; elSec(-1);
  if (iptal || e.clientY > $("hand").getBoundingClientRect().bottom + 10) return;
  const o = EL && EL.els[b.i]; if (!o || !EL.myTurn) return;
  if (EL.ok.has(id(o.c))) humanPlay(o.c, EL.p);
  else o.el.animate([{ transform: "rotate(var(--rot)) translateX(-4px)" }, { transform: "rotate(var(--rot)) translateX(4px)" }, { transform: "rotate(var(--rot))" }], { duration: 220 });
}
$("hand").addEventListener("pointerup", (e) => elBirak(e, false));
$("hand").addEventListener("pointercancel", (e) => elBirak(e, true));
function renderHand() {
  handInto("hand", 0);
  const showP = OPT.esli && bidder === 0 && phase === "play";
  $("pwrap").style.display = showP ? "" : "none";
  $("table").classList.toggle("ph", showP);
  if (showP) handInto("phand", 2);
}
function render() { renderInfo(); renderSeats(); renderHand(); }

// ---------- El dağıtımı ----------
function newRound() {
  roundNo++;
  dealer = (dealer + 1) % 4;
  hands = dealHands();
  hands.forEach(sortHand);
  bids = [null, null, null, null];
  active = [true, true, true, true];
  highBid = 0; highBidder = -1;
  bidder = null; contract = 0; trump = null; trumpBroken = false;
  trick = []; tricks = [0, 0, 0, 0]; played = new Set();
  aiInfo = BatakAI.newInfo(); aiEv = {};
  phase = "bid";
  turn = (dealer + 1) % 4;
  if (window.CardSfx) CardSfx.deal(13);
  renderTrick();
  render();
  bidTurn();
}

// ---------- İhale ----------
async function bidTurn() {
  const act = [0, 1, 2, 3].filter((i) => active[i]);
  if (highBidder >= 0 && act.length === 1) return endBidding();
  if (act.length === 0) {
    highBid = MINB(); highBidder = dealer;
    setStatus(`Herkes pas geçti; ihale ${MINB()} ile dağıtana kaldı: ${NAMES[dealer]}.`);
    await wait(1200);
    return endBidding();
  }
  while (!active[turn]) turn = (turn + 1) % 4;
  renderSeats();
  if (turn === 0) {
    showBidPanel();
  } else {
    setStatus(`${NAMES[turn]} düşünüyor…`);
    await wait(750);
    const want = BatakAI.bidLimit(bidEv(turn), turn, AIO(), MINB());
    const min = Math.max(MINB(), highBid + 1);
    doBid(turn, want >= min && min <= 13 ? min : "pas");
  }
}
function showBidPanel() {
  const min = Math.max(MINB(), highBid + 1);
  setStatus(highBid ? `En yüksek ihale: <b>${highBid}</b> (${NAMES[highBidder]}). Senin sıran.` : "İhale sende. Kaç el alırsın?");
  const panel = $("bidPanel");
  panel.innerHTML = "";
  for (let v = min; v <= 13; v++) {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => { panel.classList.remove("show"); doBid(0, v); };
    panel.appendChild(b);
  }
  const ps = document.createElement("button");
  ps.textContent = "Pas";
  ps.className = "pass";
  ps.onclick = () => { panel.classList.remove("show"); doBid(0, "pas"); };
  panel.appendChild(ps);
  panel.classList.add("show");
}
function doBid(p, v) {
  if (v === "pas") { active[p] = false; bids[p] = "pas"; }
  else { highBid = v; highBidder = p; bids[p] = v; }
  turn = (p + 1) % 4;
  renderSeats();
  bidTurn();
}
async function endBidding() {
  bidder = highBidder; contract = highBid;
  phase = "trump";
  turn = bidder;
  if (bidder === 0) {
    setStatus(`İhaleyi <b>${contract}</b> ile aldın. Kozu seç:`);
    const panel = $("trumpPanel");
    panel.innerHTML = "";
    for (const s of SUITS) {
      const b = document.createElement("button");
      b.className = "suit" + (isRed(s) ? " red" : "");
      b.textContent = s;
      b.onclick = () => { panel.classList.remove("show"); startPlay(s); };
      panel.appendChild(b);
    }
    panel.classList.add("show");
    render();
  } else {
    render();
    const t = BatakAI.bestTrump(bidEv(bidder), bidder, contract, AIO());
    setStatus(`${NAMES[bidder]} ihaleyi <b>${contract}</b> ile aldı, koz <b>${t} ${SUIT_NAMES[t]}</b>.`);
    await wait(1500);
    startPlay(t);
  }
}

// ---------- Oyun ----------
function startPlay(t) {
  trump = t;
  phase = "play";
  turn = bidder;
  render();
  playTurn();
}
async function playTurn() {
  renderSeats();
  if (humanCtl(turn)) {
    const who = turn === 2 ? "Eşinin (Sadolayn) sırası — onun kartını sen seç." : "";
    setStatus(who || (trick.length === 0 ? "Sıra sende, bir kart aç." : "Sıra sende."));
    renderHand();
  } else {
    setStatus(turn === 0 ? "İhale eşinde: Sadolayn senin kartını oynuyor…" : `${NAMES[turn]} oynuyor…`);
    renderHand();
    await wait(60); // "oynuyor…" yazısı görünsün, sonra düşünsün
    const t0 = performance.now(), c = botPick(turn);
    await wait(Math.max(150, 590 - (performance.now() - t0)));
    playCard(turn, c);
  }
}
function humanPlay(c, p = 0) {
  if (phase !== "play" || turn !== p || !humanCtl(p) || busy) return;
  playCard(p, c);
}
async function playCard(p, c) {
  if (window.CardSfx) CardSfx.play();
  BatakAI.observe(aiInfo, p, c, trick, trump, trumpBroken, AIO());
  hands[p] = hands[p].filter((x) => id(x) !== id(c));
  trick.push({ p, card: c, fresh: true });
  played.add(id(c));
  if (c.s === trump) trumpBroken = true;
  renderTrick();
  if (trick.length < 4) {
    turn = (p + 1) % 4;
    renderHand();
    return playTurn();
  }
  busy = true;
  const w = trickWinner(trick).p;
  tricks[w]++;
  turn = -1;
  renderTrick(w);
  render();
  setStatus(w === 0 ? "Eli <b>sen</b> aldın! 👏" : `Eli <b>${NAMES[w]}</b> aldı.`);
  await wait(1100);
  if (window.CardSfx) CardSfx.collect();
  trick = [];
  renderTrick();
  busy = false;
  if (hands[0].length === 0) return endRound();
  turn = w;
  playTurn();
}

// ---------- Puanlama ----------
function endRound() {
  phase = "end";
  const side = sideTricks(bidder);
  const over = A3() && side >= contract + 3;
  const made = side >= contract && !over;
  // Puan: ihaleyi tutan taahhüt başına 15, fazla el başına 10; tutamayan (ya da +3 yapan) −10 × ihale.
  // Diğerleri el başına 10; hiç el almayan −50.
  const bidPts = made ? contract * 15 + (side - contract) * 10 : -contract * 10;
  const other = (t) => (t > 0 ? t * 10 : -50);
  let deltas;
  if (OPT.esli) {
    const os = other(13 - side);
    deltas = [0, 1, 2, 3].map((p) => (sameSide(p, bidder) ? bidPts : os));
  } else {
    deltas = [0, 1, 2, 3].map((p) => (p === bidder ? bidPts : other(tricks[p])));
  }
  deltas.forEach((d, p) => (scores[p] += d));
  saveScores();
  render();
  const who = OPT.esli ? (sameSide(0, bidder) ? "Tarafınız" : "Rakip taraf") : bidder === 0 ? "Sen" : NAMES[bidder];
  const title = made ? (sameSide(0, bidder) ? "🎉 İhale tuttu!" : `${who} ihaleyi tuttu`)
    : over ? `🔥 ${who} +3 yaptı, yandı!` : (sameSide(0, bidder) ? "😬 Battın!" : `${who} battı!`);
  const rows = OPT.esli
    ? [[0, `${NAMES[0]} + Sadolayn`], [1, `${NAMES[1]} + ${NAMES[3]}`]].map(([p, n]) => `<tr><td style="text-align:left">${n}${sameSide(p, bidder) ? " 👑" : ""}</td><td>${tricks[p] + tricks[partner(p)]}</td><td class="${deltas[p] < 0 ? "neg" : "pos"}">${deltas[p] > 0 ? "+" : ""}${deltas[p]}</td><td><b>${scores[p]}</b></td></tr>`).join("")
    : [0, 1, 2, 3].map((p) => `<tr><td style="text-align:left">${NAMES[p]}${p === bidder ? " 👑" : ""}</td><td>${tricks[p]}</td><td class="${deltas[p] < 0 ? "neg" : "pos"}">${deltas[p] > 0 ? "+" : ""}${deltas[p]}</td><td><b>${scores[p]}</b></td></tr>`).join("");
  const last = roundNo >= OPT.eller;
  $("modal").innerHTML = `
    <h2>${title}</h2>
    <p>El ${roundNo}/${OPT.eller} · İhale ${contract} · Alınan ${side}${over ? " (ihale+3)" : ""} · Koz ${trump}</p>
    <table><tr><th></th><th>El</th><th>Puan</th><th>Toplam</th></tr>${rows}</table>
    <button class="btn" id="next">${last ? "Sonucu gör" : "Sonraki el"}</button>${last ? "" : CIKIS(gameStake ? "Oyun yarıda kalır; ortadaki Yıldız geri gelmez." : "")}`;
  $("overlay").classList.add("show");
  $("next").onclick = () => { $("overlay").classList.remove("show"); last ? gameOver() : newRound(); };
  setStatus("");
}
function showLock() {
  // Yıldız bitti: 3 saat bekleme, sonra İş Bankası sorusu (token.js)
  $("modal").classList.remove("ayar");
  Token.kilit($("modal"), { goster: () => $("overlay").classList.add("show"), devam: () => showRules() });
}
function gameOver() {
  phase = "idle";
  let rows, win;
  if (OPT.esli) {
    const a = scores[0], b = scores[1];
    win = a === b ? "Berabere!" : a > b ? `🎉 Siz kazandınız! (${NAMES[0]} + Sadolayn)` : `${NAMES[1]} + ${NAMES[3]} kazandı`;
    rows = `<tr><td style="text-align:left">${NAMES[0]} + Sadolayn</td><td><b>${a}</b></td></tr><tr><td style="text-align:left">${NAMES[1]} + ${NAMES[3]}</td><td><b>${b}</b></td></tr>`;
  } else {
    const order = [0, 1, 2, 3].sort((x, y) => scores[y] - scores[x]);
    win = scores[order[0]] === scores[order[1]] ? (scores[0] === scores[order[0]] ? "🤝 Birincilik paylaşıldı" : "Birincilik paylaşıldı") : order[0] === 0 ? "🎉 Kazandın!" : `${NAMES[order[0]]} kazandı`;
    rows = order.map((p, i) => `<tr><td style="text-align:left">${["🥇", "🥈", "🥉", "4."][i]} ${NAMES[p]}</td><td><b>${scores[p]}</b></td></tr>`).join("");
  }
  // Yıldız ödemesi (token.js): tekli birinci 3 katını, eşlide kazanan taraf 2 katını alır; beraberlikte iade
  let kat;
  if (OPT.esli) { const a = scores[0], b = scores[1]; kat = a > b ? 2 : a === b ? 1 : 0; }
  else { const top = Math.max(...scores), tops = scores.filter((x) => x === top).length; kat = scores[0] === top ? (tops === 1 ? 3 : 1) : 0; }
  const R = Token.sonuc("batak", gameStake, 4, kat);
  if (gameStake) kasaBildir({ isim: NAMES[0], token: gameStake, masa: R.masa, ucret: R.ucret, el: OPT.eller, esli: OPT.esli, dag: OPT.dagilim === "dengeli" ? "Dengeli" : "Rastgele", sonuc: R.durum === "kazandi" ? "Kazandı" : R.durum === "berabere" ? "Berabere" : "Kaybetti" });
  gameStake = 0;
  $("modal").classList.remove("ayar"); $("modal").innerHTML = `<h2>${win}</h2><p>${OPT.eller} el tamamlandı</p><table>${rows}</table>
    ${R.html}
    <button class="btn" id="again">${Token.yeter() ? "Yeni oyun" : "Devam"}</button>${CIKIS()}`;
  $("overlay").classList.add("show");
  $("again").onclick = () => showRules();
}

// ---------- Başlangıç ----------
function showRules() {
  Token.yukle();
  if (MP.bal < KADEMELER[0]) return showLock();
  if (OPT.yildiz > MP.bal) OPT.yildiz = [...KADEMELER].reverse().find((v) => v <= MP.bal);
  const seg = (k, opts) => `<div class="seg" data-k="${k}">${opts.map(([v, t]) => `<button type="button" data-v="${v}" class="${String(OPT[k]) === String(v) ? "on" : ""}">${t}</button>`).join("")}</div>`;
  $("modal").classList.add("ayar");
  $("modal").innerHTML = `
    <div class="ah"><h2>♠ Masa Kur</h2><div class="aw">⭐ Yıldız yalnızca oyun içi skordur · kazanana tam ödenir</div><button type="button" class="ax" id="ayarX" aria-label="Kapat">✕</button></div>
    <div class="abal"><span>⭐ Bakiyen <small style="opacity:.6;font-size:11px">· King ve Balayı'yla ortak</small></span><b>${mpFmt(MP.bal)} Yıldız</b></div>
    <div class="asec"><span>Oyun ayarları</span></div>
    <div class="agrid">
      <div class="arow"><span>Yıldız</span><div class="step"><button type="button" data-st="yildiz" data-d="-1">‹</button><b id="vYildiz"></b><button type="button" data-st="yildiz" data-d="1">›</button></div></div>
      <div class="arow"><span>El dağılımı</span><div class="step"><button type="button" data-st="dagilim" data-d="-1">‹</button><b id="vDag"></b><button type="button" data-st="dagilim" data-d="1">›</button></div></div>
      <div class="arow"><span>El sayısı</span><div class="step"><button type="button" data-st="eller" data-d="-1">−</button><b id="vEl"></b><button type="button" data-st="eller" data-d="1">+</button></div></div>
      <label class="chk"><input type="checkbox" id="cEsli"><i></i><span>Eşli <small>(Sadolayn eşin)</small></span></label>
      <label class="chk"><input type="checkbox" id="cYuk"><i></i><span>Yükseltme zorunlu</span></label>
      <label class="chk" id="kbWrap"><input type="checkbox" id="cKoz"><i></i><span>Kozla başlanabilir <small>(eşli)</small></span></label>
    </div>
    <div class="ahint" id="dagNote"></div>
    <details class="adet"><summary>👥 Oyuncu isimleri</summary>${ISIM.html([["ben", "Sen", "Senin adın"], ["sag", "Sadosan", "Sağındaki"], [null, "Sadolayn", "Karşındaki"], ["sol", "Sadocan", "Solundaki"]])}</details>
    <details class="adet"><summary>📖 Kurallar</summary>${KURAL()}</details>
    <div class="aAlt"><button class="btn abtn" id="start">Başla</button>${CIKIS()}
    <div class="kasa">Bu cihazda: ${KASA.oyun} oyun</div></div>`;
  $("overlay").classList.add("show");
  ISIM.bind($("modal"), () => { setNames(); if (typeof render === "function") try { render(); } catch (e) {} });
  const DAG = [["dengeli", "Dengeli"], ["rastgele", "Rastgele"]];
  const okB = () => KADEMELER.filter((v) => v <= MP.bal);
  const syncOpt = () => {
    $("vYildiz").textContent = mpFmt(OPT.yildiz);
    $("vDag").textContent = (DAG.find((x) => x[0] === OPT.dagilim) || DAG[0])[1];
    $("vEl").textContent = OPT.eller;
    $("cEsli").checked = OPT.esli; $("cYuk").checked = OPT.yuk; $("cKoz").checked = OPT.kozBas && OPT.esli; $("cKoz").disabled = !OPT.esli;
    $("kbWrap").classList.toggle("off", !OPT.esli);
    $("dagNote").innerHTML = OPT.dagilim === "dengeli" ? "⚖️ <b>Dengeli:</b> herkese her renkten 2–5 kart; kozlar dengeli dağılır." : "🎲 <b>Rastgele:</b> tam şans; bir oyuncuya 6–7 koz bile gelebilir.";
    $("start").textContent = `Başla · ${mpFmt(OPT.yildiz)} Yıldız`;
  };
  $("modal").querySelectorAll("[data-st]").forEach((b) => (b.onclick = () => {
    const k = b.dataset.st, d = +b.dataset.d;
    if (k === "yildiz") { const L = okB(), i = L.indexOf(OPT.yildiz); OPT.yildiz = L[Math.max(0, Math.min(L.length - 1, (i < 0 ? 0 : i) + d))]; }
    if (k === "eller") OPT.eller = Math.max(1, Math.min(20, OPT.eller + d));
    if (k === "dagilim") { const i = DAG.findIndex((x) => x[0] === OPT.dagilim); OPT.dagilim = DAG[(i + d + DAG.length) % DAG.length][0]; }
    syncOpt();
  }));
  $("cEsli").onchange = (e) => { OPT.esli = e.target.checked; syncOpt(); };
  $("cYuk").onchange = (e) => { OPT.yuk = e.target.checked; };
  $("cKoz").onchange = (e) => { OPT.kozBas = e.target.checked; };
  $("ayarX").onclick = () => { if (phase && phase !== "idle" && hands) { $("overlay").classList.remove("show"); $("modal").classList.remove("ayar"); } else location.href = "oyunlar.html"; };
  syncOpt();
  $("start").onclick = () => {
    if (!Token.koy(OPT.yildiz)) return showRules();
    gameStake = OPT.yildiz;
    try { localStorage.setItem("batakOpt", JSON.stringify(OPT)); } catch (e) {}
    scores = [0, 0, 0, 0]; roundNo = 0; saveScores();
    $("overlay").classList.remove("show"); $("modal").classList.remove("ayar"); newRound();
  };
}
renderInfo();
showRules();
</script>
<script data-goatcounter="https://sadolayn.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
