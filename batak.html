<style>
  :root {
    --bg: #000000;
    --felt: #0b2a1c;
    --felt-line: #164a33;
    --card: #0d0d0d;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --red: #e0473a;
    --win: #3fc283;
    --line: #262626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    padding: 10px 10px 14px;
    user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  .info { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.3; }
  .info b { color: var(--accent); }
  .scores {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    margin: 8px 0; font-size: 12px; text-align: center;
  }
  .scores div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 2px; }
  .scores b { display: block; font-size: 15px; }

  .table {
    flex: 1;
    min-height: 330px;
    position: relative;
    background: linear-gradient(135deg, #2a3fe0 0%, #1a2bb8 55%, #13208f 100%);
    border-radius: 22px;
    border: 1px solid #3a50f0;
    overflow: hidden;
  }
  /* Arka planda SADOLAYN gölgesi */
  .table::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: url("img/logo.png") center 77% / 70% auto no-repeat;
    opacity: .2; filter: grayscale(1) brightness(2.4);
  }
  .seat, .slot { z-index: 1; }
  .seat {
    position: absolute;
    background: rgba(0,0,0,.55);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 5px 8px;
    font-size: 12px;

    min-width: 78px;

  .seat .nm { font-weight: 700; font-size: 13px; }
  .seat .bd { color: var(--muted); }
  .seat.turn { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224,162,79,.35); }
  .seat.bidder .nm::after { content: " 👑"; }
  .seat-n { top: 8px; left: 50%; transform: translateX(-50%); }
  .seat-w { left: 6px; top: 50%; transform: translateY(-50%); }
  .seat-e { right: 6px; top: 50%; transform: translateY(-50%); }
  .seat-s { bottom: 8px; left: 50%; transform: translateX(-50%); }

  .slot { position: absolute; width: 56px; height: 84px; }
  .slot-n { top: 64px; left: 50%; transform: translateX(-50%); }
  .slot-s { bottom: 64px; left: 50%; transform: translateX(-50%); }
  .slot-w { left: 90px; top: 50%; transform: translateY(-50%); }
  .slot-e { right: 90px; top: 50%; transform: translateY(-50%); }

  .card {
    width: 56px; height: 84px;
    background: #f7f4ee;
    color: #111;
    border-radius: 7px;
    border: 1px solid #bbb;
    position: relative;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
    flex: none;
  }
  .card.red { color: var(--red); }
  .card .r { position: absolute; top: 3px; left: 3px; font-size: 29px; line-height: 1; letter-spacing: -1px; transform-origin: left top; }
  .card .r.ten { transform: scaleX(.72); letter-spacing: -2px; }
  .card .s1 { position: absolute; top: 32px; left: 2px; font-size: 26px; line-height: 1; }
  .card .s2 { position: absolute; bottom: 3px; right: 4px; font-size: 34px; line-height: 1; }
  .card.win { outline: 3px solid var(--win); }
  .pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .status {
    min-height: 40px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 15px; padding: 6px 4px;
  }
  .panel { display: none; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .panel.show { display: flex; }
  .panel button, .btn {
    min-width: 44px; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .panel button.pass { border-color: var(--red); color: var(--red); }
  .panel button.suit { font-size: 26px; padding: 6px 16px; }
  .panel button.suit.red { color: var(--red); }

  .hand {
    display: flex; justify-content: center;

  .hand .card:not(:last-child) .s2 { display: none; }
  .hand .card { margin-left: -30px; transition: transform .12s, opacity .12s; cursor: pointer; }
  .hand .card:first-child { margin-left: 0; }
  .hand .card.ok { transform: translateY(-10px); }
  .hand .card.no { opacity: .4; cursor: default; }

  .overlay {

  .seg { display: flex; gap: 4px; background: #111; border: 1px solid var(--line); border-radius: 12px; padding: 3px; }

  .ayar .ax { position: absolute; right: 12px; top: 14px; width: 34px; height: 34px; border-radius: 50%; border: 1px solid rgba(240,198,116,.5); background: transparent; color: #f0c674; font-size: 15px; cursor: pointer; }
  .ayar .abal { display: flex; justify-content: space-between; align-items: center; margin: 12px 14px 0; padding: 10px 14px; border-radius: 14px; background: linear-gradient(90deg, rgba(240,198,116,.16), rgba(240,198,116,.04)); font-size: 13px; color: #d9c7ad; }
  .ayar .abal b { font-size: 17px; color: #ffe2a6; }
  .ayar .asec { margin: 14px 16px 2px; font-size: 11.5px; letter-spacing: 2px; text-transform: uppercase; color: #b79a74; }
  .ayar .agrid { display: grid; grid-template-columns: 1fr; gap: 10px; padding: 8px 16px 4px; }
  @media (min-width: 520px) { .ayar .agrid { grid-template-columns: 1fr 1fr; column-gap: 22px; } }
  .ayar .arow { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 15px; }
  .ayar .arow > span { white-space: nowrap; color: #eadcc6; }
  .ayar .step { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,.28); border: 1px solid rgba(240,198,116,.2); border-radius: 999px; padding: 3px; }
  .ayar .step button { width: 32px; height: 32px; border-radius: 50%; border: none; background: linear-gradient(180deg, #f3cf86, #d9a54a); color: #2a1a05; font-size: 18px; font-weight: 800; line-height: 1; cursor: pointer; }
  .ayar .step button:active { transform: scale(.92); }
  .ayar .step b { min-width: 74px; text-align: center; font-size: 16px; color: #fff3dc; font-variant-numeric: tabular-nums; }
  .ayar .chk { display: flex; align-items: center; gap: 10px; font-size: 15px; cursor: pointer; margin: 0; color: #eadcc6; }
  .ayar .chk input { display: none; }
  .ayar .chk i { width: 42px; height: 24px; border-radius: 999px; background: #3b2f45; flex: none; position: relative; transition: background .2s; }
  .ayar .chk i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: #cbbba6; transition: transform .2s, background .2s; }
  .ayar .chk input:checked + i { background: #d9a54a; }
  .ayar .chk input:checked + i::after { transform: translateX(18px); background: #fff7e6; }
  .ayar .chk small { opacity: .65; font-size: 12px; }
  .ayar .chk.off { opacity: .4; cursor: default; }
  .ayar .ahint { margin: 10px 16px 0; font-size: 12.5px; color: #e3d3bb; background: rgba(0,0,0,.22); border-radius: 12px; padding: 8px 12px; }
  .ayar .adet { margin: 8px 16px 0; background: rgba(0,0,0,.22); border-radius: 12px; padding: 6px 12px; }
  .ayar .adet summary { cursor: pointer; font-size: 14px; font-weight: 600; padding: 4px 0; color: #f0c674; }
  .ayar .rules { color: #e8dccb; }
  .ayar .abtn { display: block; box-sizing: border-box; width: calc(100% - 32px) !important; margin: 16px 16px 0; border-radius: 999px; background: linear-gradient(180deg, #f3cf86, #d9a54a); color: #2a1a05; border: none; font-family: Georgia, serif; font-style: italic; font-size: 18px; font-weight: 700; padding: 13px; box-shadow: 0 6px 18px rgba(217,165,74,.25); }
  .ayar .kasa { margin: 10px 16px 0; font-size: 12px; color: #b79a74; text-align: center; }
  .mpbox { background: linear-gradient(135deg, #1a2a4a, #0f1a30); border: 1px solid #2f4f8f; color: #cfdcff; border-radius: 12px; padding: 9px 12px; font-size: 14px; margin: 4px 0 8px; }
  .mpbox b { color: #fff; }
  .qopts { display: grid; gap: 8px; }
  .qopts button { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: #161616; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; text-align: left; }
  .qopts button.ok { border-color: #3fc283; background: rgba(63,194,131,.15); }
  .qopts button.bad { border-color: #e0473a; background: rgba(224,71,58,.15); }
  #pwrap { position: absolute; top: 58px; left: 0; right: 0; z-index: 2; display: flex; justify-content: center; pointer-events: none; }
  #phand { padding: 8px 0 0; min-height: 0; transform: scale(.76); transform-origin: top center; pointer-events: auto; }
  #phand .card { margin-left: -27px; }
  #phand .card.no { opacity: .6; }
  #phand .card:first-child { margin-left: 0; }
  #phand .card.ok { transform: translateY(8px); }
  .table.ph .slot-n { top: 140px; }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  .modal .btn { width: 100%; background: var(--accent); border-color: var(--accent); color: #000; }
  .rules { font-size: 13px; color: var(--muted); text-align: left; line-height: 1.5; margin: 0 0 14px; padding-left: 18px; }
</style>

<script>
const SUITS = ["♠", "♥", "♣", "♦"];
const SUIT_NAMES = { "♠": "Maça", "♥": "Kupa", "♣": "Sinek", "♦": "Karo" };
const RANKS = { 11: "J", 12: "Q", 13: "K", 14: "A" };
let NAMES = [];
// İsimler: Sadolayn sabit; diğerlerini kullanıcı yazar (en fazla 8 karakter, tüm oyunlarda ortak)
function setNames() { NAMES = [ISIM.ben(), ISIM.get("sag", "Sadosan"), "Sadolayn", ISIM.get("sol", "Sadocan")]; }
setNames();
const isRed = (s) => s === "♥" || s === "♦";
const rankText = (r) => RANKS[r] || String(r);
const id = (c) => c.s + c.r;
const $ = (x) => document.getElementById(x);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

let scores = [0, 0, 0, 0];
let dealer = 3;
// Oyun ayarları
let OPT = { eller: 7, arti3: false, yuk: true, esli: false, bahis: 100, dagilim: "dengeli", kozBas: false };
try { Object.assign(OPT, JSON.parse(localStorage.getItem("batakOpt") || "{}")); } catch (e) {}
if (!(OPT.eller >= 1 && OPT.eller <= 20)) OPT.eller = 7;
OPT.arti3 = false; // +3 kuralı yeni ayarlarda yok
const FEE = 0.01; // %1 masa ücreti: her oyunda ortadaki toplam Token'ın %1'i kazanandan alınır (kasaya)
// Masa kasası: site sahibi kaç oyun oynandığını ve toplam masa ücretini görebilsin diye oyun özeti Google Form'a gider
const KASA_FORM = { action: "https://docs.google.com/forms/d/e/1FAIpQLSfeuDkVXo1nk6IZ_9f7uEjXkCUF3M--PUv7cYcBwXPWe6F6gA/formResponse", mesaj: "entry.1123079006", kimden: "entry.1229018588" };
let KASA = { oyun: 0, ucret: 0 }; try { Object.assign(KASA, JSON.parse(localStorage.getItem("batakKasa") || "{}")); } catch (e) {}
function kasaBildir(o) {
  window.Rapor && Rapor.oyun("batak", o.sonuc === "Kazandı");
  KASA.oyun++; KASA.ucret += o.ucret; try { localStorage.setItem("batakKasa", JSON.stringify(KASA)); } catch (e) {}
  try {
    const f = new FormData();
    f.append(KASA_FORM.mesaj, `🎲 BATAK MASA | Oyuncu: ${o.isim} | Token: ${o.token} | Masa: ${o.masa} | Masa ücreti: ${o.ucret} | Sonuç: ${o.sonuc} | El: ${o.el} | ${o.esli ? "Eşli" : "Tekli"} | ${o.dag}`);
    f.append(KASA_FORM.kimden, "Batak masa kasası");
    fetch(KASA_FORM.action, { method: "POST", mode: "no-cors", body: f }).catch(() => {});
  } catch (e) {}
  try { if (window.goatcounter && goatcounter.count) goatcounter.count({ path: "batak-masa-ucreti-" + o.ucret, title: "Batak masa ücreti", event: true }); } catch (e) {}
}
// ---------- Token ----------
const MP_KEY = "batakMP";
let MP = { bal: 1000, empty: 0, lastQ: -1 };
try { Object.assign(MP, JSON.parse(localStorage.getItem(MP_KEY) || "{}")); } catch (e) {}
const mpSave = () => { try { localStorage.setItem(MP_KEY, JSON.stringify(MP)); } catch (e) {} };
const mpFmt = (n) => n.toLocaleString("tr-TR");
const BAHIS = [100, 250, 500, 1000, 2500, 5000, 10000];
let gameStake = 0;
// İş Bankası tarihçesi ve ürün soruları (internetten doğrulandı: Küre Ansiklopedi, Diken, isbank.com.tr, Teknoblog)
// 4. alan: son geçerlilik tarihi (kampanya soruları kampanya bitince sorulmaz)
let roundNo = 0;
const partner = (p) => (p + 2) % 4;
const sameSide = (a, b) => a === b || (OPT.esli && partner(a) === b);
const MINB = () => (OPT.esli ? 7 : 4);
const A3 = () => OPT.arti3 && !OPT.esli; // eşlide +3 kuralı yok
// Eşli: ihaleyi alan eşinin kartlarını da oynar
const humanCtl = (p) => p === 0 ? !(OPT.esli && bidder === 2 && phase === "play") : (p === 2 && OPT.esli && bidder === 0 && phase === "play");
const sideTricks = (p) => tricks[p] + (OPT.esli ? tricks[partner(p)] : 0);
let hands, bids, active, highBid, highBidder, bidder, contract, trump, trumpBroken;
let trick, turn, tricks, played, phase, busy = false;

try {
  const s = JSON.parse(localStorage.getItem("batakScores") || "null");
  if (Array.isArray(s) && s.length === 4) scores = s;
} catch (e) {}
function saveScores() {
  try { localStorage.setItem("batakScores", JSON.stringify(scores)); } catch (e) {}
}

// ---------- Kartlar ----------
function newDeck() {
  const d = [];
  for (const s of SUITS) for (let r = 2; r <= 14; r++) d.push({ s, r });
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
// El dağılımı: "rastgele" düz karıştırma; "dengeli" her oyuncuya her renkten 2–5 kart düşene kadar yeniden karar
// (böylece koz hangi renk olursa olsun herkese benzer sayıda gelir)
function dealHands() {
  for (let tries = 0; tries < 400; tries++) {
    const d = newDeck(), H = [0, 1, 2, 3].map((i) => d.slice(i * 13, i * 13 + 13));
    if (OPT.dagilim !== "dengeli") return H;
    if (H.every((h) => SUITS.every((su) => { const n = h.filter((c) => c.s === su).length; return n >= 2 && n <= 5; }))) return H;
  }
  const d = newDeck(); return [0, 1, 2, 3].map((i) => d.slice(i * 13, i * 13 + 13));
}
function sortHand(h) {
  h.sort((a, b) => SUITS.indexOf(a.s) - SUITS.indexOf(b.s) || b.r - a.r);
}
function cardEl(c) {
  const el = document.createElement("div");
  el.className = "card" + (isRed(c.s) ? " red" : "");
  el.innerHTML = `<span class="r${c.r === 10 ? " ten" : ""}">${rankText(c.r)}</span><span class="s1">${c.s}</span><span class="s2">${c.s}</span>`;
  return el;
}

// ---------- Kurallar ----------
function beats(a, b, led) {
  if (a.s === b.s) return a.r > b.r;
  if (a.s === trump) return true;
  return false;
}
function trickWinner(t) {
  const led = t[0].card.s;
  let best = t[0];
  for (const x of t) if (beats(x.card, best.card, led)) best = x;
  return best;
}
function legal(hand) {
  if (trick.length === 0) {
    if (!trumpBroken && !(OPT.esli && OPT.kozBas)) {
      const nt = hand.filter((c) => c.s !== trump);
      if (nt.length) return nt;
    }
    return hand;
  }
  const led = trick[0].card.s;
  const best = trickWinner(trick).card;
  const same = hand.filter((c) => c.s === led);
  if (same.length) {
    // Yükseltmeli: renge uyarken yükseltmek zorunlu. Yükseltmesiz: yalnızca koz açıldıysa yükseltilir.
    if (best.s === led && (OPT.yuk || led === trump)) {
      const higher = same.filter((c) => c.r > best.r);
      if (higher.length) return higher;
    }
    return same;
  }
  const tr = hand.filter((c) => c.s === trump);
  if (tr.length) {
    if (best.s === trump) {
      const higher = tr.filter((c) => c.r > best.r);
      if (higher.length) return higher;
    }
    return tr;
  }
  return hand;
}

// ---------- Bilgisayar ----------
function estimate(hand) {
  let est = 0, longest = 0;
  for (const s of SUITS) {
    const cs = hand.filter((c) => c.s === s);
    const len = cs.length;
    const has = (r) => cs.some((c) => c.r === r);
    if (has(14)) est += 1;
    if (has(13)) est += len >= 2 ? 0.8 : 0.2;
    if (has(12)) est += len >= 3 ? 0.5 : 0;
    if (has(11)) est += len >= 4 ? 0.3 : 0;
    longest = Math.max(longest, len);
  }
  if (longest > 4) est += (longest - 4) * 0.9;
  return est;
}
function botChooseTrump(hand) {
  let best = SUITS[0], bestScore = -1;
  for (const s of SUITS) {
    const cs = hand.filter((c) => c.s === s);
    const sc = cs.length * 2 + cs.reduce((a, c) => a + Math.max(0, c.r - 10), 0);
    if (sc > bestScore) { bestScore = sc; best = s; }
  }
  return best;
}
function isBoss(c, hand) {
  for (let r = c.r + 1; r <= 14; r++) {
    const k = c.s + r;
    if (!played.has(k) && !hand.some((h) => id(h) === k)) return false;
  }
  return true;
}
function lowest(cards) {
  return [...cards].sort((a, b) => (a.s === trump) - (b.s === trump) || a.r - b.r)[0];
}
function botPick(p) {
  const hand = hands[p];
  const L = legal(hand);
  if (trick.length === 0) {
    const bosses = L.filter((c) => isBoss(c, hand));
    const nonTrumpBoss = bosses.filter((c) => c.s !== trump);
    if (nonTrumpBoss.length) return nonTrumpBoss[0];
    if (bosses.length && p === bidder) return bosses[0];
    return lowest(L);
  }
  const led = trick[0].card.s;
  const bw = trickWinner(trick), best = bw.card;
  const winning = L.filter((c) => beats(c, best, led));
  const losing = L.filter((c) => !beats(c, best, led));
  // +3 kuralı: ihale tarafı zaten ihale+2'ye ulaştıysa el almaktan kaçın
  if (A3() && sameSide(p, bidder) && sideTricks(bidder) >= contract + 2 && losing.length) return [...losing].sort((a, b) => b.r - a.r)[0];
  // Eşli: eli ortak alıyorsa ve garantiyse üstüne çıkma
  if (OPT.esli && bw.p === partner(p) && losing.length && (trick.length === 3 || isBoss(best, hand) || best.s === trump)) return lowest(losing);
  if (winning.length) {
    const asc = [...winning].sort((a, b) => a.r - b.r);
    if (trick.length === 3) return asc[0];
    const boss = asc.find((c) => isBoss(c, hand));
    return boss || asc[asc.length - 1];
  }
  return lowest(L);
}

function handInto(elId, p) {

}
function renderHand() {

  $("table").classList.toggle("ph", showP);

}
function render() { renderInfo(); renderSeats(); renderHand(); }

// ---------- El dağıtımı ----------
function newRound() {
  roundNo++;
  dealer = (dealer + 1) % 4;
  hands = dealHands();
  hands.forEach(sortHand);
  bids = [null, null, null, null];
  active = [true, true, true, true];
  highBid = 0; highBidder = -1;
  bidder = null; contract = 0; trump = null; trumpBroken = false;
  trick = []; tricks = [0, 0, 0, 0]; played = new Set();
  phase = "bid";
  turn = (dealer + 1) % 4;
  if (window.CardSfx) CardSfx.deal(13);
  renderTrick();
  render();
  bidTurn();
}

// ---------- İhale ----------
async function bidTurn() {
  const act = [0, 1, 2, 3].filter((i) => active[i]);
  if (highBidder >= 0 && act.length === 1) return endBidding();
  if (act.length === 0) {
    highBid = MINB(); highBidder = dealer;
    setStatus(`Herkes pas geçti, ihale ${NAMES[dealer]}'e ${MINB()} ile kaldı.`);
    await wait(1200);
    return endBidding();
  }
  while (!active[turn]) turn = (turn + 1) % 4;
  renderSeats();
  if (turn === 0) {
    showBidPanel();
  } else {
    setStatus(`${NAMES[turn]} düşünüyor…`);
    await wait(750);
    const want = Math.floor(estimate(hands[turn]) + (OPT.esli ? 3.2 : 0));
    const min = Math.max(MINB(), highBid + 1);
    doBid(turn, want >= min && min <= 13 ? min : "pas");
  }
}
function showBidPanel() {
  const min = Math.max(MINB(), highBid + 1);
  setStatus(highBid ? `En yüksek ihale: <b>${highBid}</b> (${NAMES[highBidder]}). Senin sıran.` : "İhale sende. Kaç el alırsın?");
  const panel = $("bidPanel");
  panel.innerHTML = "";
  for (let v = min; v <= 13; v++) {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => { panel.classList.remove("show"); doBid(0, v); };
    panel.appendChild(b);
  }
  const ps = document.createElement("button");
  ps.textContent = "Pas";
  ps.className = "pass";
  ps.onclick = () => { panel.classList.remove("show"); doBid(0, "pas"); };
  panel.appendChild(ps);
  panel.classList.add("show");
}
function doBid(p, v) {
  if (v === "pas") { active[p] = false; bids[p] = "pas"; }
  else { highBid = v; highBidder = p; bids[p] = v; }
  turn = (p + 1) % 4;
  renderSeats();
  bidTurn();
}
async function endBidding() {
  bidder = highBidder; contract = highBid;
  phase = "trump";
  turn = bidder;
  if (bidder === 0) {
    setStatus(`İhaleyi <b>${contract}</b> ile aldın. Kozu seç:`);
    const panel = $("trumpPanel");
    panel.innerHTML = "";
    for (const s of SUITS) {
      const b = document.createElement("button");
      b.className = "suit" + (isRed(s) ? " red" : "");
      b.textContent = s;
      b.onclick = () => { panel.classList.remove("show"); startPlay(s); };
      panel.appendChild(b);
    }
    panel.classList.add("show");
    render();
  } else {
    render();
    const t = botChooseTrump(hands[bidder]);
    setStatus(`${NAMES[bidder]} ihaleyi <b>${contract}</b> ile aldı, koz <b>${t} ${SUIT_NAMES[t]}</b>.`);
    await wait(1500);
    startPlay(t);
  }
}

// ---------- Oyun ----------
function startPlay(t) {
  trump = t;
  phase = "play";
  turn = bidder;
  render();
  playTurn();
}
async function playTurn() {
  renderSeats();
  if (humanCtl(turn)) {
    const who = turn === 2 ? "Eşinin (Sadolayn) sırası — onun kartını sen seç." : "";
    setStatus(who || (trick.length === 0 ? "Sıra sende, bir kart aç." : "Sıra sende."));
    renderHand();
  } else {
    setStatus(turn === 0 ? "İhale eşinde: Sadolayn senin kartını oynuyor…" : `${NAMES[turn]} oynuyor…`);
    renderHand();
    await wait(650);
    playCard(turn, botPick(turn));
  }
}
function humanPlay(c, p = 0) {
  if (phase !== "play" || turn !== p || !humanCtl(p) || busy) return;
  playCard(p, c);
}
async function playCard(p, c) {
  if (window.CardSfx) CardSfx.play();
  hands[p] = hands[p].filter((x) => id(x) !== id(c));
  trick.push({ p, card: c, fresh: true });
  played.add(id(c));
  if (c.s === trump) trumpBroken = true;
  renderTrick();
  if (trick.length < 4) {
    turn = (p + 1) % 4;
    renderHand();
    return playTurn();
  }
  busy = true;
  const w = trickWinner(trick).p;
  tricks[w]++;
  turn = -1;
  renderTrick(w);
  render();
  setStatus(w === 0 ? "Eli <b>sen</b> aldın! 👏" : `Eli <b>${NAMES[w]}</b> aldı.`);
  await wait(1100);
  if (window.CardSfx) CardSfx.collect();
  trick = [];
  renderTrick();
  busy = false;
  if (hands[0].length === 0) return endRound();
  turn = w;
  playTurn();
}

// ---------- Puanlama ----------
function endRound() {
  phase = "end";
  const side = sideTricks(bidder);
  const over = A3() && side >= contract + 3;
  const made = side >= contract && !over;
  // Puan: ihaleyi tutan taahhüt başına 15, fazla el başına 10; tutamayan (ya da +3 yapan) −10 × ihale.
  // Diğerleri el başına 10; hiç el almayan −50.
  const bidPts = made ? contract * 15 + (side - contract) * 10 : -contract * 10;
  const other = (t) => (t > 0 ? t * 10 : -50);
  let deltas;
  if (OPT.esli) {
    const os = other(13 - side);
    deltas = [0, 1, 2, 3].map((p) => (sameSide(p, bidder) ? bidPts : os));
  } else {
    deltas = [0, 1, 2, 3].map((p) => (p === bidder ? bidPts : other(tricks[p])));
  }
  deltas.forEach((d, p) => (scores[p] += d));
  saveScores();
  render();
  const who = OPT.esli ? (sameSide(0, bidder) ? "Tarafınız" : "Rakip taraf") : bidder === 0 ? "Sen" : NAMES[bidder];
  const title = made ? (sameSide(0, bidder) ? "🎉 İhale tuttu!" : `${who} ihaleyi tuttu`)
    : over ? `🔥 ${who} +3 yaptı, yandı!` : (sameSide(0, bidder) ? "😬 Battın!" : `${who} battı!`);
  const rows = OPT.esli
    ? [[0, `${NAMES[0]} + Sadolayn`], [1, `${NAMES[1]} + ${NAMES[3]}`]].map(([p, n]) => `<tr><td style="text-align:left">${n}${sameSide(p, bidder) ? " 👑" : ""}</td><td>${tricks[p] + tricks[partner(p)]}</td><td class="${deltas[p] < 0 ? "neg" : "pos"}">${deltas[p] > 0 ? "+" : ""}${deltas[p]}</td><td><b>${scores[p]}</b></td></tr>`).join("")
    : [0, 1, 2, 3].map((p) => `<tr><td style="text-align:left">${NAMES[p]}${p === bidder ? " 👑" : ""}</td><td>${tricks[p]}</td><td class="${deltas[p] < 0 ? "neg" : "pos"}">${deltas[p] > 0 ? "+" : ""}${deltas[p]}</td><td><b>${scores[p]}</b></td></tr>`).join("");
  const last = roundNo >= OPT.eller;
  $("modal").innerHTML = `
    <h2>${title}</h2>
    <p>El ${roundNo}/${OPT.eller} · İhale ${contract} · Alınan ${side}${over ? " (ihale+3)" : ""} · Koz ${trump}</p>
    <table><tr><th></th><th>El</th><th>Puan</th><th>Toplam</th></tr>${rows}</table>
    <button class="btn" id="next">${last ? "Sonucu gör" : "Sonraki el"}</button>`;
  $("overlay").classList.add("show");
  $("next").onclick = () => { $("overlay").classList.remove("show"); last ? gameOver() : newRound(); };
  setStatus("");
}

      <li>En yüksek ihaleyi veren kozu seçer ve ilk kartı açar (en az <b>4</b>, eşlide en az <b>7</b>). Koz oynanmadan kozla el açılamaz; eşlide <b>Kozla başlanabilir</b> açıksa açılabilir.</li>
      <li><b>Yükseltme zorunlu:</b> yerdeki rengi atarken büyüğünü atmak zorundasın. Kapalıysa renge uyman yeter; yalnızca <b>koz</b> yükseltilir.</li>
      <li>O renk yoksa koz atmalısın (yükseltebiliyorsan yükselt).</li>
      <li><b>El dağılımı:</b> Dengeli'de her oyuncuya her renkten 2–5 kart düşer, kozlar herkese benzer sayıda gelir. Rastgele'de kartlar tamamen şansa dağılır; bir oyuncuya çok koz gelebilir.</li>
      <li><b>Puan:</b> ihaleyi tutan, söz verdiği her el için 15, fazla her el için 10 puan alır; tutamayan ihale × 10 eksi yazar. Diğerleri aldıkları her el için 10 puan alır; <b>hiç el alamayan −50</b> yazar.</li>
      <li><b>Eşli:</b> karşındaki oyuncu eşindir, ellerin toplamı sayılır. İhaleyi alan eşinin kartlarını açık görür ve iki eli de o oynar.</li>
      <li><b>Token:</b> 1.000 Token ile başlarsın. Tekli oyunda birinci olursan koyduğun Token'ın <b>3 katını</b>, eşlide tarafın kazanırsa <b>2 katını</b> alırsın. Berabere biterse Token'ın iade edilir.</li>
      <li><b>Masa ücreti:</b> masadaki toplam Token'ın <b>%1'i</b> kazanandan alınır ve masa kasasına gider. Kasa istatistiği için oyun özeti (adın, Token, sonuç) site yöneticisine iletilir.</li>
      <li> Token biterse 1 gün sonra İş Bankası sorusu gelir; doğru cevap 1.000 Token kazandırır.</li>
    </ul></details>
    <button class="btn abtn" id="start">Başla</button>
    <div class="kasa">🏦 Bu cihazda: ${KASA.oyun} oyun · masa kasasına ${mpFmt(KASA.ucret)} Token</div>`;
  $("overlay").classList.add("show");
  ISIM.bind($("modal"), () => { setNames(); if (typeof render === "function") try { render(); } catch (e) {} });
  const DAG = [["dengeli", "Dengeli"], ["rastgele", "Rastgele"]];
  const okB = () => BAHIS.filter((v) => v <= MP.bal);
  const syncOpt = () => {
    $("vBahis").textContent = mpFmt(OPT.bahis);
    $("vDag").textContent = (DAG.find((x) => x[0] === OPT.dagilim) || DAG[0])[1];
    $("vEl").textContent = OPT.eller;
    $("cEsli").checked = OPT.esli; $("cYuk").checked = OPT.yuk; $("cKoz").checked = OPT.kozBas && OPT.esli; $("cKoz").disabled = !OPT.esli;
    $("kbWrap").classList.toggle("off", !OPT.esli);
    $("dagNote").innerHTML = OPT.dagilim === "dengeli" ? "⚖️ <b>Dengeli:</b> herkese her renkten 2–5 kart; kozlar dengeli dağılır." : "🎲 <b>Rastgele:</b> tam şans; bir oyuncuya 6–7 koz bile gelebilir.";
    $("start").textContent = `Başla · ${mpFmt(OPT.bahis)} Token`;
  };
  $("modal").querySelectorAll("[data-st]").forEach((b) => (b.onclick = () => {
    const k = b.dataset.st, d = +b.dataset.d;
    if (k === "bahis") { const L = okB(), i = L.indexOf(OPT.bahis); OPT.bahis = L[Math.max(0, Math.min(L.length - 1, (i < 0 ? 0 : i) + d))]; }
    if (k === "eller") OPT.eller = Math.max(1, Math.min(20, OPT.eller + d));
    if (k === "dagilim") { const i = DAG.findIndex((x) => x[0] === OPT.dagilim); OPT.dagilim = DAG[(i + d + DAG.length) % DAG.length][0]; }
    syncOpt();
  }));
  $("cEsli").onchange = (e) => { OPT.esli = e.target.checked; syncOpt(); };
  $("cYuk").onchange = (e) => { OPT.yuk = e.target.checked; };
  $("cKoz").onchange = (e) => { OPT.kozBas = e.target.checked; };
  $("ayarX").onclick = () => { if (phase && phase !== "idle" && hands) { $("overlay").classList.remove("show"); $("modal").classList.remove("ayar"); } else location.href = "oyunlar.html"; };
  syncOpt();
  $("start").onclick = () => {
    if (OPT.bahis > MP.bal) return;
    MP.bal -= OPT.bahis; gameStake = OPT.bahis; mpSave();
    try { localStorage.setItem("batakOpt", JSON.stringify(OPT)); } catch (e) {}
    scores = [0, 0, 0, 0]; roundNo = 0; saveScores();
    $("overlay").classList.remove("show"); $("modal").classList.remove("ayar"); newRound();
  };
}
renderInfo();
showRules();
