<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<script src="gate.js"></script>
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Batak</title>
<style>
  :root {
    --bg: #000000;
    --felt: #0b2a1c;
    --felt-line: #164a33;
    --card: #0d0d0d;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --red: #e0473a;
    --win: #3fc283;
    --line: #262626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    max-width: 480px;
    margin: 0 auto;
    padding: 10px 10px 14px;
    user-select: none;
  }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  .info { font-size: 13px; color: var(--muted); text-align: right; line-height: 1.3; }
  .info b { color: var(--accent); }
  .scores {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
    margin: 8px 0; font-size: 12px; text-align: center;
  }
  .scores div { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 2px; }
  .scores b { display: block; font-size: 15px; }

  .table {
    flex: 1;
    min-height: 330px;
    position: relative;
    background: linear-gradient(135deg, #2a3fe0 0%, #1a2bb8 55%, #13208f 100%);
    border-radius: 22px;
    border: 1px solid #3a50f0;
    overflow: hidden;
  }
  /* Arka planda SADOLAYN gölgesi */
  .table::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: url("img/logo.png") center 77% / 70% auto no-repeat;
    opacity: .2; filter: grayscale(1) brightness(2.4);
  }
  .seat, .slot { z-index: 1; }
  .seat {
    position: absolute;
    background: rgba(0,0,0,.55);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 5px 8px;
    font-size: 12px;
    text-align: center;
    min-width: 78px;
    transition: border-color .2s, box-shadow .2s;
  }
  .seat .nm { font-weight: 700; font-size: 13px; }
  .seat .bd { color: var(--muted); }
  .seat.turn { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(224,162,79,.35); }
  .seat.bidder .nm::after { content: " 👑"; }
  .seat-n { top: 8px; left: 50%; transform: translateX(-50%); }
  .seat-w { left: 6px; top: 50%; transform: translateY(-50%); }
  .seat-e { right: 6px; top: 50%; transform: translateY(-50%); }
  .seat-s { bottom: 8px; left: 50%; transform: translateX(-50%); }

  .slot { position: absolute; width: 56px; height: 84px; }
  .slot-n { top: 64px; left: 50%; transform: translateX(-50%); }
  .slot-s { bottom: 64px; left: 50%; transform: translateX(-50%); }
  .slot-w { left: 90px; top: 50%; transform: translateY(-50%); }
  .slot-e { right: 90px; top: 50%; transform: translateY(-50%); }

  .card {
    width: 56px; height: 84px;
    background: #f7f4ee;
    color: #111;
    border-radius: 7px;
    border: 1px solid #bbb;
    position: relative;
    font-weight: 700;
    box-shadow: 0 2px 6px rgba(0,0,0,.5);
    flex: none;
  }
  .card.red { color: var(--red); }
  .card .r { position: absolute; top: 3px; left: 3px; font-size: 29px; line-height: 1; letter-spacing: -1px; transform-origin: left top; }
  .card .r.ten { transform: scaleX(.72); letter-spacing: -2px; }
  .card .s1 { position: absolute; top: 32px; left: 2px; font-size: 26px; line-height: 1; }
  .card .s2 { position: absolute; bottom: 3px; right: 4px; font-size: 34px; line-height: 1; }
  .card.win { outline: 3px solid var(--win); }
  .pop { animation: pop .18s ease-out; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .status {
    min-height: 40px;
    display: flex; align-items: center; justify-content: center;
    text-align: center; font-size: 15px; padding: 6px 4px;
  }
  .panel { display: none; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .panel.show { display: flex; }
  .panel button, .btn {
    min-width: 44px; padding: 10px 12px;
    border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink);
    font-size: 16px; font-weight: 600; cursor: pointer;
  }
  .panel button.pass { border-color: var(--red); color: var(--red); }
  .panel button.suit { font-size: 26px; padding: 6px 16px; }
  .panel button.suit.red { color: var(--red); }

  .hand {
    display: flex; justify-content: center;
    padding: 14px 0 4px; min-height: 90px;
  }
  .hand .card:not(:last-child) .s2 { display: none; }
  .hand .card { margin-left: -30px; transition: transform .12s, opacity .12s; cursor: pointer; }
  .hand .card:first-child { margin-left: 0; }
  .hand .card.ok { transform: translateY(-10px); }
  .hand .card.no { opacity: .4; cursor: default; }
  .hand .card.ok:active { transform: translateY(-16px); }

  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.8);
    display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10;
  }
  .overlay.show { display: flex; }
  .modal {
    background: var(--card); border: 1px solid var(--line); border-radius: 18px;
    padding: 20px; width: 100%; max-width: 360px; text-align: center;
  }
  .modal h2 { margin: 0 0 6px; font-size: 20px; }
  .modal p { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
  .modal table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 14px; }
  .modal td, .modal th { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .modal th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .pos { color: var(--win); }
  .neg { color: var(--red); }
  .opts { text-align: left; margin-bottom: 10px; }
  .opts label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 5px; }
  .seg { display: flex; gap: 4px; background: #111; border: 1px solid var(--line); border-radius: 12px; padding: 3px; }
  .seg button { flex: 1; padding: 8px 4px; border: none; border-radius: 9px; background: transparent; color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #000; }
  .modal { max-height: 92vh; overflow-y: auto; }
  .mpbox { background: linear-gradient(135deg, #1a2a4a, #0f1a30); border: 1px solid #2f4f8f; color: #cfdcff; border-radius: 12px; padding: 9px 12px; font-size: 14px; margin: 4px 0 8px; }
  .mpbox b { color: #fff; }
  .qopts { display: grid; gap: 8px; }
  .qopts button { padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: #161616; color: var(--ink); font-size: 15px; font-weight: 600; cursor: pointer; text-align: left; }
  .qopts button.ok { border-color: #3fc283; background: rgba(63,194,131,.15); }
  .qopts button.bad { border-color: #e0473a; background: rgba(224,71,58,.15); }
  #pwrap { position: absolute; top: 58px; left: 0; right: 0; z-index: 2; display: flex; justify-content: center; pointer-events: none; }
  #phand { padding: 8px 0 0; min-height: 0; transform: scale(.76); transform-origin: top center; pointer-events: auto; }
  #phand .card { margin-left: -27px; }
  #phand .card.no { opacity: .6; }
  #phand .card:first-child { margin-left: 0; }
  #phand .card.ok { transform: translateY(8px); }
  .table.ph .slot-n { top: 140px; }
  .seg button:disabled { opacity: .35; cursor: not-allowed; }
  .modal .btn { width: 100%; background: var(--accent); border-color: var(--accent); color: #000; }
  .rules { font-size: 13px; color: var(--muted); text-align: left; line-height: 1.5; margin: 0 0 14px; padding-left: 18px; }
</style>
<script src="cardsound.js"></script>
</head>
<body>
<header>
  <a href="oyunlar.html" style="display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:#161616;border:1px solid #e0a24f;font-size:22px;line-height:1;text-decoration:none" title="Oyunlar" aria-label="Oyunlar">🎮</a>

<div class="scores" id="scores"></div>

<div class="table" id="table">
  <div class="seat seat-n" id="seat2"></div>
  <div id="pwrap" style="display:none"><div class="hand" id="phand"></div></div>
  <div class="seat seat-w" id="seat3"></div>
  <div class="seat seat-e" id="seat1"></div>
  <div class="seat seat-s" id="seat0"></div>
  <div class="slot slot-s" id="slot0"></div>
  <div class="slot slot-e" id="slot1"></div>
  <div class="slot slot-n" id="slot2"></div>
  <div class="slot slot-w" id="slot3"></div>
</div>

<div class="status" id="status"></div>
<div class="panel" id="bidPanel"></div>

<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
const SUITS = ["♠", "♥", "♣", "♦"];
const SUIT_NAMES = { "♠": "Maça", "♥": "Kupa", "♣": "Sinek", "♦": "Karo" };
const RANKS = { 11: "J", 12: "Q", 13: "K", 14: "A" };
const NAMES = ["Sen", "Sadosan", "Sadolayn", "Sadocan"];
const isRed = (s) => s === "♥" || s === "♦";
const rankText = (r) => RANKS[r] || String(r);
const id = (c) => c.s + c.r;
const $ = (x) => document.getElementById(x);
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

let scores = [0, 0, 0, 0];
let dealer = 3;
// Oyun ayarları
let OPT = { eller: 5, arti3: true, yuk: true, esli: false, bahis: 100 };
try { Object.assign(OPT, JSON.parse(localStorage.getItem("batakOpt") || "{}")); } catch (e) {}
if (![1, 3, 5, 7].includes(OPT.eller)) OPT.eller = 5;
// ---------- MaxiPuan ----------
const MP_KEY = "batakMP";
let MP = { bal: 1000, empty: 0, lastQ: -1 };
try { Object.assign(MP, JSON.parse(localStorage.getItem(MP_KEY) || "{}")); } catch (e) {}
const mpSave = () => { try { localStorage.setItem(MP_KEY, JSON.stringify(MP)); } catch (e) {} };
const mpFmt = (n) => n.toLocaleString("tr-TR");
const BAHIS = [100, 250, 500, 1000];
let gameStake = 0;
// İş Bankası tarihçesi ve ürün soruları (internetten doğrulandı: Küre Ansiklopedi, Diken, isbank.com.tr, Teknoblog)
// 4. alan: son geçerlilik tarihi (kampanya soruları kampanya bitince sorulmaz)
const ISQ_ALL = [
  ["Türkiye İş Bankası hangi yıl kuruldu?", ["1923", "1924", "1927", "1933"], 1],
  ["Türkiye İş Bankası'nın kurucusu kimdir?", ["Mustafa Kemal Atatürk", "İsmet İnönü", "Kâzım Karabekir", "Fevzi Çakmak"], 0],
  ["İş Bankası'nın ilk genel müdürü kimdir?", ["Muammer Eriş", "Celâl Bayar", "Şükrü Saracoğlu", "Hasan Saka"], 1],
  ["İş Bankası hangi tarihte kuruldu?", ["29 Ekim 1923", "26 Ağustos 1924", "23 Nisan 1920", "30 Ağustos 1922"], 1],
  ["İş Bankası hangi şehirde kuruldu?", ["İstanbul", "İzmir", "Ankara", "Bursa"], 2],
  ["İş Bankası'nın kuruluş sermayesi ne kadardı?", ["100 bin lira", "500 bin lira", "1 milyon lira", "10 milyon lira"], 2],
  ["Atatürk, İş Bankası'nın 1 milyon liralık kuruluş sermayesinin ne kadarını karşıladı?", ["100 bin lira", "250 bin lira", "500 bin lira", "Tamamını"], 1],
  ["Atatürk'ün İş Bankası hisseleri, vasiyeti gereği hangi parti tarafından temsil edilir?", ["Cumhuriyet Halk Partisi", "Demokrat Parti", "Hazine", "TBMM"], 0],
  ["Atatürk'ün İş Bankası hisselerinin kâr payları hangi kurumlara gider?", ["TÜBİTAK ve YÖK", "Türk Dil Kurumu ve Türk Tarih Kurumu", "Kızılay ve Darüşşafaka", "Milli Eğitim ve Diyanet"], 1],
  ["İş Bankası'nın genel müdürlüğü bugün hangi binadadır?", ["İş Kuleleri (Levent)", "Galata Kulesi", "Atakule", "Sabancı Center"], 0],
  ["İş Bankası İktisadi Bağımsızlık Müzesi, bankanın Ankara'daki tarihi genel müdürlük binasındadır. Bu bina hangi semttedir?", ["Kızılay", "Çankaya", "Ulus", "Bahçelievler"], 2],
  ["'Hasan Âli Yücel Klasikler Dizisi' hangi yayınevine aittir?", ["Yapı Kredi Yayınları", "İş Bankası Kültür Yayınları", "Can Yayınları", "Remzi Kitabevi"], 1],
  ["İşCep hangi bankanın mobil bankacılık uygulamasıdır?", ["Ziraat Bankası", "Garanti BBVA", "Türkiye İş Bankası", "Akbank"], 2],
  ["Maximum kart harcamalarında kazanılan puanın adı nedir?", ["MaxiPuan", "Bonus", "ParaPuan", "Chip-para"], 0],
  ["Telefona ya da eşyaya yapıştırılıp temassız ödeme yapılan İş Bankası kart ürününün adı nedir?", ["MaxiPara", "MaxSticker", "Maximiles Black", "İşCep Pay"], 1],
  ["MaxSticker'ın üzerinde aşağıdakilerden hangisi bulunmaz?", ["Kart numarası, son kullanma tarihi ve CVV", "Temassız ödeme çipi", "Maximum özelliği", "MaxiPuan kazanımı"], 0],
  ["MaxSticker başvurusu nereden yapılır?", ["Sadece şubeden", "İşCep'teki 'MaxSticker Kartlarım' menüsünden", "ATM'den", "Kargo ile"], 1],
  ["Maximum kartla akıllı saatten ödeme ('Saat ile Öde') hangi uygulamadan etkinleştirilir?", ["Maximum Mobil", "e-Devlet", "Google Haritalar", "BiP"], 0],
  ["İş Bankası'na uzaktan, görüntülü görüşmeyle müşteri olmak için İşCep'teki özelliğin adı nedir?", ["Hızlı Kredi", "Müşteri Olmak İstiyorum", "Kolay Adres", "QR ile Öde"], 1],
  ["İş Bankası Gişematik'ten tek seferde en fazla kaç TL para çekilebilir?", ["20.000 TL", "50.000 TL", "120.000 TL", "250.000 TL"], 2],
  ["İş Bankası Gişematik'e tek seferde en fazla kaç TL para yatırılabilir?", ["100.000 TL", "250.000 TL", "500.000 TL", "1.000.000 TL"], 2],
  ["Ekim 2026 kampanyası: Maximum anlaşmalı marketlerde tek seferde 20.000 TL alışverişe kaç TL MaxiPuan veriliyor?", ["250 TL", "500 TL", "1.000 TL", "2.000 TL"], 2, "2026-10-31"],
  ["Ekim 2026 'İş Bankası'nı Arkadaşınıza Önerin' kampanyasında davet eden ve yeni müşteri olan arkadaşı kaçar TL MaxiPuan kazanır?", ["100 TL", "250 TL", "500 TL", "1.000 TL"], 2, "2026-10-31"],
];
const ISQ = ISQ_ALL.filter((q) => !q[3] || new Date() <= new Date(q[3] + "T23:59:59"));
let roundNo = 0;
const partner = (p) => (p + 2) % 4;
const sameSide = (a, b) => a === b || (OPT.esli && partner(a) === b);
const MINB = () => (OPT.esli ? 7 : 4);
const A3 = () => OPT.arti3 && !OPT.esli; // eşlide +3 kuralı yok
// Eşli: ihaleyi alan eşinin kartlarını da oynar
const humanCtl = (p) => p === 0 ? !(OPT.esli && bidder === 2 && phase === "play") : (p === 2 && OPT.esli && bidder === 0 && phase === "play");
const sideTricks = (p) => tricks[p] + (OPT.esli ? tricks[partner(p)] : 0);
let hands, bids, active, highBid, highBidder, bidder, contract, trump, trumpBroken;
let trick, turn, tricks, played, phase, busy = false;

try {
  const s = JSON.parse(localStorage.getItem("batakScores") || "null");
  if (Array.isArray(s) && s.length === 4) scores = s;
} catch (e) {}
function saveScores() {
  try { localStorage.setItem("batakScores", JSON.stringify(scores)); } catch (e) {}
}

// ---------- Kartlar ----------
function newDeck() {
  const d = [];
  for (const s of SUITS) for (let r = 2; r <= 14; r++) d.push({ s, r });
  for (let i = d.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [d[i], d[j]] = [d[j], d[i]];
  }
  return d;
}
function sortHand(h) {
  h.sort((a, b) => SUITS.indexOf(a.s) - SUITS.indexOf(b.s) || b.r - a.r);
}
function cardEl(c) {
  const el = document.createElement("div");
  el.className = "card" + (isRed(c.s) ? " red" : "");
  el.innerHTML = `<span class="r${c.r === 10 ? " ten" : ""}">${rankText(c.r)}</span><span class="s1">${c.s}</span><span class="s2">${c.s}</span>`;
  return el;
}

// ---------- Kurallar ----------
function beats(a, b, led) {
  if (a.s === b.s) return a.r > b.r;
  if (a.s === trump) return true;
  return false;
}
function trickWinner(t) {
  const led = t[0].card.s;
  let best = t[0];
  for (const x of t) if (beats(x.card, best.card, led)) best = x;
  return best;
}
function legal(hand) {
  if (trick.length === 0) {
    if (!trumpBroken) {
      const nt = hand.filter((c) => c.s !== trump);
      if (nt.length) return nt;
    }
    return hand;
  }
  const led = trick[0].card.s;
  const best = trickWinner(trick).card;
  const same = hand.filter((c) => c.s === led);
  if (same.length) {
    // Yükseltmeli: renge uyarken yükseltmek zorunlu. Yükseltmesiz: yalnızca koz açıldıysa yükseltilir.
    if (best.s === led && (OPT.yuk || led === trump)) {
      const higher = same.filter((c) => c.r > best.r);
      if (higher.length) return higher;
    }
    return same;
  }
  const tr = hand.filter((c) => c.s === trump);
  if (tr.length) {
    if (best.s === trump) {
      const higher = tr.filter((c) => c.r > best.r);
      if (higher.length) return higher;
    }
    return tr;
  }
  return hand;
}

// ---------- Bilgisayar ----------
function estimate(hand) {
  let est = 0, longest = 0;
  for (const s of SUITS) {
    const cs = hand.filter((c) => c.s === s);
    const len = cs.length;
    const has = (r) => cs.some((c) => c.r === r);
    if (has(14)) est += 1;
    if (has(13)) est += len >= 2 ? 0.8 : 0.2;
    if (has(12)) est += len >= 3 ? 0.5 : 0;
    if (has(11)) est += len >= 4 ? 0.3 : 0;
    longest = Math.max(longest, len);
  }
  if (longest > 4) est += (longest - 4) * 0.9;
  return est;
}
function botChooseTrump(hand) {
  let best = SUITS[0], bestScore = -1;
  for (const s of SUITS) {
    const cs = hand.filter((c) => c.s === s);
    const sc = cs.length * 2 + cs.reduce((a, c) => a + Math.max(0, c.r - 10), 0);
    if (sc > bestScore) { bestScore = sc; best = s; }
  }
  return best;
}
function isBoss(c, hand) {
  for (let r = c.r + 1; r <= 14; r++) {
    const k = c.s + r;
    if (!played.has(k) && !hand.some((h) => id(h) === k)) return false;
  }
  return true;
}
function lowest(cards) {
  return [...cards].sort((a, b) => (a.s === trump) - (b.s === trump) || a.r - b.r)[0];
}
function botPick(p) {
  const hand = hands[p];
  const L = legal(hand);
  if (trick.length === 0) {
    const bosses = L.filter((c) => isBoss(c, hand));
    const nonTrumpBoss = bosses.filter((c) => c.s !== trump);
    if (nonTrumpBoss.length) return nonTrumpBoss[0];
    if (bosses.length && p === bidder) return bosses[0];
    return lowest(L);
  }
  const led = trick[0].card.s;
  const bw = trickWinner(trick), best = bw.card;
  const winning = L.filter((c) => beats(c, best, led));
  const losing = L.filter((c) => !beats(c, best, led));
  // +3 kuralı: ihale tarafı zaten ihale+2'ye ulaştıysa el almaktan kaçın
  if (A3() && sameSide(p, bidder) && sideTricks(bidder) >= contract + 2 && losing.length) return [...losing].sort((a, b) => b.r - a.r)[0];
  // Eşli: eli ortak alıyorsa ve garantiyse üstüne çıkma
  if (OPT.esli && bw.p === partner(p) && losing.length && (trick.length === 3 || isBoss(best, hand) || best.s === trump)) return lowest(losing);
  if (winning.length) {
    const asc = [...winning].sort((a, b) => a.r - b.r);
    if (trick.length === 3) return asc[0];
    const boss = asc.find((c) => isBoss(c, hand));
    return boss || asc[asc.length - 1];
  }
  return lowest(L);
}

// ---------- Ekran ----------
function setStatus(t) { $("status").innerHTML = t; }

function renderInfo() {
  const k = trump ? `<b style="color:${isRed(trump) ? "var(--red)" : "var(--ink)"}">${trump} ${SUIT_NAMES[trump]}</b>` : "–";
  const i = bidder != null && contract ? `<b>${contract}</b> · ${NAMES[bidder]}` : "–";
  $("info").innerHTML = `El: <b>${Math.max(1, roundNo)}/${OPT.eller}</b> · Koz: ${k}<br>İhale: ${i}${gameStake ? ` · 💳 ${mpFmt(gameStake)}` : ""}`;
  $("scores").innerHTML = OPT.esli
    ? `<div style="grid-column:span 2">Sen + Sadolayn<b class="${scores[0] < 0 ? "neg" : ""}">${scores[0]}</b></div><div style="grid-column:span 2">Sadosan + Sadocan<b class="${scores[1] < 0 ? "neg" : ""}">${scores[1]}</b></div>`
    : scores.map((s, p) => `<div>${NAMES[p]}<b class="${s < 0 ? "neg" : ""}">${s}</b></div>`).join("");
}
function renderSeats() {
  for (let p = 0; p < 4; p++) {
    const el = $("seat" + p);
    let bd = "";
    if (phase === "bid") {
      bd = bids[p] == null ? "…" : bids[p] === "pas" ? "Pas" : `İhale ${bids[p]}`;
    } else {
      bd = `Aldı: ${tricks[p]}` + (sameSide(p, bidder) ? ` · ${OPT.esli ? "Taraf " + sideTricks(p) : ""} / ${contract}`.replace("·  /", "/") : "");
    }
    el.innerHTML = `<div class="nm">${NAMES[p]}${OPT.esli && p === 2 ? " 🤝" : ""}</div><div class="bd">${bd}</div>`;
    el.classList.toggle("turn", turn === p && (phase === "bid" || phase === "play"));
    el.classList.toggle("bidder", phase !== "bid" && p === bidder);
  }
}
function renderTrick(winnerP) {
  for (let p = 0; p < 4; p++) $("slot" + p).innerHTML = "";
  for (const t of trick) {
    const el = cardEl(t.card);
    if (t.fresh) { el.classList.add("pop"); t.fresh = false; }
    if (winnerP === t.p) el.classList.add("win");
    $("slot" + t.p).appendChild(el);
  }
}
function handInto(elId, p) {
  const h = $(elId);
  h.innerHTML = "";
  const myTurn = phase === "play" && turn === p && humanCtl(p) && !busy;
  const ok = myTurn ? new Set(legal(hands[p]).map(id)) : null;
  for (const c of hands[p]) {
    const el = cardEl(c);
    if (myTurn) {
      if (ok.has(id(c))) { el.classList.add("ok"); el.onclick = () => humanPlay(c, p); }
      else el.classList.add("no");
    }
    h.appendChild(el);
  }
}
function renderHand() {
  handInto("hand", 0);
  const showP = OPT.esli && bidder === 0 && phase === "play";
  $("pwrap").style.display = showP ? "" : "none";
  $("table").classList.toggle("ph", showP);
  if (showP) handInto("phand", 2);
}
function render() { renderInfo(); renderSeats(); renderHand(); }

// ---------- El dağıtımı ----------
function newRound() {
  roundNo++;
  dealer = (dealer + 1) % 4;
  const d = newDeck();
  hands = [0, 1, 2, 3].map((i) => d.slice(i * 13, i * 13 + 13));
  hands.forEach(sortHand);
  bids = [null, null, null, null];
  active = [true, true, true, true];
  highBid = 0; highBidder = -1;
  bidder = null; contract = 0; trump = null; trumpBroken = false;
  trick = []; tricks = [0, 0, 0, 0]; played = new Set();
  phase = "bid";
  turn = (dealer + 1) % 4;
  if (window.CardSfx) CardSfx.deal(13);
  renderTrick();
  render();
  bidTurn();
}

// ---------- İhale ----------
async function bidTurn() {
  const act = [0, 1, 2, 3].filter((i) => active[i]);
  if (highBidder >= 0 && act.length === 1) return endBidding();
  if (act.length === 0) {
    highBid = MINB(); highBidder = dealer;
    setStatus(`Herkes pas geçti, ihale ${NAMES[dealer]}'e ${MINB()} ile kaldı.`);
    await wait(1200);
    return endBidding();
  }
  while (!active[turn]) turn = (turn + 1) % 4;
  renderSeats();
  if (turn === 0) {
    showBidPanel();
  } else {
    setStatus(`${NAMES[turn]} düşünüyor…`);
    await wait(750);
    const want = Math.floor(estimate(hands[turn]) + (OPT.esli ? 3.2 : 0));
    const min = Math.max(MINB(), highBid + 1);
    doBid(turn, want >= min && min <= 13 ? min : "pas");
  }
}
function showBidPanel() {
  const min = Math.max(MINB(), highBid + 1);
  setStatus(highBid ? `En yüksek ihale: <b>${highBid}</b> (${NAMES[highBidder]}). Senin sıran.` : "İhale sende. Kaç el alırsın?");
  const panel = $("bidPanel");
  panel.innerHTML = "";
  for (let v = min; v <= 13; v++) {
    const b = document.createElement("button");
    b.textContent = v;
    b.onclick = () => { panel.classList.remove("show"); doBid(0, v); };
    panel.appendChild(b);
  }
  const ps = document.createElement("button");
  ps.textContent = "Pas";
  ps.className = "pass";
  ps.onclick = () => { panel.classList.remove("show"); doBid(0, "pas"); };
  panel.appendChild(ps);
  panel.classList.add("show");
}
function doBid(p, v) {
  if (v === "pas") { active[p] = false; bids[p] = "pas"; }
  else { highBid = v; highBidder = p; bids[p] = v; }
  turn = (p + 1) % 4;
  renderSeats();
  bidTurn();
}
async function endBidding() {
  bidder = highBidder; contract = highBid;
  phase = "trump";
  turn = bidder;
  if (bidder === 0) {
    setStatus(`İhaleyi <b>${contract}</b> ile aldın. Kozu seç:`);
    const panel = $("trumpPanel");
    panel.innerHTML = "";
    for (const s of SUITS) {
      const b = document.createElement("button");
      b.className = "suit" + (isRed(s) ? " red" : "");
      b.textContent = s;
      b.onclick = () => { panel.classList.remove("show"); startPlay(s); };
      panel.appendChild(b);
    }
    panel.classList.add("show");
    render();
  } else {
    render();
    const t = botChooseTrump(hands[bidder]);
    setStatus(`${NAMES[bidder]} ihaleyi <b>${contract}</b> ile aldı, koz <b>${t} ${SUIT_NAMES[t]}</b>.`);
    await wait(1500);
    startPlay(t);
  }
}

// ---------- Oyun ----------
function startPlay(t) {
  trump = t;
  phase = "play";
  turn = bidder;
  render();
  playTurn();
}
async function playTurn() {
  renderSeats();
  if (humanCtl(turn)) {
    const who = turn === 2 ? "Eşinin (Sadolayn) sırası — onun kartını sen seç." : "";
    setStatus(who || (trick.length === 0 ? "Sıra sende, bir kart aç." : "Sıra sende."));
    renderHand();
  } else {
    setStatus(turn === 0 ? "İhale eşinde: Sadolayn senin kartını oynuyor…" : `${NAMES[turn]} oynuyor…`);
    renderHand();
    await wait(650);
    playCard(turn, botPick(turn));
  }
}
function humanPlay(c, p = 0) {
  if (phase !== "play" || turn !== p || !humanCtl(p) || busy) return;
  playCard(p, c);
}
async function playCard(p, c) {
  if (window.CardSfx) CardSfx.play();
  hands[p] = hands[p].filter((x) => id(x) !== id(c));
  trick.push({ p, card: c, fresh: true });
  played.add(id(c));
  if (c.s === trump) trumpBroken = true;
  renderTrick();
  if (trick.length < 4) {
    turn = (p + 1) % 4;
    renderHand();
    return playTurn();
  }
  busy = true;
  const w = trickWinner(trick).p;
  tricks[w]++;
  turn = -1;
  renderTrick(w);
  render();
  setStatus(w === 0 ? "Eli <b>sen</b> aldın! 👏" : `Eli <b>${NAMES[w]}</b> aldı.`);
  await wait(1100);
  if (window.CardSfx) CardSfx.collect();
  trick = [];
  renderTrick();
  busy = false;
  if (hands[0].length === 0) return endRound();
  turn = w;
  playTurn();
}

// ---------- Puanlama ----------
function endRound() {
  phase = "end";
  const side = sideTricks(bidder);
  const over = A3() && side >= contract + 3;
  const made = side >= contract && !over;
  // Puan: ihaleyi tutan taahhüt başına 15, fazla el başına 10; tutamayan (ya da +3 yapan) −10 × ihale.
  // Diğerleri el başına 10; hiç el almayan −50.
  const bidPts = made ? contract * 15 + (side - contract) * 10 : -contract * 10;
  const other = (t) => (t > 0 ? t * 10 : -50);
  let deltas;
  if (OPT.esli) {
    const os = other(13 - side);
    deltas = [0, 1, 2, 3].map((p) => (sameSide(p, bidder) ? bidPts : os));
  } else {
    deltas = [0, 1, 2, 3].map((p) => (p === bidder ? bidPts : other(tricks[p])));
  }
  deltas.forEach((d, p) => (scores[p] += d));
  saveScores();
  render();
  const who = OPT.esli ? (sameSide(0, bidder) ? "Tarafınız" : "Rakip taraf") : bidder === 0 ? "Sen" : NAMES[bidder];
  const title = made ? (sameSide(0, bidder) ? "🎉 İhale tuttu!" : `${who} ihaleyi tuttu`)
    : over ? `🔥 ${who} +3 yaptı, yandı!` : (sameSide(0, bidder) ? "😬 Battın!" : `${who} battı!`);
  const rows = OPT.esli
    ? [[0, "Sen + Sadolayn"], [1, "Sadosan + Sadocan"]].map(([p, n]) => `<tr><td style="text-align:left">${n}${sameSide(p, bidder) ? " 👑" : ""}</td><td>${tricks[p] + tricks[partner(p)]}</td><td class="${deltas[p] < 0 ? "neg" : "pos"}">${deltas[p] > 0 ? "+" : ""}${deltas[p]}</td><td><b>${scores[p]}</b></td></tr>`).join("")
    : [0, 1, 2, 3].map((p) => `<tr><td style="text-align:left">${NAMES[p]}${p === bidder ? " 👑" : ""}</td><td>${tricks[p]}</td><td class="${deltas[p] < 0 ? "neg" : "pos"}">${deltas[p] > 0 ? "+" : ""}${deltas[p]}</td><td><b>${scores[p]}</b></td></tr>`).join("");
  const last = roundNo >= OPT.eller;
  $("modal").innerHTML = `
    <h2>${title}</h2>
    <p>El ${roundNo}/${OPT.eller} · İhale ${contract} · Alınan ${side}${over ? " (ihale+3)" : ""} · Koz ${trump}</p>
    <table><tr><th></th><th>El</th><th>Puan</th><th>Toplam</th></tr>${rows}</table>
    <button class="btn" id="next">${last ? "Sonucu gör" : "Sonraki el"}</button>`;
  $("overlay").classList.add("show");
  $("next").onclick = () => { $("overlay").classList.remove("show"); last ? gameOver() : newRound(); };
  setStatus("");
}
function showLock() {
  if (!MP.empty) { MP.empty = Date.now(); mpSave(); }
  const left = MP.empty + 864e5 - Date.now();
  if (left > 0) {
    const h = Math.floor(left / 36e5), m = Math.floor((left % 36e5) / 6e4);
    $("modal").innerHTML = `<h2>💳 MaxiPuan bitti</h2>
      <p>Yeni MaxiPuan için <b>${h} saat ${m} dakika</b> sonra gel. Seni İş Bankası tarihçesi ve ürünleriyle ilgili bir soru bekliyor; bilirsen <b>1.000 MaxiPuan</b> kazanırsın.</p>
      <a class="btn" href="oyunlar.html" style="display:block;text-decoration:none;padding:12px">Oyunlara dön</a>`;
    $("overlay").classList.add("show");
    return;
  }
  let qi; do { qi = Math.floor(Math.random() * ISQ.length); } while (ISQ.length > 1 && qi === MP.lastQ);
  const [q, opts0, ok0] = ISQ[qi];
  // Şıkları karıştır
  const ord = opts0.map((_, i) => i).sort(() => Math.random() - 0.5);
  const opts = ord.map((i) => opts0[i]), ok = ord.indexOf(ok0);
  $("modal").innerHTML = `<h2>🏦 İş Bankası Bilgi Yarışması</h2><p>Doğru cevap: <b>1.000 MaxiPuan</b></p>
    <div style="font-weight:700;font-size:16px;margin:4px 0 12px">${q}</div>
    <div class="qopts">${opts.map((o, i) => `<button type="button" data-i="${i}">${o}</button>`).join("")}</div><div id="qres" style="margin-top:12px;font-size:14px"></div>`;
  $("overlay").classList.add("show");
  $("modal").querySelector(".qopts").onclick = (e) => {
    const b = e.target.closest("button"); if (!b || b.disabled) return;
    $("modal").querySelectorAll(".qopts button").forEach((x) => { x.disabled = true; if (+x.dataset.i === ok) x.classList.add("ok"); });
    MP.lastQ = qi;
    if (+b.dataset.i === ok) {
      MP.bal += 1000; MP.empty = 0; mpSave();
      $("qres").innerHTML = `✅ Doğru! <b>1.000 MaxiPuan</b> hesabına yüklendi.<button class="btn" id="qgo" style="margin-top:10px">Oyuna devam</button>`;
      $("qgo").onclick = () => showRules();
    } else {
      b.classList.add("bad"); MP.empty = Date.now(); mpSave();
      $("qres").innerHTML = `❌ Yanlış. Yarın yeni bir soruyla tekrar dene.<a class="btn" href="oyunlar.html" style="display:block;text-decoration:none;padding:12px;margin-top:10px">Oyunlara dön</a>`;
    }
  };
}
function gameOver() {
  phase = "idle";
  let rows, win;
  if (OPT.esli) {
    const a = scores[0], b = scores[1];
    win = a === b ? "Berabere!" : a > b ? "🎉 Siz kazandınız! (Sen + Sadolayn)" : "Sadosan + Sadocan kazandı";
    rows = `<tr><td style="text-align:left">Sen + Sadolayn</td><td><b>${a}</b></td></tr><tr><td style="text-align:left">Sadosan + Sadocan</td><td><b>${b}</b></td></tr>`;
  } else {
    const order = [0, 1, 2, 3].sort((x, y) => scores[y] - scores[x]);
    win = order[0] === 0 ? "🎉 Kazandın!" : `${NAMES[order[0]]} kazandı`;
    rows = order.map((p, i) => `<tr><td style="text-align:left">${["🥇", "🥈", "🥉", "4."][i]} ${NAMES[p]}</td><td><b>${scores[p]}</b></td></tr>`).join("");
  }
  // MaxiPuan ödemesi
  let pay = 0, payTxt = "";
  if (OPT.esli) { const a = scores[0], b = scores[1]; pay = a > b ? gameStake * 2 : a === b ? gameStake : 0; }
  else { const top = Math.max(...scores), tops = scores.filter((x) => x === top).length; pay = scores[0] === top ? (tops === 1 ? gameStake * 3 : gameStake) : 0; }
  MP.bal += pay; mpSave();
  payTxt = pay > gameStake ? `🎉 <b>+${mpFmt(pay)}</b> MaxiPuan kazandın!` : pay === gameStake && pay ? `Berabere: ${mpFmt(pay)} MaxiPuan iade edildi.` : `Bu oyunda ${mpFmt(gameStake)} MaxiPuan kaybettin.`;
  gameStake = 0;
  $("modal").innerHTML = `<h2>${win}</h2><p>${OPT.eller} el tamamlandı</p><table>${rows}</table>
    <div class="mpbox" style="margin-bottom:12px">${payTxt}<br>💳 Bakiye: <b>${mpFmt(MP.bal)}</b> MaxiPuan</div>
    <button class="btn" id="again">${MP.bal < BAHIS[0] ? "Devam" : "Yeni oyun"}</button>`;
  $("overlay").classList.add("show");
  $("again").onclick = () => showRules();
}

// ---------- Başlangıç ----------
function showRules() {
  if (MP.bal < BAHIS[0]) return showLock();
  if (OPT.bahis > MP.bal) OPT.bahis = [...BAHIS].reverse().find((v) => v <= MP.bal);
  const seg = (k, opts) => `<div class="seg" data-k="${k}">${opts.map(([v, t]) => `<button type="button" data-v="${v}" class="${String(OPT[k]) === String(v) ? "on" : ""}">${t}</button>`).join("")}</div>`;
  $("modal").innerHTML = `
    <h2>♠ İhaleli Batak</h2>
    <div class="mpbox">💳 MaxiPuan: <b>${mpFmt(MP.bal)}</b></div>
    <div class="opts">
      <label>Bahis (MaxiPuan)</label>${seg("bahis", BAHIS.map((v) => [v, mpFmt(v)]))}
      <div style="font-size:11px;color:var(--muted);margin-top:4px">Tekli oyunda birinci olursan bahsinin <b>3 katını</b>, eşli oyunda tarafın kazanırsa <b>2 katını</b> alırsın. Berabere biterse bahsin iade edilir.</div>
      <label>Kaç el oynanacak?</label>${seg("eller", [[1, "1"], [3, "3"], [5, "5"], [7, "7"]])}
      <label>Oyun şekli</label>${seg("esli", [[false, "Eşsiz (tekli)"], [true, "Eşli (Sen + Sadolayn)"]])}
      <label>Yükseltme</label>${seg("yuk", [[true, "Yükseltmeli (kanlı)"], [false, "Yükseltmesiz"]])}
      <label>İhale +3 kuralı</label>${seg("arti3", [[true, "+3 yapan yanar"], [false, "Kapalı"]])}
      <div id="a3note" style="font-size:11px;color:var(--muted);margin-top:4px">Eşli oyunda +3 kuralı uygulanmaz.</div>
    </div>
    <ul class="rules">
      <li>En yüksek ihaleyi veren kozu seçer ve ilk kartı açar (en az <b>4</b>, eşlide en az <b>7</b>). Koz oynanmadan kozla el açılamaz.</li>
      <li><b>Yükseltmeli:</b> yerdeki rengi atarken büyüğünü atmak zorundasın. <b>Yükseltmesiz:</b> renge uyman yeter; yalnızca <b>koz</b> yükseltilir.</li>
      <li>O renk yoksa koz atmalısın (yükseltebiliyorsan yükselt).</li>
      <li><b>MaxiPuan:</b> 1.000 MaxiPuan ile başlarsın. Biterse 1 gün sonra İş Bankası tarihçesinden bir soru gelir; doğru cevap 1.000 MaxiPuan kazandırır.</li>
      <li><b>Puan:</b> ihaleyi tutan, söz verdiği her el için 15, fazla her el için 10 puan alır; tutamayan ihale × 10 eksi yazar. Diğer oyuncular aldıkları her el için 10 puan alır; <b>hiç el alamayan −50</b> yazar.</li>
      <li><b>+3 kuralı</b> (tekli): ihalenin 3 ve fazla üstüne çıkan da yanar (ihale × 10 eksi).</li>
      <li><b>Eşli:</b> karşındaki oyuncu eşindir, ellerin toplamı sayılır. İhaleyi alan, eşinin kartlarını açık görür ve <b>iki eli de o oynar</b>. +3 kuralı yoktur.</li>
    </ul>
    <button class="btn" id="start">Başla</button>`;
  $("overlay").classList.add("show");
  $("modal").querySelectorAll(".seg").forEach((g) => (g.onclick = (e) => {
    const b = e.target.closest("button"); if (!b) return;
    const k = g.dataset.k, v = b.dataset.v;
    OPT[k] = v === "true" ? true : v === "false" ? false : +v;
    g.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    syncOpt();
  }));
  const syncOpt = () => {
    $("modal").querySelectorAll('.seg[data-k="arti3"] button').forEach((x) => (x.disabled = OPT.esli)); $("a3note").style.display = OPT.esli ? "" : "none";
    $("modal").querySelectorAll('.seg[data-k="bahis"] button').forEach((x) => (x.disabled = +x.dataset.v > MP.bal));
    $("start").textContent = `Başla · ${mpFmt(OPT.bahis)} MaxiPuan`;
  };
  syncOpt();
  $("start").onclick = () => {
    if (OPT.bahis > MP.bal) return;
    MP.bal -= OPT.bahis; gameStake = OPT.bahis; mpSave();
    try { localStorage.setItem("batakOpt", JSON.stringify(OPT)); } catch (e) {}
    scores = [0, 0, 0, 0]; roundNo = 0; saveScores();
    $("overlay").classList.remove("show"); newRound();
  };
}
renderInfo();
showRules();
</script>
