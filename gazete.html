<style>
  :root {
    --bg: #000000;
    --card: #0d0d0d;
    --field: #161616;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --line: #262626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11" 1;
    padding: 12px 16px 32px;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  .bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .bar button {
    flex: none; width: 46px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 20px; cursor: pointer;
  }
  .bar button:disabled { opacity: .3; }
  select {
    flex: 1; padding: 12px; font-size: 16px; border-radius: 12px;
    background: var(--field); color: var(--ink); border: 1px solid var(--line);
    -webkit-appearance: none; appearance: none; text-align: center;
  }
  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .hero .date { font-size: 22px; font-weight: 700; }
  .hero .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .hero p { margin: 0; font-size: 15px; }
  /* Günün özeti: belirgin, okunması kolay panel */
  .hero { background: linear-gradient(160deg, rgba(224,162,79,.16), rgba(224,162,79,.02) 55%), var(--card); border-color: #5a4320; box-shadow: 0 6px 22px rgba(224,162,79,.08); }
  .hero .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .hero .no { flex: none; font-size: 12px; font-weight: 700; color: var(--accent); border: 1px solid #5a4320; border-radius: 99px; padding: 3px 10px; margin-top: 4px; }
  .sum { margin-top: 12px; }
  .sum .lbl { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #000; background: var(--accent); border-radius: 99px; padding: 3px 10px; }
  .sum .lead { margin: 10px 0 0; font-size: 14.5px; line-height: 1.6; font-weight: 600; color: #fff; padding-left: 11px; border-left: 3px solid var(--accent); letter-spacing: -.1px; }
  .sum ul { list-style: none; margin: 12px 0 0; padding: 0; }
  .sum li { position: relative; padding: 8px 0 8px 18px; border-top: 1px solid rgba(224,162,79,.14); font-size: 13.5px; line-height: 1.6; color: #d4d4d4; }
  .sum li::before { content: ""; position: absolute; left: 3px; top: 16px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .sum li.mute { color: var(--muted); font-size: 12.5px; }
  .sum li.mute::before { background: #444; }
  .sec { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px 16px; margin-bottom: 12px; }
  .sec h2 { margin: 10px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
  .status { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; margin-bottom: 8px; }
  .status b { color: var(--ink); font-weight: 600; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fc283; display: inline-block; margin-right: 4px; }
  .status .dot.old { background: #e8b52b; }
  .warnbox { background: rgba(232,181,43,.1); border: 1px solid rgba(232,181,43,.45); color: #f1d27a; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .warnbox a { color: var(--accent); }
  .sec.imp { border-color: rgba(224,162,79,.6); background: linear-gradient(180deg, rgba(224,162,79,.10), var(--card) 60%); }
  .sec.bnk { border-color: rgba(90,169,240,.5); background: linear-gradient(180deg, rgba(90,169,240,.08), var(--card) 60%); }
  .sec.bnk h2 { color: #5aa9f0; }
  .kurum { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(224,162,79,.18); color: var(--accent); margin-bottom: 4px; }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: none; }
  .item b { display: block; font-size: 14px; font-weight: 600; line-height: 1.45; }
  .item a.rg { color: inherit; text-decoration: none; }
  .item a.rg:hover, .item a.rg:active { color: var(--accent); text-decoration: underline; }
  .item a.rg i { font-style: normal; font-size: 11px; margin-left: 5px; opacity: .7; }
  .item ul.det { margin: 6px 0 0; padding-left: 18px; color: #cfcfcf; font-size: 14px; }
  .item ul.det li { margin: 3px 0; }
  .item .yur { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .item span { display: block; color: #a8a8a8; font-size: 13.5px; line-height: 1.5; margin-top: 3px; }
  .links { font-size: 13px; color: var(--muted); }
  .links a { color: var(--accent); }
  .links li { margin-bottom: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .cal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; margin: 0 auto 12px; max-width: 360px; }
  .cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .cal-h b { font-size: 14px; }
  .cal-h button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font-size: 15px; cursor: pointer; }
  .cal-h button:disabled { opacity: .3; }
  .cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-g .wd { font-size: 11px; color: #a3a3a3; padding: 0 0 2px; }
  .cal-g .wd.we { color: #8a8a8a; }
  .day { position: relative; height: 26px; border-radius: 7px; border: 1px solid transparent; background: none; color: #6a6a6a; font-size: 12px; font-family: inherit; cursor: pointer; padding: 0; }
  .day.has { color: var(--ink); background: var(--field); border-color: var(--line); font-weight: 600; }
  .day.has::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
  .day.today { border-color: #555; }
  .day.sel { background: var(--accent); color: #000; border-color: var(--accent); }
  .day.sel::after { background: #000; }
  .day.fut { opacity: .35; cursor: default; }
  .cal-f { display: flex; gap: 12px; justify-content: center; font-size: 11px; color: var(--muted); margin-top: 4px; }
  /* Bankacılığı ilgilendiren madde olan gün: sağ üstte küçük mavi sayı */
  .day.bnk::before { content: attr(data-n); position: absolute; top: -5px; right: -3px; min-width: 13px; height: 13px; padding: 0 3px; box-sizing: border-box; border-radius: 7px; background: #4a63ff; color: #fff; font-size: 9px; font-weight: 800; line-height: 13px; z-index: 1; }
  .cal-f .lg { display: inline-block; min-width: 12px; height: 12px; border-radius: 6px; background: #4a63ff; color: #fff; font-size: 8.5px; font-weight: 800; line-height: 12px; text-align: center; margin-right: 4px; vertical-align: middle; }
  /* Haftalık bankacılık uyarısı (takvimin altında) */
  .hbnk { border: 1px solid rgba(74,99,255,.45); background: linear-gradient(160deg, rgba(74,99,255,.16), rgba(74,99,255,.04)); border-radius: 14px; padding: 11px 12px; margin: 0 0 12px; }
  .hbnk .hh { font-size: 14px; color: #dfe4ff; }
  .hbnk .hh b { color: #fff; }
  .hbnk .hh small { display: block; font-size: 11.5px; color: #9aa3d6; margin-top: 2px; }
  .hbnk ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 5px; }
  .hbnk li button { display: flex; gap: 8px; width: 100%; text-align: left; padding: 7px 9px; border-radius: 10px; border: 1px solid rgba(74,99,255,.25); background: rgba(0,0,0,.35); color: var(--ink); font: inherit; font-size: 13px; line-height: 1.4; cursor: pointer; }
  .hbnk li em { flex: none; font-style: normal; font-size: 11px; font-weight: 800; color: #8fa0ff; min-width: 46px; padding-top: 1px; }
  .hbnk .hmore { margin-top: 7px; width: 100%; padding: 7px; border-radius: 10px; border: 1px dashed rgba(74,99,255,.45); background: none; color: #a9b5ff; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .yakin { margin-top: 10px; padding: 10px 11px; border-radius: 12px; border: 1px dashed rgba(240,198,74,.45); background: repeating-linear-gradient(135deg, rgba(240,198,74,.05) 0 10px, transparent 10px 20px); }
  .yk-ust { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .yk-et { font-size: 11px; font-weight: 800; letter-spacing: .8px; text-transform: uppercase; color: #f0c64a; }
  .yk-et i { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #f0c64a; margin-right: 6px; vertical-align: 1px; animation: ykNabiz 1.6s ease-in-out infinite; }
  @keyframes ykNabiz { 0%, 100% { box-shadow: 0 0 0 0 rgba(240,198,74,.6); } 50% { box-shadow: 0 0 0 5px rgba(240,198,74,0); } }
  .yk-ch { display: inline-flex; gap: 5px; }
  .yk-ch b { font-size: 11px; font-weight: 800; letter-spacing: .4px; padding: 2px 7px; border-radius: 6px; background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.14); color: #e9e2cf; }
  .yakin p { margin: 7px 0 8px; font-size: 12.5px; line-height: 1.5; color: #c9c2ae; }
  /* Önemli duyuru: kutunun ilk satırı */
  .yk-on { margin: 8px 0 0; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(229,56,59,.5); background: rgba(229,56,59,.08); font-size: 12.5px; line-height: 1.5; color: #e9e2cf; }
  .yk-on .et { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .8px; color: #fff; background: #d32f2f; border-radius: 6px; padding: 1px 6px; margin-right: 6px; vertical-align: 1px; }
  .yk-on b { color: #f3dca8; }
  .yk-on a { color: #ffb4b4; }
  .yk-on .not { display: block; margin-top: 4px; font-size: 11.5px; color: #a9a08a; }
  .yakin.vur { animation: ykVur 1.6s ease-out 2; }
  @keyframes ykVur { 0%, 100% { box-shadow: 0 0 0 0 rgba(229,56,59,0); } 40% { box-shadow: 0 0 0 4px rgba(229,56,59,.5); } }
  .yakin p b { color: #f3dca8; }
  .yk-b { width: 100%; padding: 8px; border-radius: 10px; border: 1px solid #f0c64a; background: rgba(240,198,74,.12); color: #f3dca8; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .yk-b.ok { border-color: rgba(63,194,131,.5); background: rgba(63,194,131,.1); color: #7ee2a8; cursor: default; }
  @media (prefers-reduced-motion: reduce) { .yk-et i { animation: none; } }
  .hbnk.bos { border-color: var(--line); background: none; padding: 8px 12px; }
  .hbnk.bos .hh { font-size: 12.5px; color: var(--muted); }
  .cal-f i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: middle; }
  .stick { position: sticky; top: 0; z-index: 30; background: #000; margin: 0 -16px 12px; padding: 10px 16px; border-bottom: 1px solid transparent; transition: border-color .2s, box-shadow .2s; }
  .stick.stuck { border-bottom-color: #222; box-shadow: 0 8px 18px rgba(0,0,0,.55); }
  .stick > :last-child { margin-bottom: 0; }
  html { overflow-anchor: none; }
  .stick header { margin-bottom: 8px; }
  .stick .cal { margin-top: 8px; }
  .calTog { display: inline-block; margin-left: 6px; padding: 4px 9px; min-height: 24px; box-sizing: border-box; line-height: 1.2; border-radius: 99px; border: 1px solid #5a4320; color: var(--accent); font-size: 11.5px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .hero .date { font-size: 17px; font-weight: 700; letter-spacing: -.2px; }
</style>

<body>
<div class="wrap">
  <div class="stick">
  <header>
    <a href="index.html" style="display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:#161616;border:1px solid #e0a24f;font-size:22px;line-height:1;text-decoration:none" title="Ana sayfa" aria-label="Ana sayfa">🏠</a>
    <h1>📜 Resmi Gazete</h1>
    <span style="width:52px"></span>
  </header>
  <div class="status" id="status">Kontrol bilgisi yükleniyor…</div>
  <div class="bar">
    <button id="prev" aria-label="Önceki gün">‹</button>
    <select id="pick" aria-label="Gün seç"></select>
    <button id="next" aria-label="Sonraki gün">›</button>
  </div>
  <div class="cal" id="cal"></div>
  </div>
  <div id="haftaBnk"></div>

  <div id="content"><div class="empty">Yükleniyor…</div></div>
</div>

<script>
const $ = (x) => document.getElementById(x);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric", weekday: "long" });
let dates = [];

const getJSON = (url) => Ortak.json(url);

const fmtTime = (iso) => { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }); };
async function renderStatus() {
  let k = null; try { k = await getJSON("gazete/kontrol.json"); } catch (e) {}
  const today = todayIso(), have = dates.includes(today);
  const last = k && k.son_kontrol ? new Date(k.son_kontrol) : null;
  const ageH = last ? (Date.now() - last) / 36e5 : 99;
  $("status").innerHTML = `<span><span class="dot${ageH > 12 ? " old" : ""}"></span>Son kontrol: <b>${last ? esc(fmtTime(k.son_kontrol)) : "—"}</b></span>
    <span>Her sabah 07:00 civarı güncellenir</span>`;
  if (!have) {
    const h = new Date().getHours();
    $("haftaBnk").insertAdjacentHTML("beforebegin", `<div class="warnbox" id="nowarn">📭 Bugünün (${esc(fmtDate(today))}) özeti henüz eklenmedi${h < 2 ? " — kontrol sürüyor, birazdan eklenecek" : "; bir sonraki kontrolde eklenecek"}. Şimdilik <a href="https://www.resmigazete.gov.tr/" target="_blank" rel="noopener">Resmi Gazete'nin sitesine</a> bakabilirsin.</div>`);
  }
}
const AYLAR = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
let calY, calM, selDate = null;
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

let calCompact = true, calUser = false, weekRef = null;
// Gün gün "bankacılığı ilgilendirenler" (16 Ekim 2026'dan önceki özetlerde bu bölüm yok → işaretsiz)
const BNK = {}, bnkYolda = new Set(); let bnkHepsi = false;
async function bnkYukle(isos) {
  const eksik = isos.filter((d) => dates.includes(d) && !(d in BNK) && !bnkYolda.has(d));
  if (!eksik.length) return;
  eksik.forEach((d) => bnkYolda.add(d));
  await Promise.all(eksik.map(async (d) => { try { const g = await getJSON(`gazete/${d}.json`); BNK[d] = Array.isArray(g.bankacilik) ? g.bankacilik : null; } catch (e) { BNK[d] = null; } bnkYolda.delete(d); }));
  renderCal();
}
// "Yapım aşamasında": BDDK, MASAK, TCMB duyuruları. "Bunu bekliyorum" ilgiyi anonim sayar (kim olduğu bilinmez)
const YK_KEY = "gazeteYakinda1";
const yakinda = () => {
  let ok = false; try { ok = localStorage.getItem(YK_KEY) === "1"; } catch (e) {}
  return `<div class="yakin"><div class="yk-ust"><span class="yk-et"><i></i>Yapım aşamasında</span><span class="yk-ch"><b>BDDK</b><b>MASAK</b><b>TCMB</b><b>Ticaret Bak.</b></span></div>
    <div class="yk-on"><span class="et">ÖNEMLİ</span><b>15 Ekim 2026 · Resmi Gazete 33401:</b> perakende taksit kuralları değişti. Genel <b>12 ay taksit tavanı</b> yönetmelikten çıktı; konut dışı taksitli satışlarda vade ve sınırları artık <b>Ticaret Bakanlığı</b> belirliyor (BDDK kararlarıyla uyumlu). İlk adım: sıfır cep telefonunda 12 ay taksit sınırı <b>20 bin → 40 bin TL</b> (üstü 3 ay), yenilenmiş telefonda tutar sınırı olmadan 12 ay. Diğer ürünlerde değişiklik yok.<span class="not">Kaynak: <a href="https://ticaret.gov.tr/haberler/ticaret-bakanligindan-bddk-kararlariyla-uyumlu-yeni-duzenleme-15-10-2026" target="_blank" rel="noopener">Ticaret Bakanlığı duyurusu ↗</a> · <a href="#2026-10-15" data-gun="2026-10-15">o günün özeti</a></span></div>
    <p><b>Yakında bu kutuda:</b> Resmi Gazete'ye düşmeyen kararlar da. Kredi kartı taksit ve yapılandırma kararları, yaptırım listesi güncellemeleri, faiz duyuruları… hepsi tek yerde. 15 Ekim 2026 tarihli Resmi Gazete'deki yönetmelik değişikliğine istinaden taksit vadelerini ve sınırlarını belirleme yetkisi <b>Ticaret Bakanlığı</b>'na geçtiği için Bakanlığın taksit duyuruları da buraya eklenecek.</p>
    <button type="button" class="yk-b ${ok ? "ok" : ""}" id="ykBtn" ${ok ? "disabled" : ""}>${ok ? "✓ Not ettik, teşekkürler! Hazır olunca burada" : "👀 Bunu bekliyorum"}</button></div>`;
};
let ykGeldi = false;
function bindYakinda() {
  // Ana sayfadaki kayan yazıdan (gazete.html?yakinda) gelince kutuya kaydır ve kısaca vurgula
  const k = document.querySelector(".yakin");
  if (k && !ykGeldi && /yakinda/.test(location.search)) { ykGeldi = true; setTimeout(() => { const st = document.querySelector(".stick"); k.style.scrollMarginTop = ((st ? st.offsetHeight : 0) + 10) + "px"; k.scrollIntoView({ behavior: "smooth", block: "start" }); k.classList.add("vur"); }, 150); }
  const g = document.querySelector(".yk-on [data-gun]"); if (g) g.onclick = (e) => { e.preventDefault(); history.replaceState(null, "", "#" + g.dataset.gun); show(g.dataset.gun); };
  const b = $("ykBtn"); if (!b || b.disabled) return;
  b.onclick = () => { window.Rapor && Rapor.bolum("yakinda-bddk-masak-tcmb"); try { localStorage.setItem(YK_KEY, "1"); } catch (e) {} b.disabled = true; b.classList.add("ok"); b.textContent = "✓ Not ettik, teşekkürler! Hazır olunca burada"; };
}
const GUN = ["Paz", "Pzt", "Sal", "Çar", "Per", "Cum", "Cmt"];
function renderHaftaBnk(mon) {
  const el = $("haftaBnk"); if (!el) return;
  const today = todayIso();
  const gunler = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return isoOf(d); }).filter((d) => d <= today && dates.includes(d));
  if (!gunler.length || gunler.some((d) => !(d in BNK))) { el.innerHTML = ""; return; } // yükleniyor ya da özet yok
  const L = []; [...gunler].reverse().forEach((d) => (BNK[d] || []).forEach((it) => L.push({ d, it }))); // en yeni gün en üstte
  const bugHafta = isoOf(mon) === (() => { const t = new Date(today + "T12:00:00"); t.setDate(t.getDate() - ((t.getDay() + 6) % 7)); return isoOf(t); })();
  const ad = bugHafta ? "Bu hafta" : "Bu haftada";
  if (!L.length) { el.innerHTML = `<div class="hbnk bos"><div class="hh">✓ ${ad} bankacılığı ilgilendiren bir düzenleme yok</div></div>${yakinda()}`; bindYakinda(); return; }
  el.innerHTML = `<div class="hbnk"><div class="hh">🏦 ${ad} bankacılığı ilgilendiren <b>${L.length}</b> düzenleme<small>Dokun, o günün özetinde aç · takvimdeki mavi sayılar aynı şeyi gösterir</small></div>
    <ul>${(bnkHepsi ? L : L.slice(0, 3)).map(({ d, it }) => { const t = new Date(d + "T12:00:00"); return `<li><button type="button" data-g="${d}"><em>${GUN[t.getDay()]} ${t.getDate()}</em><span>${esc(it.baslik)}</span></button></li>`; }).join("")}</ul>
    ${L.length > 3 ? `<button type="button" class="hmore" id="bnkTog">${bnkHepsi ? "Daha az göster ▴" : `+${L.length - 3} düzenleme daha ▾`}</button>` : ""}${yakinda()}</div>`;
  bindYakinda();
  if ($("bnkTog")) $("bnkTog").onclick = () => { bnkHepsi = !bnkHepsi; renderHaftaBnk(mon); };
  el.querySelectorAll("[data-g]").forEach((b) => (b.onclick = async () => {
    window.Rapor && Rapor.bolum("haftalik-bankacilik");
    history.replaceState(null, "", "#" + b.dataset.g);
    await show(b.dataset.g);
    const sec = document.querySelector("#content .sec.bnk");
    if (sec) { const y = sec.getBoundingClientRect().top + window.scrollY - (document.querySelector(".stick").offsetHeight + 8); window.scrollTo({ top: y, behavior: "smooth" }); }
  }));
}
const isoOf = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
function dayBtn(iso, today, set) {
  const n = (BNK[iso] || []).length;
  const c = ["day", set.has(iso) ? "has" : "", iso === today ? "today" : "", iso === selDate ? "sel" : "", iso > today ? "fut" : "", n ? "bnk" : ""].join(" ");
  return `<button class="${c}" data-d="${iso}" ${n ? `data-n="${n}" title="${n} bankacılık maddesi"` : ""} ${iso > today ? "disabled" : ""}>${+iso.slice(8)}</button>`;
}
function renderWeek() {
  const today = todayIso(), set = new Set(dates);
  const ref = new Date((weekRef || selDate || today) + "T12:00:00");
  const mon = new Date(ref); mon.setDate(ref.getDate() - ((ref.getDay() + 6) % 7));
  const days = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; });
  const a = days[0], b = days[6];
  const label = a.getMonth() === b.getMonth() ? `${a.getDate()}–${b.getDate()} ${AYLAR[b.getMonth()]} ${b.getFullYear()}` : `${a.getDate()} ${AYLAR[a.getMonth()].slice(0, 3)} – ${b.getDate()} ${AYLAR[b.getMonth()].slice(0, 3)} ${b.getFullYear()}`;
  let h = `<div class="cal-h"><button id="cprev" aria-label="Önceki hafta">‹</button><b style="font-size:14px">${label} <span class="calTog" id="calTog" role="button" tabindex="0">📅 Ay ▾</span></b>
    <button id="cnext" aria-label="Sonraki hafta" ${isoOf(b) >= today ? "disabled" : ""}>›</button></div><div class="cal-g">`;
  h += ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"].map((w, i) => `<div class="wd ${i > 4 ? "we" : ""}">${w}</div>`).join("");
  h += days.map((d) => dayBtn(isoOf(d), today, set)).join("") + "</div>";
  $("cal").innerHTML = h;
  renderHaftaBnk(mon); bnkYukle(days.map(isoOf));
  const shift = (n) => { const r = new Date(ref); r.setDate(r.getDate() + n); weekRef = isoOf(r); renderWeek(); };
  $("cprev").onclick = () => shift(-7);
  $("cnext").onclick = () => shift(7);
  $("calTog").onclick = () => { calCompact = false; calUser = true; const r = weekRef || selDate; calY = +r.slice(0, 4); calM = +r.slice(5, 7) - 1; renderCal(); };
}
function renderCal() {
  if (calCompact) return renderWeek();
  const first = new Date(calY, calM, 1), dim = new Date(calY, calM + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7, today = todayIso(), set = new Set(dates);
  const oldest = dates.length ? dates[dates.length - 1] : today;
  const ym = `${calY}-${String(calM + 1).padStart(2, "0")}`;
  let h = `<div class="cal-h"><button id="cprev" aria-label="Önceki ay" ${ym <= "2021-01" ? "disabled" : ""}>‹</button>
    <b>${AYLAR[calM]} ${calY} <span class="calTog" id="calTog" role="button" tabindex="0">Hafta ▴</span></b>
    <button id="cnext" aria-label="Sonraki ay" ${ym >= today.slice(0, 7) ? "disabled" : ""}>›</button></div><div class="cal-g">`;
  h += ["Pzt", "Sal", "Çar", "Per", "Cum", "Cmt", "Paz"].map((w, i) => `<div class="wd ${i > 4 ? "we" : ""}">${w}</div>`).join("");
  for (let i = 0; i < lead; i++) h += "<div></div>";
  for (let d = 1; d <= dim; d++) {
    h += dayBtn(`${ym}-${String(d).padStart(2, "0")}`, today, set);
  }
  h += `</div><div class="cal-f"><span><i></i>Özet var</span><span><b class="lg">2</b>Bankacılık maddesi</span><span>Diğer günler: resmi site</span></div>`;
  $("cal").innerHTML = h;
  { const r = new Date((selDate || today) + "T12:00:00"); r.setDate(r.getDate() - ((r.getDay() + 6) % 7)); renderHaftaBnk(r); }
  bnkYukle([...Array(dim)].map((_, i) => `${ym}-${String(i + 1).padStart(2, "0")}`));
  $("calTog").onclick = () => { calCompact = true; calUser = false; renderCal(); };
  $("cprev").onclick = () => { calM--; if (calM < 0) { calM = 11; calY--; } renderCal(); };
  $("cnext").onclick = () => { calM++; if (calM > 11) { calM = 0; calY++; } renderCal(); };
}

function setCal(date) { selDate = date; weekRef = null; calY = +date.slice(0, 4); calM = +date.slice(5, 7) - 1; renderCal(); }

function showMissing(date) {
  setCal(date);
  const [y, m, d] = date.split("-");
  const resmi = `https://www.resmigazete.gov.tr/eskiler/${y}/${m}/${y}${m}${d}.htm`;
  $("content").innerHTML = `<div class="hero"><div class="date">${esc(fmtDate(date))}</div>
    <p style="color:var(--muted);margin-top:6px">Bu gün için hazırlanmış bir özet yok. Özetler ${esc(fmtDate(dates[dates.length - 1]))} tarihinden itibaren tutuluyor.</p>
    <p style="margin-top:12px"><a href="${resmi}" target="_blank" rel="noopener" style="color:var(--accent)">Resmi Gazete'nin bu günkü sayısını aç ›</a></p></div>`;
  $("prev").disabled = true; $("next").disabled = true;
}

async function show(date) {
  setCal(date);
  $("pick").value = date;
  const i = dates.indexOf(date);
  $("prev").disabled = i >= dates.length - 1;
  $("next").disabled = i <= 0;
  $("content").innerHTML = '<div class="empty">Yükleniyor…</div>';
  try {
    const g = await getJSON(`gazete/${date}.json`);
    const [y, m, d] = date.split("-");
    const resmi = `https://www.resmigazete.gov.tr/eskiler/${y}/${m}/${y}${m}${d}.htm`;
    // Özeti cümlelere böl: ilk cümle öne çıkar, diğerleri madde madde
    const cum = String(g.ozet || "").replace(/([.!?])\s+(?=[A-ZÇĞİÖŞÜ"“'0-9])/g, "$1\n").split("\n").map((s) => s.trim()).filter(Boolean);
    const sakin = /yer almad|bulunmuyor|yayımlanmad/i;
    const sum = cum.length ? `<div class="sum"><span class="lbl">📌 Günün özeti</span>
        <p class="lead">${esc(cum[0])}</p>
        ${cum.length > 1 ? `<ul>${cum.slice(1).map((s) => `<li${sakin.test(s) ? ' class="mute"' : ""}>${esc(s)}</li>`).join("")}</ul>` : ""}</div>` : "";
    let html = `
      <div class="hero">
        <div class="top"><div class="date">${esc(fmtDate(date))}</div>${g.sayi ? `<span class="no">Sayı ${esc(g.sayi)}</span>` : ""}</div>
        ${sum}
        ${g.guncelleme ? `<div class="meta" style="margin:10px 0 0">🕐 Bu özet en son ${esc(fmtTime(g.guncelleme))} güncellendi</div>` : ""}
      </div>`;
    // Başlık bağlantısı: maddenin kendi Resmi Gazete adresi varsa o, yoksa günün fihristi
    const lk = (it, txt) => { const u = it.url && /^https:\/\/www\.resmigazete\.gov\.tr\//.test(it.url) ? it.url : resmi; return `<a class="rg" href="${esc(u)}" target="_blank" rel="noopener" title="${it.url ? "Resmi metni aç" : "Günün Resmi Gazete fihristini aç"}">${txt}<i>${it.url ? "↗" : "📜"}</i></a>`; };
    // Öncelik bankacılık: önce bankacılığı ilgilendirenler, sonra atamalar
    const bnk = g.bankacilik || [];
    if (bnk.length) {
      html += `<div class="sec bnk"><h2>🏦 Bankacılığı ilgilendirenler</h2>` + bnk.map((it) => `<div class="item"><b>${lk(it, esc(it.baslik))}</b>${it.aciklama ? `<span>${esc(it.aciklama)}</span>` : ""}</div>`).join("") + `</div>`;
    }
    const atm = g.onemli_atamalar || [];
    if (atm.length) {
      html += `<div class="sec imp"><h2>🏛️ Önemli atamalar</h2>` + atm.map((a) => `<div class="item"><span class="kurum">${esc(a.kurum)}</span><b>${lk(a, esc(a.kisi))}</b><span>${esc(a.gorev)}${a.aciklama ? " · " + esc(a.aciklama) : ""}</span></div>`).join("") + `</div>`;
    }
    for (const b of g.bolumler || []) {
      html += `<div class="sec"><h2>${esc(b.baslik)}</h2>`;
      for (const it of b.maddeler || []) {
        const det = (it.detaylar || []).map((d) => `<li>${esc(d)}</li>`).join("");
        html += `<div class="item"><b>${lk(it, esc(it.baslik))}</b>${it.aciklama ? `<span>${esc(it.aciklama)}</span>` : ""}${det ? `<ul class="det">${det}</ul>` : ""}${it.yururluk ? `<div class="yur">📅 Yürürlük: ${esc(it.yururluk)}</div>` : ""}${it.kimi ? `<div class="yur">👥 Kimi ilgilendirir: ${esc(it.kimi)}</div>` : ""}</div>`;
      }
      html += `</div>`;
    }
    const src = (g.kaynaklar || []).map((k) => `<li><a href="${esc(k.url)}" target="_blank" rel="noopener">${esc(k.ad)}</a></li>`).join("");
    html += `<div class="sec links"><h2>Kaynaklar</h2><ul style="padding-left:18px;margin:6px 0 10px">
      <li><a href="${resmi}" target="_blank" rel="noopener">Resmi Gazete'nin bu günkü sayısı</a></li>${src}</ul>
      <div style="margin-bottom:10px">Bu sayfa haber kaynaklarından hazırlanan bir özettir; resmi metin için Resmi Gazete'ye bakın.</div></div>`;
    $("content").innerHTML = html;
  } catch (e) {
    if (/HTTP 404/.test(e && e.message)) $("content").innerHTML = '<div class="empty">Bu günün özeti bulunamadı.</div>';
    else Ortak.hata("content", { ne: "Resmi Gazete özeti", tekrar: () => show(date) });
  }
}

async function init() {
  try {
    dates = (await getJSON("gazete/index.json")).sort().reverse();
  } catch (e) {
    Ortak.hata("content", { ne: "Resmi Gazete özetleri", tekrar: init });
    return;
  }
  $("pick").innerHTML = dates.map((d) => `<option value="${d}">${fmtDate(d)}</option>`).join("");
  $("pick").onchange = () => show($("pick").value);
  $("prev").onclick = () => show(dates[dates.indexOf($("pick").value) + 1]);
  $("next").onclick = () => show(dates[dates.indexOf($("pick").value) - 1]);
  $("cal").onclick = (e) => {
    const b = e.target.closest(".day"); if (!b || b.disabled) return;
    const d = b.dataset.d;
    if (dates.includes(d)) show(d); else showMissing(d);
    history.replaceState(null, "", "#" + d);
  };
  // Aşağı kaydırınca takvim tek haftaya iner, en üste dönünce ay görünümü geri gelir
  window.addEventListener("scroll", () => {
    if (!calCompact && window.scrollY > 80) { calCompact = true; renderCal(); }

  }, { passive: true });
  renderStatus();
  const want = location.hash.slice(1);
  show(dates.includes(want) ? want : dates[0]);
}
init();
</script>
<script data-goatcounter="https://sadolayn.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
