<style>
  :root {
    --bg: #000000;
    --card: #0d0d0d;
    --field: #161616;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --line: #262626;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; font-feature-settings: "cv11" 1;
    padding: 12px 16px 32px;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  .bar { display: flex; gap: 8px; margin-bottom: 14px; }
  .bar button {
    flex: none; width: 46px; border-radius: 12px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 20px; cursor: pointer;
  }
  .bar button:disabled { opacity: .3; }
  select {
    flex: 1; padding: 12px; font-size: 16px; border-radius: 12px;
    background: var(--field); color: var(--ink); border: 1px solid var(--line);
    -webkit-appearance: none; appearance: none; text-align: center;
  }
  .hero { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .hero .date { font-size: 22px; font-weight: 700; }
  .hero .meta { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .hero p { margin: 0; font-size: 15px; }
  /* Günün özeti: belirgin, okunması kolay panel */
  .hero { background: linear-gradient(160deg, rgba(224,162,79,.16), rgba(224,162,79,.02) 55%), var(--card); border-color: #5a4320; box-shadow: 0 6px 22px rgba(224,162,79,.08); }
  .hero .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .hero .no { flex: none; font-size: 12px; font-weight: 700; color: var(--accent); border: 1px solid #5a4320; border-radius: 99px; padding: 3px 10px; margin-top: 4px; }
  .sum { margin-top: 12px; }
  .sum .lbl { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: #000; background: var(--accent); border-radius: 99px; padding: 3px 10px; }
  .sum .lead { margin: 10px 0 0; font-size: 14.5px; line-height: 1.6; font-weight: 600; color: #fff; padding-left: 11px; border-left: 3px solid var(--accent); letter-spacing: -.1px; }
  .sum ul { list-style: none; margin: 12px 0 0; padding: 0; }
  .sum li { position: relative; padding: 8px 0 8px 18px; border-top: 1px solid rgba(224,162,79,.14); font-size: 13.5px; line-height: 1.6; color: #d4d4d4; }
  .sum li::before { content: ""; position: absolute; left: 3px; top: 16px; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .sum li.mute { color: var(--muted); font-size: 12.5px; }
  .sum li.mute::before { background: #444; }
  .sec { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 6px 16px; margin-bottom: 12px; }
  .sec h2 { margin: 10px 0 4px; font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--accent); }
  .status { display: flex; flex-wrap: wrap; gap: 2px 12px; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; margin-bottom: 8px; }
  .status b { color: var(--ink); font-weight: 600; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: #3fc283; display: inline-block; margin-right: 4px; }
  .status .dot.old { background: #e8b52b; }
  .warnbox { background: rgba(232,181,43,.1); border: 1px solid rgba(232,181,43,.45); color: #f1d27a; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin-bottom: 12px; }
  .warnbox a { color: var(--accent); }
  .sec.imp { border-color: rgba(224,162,79,.6); background: linear-gradient(180deg, rgba(224,162,79,.10), var(--card) 60%); }
  .sec.bnk { border-color: rgba(90,169,240,.5); background: linear-gradient(180deg, rgba(90,169,240,.08), var(--card) 60%); }
  .sec.bnk h2 { color: #5aa9f0; }
  .kurum { display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: rgba(224,162,79,.18); color: var(--accent); margin-bottom: 4px; }
  .item { padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: none; }
  .item b { display: block; font-size: 14px; font-weight: 600; line-height: 1.45; }
  .item a.rg { color: inherit; text-decoration: none; }
  .item a.rg:hover, .item a.rg:active { color: var(--accent); text-decoration: underline; }
  .item a.rg i { font-style: normal; font-size: 11px; margin-left: 5px; opacity: .7; }
  .item ul.det { margin: 6px 0 0; padding-left: 18px; color: #cfcfcf; font-size: 14px; }
  .item ul.det li { margin: 3px 0; }
  .item .yur { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .item span { display: block; color: #a8a8a8; font-size: 13.5px; line-height: 1.5; margin-top: 3px; }
  .links { font-size: 13px; color: var(--muted); }
  .links a { color: var(--accent); }
  .links li { margin-bottom: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .cal { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 8px 10px; margin: 0 auto 12px; max-width: 360px; }
  .cal-h { display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .cal-h b { font-size: 14px; }
  .cal-h button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: var(--field); color: var(--ink); font-size: 15px; cursor: pointer; }
  .cal-h button:disabled { opacity: .3; }
  .cal-g { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
  .cal-g .wd { font-size: 11px; color: #a3a3a3; padding: 0 0 2px; }
  .cal-g .wd.we { color: #8a8a8a; }
  .day { position: relative; height: 26px; border-radius: 7px; border: 1px solid transparent; background: none; color: #6a6a6a; font-size: 12px; font-family: inherit; cursor: pointer; padding: 0; }
  .day.has { color: var(--ink); background: var(--field); border-color: var(--line); font-weight: 600; }
  .day.has::after { content: ""; position: absolute; left: 50%; bottom: 2px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
  .day.today { border-color: #555; }
  .day.sel { background: var(--accent); color: #000; border-color: var(--accent); }
  .day.sel::after { background: #000; }
  .day.fut { opacity: .35; cursor: default; }
  .cal-f { display: flex; gap: 12px; justify-content: center; font-size: 11px; color: var(--muted); margin-top: 4px; }
  /* Bankacılığı ilgilendiren madde olan gün: sağ üstte küçük mavi sayı */
  .day.bnk::before { content: attr(data-n); position: absolute; top: -5px; right: -3px; min-width: 13px; height: 13px; padding: 0 3px; box-sizing: border-box; border-radius: 7px; background: #4a63ff; color: #fff; font-size: 9px; font-weight: 800; line-height: 13px; z-index: 1; }
  .cal-f .lg { display: inline-block; min-width: 12px; height: 12px; border-radius: 6px; background: #4a63ff; color: #fff; font-size: 8.5px; font-weight: 800; line-height: 12px; text-align: center; margin-right: 4px; vertical-align: middle; }
  /* Haftalık bankacılık uyarısı (takvimin altında) */
  .hbnk { border: 1px solid rgba(74,99,255,.45); background: linear-gradient(160deg, rgba(74,99,255,.16), rgba(74,99,255,.04)); border-radius: 14px; padding: 11px 12px; margin: 0 0 12px; }
  .hbnk .hh { font-size: 14px; color: #dfe4ff; }
  .hbnk .hh b { color: #fff; }
  .hbnk .hh small { display: block; font-size: 11.5px; color: #9aa3d6; margin-top: 2px; }
  .hbnk ul { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 5px; }
  .hbnk li button { display: flex; gap: 8px; width: 100%; text-align: left; padding: 7px 9px; border-radius: 10px; border: 1px solid rgba(74,99,255,.25); background: rgba(0,0,0,.35); color: var(--ink); font: inherit; font-size: 13px; line-height: 1.4; cursor: pointer; }
  .hbnk li em { flex: none; font-style: normal; font-size: 11px; font-weight: 800; color: #8fa0ff; min-width: 46px; padding-top: 1px; }
  .hbnk .hmore { margin-top: 7px; width: 100%; padding: 7px; border-radius: 10px; border: 1px dashed rgba(74,99,255,.45); background: none; color: #a9b5ff; font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  /* ===== İki bölüm: Günün Gazetesi | Kurum Duyuruları ===== */
  .sek { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: -4px 0 10px; }
  .sek button { position: relative; display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 6px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 13.5px; font-weight: 800; cursor: pointer; }
  .sek button small { font-size: 11px; font-weight: 600; color: var(--muted); text-align: center; line-height: 1.3; }
  .sek button.on { background: linear-gradient(160deg, #3a2a10, #1a1206); border-color: var(--accent); color: #fbe3b0; }
  .sek button.kr.on { background: linear-gradient(160deg, #10224a, #070f22); border-color: #5d8bff; color: #d6e2ff; }
  .sek button em { position: absolute; top: -7px; right: -5px; min-width: 20px; height: 20px; padding: 0 5px; border-radius: 10px; background: #d32f2f; color: #fff; font-style: normal; font-size: 11.5px; font-weight: 800; line-height: 20px; box-shadow: 0 0 0 2px #000; }
  body.kurumda .gz-only, body:not(.kurumda) .kr-only { display: none !important; }
  /* Son 24 saat şeridi: girer girmez ne çıktığı görülsün */
  .bugun { margin: 0 0 12px; padding: 10px 12px; border-radius: 14px; border: 1px solid #3b3214; background: linear-gradient(160deg, #1c160a, #0a0805); }
  .bugun .bh { font-size: 12px; font-weight: 800; letter-spacing: .5px; color: #f0c64a; text-transform: uppercase; margin-bottom: 6px; }
  .bugun .bl { display: flex; flex-wrap: wrap; gap: 6px; }
  .bugun button { display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 999px; border: 1px solid var(--line); background: #111; color: var(--ink); font: inherit; font-size: 12.5px; cursor: pointer; }
  .bugun button b { color: #fff; } .bugun button.onm { border-color: #d32f2f; background: rgba(211,47,47,.12); }
  .bugun .sakin { font-size: 12.5px; color: var(--muted); }
  /* Kurum duyuruları */
  .kh { background: var(--card); border: 1px solid #23365f; border-radius: 16px; padding: 14px; margin-bottom: 10px; }
  .kh b { font-size: 16px; } .kh p { margin: 4px 0 0; font-size: 13px; color: var(--muted); }
  .kf { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
  .kf button { padding: 6px 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .kf button i { font-style: normal; opacity: .7; margin-left: 4px; font-weight: 600; }
  .kf button.sifir:not(.on) { opacity: .5; }
  .sek button small.kad { font-size: 12.5px; font-weight: 700; line-height: 1.35; }
  /* Kurum takvimi: her gün o gün duyuru yapan kurumların renginde nokta */
  .kcal { max-width: none; margin: 0 0 10px; }
  .kcal .day { height: 34px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding-top: 3px; }
  .kcal .day.kv { color: var(--ink); background: var(--field); border-color: var(--line); font-weight: 700; }
  .kcal .day.sel { background: #1d2c55; border-color: #8fb0ff; color: #fff; }
  .kcal .day.onm { box-shadow: inset 0 -2px 0 #d32f2f; }
  .kcal .day .nk { display: flex; gap: 2px; margin-top: 3px; }
  .kcal .day .nk i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
  .kcal .cal-f { flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; }
  .kcal .cal-f i { background: var(--c); }
  .kgun { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 0 10px; padding: 8px 12px; border-radius: 12px; background: #13203f; border: 1px solid #2b4a8f; font-size: 13.5px; color: #d6e2ff; }
  .kcal .cal-f .kalt { display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: #d32f2f; margin-right: 5px; vertical-align: middle; }
  .kgun button { white-space: nowrap; flex: none; border: 0; background: none; color: #8fb0ff; font: inherit; font-weight: 800; cursor: pointer; padding: 4px; }
  .kf button.on { background: var(--kc, #5d8bff); border-color: var(--kc, #5d8bff); color: #000; }
  .kd { position: relative; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--kc, #5d8bff); border-radius: 14px; padding: 12px 12px 10px; margin-bottom: 10px; }
  .kd.onm { border-color: rgba(211,47,47,.55); border-left-color: var(--kc, #5d8bff); background: linear-gradient(160deg, #1a0d0d, #0d0d0d); }
  .kd .ku { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .kd .kr { padding: 1px 8px; border-radius: 6px; background: var(--kc, #5d8bff); color: #000; font-weight: 800; font-size: 11.5px; }
  .kd .on { padding: 1px 6px; border-radius: 6px; background: #d32f2f; color: #fff; font-weight: 800; font-size: 11px; letter-spacing: .5px; }
  .kd .yn { padding: 1px 6px; border-radius: 6px; background: #3fc283; color: #000; font-weight: 800; font-size: 11px; }
  .kd h3 { margin: 6px 0 4px; font-size: 15.5px; line-height: 1.35; }
  .kd p { margin: 0; font-size: 13.5px; color: #d6d6d6; }
  .kd .et { margin-top: 6px; padding: 6px 9px; border-radius: 9px; background: rgba(240,198,74,.08); border: 1px solid rgba(240,198,74,.25); font-size: 12.5px; color: #f3dca8; }
  .kd .kl { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 8px; font-size: 13px; }
  .kd .kl a { color: #8fb0ff; text-decoration: none; font-weight: 700; } .kd .kl a.gz { color: var(--accent); }
  .knot { font-size: 12px; color: var(--muted); text-align: center; margin: 6px 0 0; }
  .kteaser { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 10px; padding: 10px 12px; border-radius: 12px; border: 1px solid #2b4a8f; background: linear-gradient(160deg, #0f1d3d, #070d1c); color: #d6e2ff; font: inherit; font-size: 13px; text-align: left; cursor: pointer; }
  .kteaser b { color: #fff; } .kteaser span { flex: 1; } .kteaser em { font-style: normal; font-weight: 800; color: #8fb0ff; }
  .hbnk.bos { border-color: var(--line); background: none; padding: 8px 12px; }
  .hbnk.bos .hh { font-size: 12.5px; color: var(--muted); }
  .cal-f i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: middle; }
  .stick { position: sticky; top: 0; z-index: 30; background: #000; margin: 0 -16px 12px; padding: 10px 16px; border-bottom: 1px solid transparent; transition: border-color .2s, box-shadow .2s; }

<div class="wrap">
  <div class="stick">
  <header>
    <a href="index.html" style="display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:#161616;border:1px solid #e0a24f;font-size:22px;line-height:1;text-decoration:none" title="Ana sayfa" aria-label="Ana sayfa">🏠</a>

    <span style="width:52px"></span>
  </header>
  <div class="sek" id="sek"></div>
  <div class="status gz-only" id="status">Kontrol bilgisi yükleniyor…</div>

  </div>

  </div>

</div>

<script>
const $ = (x) => document.getElementById(x);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtDate = (d) => new Date(d + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric", weekday: "long" });
let dates = [];

const getJSON = (url) => Ortak.json(url);

const fmtTime = (iso) => { const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }); };
async function renderStatus() {
  let k = null; try { k = await getJSON("gazete/kontrol.json"); } catch (e) {}
  const today = todayIso(), have = dates.includes(today);
  const last = k && k.son_kontrol ? new Date(k.son_kontrol) : null;
  const ageH = last ? (Date.now() - last) / 36e5 : 99;
  $("status").innerHTML = `<span><span class="dot${ageH > 12 ? " old" : ""}"></span>Son kontrol: <b>${last ? esc(fmtTime(k.son_kontrol)) : "—"}</b></span>
    <span>Her sabah 07:00 civarı güncellenir</span>`;
  if (!have) {
    const h = new Date().getHours();
    $("haftaBnk").insertAdjacentHTML("beforebegin", `<div class="warnbox" id="nowarn">📭 Bugünün (${esc(fmtDate(today))}) özeti henüz eklenmedi${h < 8 ? " — her sabah 07:00 civarı eklenir" : "; bir sonraki kontrolde eklenecek"}. Şimdilik <a href="https://www.resmigazete.gov.tr/" target="_blank" rel="noopener">Resmi Gazete'nin sitesine</a> bakabilirsin.</div>`);
  }
}
const AYLAR = ["Ocak", "Şubat", "Mart", "Nisan", "Mayıs", "Haziran", "Temmuz", "Ağustos", "Eylül", "Ekim", "Kasım", "Aralık"];
let calY, calM, selDate = null;
const todayIso = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };

let calCompact = true, calUser = false, weekRef = null;
// Gün gün "bankacılığı ilgilendirenler" (16 Ekim 2026'dan önceki özetlerde bu bölüm yok → işaretsiz)
const BNK = {}, bnkYolda = new Set(); let bnkHepsi = false;
async function bnkYukle(isos) {
  const eksik = isos.filter((d) => dates.includes(d) && !(d in BNK) && !bnkYolda.has(d));
  if (!eksik.length) return;
  eksik.forEach((d) => bnkYolda.add(d));

    const bnk = g.bankacilik || [];
    if (bnk.length) {
      html += `<div class="sec bnk"><h2>🏦 Bankacılığı ilgilendirenler</h2>` + bnk.map((it) => `<div class="item"><b>${lk(it, esc(it.baslik))}</b>${it.aciklama ? `<span>${esc(it.aciklama)}</span>` : ""}</div>`).join("") + `</div>`;
    }
    const atm = g.onemli_atamalar || [];
    if (atm.length) {
      html += `<div class="sec imp"><h2>🏛️ Önemli atamalar</h2>` + atm.map((a) => `<div class="item"><span class="kurum">${esc(a.kurum)}</span><b>${lk(a, esc(a.kisi))}</b><span>${esc(a.gorev)}${a.aciklama ? " · " + esc(a.aciklama) : ""}</span></div>`).join("") + `</div>`;
    }
    for (const b of g.bolumler || []) {
      html += `<div class="sec"><h2>${esc(b.baslik)}</h2>`;
      for (const it of b.maddeler || []) {
        const det = (it.detaylar || []).map((d) => `<li>${esc(d)}</li>`).join("");
        html += `<div class="item"><b>${lk(it, esc(it.baslik))}</b>${it.aciklama ? `<span>${esc(it.aciklama)}</span>` : ""}${det ? `<ul class="det">${det}</ul>` : ""}${it.yururluk ? `<div class="yur">📅 Yürürlük: ${esc(it.yururluk)}</div>` : ""}${it.kimi ? `<div class="yur">👥 Kimi ilgilendirir: ${esc(it.kimi)}</div>` : ""}</div>`;
      }
      html += `</div>`;
    }
    const src = (g.kaynaklar || []).map((k) => `<li><a href="${esc(k.url)}" target="_blank" rel="noopener">${esc(k.ad)}</a></li>`).join("");
    html += `<div class="sec links"><h2>Kaynaklar</h2><ul style="padding-left:18px;margin:6px 0 10px">
      ${g.yayimlanmadi ? "" : `<li><a href="${resmi}" target="_blank" rel="noopener">Resmi Gazete'nin o günkü sayısı</a></li>`}${src}</ul>
      <div style="margin-bottom:10px">Bu sayfa haber kaynaklarından hazırlanan bir özettir; resmi metin için Resmi Gazete'ye bakın.</div></div>`;
    $("content").innerHTML = html;
  } catch (e) {
    if (/HTTP 404/.test(e && e.message)) $("content").innerHTML = '<div class="empty">Bu günün özeti bulunamadı.</div>';
    else Ortak.hata("content", { ne: "Resmi Gazete özeti", tekrar: () => show(date) });
  }
}

async function init() {
  try {
    dates = (await getJSON("gazete/index.json")).sort().reverse();
  } catch (e) {
    Ortak.hata("content", { ne: "Resmi Gazete özetleri", tekrar: init });
    return;
  }
  $("pick").innerHTML = dates.map((d) => `<option value="${d}">${fmtDate(d)}</option>`).join("");
  $("pick").onchange = () => show($("pick").value);
  $("prev").onclick = () => show(dates[dates.indexOf($("pick").value) + 1]);
  $("next").onclick = () => show(dates[dates.indexOf($("pick").value) - 1]);
  $("cal").onclick = (e) => {
    const b = e.target.closest(".day"); if (!b || b.disabled) return;
    const d = b.dataset.d;
    if (dates.includes(d)) show(d); else showMissing(d);
    history.replaceState(null, "", "#" + d);
  };
  // Aşağı kaydırınca takvim tek haftaya iner, en üste dönünce ay görünümü geri gelir
  window.addEventListener("scroll", () => {
    if (!calCompact && window.scrollY > 80) { calCompact = true; renderCal(); }

  }, { passive: true });
  try { const j = await getJSON("gazete/duyurular.json"); DUY = (j.duyurular || []).filter((x) => x && x.tarih && x.baslik).sort((a, b) => b.tarih.localeCompare(a.tarih)); DUYUPD = j.guncelleme || null; } catch (e) { DUY = []; }
  // Ana sayfadaki kayan yazıdan (?yakinda) ya da ?kurum / #kurum ile gelince Kurum Duyuruları açılır
  sekAc(/yakinda|kurum/.test(location.search) || location.hash === "#kurum" ? "kurum" : "gazete");
  renderStatus();
  const want = location.hash.slice(1);
  show(dates.includes(want) ? want : dates[0]);
}
init();
</script>
