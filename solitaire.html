<style>
  :root {
    --bg: #000000;
    --felt: #0b2a1c;
    --felt-line: #164a33;
    --card: #0d0d0d;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --red: #d63a2c;
    --line: #262626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 520px; margin: 0 auto; padding: 10px 8px 24px; user-select: none; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  .stats { display: flex; justify-content: center; gap: 16px; font-size: 13px; color: var(--muted); margin: 8px 0; }
  .stats b { color: var(--ink); }
  .bar { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
  .bar button { padding: 9px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 14px; font-weight: 600; cursor: pointer; }
  .bar button.pri { background: var(--accent); border-color: var(--accent); color: #000; }
  .bar button:disabled { opacity: .35; }
  .board {
    position: relative; border-radius: 16px; padding: 8px;
    background: linear-gradient(135deg, #2a3fe0 0%, #1a2bb8 55%, #13208f 100%);
    border: 1px solid #3a50f0; min-height: 70vh; overflow: hidden;
  }
  /* Arka planda SADOLAYN gölgesi */
  .board::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 0;
    background: url("img/logo.png") center calc(100% - 18px) / 82% auto no-repeat;
    opacity: .2; filter: grayscale(1) brightness(2.4);
  }
  .slot { position: absolute; z-index: 0; border: 1.5px dashed rgba(255,255,255,.28); border-radius: 7px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.25); font-size: 22px; }
  .card {
    position: absolute; border-radius: 7px; background: #f7f4ee; color: #111; border: 1px solid #b9b2a5;
    box-shadow: 0 1px 3px rgba(0,0,0,.45); font-weight: 800;
    transition: left .18s ease, top .18s ease, transform .15s;
  }
  .card.red { color: var(--red); }
  .card .r { position: absolute; top: 2px; left: 3px; line-height: 1; letter-spacing: -1px; }
  .card .s1 { position: absolute; top: 2px; right: 2px; line-height: 1; }
  .card .s2 { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; line-height: 1; }
  .card.back {
    background: repeating-linear-gradient(45deg, #c48a35 0 5px, #a8742a 5px 10px);
    border-color: #f7f4ee; box-shadow: inset 0 0 0 2px rgba(0,0,0,.18), 0 1px 3px rgba(0,0,0,.45);
  }
  .card.back > * { display: none; }
  .card.hint { box-shadow: 0 0 0 3px var(--accent); }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
  .overlay.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 26px 22px; width: 100%; max-width: 360px; text-align: center; }
  .modal .moon { font-size: 56px; margin-bottom: 6px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px); } }
  .modal h2 { margin: 0 0 8px; font-size: 22px; font-family: Georgia, "Times New Roman", serif; font-style: italic; color: var(--accent); }
  .modal p { margin: 0 0 18px; color: #bbb; font-size: 15px; line-height: 1.5; }
  .btn { width: 100%; padding: 13px; border-radius: 12px; background: var(--accent); border: none; color: #000; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); margin-top: 8px; }
  .confetti { position: fixed; top: -40px; font-size: 22px; pointer-events: none; z-index: 1001; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  .card.target, .slot.target { box-shadow: 0 0 0 3px #3fc283, 0 0 18px rgba(63,194,131,.7) !important; }
  .card.ghost { pointer-events: none; box-shadow: 0 0 0 3px var(--accent), 0 10px 24px rgba(0,0,0,.6); transition: none; }
  .solToast { position: fixed; left: 50%; bottom: max(18px, env(safe-area-inset-bottom)); transform: translate(-50%, 20px); max-width: 92vw; padding: 11px 16px; border-radius: 14px; background: rgba(20,18,14,.96); border: 1px solid #6b5222; color: #f3dca8; font-size: 14.5px; line-height: 1.4; text-align: center; box-shadow: 0 10px 28px rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 1500; }
  .solToast.show { opacity: 1; transform: translate(-50%, 0); }
  .solToast b { color: #fff; } .solToast small { color: #b8a27a; }

<body>
<header>
  <a href="oyunlar.html" style="display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:#161616;border:1px solid #e0a24f;font-size:22px;line-height:1;text-decoration:none" title="Oyunlar" aria-label="Oyunlar">🎮</a>
  <h1>🃏 Solitaire</h1>
  <span style="width:52px"></span>
</header>
<div class="stats"><span>Hamle <b id="moves">0</b></span><span>Süre <b id="time">0:00</b></span><span>Kazanılan <b id="wins">0</b></span></div>
<div class="bar">
  <button id="undo">↶ Geri al</button>
  <button id="hint">💡 İpucu</button>
  <button id="auto" class="pri" style="display:none">⚡ Otomatik bitir</button>
  <button id="newg">Yeni oyun</button>
</div>
<div class="board" id="board"></div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<script>
const SUITS = ["♠", "♥", "♣", "♦"];
const RANK = { 1: "A", 11: "J", 12: "Q", 13: "K" };
const isRed = (s) => s === "♥" || s === "♦";
const $ = (x) => document.getElementById(x);

let S; // durum
let history = [];
let els = new Map();
let timer = null, started = 0, elapsed = 0;
let wins = 0;
try { wins = Number(localStorage.getItem("solWins")) || 0; } catch (e) {}

function deal() {
  const deck = [];
  for (const s of SUITS) for (let r = 1; r <= 13; r++) deck.push({ id: s + r, s, r, up: false });
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  const tab = [];
  for (let i = 0; i < 7; i++) {
    tab.push(deck.splice(0, i + 1));
    tab[i][i].up = true;
  }
  S = { stock: deck, waste: [], found: [[], [], [], []], tab, moves: 0 };
  history = [];
  elapsed = 0; started = 0;
  clearInterval(timer); timer = null;
  $("board").innerHTML = ""; els = new Map();
  if (window.CardSfx) CardSfx.shuffle();
  updateStats();
  render();
}
const snapshot = () => JSON.stringify(S);
function pushHistory() { history.push(snapshot()); if (history.length > 200) history.shift(); }
function startTimer() {
  if (timer) return;
  started = Date.now() - elapsed * 1000;
  timer = setInterval(() => { elapsed = Math.floor((Date.now() - started) / 1000); updateStats(); }, 1000);
}
function updateStats() {
  $("moves").textContent = S ? S.moves : 0;
  $("time").textContent = `${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, "0")}`;
  $("wins").textContent = wins;
  $("undo").disabled = !history.length;
}

// ---------- Kurallar ----------
const lastOf = (arr) => arr[arr.length - 1];
function canFound(c, fi) {
  const f = S.found[fi];
  if (!f.length) return c.r === 1 && SUITS[fi] === c.s;
  const t = lastOf(f);
  return t.s === c.s && c.r === t.r + 1;
}
function foundIndexFor(c) { const fi = SUITS.indexOf(c.s); return canFound(c, fi) ? fi : -1; }
function canTab(c, ti) {
  const col = S.tab[ti];
  if (!col.length) return c.r === 13;
  const t = lastOf(col);
  return t.up && isRed(t.s) !== isRed(c.s) && t.r === c.r + 1;
}

// Kartın nerede olduğu
function locate(id) {
  if (S.waste.length && lastOf(S.waste).id === id) return { from: "waste" };
  for (let i = 0; i < 4; i++) if (S.found[i].length && lastOf(S.found[i]).id === id) return { from: "found", i };
  for (let i = 0; i < 7; i++) { const k = S.tab[i].findIndex((c) => c.id === id); if (k >= 0) return { from: "tab", i, k }; }
  return null;
}
function takeFrom(loc) {
  if (loc.from === "waste") return [S.waste.pop()];
  if (loc.from === "found") return [S.found[loc.i].pop()];
  return S.tab[loc.i].splice(loc.k);
}
function flipTops() { for (const col of S.tab) if (col.length && !lastOf(col).up) { lastOf(col).up = true; } }

// En iyi hedefi bul
function bestMove(id) {
  const loc = locate(id);
  if (!loc) return null;
  if (loc.from === "tab" && !S.tab[loc.i][loc.k].up) return null;
  const card = loc.from === "tab" ? S.tab[loc.i][loc.k] : loc.from === "waste" ? lastOf(S.waste) : lastOf(S.found[loc.i]);
  const single = loc.from !== "tab" || loc.k === S.tab[loc.i].length - 1;
  if (single && loc.from !== "found") {
    const fi = foundIndexFor(card);
    if (fi >= 0) return { loc, to: "found", i: fi };
  }
  let empty = -1;
  for (let ti = 0; ti < 7; ti++) {
    if (loc.from === "tab" && ti === loc.i) continue;
    if (!canTab(card, ti)) continue;
    if (S.tab[ti].length) return { loc, to: "tab", i: ti };
    if (empty < 0) empty = ti;
  }
  // Boş sütuna papaz: zaten sütunun en altındaysa anlamsız
  if (empty >= 0 && !(loc.from === "tab" && loc.k === 0)) return { loc, to: "tab", i: empty };
  return null;
}
function doMove(m) {
  if (window.CardSfx && !window.__silent) CardSfx.play();
  pushHistory();
  const cards = takeFrom(m.loc);
  if (m.to === "found") S.found[m.i].push(...cards); else S.tab[m.i].push(...cards);
  flipTops();
  S.moves++;
  startTimer();
}
function drawStock() {
  pushHistory();
  if (!S.stock.length) {
    if (!S.waste.length) { history.pop(); return; }
    S.stock = S.waste.reverse().map((c) => ({ ...c, up: false }));
    S.waste = [];
    if (window.CardSfx) CardSfx.collect();
  } else {
    for (let i = 0; i < 3 && S.stock.length; i++) { const c = S.stock.pop(); c.up = true; S.waste.push(c); }
    if (window.CardSfx) CardSfx.flip();
  }
  S.moves++;
  startTimer();
  render();
  checkStuck();
}

// ---------- Etkileşim ----------
function onCardTap(id, el) {
  const loc = locate(id);
  if (!loc) { shake(el); return; }
  const m = bestMove(id);
  if (!m) { shake(el); return; }
  doMove(m);
  render();
  checkWin();
  checkStuck();
}
function shake(el) { el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); }
function undo() {
  if (!history.length) return;
  S = JSON.parse(history.pop());
  render();
}
function allMoves() {
  const out = [];
  const ids = [];
  if (S.waste.length) ids.push(lastOf(S.waste).id);
  for (const col of S.tab) col.forEach((c) => c.up && ids.push(c.id));
  for (const id of ids) {
    const m = bestMove(id);
    if (!m) continue;
    // Anlamsız tablo hareketlerini ele (aynı türden başka karta taşıma, alttaki kart zaten açık)
    if (m.loc.from === "tab" && m.to === "tab" && m.loc.k > 0 && S.tab[m.loc.i][m.loc.k - 1].up) continue;
    out.push({ id, m });
  }
  return out;
}
// ---------- Akıllı ipucu ve çıkmaz tespiti ----------
const cName = (c) => (RANK[c.r] || c.r) + c.s;
function cardTarget(card) {
  const fi = foundIndexFor(card); if (fi >= 0) return { to: "found", i: fi };
  for (let ti = 0; ti < 7; ti++) if (canTab(card, ti) && (S.tab[ti].length || card.r === 13)) return { to: "tab", i: ti };
  return null;
}
// Hiç hamle yapmadan desteyi çevirmeye devam edilirse hangi kartlar en üste gelir (3'lü açılış)
function stockReach() {
  let st = S.stock.slice(), wa = S.waste.slice();
  const total = st.length + wa.length, seen = new Map();
  if (!total) return [];
  const limit = Math.ceil(total / 3) * 2 + 4;
  for (let n = 1; n <= limit; n++) {
    if (!st.length) { st = wa.slice().reverse(); wa = []; }
    else for (let i = 0; i < 3 && st.length; i++) wa.push(st.pop());
    if (wa.length) { const t = wa[wa.length - 1]; if (!seen.has(t.id)) seen.set(t.id, { c: t, n }); }
  }
  return [...seen.values()];
}
function rankMoves() {
  const score = ({ m }) => (m.to === "found" ? 4 : 0) + (m.loc.from === "tab" && m.loc.k > 0 && !S.tab[m.loc.i][m.loc.k - 1].up ? 3 : 0) + (m.loc.from === "waste" ? 1 : 0);
  return allMoves().sort((a, b) => score(b) - score(a));
}
function targetEl(t) {
  if (t.to === "found") return els.get("__f" + t.i);
  const col = S.tab[t.i]; return col.length ? els.get(lastOf(col).id) : els.get("__t" + t.i);
}
function toast(txt) {
  let el = $("solToast"); if (!el) { el = document.createElement("div"); el.id = "solToast"; el.className = "solToast"; document.body.appendChild(el); }
  el.innerHTML = txt; el.classList.remove("show"); void el.offsetWidth; el.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove("show"), 3200);
}
// Kaynaktan hedefe uçan hayalet kart
function ghostFly(srcEl, dstEl, isTab) {
  if (!srcEl || !dstEl) return;
  const a = srcEl.getBoundingClientRect(), b = dstEl.getBoundingClientRect();
  const g = srcEl.cloneNode(true); g.className = srcEl.className + " ghost"; g.onclick = null;
  Object.assign(g.style, { position: "fixed", left: a.left + "px", top: a.top + "px", width: a.width + "px", height: a.height + "px", zIndex: 2000, margin: 0 });
  document.body.appendChild(g);
  dstEl.classList.add("target"); srcEl.classList.add("hint");
  const dy = isTab && dstEl.classList.contains("card") ? b.height * 0.36 : 0;
  const run = () => g.animate([{ transform: "translate(0,0) scale(1)", opacity: .95 }, { transform: `translate(${b.left - a.left}px,${b.top - a.top + dy}px) scale(1.04)`, opacity: .9, offset: .7 }, { transform: `translate(${b.left - a.left}px,${b.top - a.top + dy}px) scale(1)`, opacity: 0 }], { duration: 950, easing: "cubic-bezier(.4,.1,.3,1)" });
  const an = run(); an.onfinish = () => { const a2 = run(); a2.onfinish = () => { g.remove(); dstEl.classList.remove("target"); srcEl.classList.remove("hint"); }; };
}
function hint() {
  const mv = rankMoves();
  if (mv.length) {
    const { id, m } = mv[0], card = m.loc.from === "waste" ? lastOf(S.waste) : S.tab[m.loc.i][m.loc.k];
    const dst = targetEl(m), hedef = m.to === "found" ? "bitiş yığınına" : S.tab[m.i].length ? cName(lastOf(S.tab[m.i])) + " kartının üstüne" : "boş sütuna";
    ghostFly(els.get(id), dst, m.to === "tab");
    toast(`💡 <b>${cName(card)}</b> → ${hedef}${m.loc.from === "tab" && m.loc.k < S.tab[m.loc.i].length - 1 ? ` <small>(altındaki kartlarla birlikte)</small>` : ""}`);
    return;
  }
  const r = stockReach().map((x) => ({ ...x, t: cardTarget(x.c) })).filter((x) => x.t).sort((a, b) => a.n - b.n)[0];
  if (r) {
    flash(els.get("__stock")); const st = els.get("__stock"); st.classList.add("target"); setTimeout(() => st.classList.remove("target"), 1800);
    const hedef = r.t.to === "found" ? "bitiş yığınına" : S.tab[r.t.i].length ? cName(lastOf(S.tab[r.t.i])) + " kartının üstüne" : "boş sütuna";
    toast(`🂠 Desteyi <b>${r.n} kez</b> aç: <b>${cName(r.c)}</b> gelecek → ${hedef}`);
    return;
  }
  stuckModal(true);
}
// Destedeki kartlar dahil hiçbir kart oynanamıyorsa oyunu sonlandırmayı öner
function isStuck() {
  if (isWon() || canAutoFinish()) return false;
  if (rankMoves().length) return false;
  return !stockReach().some((x) => cardTarget(x.c));
}
function stuckModal(force) {
  if (!force && !isStuck()) return;
  clearInterval(timer); timer = null;
  const t = $("solToast"); t && t.classList.remove("show");
  document.querySelectorAll(".card.ghost").forEach((g) => g.remove());
  const kalan = 52 - S.found.reduce((a, f) => a + f.length, 0);
  window.Rapor && Rapor.oyun("solitaire", false, `Tıkandı · ${52 - kalan}/52 kart bitişte · ${S.moves} hamle`);
  $("modal").innerHTML = `<div class="moon">🧩</div><h2>Hamle kalmadı</h2>
    <p>Destedeki kartlar da dahil oynanabilecek bir kart yok; desteyi boşuna çevirmene gerek yok.${kalan < 52 ? `<br><b style="color:var(--accent)">${52 - kalan}</b> kartı bitişe taşıdın 👏` : ""}</p>
    <button class="btn" id="stNew">Yeni oyun</button>
    <button class="btn ghost" id="stUndo">↶ Birkaç hamle geri al</button>
    <button class="btn ghost" id="stLook">Masaya bakayım</button>`;
  $("overlay").classList.add("show");
  $("stNew").onclick = () => { $("overlay").classList.remove("show"); wishScreen(); };
  $("stUndo").onclick = () => { $("overlay").classList.remove("show"); for (let i = 0; i < 3; i++) undo(); };
  $("stLook").onclick = () => $("overlay").classList.remove("show");
}
let stuckT = null;
function checkStuck() { clearTimeout(stuckT); stuckT = setTimeout(() => { if (isStuck()) stuckModal(false); }, 450); }
function flash(el) { if (!el) return; el.classList.add("hint"); setTimeout(() => el.classList.remove("hint"), 900); }
function canAutoFinish() {
  return !S.stock.length && !S.waste.length && S.tab.every((col) => col.every((c) => c.up)) && !isWon();
}
async function autoFinish() {
  $("auto").disabled = true;
  while (!isWon()) {
    let moved = false;
    for (let ti = 0; ti < 7 && !moved; ti++) {
      const col = S.tab[ti];
      if (!col.length) continue;
      const fi = foundIndexFor(lastOf(col));
      if (fi >= 0) { doMove({ loc: { from: "tab", i: ti, k: col.length - 1 }, to: "found", i: fi }); moved = true; }
    }
    if (!moved) break;
    render();
    await new Promise((r) => setTimeout(r, 70));
  }
  $("auto").disabled = false;
  checkWin();
}
const isWon = () => S.found.every((f) => f.length === 13);
function checkWin() {
  if (!isWon()) return;
  clearInterval(timer); timer = null;
  wins++;
  window.Rapor && Rapor.oyun("solitaire", true);
  try { localStorage.setItem("solWins", wins); } catch (e) {}
  updateStats();
  confetti();
  setTimeout(() => {
    $("modal").innerHTML = `
      <div class="moon">✨</div>
      <h2>Dileğin kabul olsun!</h2>
      <p>Oyunu <b>${S.moves}</b> hamlede, <b>${Math.floor(elapsed / 60)}:${String(elapsed % 60).padStart(2, "0")}</b> sürede bitirdin.</p>
      <button class="btn" id="again">Yeni dilek, yeni oyun</button>`;
    $("overlay").classList.add("show");
    $("again").onclick = () => { $("overlay").classList.remove("show"); wishScreen(); };
  }, 900);
}
function confetti() {
  const em = ["✨", "⭐", "🌙", "💫", "🎉", "♥", "♠"];
  for (let i = 0; i < 40; i++) {
    const d = document.createElement("div");
    d.className = "confetti";
    d.textContent = em[i % em.length];
    d.style.left = Math.random() * 100 + "vw";
    d.style.animationDuration = 2 + Math.random() * 2 + "s";
    d.style.animationDelay = Math.random() * 0.8 + "s";
    document.body.appendChild(d);
    setTimeout(() => d.remove(), 5000);
  }
}

// ---------- Çizim ----------
function cardHTML(c, cw) {
  const fs = Math.max(14, Math.round(cw * 0.44));
  const ten = c.r === 10 ? ";letter-spacing:-2px;transform:scaleX(.8);transform-origin:left top" : "";
  return `<span class="r" style="font-size:${fs}px${ten}">${RANK[c.r] || c.r}</span><span class="s1" style="font-size:${Math.round(fs * 0.82)}px">${c.s}</span><span class="s2" style="font-size:${Math.round(cw * 0.72)}px">${c.s}</span>`;
}
function render() {
  const board = $("board");
  const W = board.clientWidth - 16;
  const gap = 5;
  const cw = Math.floor((W - gap * 6) / 7);
  const ch = Math.round(cw * 1.42);
  const x = (i) => 8 + i * (cw + gap);
  const tabY = 8 + ch + 14;
  const seen = new Set();

  // Boş yuvalar (bir kez)
  if (!els.has("__slots")) {
    els.set("__slots", true);
    const mk = (key, i, y, txt) => { const s = document.createElement("div"); s.className = "slot"; s.textContent = txt; board.appendChild(s); els.set(key, s); };
    mk("__stock", 0, 8, "↻");
    for (let i = 0; i < 4; i++) mk("__f" + i, 3 + i, 8, SUITS[i]);
    for (let i = 0; i < 7; i++) mk("__t" + i, i, tabY, "");
    els.get("__stock").onclick = drawStock;
  }
  const place = (key, left, topY) => { const s = els.get(key); Object.assign(s.style, { left: left + "px", top: topY + "px", width: cw + "px", height: ch + "px" }); };
  place("__stock", x(0), 8);
  for (let i = 0; i < 4; i++) place("__f" + i, x(3 + i), 8);
  for (let i = 0; i < 7; i++) place("__t" + i, x(i), tabY);
  els.get("__stock").textContent = S.waste.length || S.stock.length ? "↻" : "";

  let z = 1;
  const putCard = (c, left, topY, up, onTap) => {
    let el = els.get(c.id);
    if (!el) { el = document.createElement("div"); els.set(c.id, el); board.appendChild(el); }
    el.className = "card" + (up ? (isRed(c.s) ? " red" : "") : " back");
    el.innerHTML = up ? cardHTML(c, cw) : "";
    Object.assign(el.style, { left: left + "px", top: topY + "px", width: cw + "px", height: ch + "px", zIndex: z++ });
    el.onclick = onTap;
    seen.add(c.id);
  };
  // Deste
  S.stock.forEach((c, i) => putCard(c, x(0), 8, false, drawStock));
  // Açık kartlar (son 3 yelpaze)
  const fan = Math.round(cw * 0.32);
  const wl = S.waste.length;
  S.waste.forEach((c, i) => {
    const k = Math.max(0, i - (wl - 3));
    const visIdx = wl <= 3 ? i : k;
    const left = x(1) + (i >= wl - 3 ? visIdx * fan : 0);
    const isTop = i === wl - 1;
    putCard(c, left, 8, true, isTop ? (e) => onCardTap(c.id, e.currentTarget) : null);
  });
  // Bitiş yığınları
  S.found.forEach((f, fi) => f.forEach((c, i) => putCard(c, x(3 + fi), 8, true, i === f.length - 1 ? (e) => onCardTap(c.id, e.currentTarget) : null)));
  // Tablo
  let maxBottom = tabY + ch;
  const downOff = Math.round(ch * 0.15), upOff = Math.round(ch * 0.36);
  S.tab.forEach((col, ti) => {
    let y = tabY;
    col.forEach((c, k) => {
      putCard(c, x(ti), y, c.up, c.up ? (e) => onCardTap(c.id, e.currentTarget) : (k === col.length - 1 ? () => { c.up = true; render(); } : null));
      y += c.up ? upOff : downOff;
    });
    maxBottom = Math.max(maxBottom, y - (col.length ? (lastOf(col).up ? upOff : downOff) : 0) + ch);
  });
  // Kaldırılmış kartlar
  for (const [k, el] of els) if (!k.startsWith("__") && !seen.has(k)) { el.remove(); els.delete(k); }
  board.style.height = maxBottom + 16 + "px";
  $("auto").style.display = canAutoFinish() ? "" : "none";
  updateStats();
}

// ---------- Dilek ekranı ----------
function wishScreen() {
  $("modal").innerHTML = `
    <div class="moon">🌙</div>
    <h2>İçinden bir dilek tut…</h2>
    <p>Gözlerini kapat, dileğini içinden geçir.<br>Oyunu bitirirsen dileğin kabul olsun. ✨</p>
    <button class="btn" id="go">Dileğimi tuttum, başla</button>`;
  $("overlay").classList.add("show");
  $("go").onclick = () => { $("overlay").classList.remove("show"); deal(); };
}

$("undo").onclick = undo;
$("hint").onclick = hint;
$("auto").onclick = autoFinish;
$("newg").onclick = wishScreen;
window.addEventListener("resize", () => S && render());
deal();
wishScreen();
</script>
