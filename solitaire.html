<style>
  :root {
    --felt: var(--masa, #0f5a3a);

    --accent: #e0a24f;

    --card: #0d0d0d;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* Aşağı çekince sayfa yenilenmesin (oyun kaybolmasın) */
  html, body { margin: 0; min-height: 100%; color: var(--ink); overscroll-behavior: none; }
  html { background: var(--felt); }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; max-width: 560px; margin: 0 auto; user-select: none; -webkit-user-select: none;
    padding: 0 3px calc(104px + env(safe-area-inset-bottom));

    min-height: 100vh; transition: background .4s;
  }
  /* Üst şerit */
  .top { position: sticky; top: 0; z-index: 50; display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 6px; padding: 8px 2px 6px; }
  .ib { width: 40px; height: 40px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); background: rgba(0,0,0,.28); color: #fff; font-size: 19px; display: flex; align-items: center; justify-content: center; text-decoration: none; cursor: pointer; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); text-align: center; }
  .stats span { font-size: 11px; letter-spacing: 1.2px; color: rgba(255,255,255,.7); font-weight: 600; }
  .stats b { display: block; font-size: 19px; color: #fff; font-variant-numeric: tabular-nums; letter-spacing: .5px; }

  .board { position: relative; margin-top: 4px; min-height: calc(100vh - 205px); min-height: calc(100dvh - 205px); }
  /* Masada Sadolayn logosu */
  .board::before {
    content: ""; position: absolute; left: 6%; right: 6%; top: 46%; height: 30%; pointer-events: none; z-index: 0;
    background: url("img/logo.png") center / contain no-repeat; opacity: .17; filter: grayscale(1) brightness(3);
  }
  .slot { position: absolute; z-index: 0; border-radius: 7px; background: rgba(0,0,0,.16); border: 1.5px solid rgba(255,255,255,.16); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,.3); font: 700 26px Georgia, "Times New Roman", serif; }
  .slot.stk { font: 22px system-ui; color: rgba(255,255,255,.55); cursor: pointer; }
  .slot.stk.done { color: rgba(255,255,255,.15); }

  /* Kartlar */
  /* Kart yüzü (renk, yazı, kalınlık, punto) ve kart arkası ⚙️ Ayarlar'dan gelir (kartmasa.js, "ust" düzeni) */
  .board .card, .card.ghost {
    position: absolute; border-radius: 7px; overflow: visible; background: linear-gradient(180deg, #ffffff 0%, #f7f5f0 100%); color: #15161a;
    box-shadow: 0 1px 2px rgba(0,0,0,.35), 0 2px 6px rgba(0,0,0,.18); border: 1px solid rgba(0,0,0,.18);
    transition: left .2s cubic-bezier(.3,.7,.3,1), top .2s cubic-bezier(.3,.7,.3,1), transform .15s; will-change: left, top;
  }
  .card.hint { box-shadow: 0 0 0 3px var(--accent), 0 0 16px rgba(224,162,79,.8); }
  .card.lift { transform: translateY(-3px); }
  .shake { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .card.target, .slot.target { box-shadow: 0 0 0 3px #7dffb8, 0 0 18px rgba(125,255,184,.7) !important; }
  .card.ghost { pointer-events: none; box-shadow: 0 0 0 3px var(--accent), 0 10px 24px rgba(0,0,0,.6); transition: none; }
  .card.pop { animation: pop .35s ease-out; }
  /* Sürükle-bırak: kart parmağı izler; tahtada dokunuş kaydırma yerine sürüklemeye gider */
  .board { touch-action: none; }
  .board .card.drag { transition: none !important; box-shadow: 0 0 0 2px var(--accent), 0 14px 28px rgba(0,0,0,.55); cursor: grabbing; }
  @keyframes pop { 40% { transform: scale(1.08); } }

  /* Alt araç çubuğu */
  .dock { position: fixed; left: 50%; bottom: 0; transform: translateX(-50%); width: 100%; max-width: 560px; z-index: 60; padding: 6px 8px calc(4px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, transparent, rgba(0,0,0,.35) 30%, rgba(0,0,0,.55)); }
  .tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px 4px 4px; border-radius: 16px; background: rgba(0,0,0,.42); border: 1px solid rgba(255,255,255,.1); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .tools button { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; border: 0; background: none; color: #fff; font: 600 11.5px system-ui, sans-serif; cursor: pointer; border-radius: 10px; }
  .tools button i { font-style: normal; font-size: 24px; line-height: 1.15; filter: drop-shadow(0 2px 3px rgba(0,0,0,.4)); }
  .tools button:active { background: rgba(255,255,255,.08); }
  .tools button:disabled { opacity: .35; }
  .brand { text-align: center; margin-top: 4px; font: 700 12px/1 Georgia, "Times New Roman", serif; letter-spacing: 6px; color: #e9c27f; text-shadow: 0 1px 0 rgba(0,0,0,.5); }
  .brand::before, .brand::after { content: "✦"; font-size: 9px; letter-spacing: 0; margin: 0 8px; opacity: .7; vertical-align: 2px; }
  .autoBtn { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 61; padding: 11px 20px; border-radius: 99px; border: 0; background: linear-gradient(180deg, #f6cf8e, #e0a24f); color: #1a1205; font: 800 15px system-ui; box-shadow: 0 8px 20px rgba(0,0,0,.45); cursor: pointer; animation: pop 1.6s ease-in-out infinite; }

  /* Pencereler */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 1000; }
  .overlay.show { display: flex; }
  .modal { background: #111; border: 1px solid #2a2a2a; border-radius: 20px; padding: 26px 22px; width: 100%; max-width: 360px; text-align: center; }
  /* Pencere, tarayıcının araç çubukları arasında kalan görünür alana sığar; sığmazsa kaydırılır (vh yerine dvh) */
  .overlay, .ov { overflow-y: auto; overscroll-behavior: contain; }
  .modal { margin: auto; max-height: 92vh; max-height: calc(100dvh - 32px); overflow-y: auto; }
  .modal .moon { font-size: 56px; margin-bottom: 6px; animation: float 3s ease-in-out infinite; }
  @keyframes float { 50% { transform: translateY(-6px); } }
  .modal h2 { margin: 0 0 8px; font-size: 22px; font-family: Georgia, "Times New Roman", serif; font-style: italic; color: var(--accent); }
  .modal p { margin: 0 0 18px; color: #bbb; font-size: 15px; line-height: 1.5; }
  .btn { width: 100%; padding: 13px; border-radius: 12px; background: var(--accent); border: none; color: #000; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn.ghost { background: transparent; color: #aaa; border: 1px solid #333; margin-top: 8px; }
  .confetti { position: fixed; top: -40px; font-size: 22px; pointer-events: none; z-index: 1001; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  .solToast { position: fixed; left: 50%; bottom: calc(100px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px); max-width: 92vw; padding: 11px 16px; border-radius: 14px; background: rgba(20,18,14,.96); border: 1px solid #6b5222; color: #f3dca8; font-size: 14.5px; line-height: 1.4; text-align: center; box-shadow: 0 10px 28px rgba(0,0,0,.6); opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; z-index: 1500; }
  .solToast.show { opacity: 1; transform: translate(-50%, 0); }
  .solToast b { color: #fff; } .solToast small { color: #b8a27a; }

  .rec { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
  .rec div { background: #1a1a1a; border-radius: 12px; padding: 10px 4px; }
  .rec b { display: block; font-size: 18px; } .rec span { font-size: 11px; color: #8a8a8a; }
</style>

<script>
// Kurallar: ⚙️ Ayarlar'ın en üstünde
const KURAL = () => `<ul class="rules">
  <li><b>Amaç:</b> 52 kartın hepsini dört bitiş yığınına, her renk kendi yığınında <b>As'tan Papaz'a</b> dizmek.</li>
  <li>Masada kartlar büyükten küçüğe, <b>kırmızı-siyah sırayla</b> dizilir (ör. siyah 8'in üstüne kırmızı 7).</li>
  <li>Boş sütuna yalnızca <b>Papaz</b> (ya da Papazla başlayan bir dizi) konur.</li>
  <li>Desteye dokununca kart açılır (ayardan 1 ya da 3 kart). Deste bitince açılan kartlar geri döner.</li>
  <li><b>Oynamak:</b> karta dokun, en uygun yere gitsin; ya da sürükleyip istediğin yere bırak. Altında kart varsa hepsi birlikte taşınır.</li>
  <li><b>Puan:</b> bitiş yığınına +10, desteden masaya +5, kapalı kart açmak +5, bitişten geri almak −15. Tek kart açmada desteyi her çevirişte −20.</li>
  <li>Takılırsan 💡 İpucu bir hamle gösterir, ↩️ Geri al hamleni geri alır.</li>
</ul>`;
if (window.KartMasa) KartMasa.kurallar = KURAL;
const SUITS = ["♠", "♥", "♣", "♦"];
const RANK = { 1: "A", 11: "J", 12: "Q", 13: "K" };
const isRed = (s) => s === "♥" || s === "♦";
const $ = (x) => document.getElementById(x);
// Masa rengi, kart arkası ve kart yüzü ortak ⚙️ ayarlardan (kartmasa.js); burada yalnızca Solitaire'e özel olanlar
const OPT = { ses: true, ip: false, tam: true, uc: true, sol: false };
try { Object.assign(OPT, JSON.parse(localStorage.getItem("solOpt") || "{}")); } catch (e) {}
if (window.CardSfx && CardSfx.muted) OPT.ses = !CardSfx.muted();
const saveOpt = () => { try { localStorage.setItem("solOpt", JSON.stringify(OPT)); } catch (e) {} };
const REC = { wins: 0, best: 0, bestT: 0 };
try { REC.wins = Number(localStorage.getItem("solWins")) || 0; Object.assign(REC, JSON.parse(localStorage.getItem("solRec") || "{}"), { wins: REC.wins }); } catch (e) {}

let S; // durum
let history = [];
let els = new Map();
let timer = null, started = 0, elapsed = 0;
let DRAW = OPT.uc ? 3 : 1;
let dealAnim = false;

function deal() {
  DRAW = OPT.uc ? 3 : 1;
  const deck = [];
  for (const s of SUITS) for (let r = 1; r <= 13; r++) deck.push({ id: s + r, s, r, up: false });
  for (let i = deck.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  const tab = [];
  for (let i = 0; i < 7; i++) { tab.push(deck.splice(0, i + 1)); tab[i][i].up = true; }
  S = { stock: deck, waste: [], found: [[], [], [], []], tab, moves: 0, score: 0 };
  history = [];
  elapsed = 0; started = 0;
  clearInterval(timer); timer = null;
  $("board").innerHTML = ""; els = new Map();
  dealAnim = true;
  if (window.CardSfx && !deal.sessiz) { CardSfx.shuffle(); setTimeout(() => CardSfx.deal(14), 650); }
  updateStats();
  render();
  dealAnim = false;
  idle();
}
const snapshot = () => JSON.stringify(S);
function pushHistory() { history.push(snapshot()); if (history.length > 300) history.shift(); }
function startTimer() {
  if (timer) return;
  started = Date.now() - elapsed * 1000;
  timer = setInterval(() => { elapsed = Math.floor((Date.now() - started) / 1000); updateStats(); }, 1000);
}
const fmtT = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
function updateStats() {
  $("moves").textContent = S ? S.moves : 0;
  $("score").textContent = S ? S.score : 0;
  $("time").textContent = fmtT(elapsed);
  $("undo").disabled = !history.length;
}

// ---------- Kurallar ----------
const lastOf = (arr) => arr[arr.length - 1];
function canFound(c, fi) {
  const f = S.found[fi];
  if (!f.length) return c.r === 1 && SUITS[fi] === c.s;
  const t = lastOf(f);
  return t.s === c.s && c.r === t.r + 1;
}
function foundIndexFor(c) { const fi = SUITS.indexOf(c.s); return canFound(c, fi) ? fi : -1; }
function canTab(c, ti) {
  const col = S.tab[ti];
  if (!col.length) return c.r === 13;
  const t = lastOf(col);
  return t.up && isRed(t.s) !== isRed(c.s) && t.r === c.r + 1;
}
function locate(id) {
  if (S.waste.length && lastOf(S.waste).id === id) return { from: "waste" };
  for (let i = 0; i < 4; i++) if (S.found[i].length && lastOf(S.found[i]).id === id) return { from: "found", i };
  for (let i = 0; i < 7; i++) { const k = S.tab[i].findIndex((c) => c.id === id); if (k >= 0) return { from: "tab", i, k }; }
  return null;
}
function takeFrom(loc) {
  if (loc.from === "waste") return [S.waste.pop()];
  if (loc.from === "found") return [S.found[loc.i].pop()];
  return S.tab[loc.i].splice(loc.k);
}
function flipTops() { let n = 0; for (const col of S.tab) if (col.length && !lastOf(col).up) { lastOf(col).up = true; n++; } return n; }
function bestMove(id) {
  const loc = locate(id);
  if (!loc) return null;
  if (loc.from === "tab" && !S.tab[loc.i][loc.k].up) return null;
  const card = loc.from === "tab" ? S.tab[loc.i][loc.k] : loc.from === "waste" ? lastOf(S.waste) : lastOf(S.found[loc.i]);
  const single = loc.from !== "tab" || loc.k === S.tab[loc.i].length - 1;
  if (single && loc.from !== "found") { const fi = foundIndexFor(card); if (fi >= 0) return { loc, to: "found", i: fi }; }
  let empty = -1;
  for (let ti = 0; ti < 7; ti++) {
    if (loc.from === "tab" && ti === loc.i) continue;
    if (!canTab(card, ti)) continue;
    if (S.tab[ti].length) return { loc, to: "tab", i: ti };
    if (empty < 0) empty = ti;
  }
  if (empty >= 0 && !(loc.from === "tab" && loc.k === 0)) return { loc, to: "tab", i: empty };
  return null;
}
// Puan: bitişe +10, desteden masaya +5, kart açma +5, bitişten geri −15
function doMove(m) {
  if (window.CardSfx && !window.__silent) CardSfx.play();
  pushHistory();
  const cards = takeFrom(m.loc);
  if (m.to === "found") S.found[m.i].push(...cards); else S.tab[m.i].push(...cards);
  let p = 0;
  if (m.to === "found" && m.loc.from !== "found") p += 10;
  if (m.loc.from === "waste" && m.to === "tab") p += 5;
  if (m.loc.from === "found" && m.to === "tab") p -= 15;
  p += 5 * flipTops();
  S.score = Math.max(0, S.score + p);
  S.moves++;
  S.last = cards[0].id;
  startTimer();
}
function drawStock() {
  pushHistory();
  if (!S.stock.length) {
    if (!S.waste.length) { history.pop(); return; }
    S.stock = S.waste.reverse().map((c) => ({ ...c, up: false }));
    S.waste = [];
    if (DRAW === 1) S.score = Math.max(0, S.score - 20);
    if (window.CardSfx) CardSfx.collect();
  } else {
    for (let i = 0; i < DRAW && S.stock.length; i++) { const c = S.stock.pop(); c.up = true; S.waste.push(c); }
    if (window.CardSfx) CardSfx.flip();
  }
  S.moves++;
  startTimer();
  render();
  after();
}

// ---------- Etkileşim ----------
function onCardTap(id, el) {
  const loc = locate(id);
  if (!loc) { shake(el); return; }
  const m = bestMove(id);
  if (!m) { shake(el); if (window.CardSfx && !CardSfx.muted()) {} return; }
  doMove(m);
  render();
  const moved = els.get(S.last); if (moved && m.to === "found") { moved.classList.remove("pop"); void moved.offsetWidth; moved.classList.add("pop"); }
  after();
}
// ---------- Sürükle-bırak ----------
// Dokunup bırakmak eskisi gibi kartı en uygun yere gönderir. Parmak 8 pikselden fazla kayarsa kart (tablodaysa
// altındakilerle birlikte) parmağı izler; bırakılan yer kurala uyuyorsa oraya gider, uymuyorsa yerine döner.
let DR = null, dragBitti = 0;
function dragCards(loc) {
  if (loc.from === "tab") return S.tab[loc.i].slice(loc.k);
  return [loc.from === "waste" ? lastOf(S.waste) : lastOf(S.found[loc.i])];
}
function dropTarget(loc, cards) {
  const el = els.get(cards[0].id); if (!el) return null;
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * 0.35;
  const card = cards[0], single = cards.length === 1;
  // Bitiş yığınları
  if (single) for (let i = 0; i < 4; i++) {
    if (loc.from === "found" && loc.i === i) continue;
    const b = els.get("__f" + i).getBoundingClientRect();
    if (cx > b.left - b.width * 0.25 && cx < b.right + b.width * 0.25 && cy > b.top - b.height * 0.4 && cy < b.bottom + b.height * 0.4 && canFound(card, i)) return { loc, to: "found", i };
  }
  // Tablo sütunları: yatayda en yakın sütun
  let best = null, bd = 1e9;
  for (let ti = 0; ti < 7; ti++) {
    if (loc.from === "tab" && loc.i === ti) continue;
    const b = els.get("__t" + ti).getBoundingClientRect();
    if (cy < b.top - b.height * 0.5) continue;
    const d = Math.abs(cx - (b.left + b.width / 2));
    if (d < b.width * 0.9 && d < bd && canTab(card, ti)) { bd = d; best = { loc, to: "tab", i: ti }; }
  }
  return best;
}
$("board").addEventListener("pointerdown", (e) => {
  if (e.button > 0 || autoRunning || DR) return;
  const el = e.target.closest(".card"); if (!el || !el.dataset.id) return;
  const id = isNaN(+el.dataset.id) ? el.dataset.id : +el.dataset.id;
  const loc = locate(id); if (!loc) return;
  if (loc.from === "tab" && !S.tab[loc.i][loc.k].up) return;
  DR = { id, loc, x0: e.clientX, y0: e.clientY, pid: e.pointerId, on: false, src: el };
});
$("board").addEventListener("pointermove", (e) => {
  if (!DR || e.pointerId !== DR.pid) return;
  const dx = e.clientX - DR.x0, dy = e.clientY - DR.y0;
  if (!DR.on) {
    if (Math.hypot(dx, dy) < 8) return;
    DR.on = true; DR.cards = dragCards(DR.loc); DR.els = DR.cards.map((c) => els.get(c.id)).filter(Boolean);
    DR.els.forEach((el, n) => { el.classList.add("drag"); el.dataset.z = el.style.zIndex; el.style.zIndex = 3000 + n; });
    try { DR.src.setPointerCapture(e.pointerId); } catch (er) {}
    clearTimeout(idleT);
  }
  e.preventDefault();
  DR.els.forEach((el) => (el.style.transform = `translate(${dx}px,${dy}px)`));
});

  try {
    if (!S || isWon()) { localStorage.removeItem(GAME_KEY); return; }

  } catch (e) {}
}

    S = g.S; history = Array.isArray(g.history) ? g.history : []; elapsed = g.elapsed || 0; DRAW = g.DRAW || DRAW;
