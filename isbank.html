<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İş Bankası Gündemi</title>
<style>
  :root {
    --bg: #000000;
    --card: #0d0d0d;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --line: #262626;
    --urun: #3fc283;
    --dijital: #5aa9f0;
    --kap: #e0a24f;
    --haber: #b48cf0;
    --maxipuan: #e0a24f;
    --taksit: #5aa9f0;
    --indirim: #3fc283;
    --puan: #b48cf0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 12px 16px 32px;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  .upd { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding-bottom: 6px; margin-bottom: 8px; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none; padding: 8px 14px; border-radius: 99px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: 14px; cursor: pointer;
  }
  .chips button.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .chips button b { font-weight: 400; opacity: .6; margin-left: 4px; }
  .day { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 6px 4px; }
  a.item {
    display: block; text-decoration: none; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--c, var(--line));
  }
  a.item:active { border-color: var(--accent); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--c); text-transform: uppercase; }
  .item b { display: block; font-size: 16px; margin: 2px 0 4px; }
  .item p { margin: 0; font-size: 14px; color: #c9c9c9; }
  .src { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .src::after { content: " ↗"; }
  .camp { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--c); }
  .camp .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .camp .left { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #1f1f1f; color: var(--muted); white-space: nowrap; }
  .camp .left.soon { background: rgba(239,106,76,.15); color: #ef6a4c; }
  .camp b { display: block; font-size: 16px; margin: 4px 0; }
  .camp p { margin: 0; font-size: 14px; color: #c9c9c9; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat span { display: block; font-size: 12px; color: var(--muted); }
  .stat b { display: block; font-size: 26px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); font-size: 12px; }
  .stat.hero { grid-column: 1 / -1; background: linear-gradient(135deg, #2a3fe0 0%, #1a2bb8 55%, #13208f 100%); border-color: #3a50f0; text-align: center; padding: 18px; }
  .stat.hero span { color: #b9c0d6; }
  .stat.hero b { font-size: 44px; color: #fff; }
  .facts { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; margin-bottom: 8px; }
  .facts li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; color: #c9c9c9; list-style: none; }
  .facts li:first-child { border-top: none; }
  .facts ul { margin: 0; padding: 0; }
  .ver { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--dijital); }
  .ver .top { display: flex; justify-content: space-between; align-items: center; }
  .ver .vn { font-weight: 700; font-size: 16px; }
  .ver .vd { font-size: 12px; color: var(--muted); }
  .ver ul { margin: 8px 0 0; padding-left: 18px; }
  .ver li { font-size: 14px; color: #c9c9c9; margin-bottom: 3px; }
  .ver.new { border-color: var(--dijital); }
  .ver .badge { font-size: 11px; font-weight: 700; color: #000; background: var(--dijital); border-radius: 99px; padding: 2px 8px; margin-left: 6px; }
  .maxlink { display: block; text-align: center; margin: 12px 0 0; padding: 12px; border-radius: 12px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 18px; line-height: 1.5; }
  .stick { position: sticky; top: 0; z-index: 30; background: #000; margin: 0 -16px 12px; padding: 10px 16px; border-bottom: 1px solid transparent; transition: border-color .2s, box-shadow .2s; }
  .stick.stuck { border-bottom-color: #222; box-shadow: 0 8px 18px rgba(0,0,0,.55); }
  .stick > :last-child { margin-bottom: 0; }
  .chipbar { position: sticky; z-index: 29; background: #000; margin: 0 -16px 10px; padding: 6px 16px 4px; }
  .subebtn { padding: 9px 16px; border-radius: 20px; border: 1px solid #3a50f0; background: linear-gradient(135deg, #2a3fe0, #13208f); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .subebtn.on { outline: 2px solid var(--accent); }
  .sum { background: linear-gradient(135deg, #2a3fe0 0%, #1a2bb8 55%, #13208f 100%); border: 1px solid #3a50f0; border-radius: 18px; padding: 14px 12px 10px; margin-bottom: 12px; text-align: center; }
  .sum .big { font-size: 12px; color: #c9d0ff; letter-spacing: .5px; }
  .sum .big b { display: block; font-size: 34px; color: #fff; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .sum .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .sum .grid div { background: rgba(0,0,0,.22); border-radius: 10px; padding: 7px 2px; }
  .sum .grid b { display: block; font-size: 16px; color: #fff; font-variant-numeric: tabular-nums; }
  .sum .grid span { font-size: 10.5px; color: #c9d0ff; }
  .sum .foot { font-size: 11px; color: #aab3e6; margin-top: 8px; }
  .sum .foot a { color: #fff; font-weight: 600; text-decoration: none; margin-left: 4px; }
  a.live { display: block; background: var(--card); border: 1px solid var(--line); border-left: 3px solid #5d8fe0; border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; color: var(--ink); text-decoration: none; }
  a.live b { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; }
  a.live span { font-size: 12px; color: var(--muted); }
  a.live span i { font-style: normal; color: #8fb0ff; font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stick">
  <header>
    <a href="index.html" style="display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:#161616;border:1px solid #e0a24f;font-size:22px;line-height:1;text-decoration:none" title="Anasayfa" aria-label="Anasayfa">🏠</a>
    <h1>🏛️ İş Bankası Gündemi</h1>
    <span style="width:52px"></span>
  </header>
  </div>
  <div class="upd" id="upd"></div>
  <div style="text-align:center;margin:-4px 0 10px"><button id="subeBtn" type="button" class="subebtn">🏦 Şubeler · 📊 Yatırımcı Sunumu</button></div>
  <div class="chipbar" id="chipbar"><div class="chips" id="chips"></div></div>
  <div id="list"><div class="empty">Yükleniyor…</div></div>

  <p class="note">Seçilmiş haberler ve Maximum kampanyaları kamuya açık kaynaklardan günde iki kez, "Güncel" sekmesi her saat otomatik derlenir. Kampanya koşulları için maximum.com.tr'ye bakın.</p>
</div>

<script>
const $ = (x) => document.getElementById(x);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CATS = [
  ["Tümü", null],
  ["Ürün", "var(--urun)"],
  ["Dijital", "var(--dijital)"],
  ["KAP", "var(--kap)"],
  ["Haber", "var(--haber)"],
  ["İşCep", "var(--dijital)"],
  ["Maximum", "var(--accent)"],
  ["📰 Güncel", "#5d8fe0"],
];
const TUR = { MaxiPuan: "var(--maxipuan)", Taksit: "var(--taksit)", "İndirim": "var(--indirim)", Puan: "var(--puan)" };
const color = (k) => (CATS.find((c) => c[0] === k) || [])[1] || "var(--muted)";
const fmtDay = (d) => new Date(d + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric", weekday: "long" });
let yat = null, kontrol = null, iscep = null, subeler = null, newsUpd = null, all = [], camps = [], campUpd = null, cat = "Tümü", live = [], liveUpd = null;
try { cat = localStorage.getItem("isbankCat") || "Tümü"; } catch (e) {}

function renderChips() {
  $("chips").innerHTML = CATS.map(([k]) => {
    const n = k === "Tümü" ? all.length : k === "Maximum" ? camps.length : k === "İşCep" ? (iscep ? iscep.surumler.length : 0) : k === "Şubeler" ? (subeler ? subeler.yurtici + subeler.yurtdisi : 0) : k === "📰 Güncel" ? live.length : all.filter((h) => h.kategori === k).length;
    return `<button data-k="${k}" class="${k === cat ? "active" : ""}">${k}<b>${n}</b></button>`;
  }).join("");
  $("chips").querySelectorAll("button").forEach((b) => (b.onclick = () => {
    cat = b.dataset.k;
    try { localStorage.setItem("isbankCat", cat); } catch (e) {}
    renderChips(); renderList();
  }));
  $("subeBtn").classList.toggle("on", cat === "Şubeler");
}

function daysLeft(d) {
  const end = new Date(d + "T23:59:59"), now = new Date();
  return Math.ceil((end - now) / 86400000);
}
function renderCamps() {
  $("upd").textContent = (kontrol ? "Son kontrol: " + fmtT(kontrol) + " · " : "") + "Liste değişince güncellenir";
  if (!camps.length) { $("list").innerHTML = '<div class="empty">Şu an listelenen kampanya yok.</div>'; return; }
  let html = "";
  for (const k of camps) {
    const n = daysLeft(k.bitis);
    const left = n <= 1 ? "Son gün" : `Son ${n} gün`;
    html += `<div class="camp" style="--c:${TUR[k.tur] || "var(--muted)"}">
      <div class="top"><span class="tag">${esc(k.tur)}</span><span class="left ${n <= 7 ? "soon" : ""}">${left}</span></div>
      <b>${esc(k.baslik)}</b>
      <p>${esc(k.ozet)}</p>
    </div>`;
  }
  html += `<a class="maxlink" href="https://www.maximum.com.tr/kampanyalar" target="_blank" rel="noopener">Tüm kampanyalar ve katılım koşulları ↗</a>`;
  $("list").innerHTML = html;
}

function renderSubeler() {
  const d = subeler;
  if (!d) { $("list").innerHTML = '<div class="empty">Şube bilgisi yüklenemedi.</div>'; return; }
  const f = (n) => Number(n).toLocaleString("tr-TR");
  $("upd").textContent = "Veri dönemi: " + d.donem + " · banka bu verileri 3 ayda bir açıklar";
  $("list").innerHTML = `
    <div class="stats">
      <div class="stat hero"><span>Toplam müşteri</span><b>${esc(d.musteri)}</b><small style="color:#b9c0d6">${esc(d.musteriDonem)}</small></div>
      <div class="stat"><span>Toplam şube</span><b>${f(d.yurtici + d.yurtdisi)}</b><small>Türkiye + ${f(d.ulke)} ülke</small></div>
      <div class="stat"><span>Çalışan</span><b>${f(d.calisan)}</b><small>${esc(d.calisanDonem)}</small></div>
      <div class="stat"><span>Yurt içi şube</span><b>${f(d.yurtici)}</b><small>81 ilin tamamında</small></div>
      <div class="stat"><span>Yurt dışı şube</span><b>${f(d.yurtdisi)}</b><small>${f(d.ulke)} ülkede</small></div>
      <div class="stat"><span>ATM</span><b>${f(d.atm)}</b><small>Türkiye'nin en geniş ağı</small></div>
      <div class="stat"><span>İşCep müşterisi</span><b>${esc(d.iscep)}</b><small>${esc(d.iscepDonem)}</small></div>
    </div>
    <div class="facts"><ul>${(d.notlar || []).map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div>
    <a class="maxlink" href="https://www.google.com/maps/search/T%C3%BCrkiye+%C4%B0%C5%9F+Bankas%C4%B1+%C5%9Fubesi" target="_blank" rel="noopener">📍 Yakınımdaki şubeleri haritada göster ↗</a>
    ${yatHtml()}
    <a class="maxlink" style="border-color:var(--line);color:var(--muted)" href="${esc(d.kaynakUrl)}" target="_blank" rel="noopener">Kaynak: ${esc(d.kaynak)} ↗</a>
    ${(d.ekKaynaklar || []).map((k) => `<a class="maxlink" style="border-color:var(--line);color:var(--muted);font-weight:400;font-size:13px" href="${esc(k.url)}" target="_blank" rel="noopener">${esc(k.ad)} ↗</a>`).join("")}`;
}

function yatHtml() {
  const y = yat;
  if (!y) return "";
  return `<div class="day" style="margin-top:22px">📊 Yatırımcı sunumu · ${esc(y.donem)}</div>
    <div class="stats">${y.kalemler.map((k) => `<div class="stat"><span>${esc(k.ad)}</span><b style="font-size:21px">${esc(k.deger)}</b><small>${esc(k.not)}</small></div>`).join("")}</div>
    <div class="facts"><ul>${y.paylar.map((n) => `<li>${esc(n)}</li>`).join("")}</ul></div>
    <a class="maxlink" href="${esc(y.pdf)}" target="_blank" rel="noopener">📄 Yatırımcı sunumunu aç (PDF) ↗</a>
    <a class="maxlink" style="border-color:var(--line);color:var(--muted)" href="${esc(y.ir)}" target="_blank" rel="noopener">Yatırımcı ilişkileri sayfası ↗</a>`;
}
function renderIscep() {
  const d = iscep;
  if (!d) { $("list").innerHTML = '<div class="empty">İşCep sürüm bilgisi yüklenemedi.</div>'; return; }
  $("upd").textContent = (kontrol ? "Son kontrol: " + fmtT(kontrol) + " · " : "") + "En son sürüm: " + new Date(d.surumler[0].tarih + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long" });
  const fmt = (t) => new Date(t + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric" });
  let html = "";
  d.surumler.forEach((v, i) => {
    html += `<div class="ver ${i === 0 ? "new" : ""}">
      <div class="top"><span class="vn">Sürüm ${esc(v.surum)}${i === 0 ? '<span class="badge">GÜNCEL</span>' : ""}</span><span class="vd">${fmt(v.tarih)}</span></div>
      <ul>${v.yenilikler.map((y) => `<li>${esc(y)}</li>`).join("")}</ul>
    </div>`;
  });
  html += `<a class="maxlink" href="${esc(d.kaynakUrl)}" target="_blank" rel="noopener">İşCep'i App Store'da aç ↗</a>`;
  $("list").innerHTML = html;
}

const fmtT = (t) => new Date(t).toLocaleString("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
function renderSum() {
  const d = subeler;
  if (!d) { $("sum").innerHTML = ""; return; }
  const f = (n) => Number(n).toLocaleString("tr-TR");
  $("sum").innerHTML = `<div class="sum">
    <div class="big">Toplam müşteri<b>${esc(d.musteri)}</b></div>
    <div class="grid">
      <div><b>${f(d.yurtici + d.yurtdisi)}</b><span>Şube</span></div>
      <div><b>${f(d.atm)}</b><span>ATM</span></div>
      <div><b>${f(d.calisan)}</b><span>Çalışan</span></div>
      <div><b>${esc(String(d.iscep).replace(" milyon", " mn"))}</b><span>İşCep</span></div>
    </div>
    <div class="foot">${esc(d.donem)} · ${f(d.ulke)} ülkede yurt dışı şube<a href="#" id="toSube">Şube ve kasa ›</a></div>
  </div>`;
  $("toSube").onclick = (e) => { e.preventDefault(); cat = "Şubeler"; try { localStorage.setItem("isbankCat", cat); } catch (er) {} renderChips(); renderList(); $("chipbar").scrollIntoView({ behavior: "smooth" }); };
}
function agoTxt(iso) {
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 60) return m + " dk önce";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " sa önce";
  return new Date(iso).toLocaleDateString("tr-TR", { day: "numeric", month: "short" });
}
function renderLive() {
  if (liveUpd) $("upd").textContent = "Her saat otomatik · son: " + new Date(liveUpd).toLocaleString("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  if (!live.length) { $("list").innerHTML = '<div class="empty">Son 2 günde İş Bankası haberi yok.</div>'; return; }
  $("list").innerHTML = live.map((x) => `<a class="live" href="${esc(x.u)}" target="_blank" rel="noopener"><b>${esc(x.t)}</b><span><i>${esc(x.s)}</i>${x.d ? " · " + agoTxt(x.d) : ""}</span></a>`).join("")
    + `<p class="note" style="margin-top:8px">Bu liste haber sitelerinden ve Google Haberler'den her saat otomatik toplanır; habere dokununca yayıncının sitesinde açılır.</p>`;
}

function renderList() {
  if (cat === "📰 Güncel") return renderLive();
  if (cat === "İşCep") return renderIscep();
  if (cat === "Maximum") return renderCamps();
  if (cat === "Şubeler") return renderSubeler();
  $("upd").textContent = (kontrol ? "Son kontrol: " + fmtT(kontrol) : newsUpd ? "Son güncelleme: " + fmtT(newsUpd) : "") + " · günde 2 kez";
  const items = all.filter((h) => cat === "Tümü" || h.kategori === cat);
  if (!items.length) { $("list").innerHTML = '<div class="empty">Bu kategoride henüz haber yok.</div>'; return; }
  let html = "", last = "";
  for (const h of items) {
    if (h.tarih !== last) { html += `<div class="day">${esc(fmtDay(h.tarih))}</div>`; last = h.tarih; }
    html += `<a class="item" href="${esc(h.url)}" target="_blank" rel="noopener" style="--c:${color(h.kategori)}">
      <span class="tag">${esc(h.kategori)}</span>
      <b>${esc(h.baslik)}</b>
      <p>${esc(h.ozet)}</p>
      <div class="src">${esc(h.kaynak)}</div>
    </a>`;
  }
  $("list").innerHTML = html;
}

(async () => {
  try {
    const r = await fetch("isbank/haberler.json?t=" + Date.now(), { cache: "no-store" });
    const d = await r.json();
    all = (d.haberler || []).sort((a, b) => b.tarih.localeCompare(a.tarih));
    newsUpd = d.guncelleme || null;
    try {
      const rc = await fetch("isbank/kampanyalar.json?t=" + Date.now(), { cache: "no-store" });
      const c = await rc.json();
      campUpd = c.guncelleme || null;
      camps = (c.kampanyalar || []).filter((k) => daysLeft(k.bitis) >= 1).sort((a, b) => a.bitis.localeCompare(b.bitis));
    } catch (e) {}
    try {
      const ri = await fetch("isbank/iscep.json?t=" + Date.now(), { cache: "no-store" });
      iscep = await ri.json();
    } catch (e) {}
    try {
      const rs = await fetch("isbank/subeler.json?t=" + Date.now(), { cache: "no-store" });
      subeler = await rs.json();
    } catch (e) {}
    try {
      const rh = await fetch("data/haberler.json?t=" + Date.now(), { cache: "no-store" });
      const h = await rh.json();
      live = (h.cats && h.cats.isbank) || []; liveUpd = h.updated || null;
    } catch (e) {}
    if (!CATS.some((c) => c[0] === cat)) cat = "Tümü";
    try { yat = await (await fetch("isbank/yatirimci.json?t=" + Date.now(), { cache: "no-store" })).json(); } catch (e) {}
    try { kontrol = (await (await fetch("isbank/kontrol.json?t=" + Date.now(), { cache: "no-store" })).json()).son_kontrol; } catch (e) {}
    $("subeBtn").onclick = () => { cat = cat === "Şubeler" ? "Tümü" : "Şubeler"; try { localStorage.setItem("isbankCat", cat); } catch (e) {} renderChips(); renderList(); };
    renderChips(); renderList();
  } catch (e) {
    $("list").innerHTML = '<div class="empty">Haberler yüklenemedi.</div>';
  }
})();
</script>
