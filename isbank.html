<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İş Bankası Gündemi</title>
<style>
  :root {
    --bg: #000000;
    --card: #0d0d0d;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --line: #262626;
    --urun: #3fc283;
    --dijital: #5aa9f0;
    --kap: #e0a24f;
    --haber: #b48cf0;
    --maxipuan: #e0a24f;
    --taksit: #5aa9f0;
    --indirim: #3fc283;
    --puan: #b48cf0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 12px 16px 32px;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  .upd { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .chips { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding: 2px 16px 4px; margin: 0 -16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-snap-type: x proximity; scroll-padding: 0 16px; }
  .chips button { flex: 0 0 auto; scroll-snap-align: start; white-space: nowrap; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none; padding: 8px 14px; border-radius: 99px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: 14px; cursor: pointer;
  }
  .chips button.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .chips button b { font-weight: 400; opacity: .6; margin-left: 4px; }
  .day { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 6px 4px; }
  a.item {
    display: block; text-decoration: none; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--c, var(--line));
  }
  a.item:active { border-color: var(--accent); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--c); text-transform: uppercase; }
  .item b { display: block; font-size: 16px; margin: 2px 0 4px; }
  .item p { margin: 0; font-size: 14px; color: #c9c9c9; }
  .src { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .src::after { content: " ↗"; }
  .camp { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--c); }
  .camp .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .camp .left { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #1f1f1f; color: var(--muted); white-space: nowrap; }
  .camp .left.soon { background: rgba(239,106,76,.15); color: #ef6a4c; }
  .camp b { display: block; font-size: 16px; margin: 4px 0; }
  .camp p { margin: 0; font-size: 14px; color: #c9c9c9; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .stat span { display: block; font-size: 12px; color: var(--muted); }
  .stat b { display: block; font-size: 26px; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .stat small { color: var(--muted); font-size: 12px; }
  .stat.hero { grid-column: 1 / -1; background: linear-gradient(135deg, #2a3fe0 0%, #1a2bb8 55%, #13208f 100%); border-color: #3a50f0; text-align: center; padding: 18px; }
  .stat.hero span { color: #b9c0d6; }
  .stat.hero b { font-size: 44px; color: #fff; }
  .facts { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 4px 14px; margin-bottom: 8px; }
  .facts li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; color: #c9c9c9; list-style: none; }
  .facts li:first-child { border-top: none; }
  .facts ul { margin: 0; padding: 0; }
  .ver { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--dijital); }
  .ver .top { display: flex; justify-content: space-between; align-items: center; }
  .ver .vn { font-weight: 700; font-size: 16px; }
  .ver .vd { font-size: 12px; color: var(--muted); }
  .ver ul { margin: 8px 0 0; padding-left: 18px; }
  .ver li { font-size: 14px; color: #c9c9c9; margin-bottom: 3px; }
  .ver.new { border-color: var(--dijital); }
  .ver .badge { font-size: 11px; font-weight: 700; color: #000; background: var(--dijital); border-radius: 99px; padding: 2px 8px; margin-left: 6px; }
  .maxlink { display: block; text-align: center; margin: 12px 0 0; padding: 12px; border-radius: 12px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 18px; line-height: 1.5; }
  .stick { position: sticky; top: 0; z-index: 30; background: #000; margin: 0 -16px 12px; padding: 10px 16px; border-bottom: 1px solid transparent; transition: border-color .2s, box-shadow .2s; }
  .stick.stuck { border-bottom-color: #222; box-shadow: 0 8px 18px rgba(0,0,0,.55); }
  .stick > :last-child { margin-bottom: 0; }
  .chipbar { margin: 8px 0 0; position: relative; }
  .chipbar::after { content: ""; position: absolute; right: -16px; top: 0; bottom: 4px; width: 28px; background: linear-gradient(90deg, transparent, #000); pointer-events: none; }
  .chipbar .tfil { margin: 6px -16px 0; padding: 0 16px 2px; scroll-padding: 0 16px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .chipbar .tfil::-webkit-scrollbar { display: none; }
  .chipbar .tfil button { flex: 0 0 auto; padding: 5px 10px; font-size: 12px; }
  .subebtn { padding: 9px 16px; border-radius: 20px; border: 1px solid #3a50f0; background: linear-gradient(135deg, #2a3fe0, #13208f); color: #fff; font-size: 14px; font-weight: 600; cursor: pointer; }
  .subebtn.on { outline: 2px solid var(--accent); }
  .sum { background: linear-gradient(135deg, #2a3fe0 0%, #1a2bb8 55%, #13208f 100%); border: 1px solid #3a50f0; border-radius: 18px; padding: 14px 12px 10px; margin-bottom: 12px; text-align: center; }
  .sum .big { font-size: 12px; color: #c9d0ff; letter-spacing: .5px; }
  .sum .big b { display: block; font-size: 34px; color: #fff; font-variant-numeric: tabular-nums; line-height: 1.15; }
  .sum .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 10px; }
  .sum .grid div { background: rgba(0,0,0,.22); border-radius: 10px; padding: 7px 2px; }
  .sum .grid b { display: block; font-size: 16px; color: #fff; font-variant-numeric: tabular-nums; }
  .sum .grid span { font-size: 10.5px; color: #c9d0ff; }
  .sum .foot { font-size: 11px; color: #aab3e6; margin-top: 8px; }
  .sum .foot a { color: #fff; font-weight: 600; text-decoration: none; margin-left: 4px; }
  .yt-chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 8px; }
  .yt-chips button { padding: 7px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--muted); font-size: 13px; font-weight: 600; cursor: pointer; }
  .yt-chips button.on { background: linear-gradient(135deg, #2a3fe0, #13208f); color: #fff; border-color: #3a50f0; }
  table.yt { width: 100%; border-collapse: separate; border-spacing: 0; background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; font-size: 13px; font-variant-numeric: tabular-nums; }
  table.yt th { font-size: 11px; color: var(--muted); font-weight: 600; text-align: right; padding: 8px 6px; border-bottom: 1px solid var(--line); background: #121212; }
  table.yt th:first-child, table.yt td:first-child { text-align: left; }
  table.yt td { padding: 9px 6px; border-bottom: 1px solid #1c1c1c; text-align: right; white-space: nowrap; }
  table.yt td:first-child { white-space: normal; color: #ddd; }
  table.yt tr:last-child td { border-bottom: none; }
  table.yt td.now { font-weight: 700; color: #fff; }
  table.yt td.old { color: var(--muted); }
  .chg { display: inline-block; padding: 3px 5px; border-radius: 8px; font-weight: 700; font-size: 12.5px; text-align: center; }
  .chg.g { background: rgba(63,194,131,.14); color: #5fd49a; }
  .chg.b { background: rgba(224,71,58,.14); color: #f07a6e; }
  .chg.n { color: var(--muted); }
  .yt-note { font-size: 11.5px; color: var(--muted); margin: 6px 2px 0; line-height: 1.45; }
  a.live { display: block; background: var(--card); border: 1px solid var(--line); border-left: 3px solid #5d8fe0; border-radius: 12px; padding: 11px 12px; margin-bottom: 8px; color: var(--ink); text-decoration: none; }
  a.live b { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; }
  a.live span { font-size: 12px; color: var(--muted); }
  a.live span i { font-style: normal; color: #8fb0ff; font-weight: 600; }
  /* ===== Günün kartı, takvim, grafikler, kampanya aciliyeti ===== */
  .nextev { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; background: linear-gradient(90deg, rgba(224,162,79,.14), rgba(224,162,79,.03)); border: 1px solid #4a3a22; border-radius: 14px; padding: 10px 12px; color: var(--ink, #f2f2f2); font: inherit; cursor: pointer; margin-bottom: 8px; }
  .nextev .n { font-size: 26px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; line-height: 1; text-align: center; min-width: 46px; }
  .nextev .n small { display: block; font-size: 10px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .nextev b { display: block; font-size: 14.5px; } .nextev span { font-size: 12px; color: var(--muted); } .nextev i { margin-left: auto; font-style: normal; color: var(--accent); font-size: 20px; }
  .daycard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .daycard h4 { margin: 0 0 6px; font-size: 12px; color: var(--accent); letter-spacing: .5px; text-transform: uppercase; }
  .daycard .yr { display: inline-block; font-weight: 800; color: #000; background: var(--accent); border-radius: 6px; padding: 0 6px; margin-right: 6px; font-size: 13px; }
  .daycard p { margin: 0; font-size: 14.5px; line-height: 1.5; color: #e6e6e6; }
  .daycard hr { border: none; border-top: 1px dashed #333; margin: 12px 0; }
  .dq .q { font-size: 15px; font-weight: 600; margin: 0 0 8px; line-height: 1.4; }
  .dq .os { display: grid; gap: 6px; }
  .dq .os button { text-align: left; padding: 9px 11px; border-radius: 10px; border: 1px solid #333; background: #161616; color: #f2f2f2; font: inherit; font-size: 14px; cursor: pointer; }
  .dq .os button.ok { background: #1f5f35; border-color: #2f9a55; } .dq .os button.no { background: #6a1f1a; border-color: #c0392b; }
  .dq .m { font-size: 13px; color: var(--muted); margin-top: 8px; min-height: 18px; }
  .tk { display: grid; grid-template-columns: 54px minmax(0,1fr) auto; gap: 10px; align-items: center; background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 14px; padding: 10px 12px; margin-bottom: 8px; }
  .tk .dt { text-align: center; line-height: 1.1; } .tk .dt b { display: block; font-size: 22px; } .tk .dt span { font-size: 11px; color: var(--muted); text-transform: uppercase; }
  .tk .tt b { display: block; font-size: 14.5px; } .tk .tt span { font-size: 12px; color: var(--muted); }
  .tk .kl { text-align: right; font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; } .tk .kl small { display: block; font-size: 10.5px; color: var(--muted); font-weight: 500; }
  .tk.est { opacity: .8; } .tk.est .tt b::after { content: " · tahmini"; font-weight: 500; font-size: 11px; color: var(--muted); }
  .chart { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 6px; margin-bottom: 8px; }
  .chart h5 { margin: 0 0 2px; font-size: 13.5px; } .chart small { font-size: 11.5px; color: var(--muted); }
  .chart svg { display: block; width: 100%; height: auto; margin-top: 6px; }
  .tfil { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 10px; }
  .tfil button { border: 1px solid var(--line); background: #161616; color: #ddd; border-radius: 999px; padding: 6px 11px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .tfil button.on { background: var(--accent); color: #000; border-color: var(--accent); }
  .tfil button b { margin-left: 5px; opacity: .7; }
  .camp .left.urgent { background: #c0392b; color: #fff; animation: pz 1.4s ease-in-out infinite; }
  @keyframes pz { 50% { box-shadow: 0 0 0 4px rgba(192,57,43,.25); } }
  .camp.urgent { border-color: #5a2a20; background: linear-gradient(180deg, rgba(192,57,43,.08), var(--card) 60%); }
  .alarm { background: rgba(192,57,43,.12); border: 1px solid #5a2a20; color: #ffb7a6; border-radius: 12px; padding: 9px 12px; font-size: 13.5px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stick">
  <header>
    <a href="index.html" style="display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:#161616;border:1px solid #e0a24f;font-size:22px;line-height:1;text-decoration:none" title="Anasayfa" aria-label="Anasayfa">🏠</a>
    <h1>🏛️ İş Bankası Gündemi</h1>
    <span style="width:52px"></span>
  </header>
  <div class="chipbar" id="chipbar"><div class="chips" id="chips"></div><div class="tfil" id="tfil" hidden></div></div>
  </div>
  <div class="upd" id="upd"></div>
  <div style="text-align:center;margin:-4px 0 10px"><button id="subeBtn" type="button" class="subebtn">🏦 Şubeler · 📊 Yatırımcı Sunumu</button></div>
  <div id="today"></div>
  <div id="list"><div class="empty">Yükleniyor…</div></div>

  <p class="note">Seçilmiş haberler ve Maximum kampanyaları kamuya açık kaynaklardan günde iki kez, "Güncel" sekmesi her saat otomatik derlenir. Kampanya koşulları için maximum.com.tr'ye bakın.</p>
</div>

<script src="isq.js"></script>
<script>
const $ = (x) => document.getElementById(x);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CATS = [
  ["Tümü", null],
  ["Ürün", "var(--urun)"],
  ["Dijital", "var(--dijital)"],
  ["KAP", "var(--kap)"],
  ["Haber", "var(--haber)"],
  ["İşCep", "var(--dijital)"],
  ["Maximum", "var(--accent)"],
  ["📰 Güncel", "#5d8fe0"],
  ["📅 Takvim", "#e0a24f"],
];
const TUR = { MaxiPuan: "var(--maxipuan)", Taksit: "var(--taksit)", "İndirim": "var(--indirim)", Puan: "var(--puan)" };
const color = (k) => (CATS.find((c) => c[0] === k) || [])[1] || "var(--muted)";
const fmtDay = (d) => new Date(d + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric", weekday: "long" });
let fin = null, yat = null, kontrol = null, iscep = null, subeler = null, newsUpd = null, all = [], camps = [], campUpd = null, cat = "Tümü", live = [], liveUpd = null;
try { cat = localStorage.getItem("isbankCat") || "Tümü"; } catch (e) {}

function renderChips() {
  $("chips").innerHTML = CATS.map(([k]) => {
    const n = k === "Tümü" ? all.length : k === "Maximum" ? camps.length : k === "İşCep" ? (iscep ? iscep.surumler.length : 0) : k === "Şubeler" ? (subeler ? subeler.yurtici + subeler.yurtdisi : 0) : k === "📰 Güncel" ? live.length : k === "📅 Takvim" ? takvim().length : all.filter((h) => h.kategori === k).length;
    return `<button data-k="${k}" class="${k === cat ? "active" : ""}">${k}<b>${n}</b></button>`;
  }).join("");
  $("chips").querySelectorAll("button").forEach((b) => (b.onclick = () => {
    cat = b.dataset.k;
    try { localStorage.setItem("isbankCat", cat); } catch (e) {}
    renderChips(); renderList();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }));
  const act = $("chips").querySelector(".active"); if (act) act.scrollIntoView({ inline: "center", block: "nearest" });
  $("subeBtn").classList.toggle("on", cat === "Şubeler");
}

function daysLeft(d) {
  const end = new Date(d + "T23:59:59"), now = new Date();
  return Math.ceil((end - now) / 86400000);
}
let campTur = "Tümü";
function renderCamps() {
  $("upd").textContent = (kontrol ? "Son kontrol: " + fmtT(kontrol) + " · " : "") + "Liste değişince güncellenir";
  if (!camps.length) { $("list").innerHTML = '<div class="empty">Şu an listelenen kampanya yok.</div>'; return; }
  const turs = ["Tümü", ...new Set(camps.map((k) => k.tur))];
  if (!turs.includes(campTur)) campTur = "Tümü";
  const urg = camps.filter((k) => daysLeft(k.bitis) <= 3);
  $("tfil").innerHTML = turs.map((t) => `<button data-t="${esc(t)}" class="${t === campTur ? "on" : ""}">${t === "Tümü" ? "Tüm türler" : esc(t)}<b>${t === "Tümü" ? camps.length : camps.filter((k) => k.tur === t).length}</b></button>`).join("");
  $("tfil").hidden = false;
  let html = "";
  if (urg.length) html += `<div class="alarm">⏰ <b>${urg.length} kampanya</b> 3 gün içinde bitiyor!</div>`;
  for (const k of camps.filter((k) => campTur === "Tümü" || k.tur === campTur)) {
    const n = daysLeft(k.bitis), u = n <= 3;
    const left = n <= 1 ? "🔥 Son gün!" : u ? `⏰ Son ${n} gün` : `Son ${n} gün`;
    const bit = new Date(k.bitis + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long" });
    html += `<div class="camp${u ? " urgent" : ""}" style="--c:${TUR[k.tur] || "var(--muted)"}">
      <div class="top"><span class="tag">${esc(k.tur)}</span><span class="left ${u ? "urgent" : n <= 7 ? "soon" : ""}" title="Bitiş: ${bit}">${left}</span></div>
      <b>${esc(k.baslik)}</b>
      <p>${esc(k.ozet)}</p>
      <div style="font-size:12px;color:var(--muted);margin-top:6px">Bitiş: ${bit}</div>
    </div>`;
  }
  html += `<a class="maxlink" href="https://www.maximum.com.tr/kampanyalar" target="_blank" rel="noopener">Tüm kampanyalar ve katılım koşulları ↗</a>`;
  $("list").innerHTML = html;
  $("tfil").onclick = (e) => { const b = e.target.closest("button[data-t]"); if (!b) return; campTur = b.dataset.t; renderCamps(); window.scrollTo({ top: 0, behavior: "smooth" }); };
}

function renderSubeler() {
  let d = subeler;
  if (d && fin) { // şube, ATM ve çalışan sayısını bankanın resmi veri dosyasından al
    const L = fin.periods.length - 1, S = fin.s;
    d = Object.assign({}, d, { atm: S.atm[L] ?? d.atm, calisan: S.calisan[L] ?? d.calisan, calisanDonem: pLabel(fin.periods[L]),
      yurtici: S.sube[L] != null ? S.sube[L] - d.yurtdisi : d.yurtici, donem: pLabel(fin.periods[L]) });
  }
  if (!d) { $("list").innerHTML = '<div class="empty">Şube bilgisi yüklenemedi.</div>'; return; }
  const f = (n) => Number(n).toLocaleString("tr-TR");
  $("upd").textContent = "Veri dönemi: " + d.donem + " · banka bu verileri 3 ayda bir açıklar";
  $("list").innerHTML = `
    <div class="stats">
      <div class="stat hero"><span>Toplam müşteri</span><b>${esc(d.musteri)}</b><small style="color:#b9c0d6">${esc(d.musteriDonem)}</small></div>
      <div class="stat"><span>Toplam şube</span><b>${f(d.yurtici + d.yurtdisi)}</b><small>Türkiye + ${f(d.ulke)} ülke</small></div>
      <div class="stat"><span>Çalışan</span><b>${f(d.calisan)}</b><small>${esc(d.calisanDonem)}</small></div>
      <div class="stat"><span>Yurt içi şube</span><b>${f(d.yurtici)}</b><small>81 ilin tamamında</small></div>
      <div class="stat"><span>Yurt dışı şube</span><b>${f(d.yurtdisi)}</b><small>${f(d.ulke)} ülkede</small></div>
      <div class="stat"><span>ATM</span><b>${f(d.atm)}</b><small>Türkiye'nin en geniş ağı</small></div>

function chartSvg(vals, labels, o) {
  const W = 340, H = 150, L = 6, R = 6, T = 18, B = 22, n = vals.length;
  const ok = vals.filter((v) => v != null), mx = Math.max(...ok) * 1.08, mn = o.line ? Math.min(...ok) * 0.9 : 0;
  const x = (i) => L + (W - L - R) * (o.line ? i / (n - 1) : (i + 0.5) / n), y = (v) => T + (H - T - B) * (1 - (v - mn) / (mx - mn || 1));
  let g = `<line x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}" stroke="#333"/>`;
  if (o.line) {
    const pts = vals.map((v, i) => v == null ? null : `${x(i).toFixed(1)},${y(v).toFixed(1)}`).filter(Boolean);
    g += `<polygon points="${x(0)},${H - B} ${pts.join(" ")} ${x(n - 1)},${H - B}" fill="${o.c}" opacity=".12"/><polyline points="${pts.join(" ")}" fill="none" stroke="${o.c}" stroke-width="2.4" stroke-linejoin="round"/>`;
    vals.forEach((v, i) => { if (v != null) g += `<circle cx="${x(i)}" cy="${y(v)}" r="${i === n - 1 ? 4 : 2.4}" fill="${i === n - 1 ? o.c : "#0d0d0d"}" stroke="${o.c}" stroke-width="1.6"><title>${labels[i]}: ${o.f(v)}</title></circle>`; });
  } else {
    const bw = (W - L - R) / n * 0.62;
    vals.forEach((v, i) => { if (v == null) return; const yy = y(v); g += `<rect x="${(x(i) - bw / 2).toFixed(1)}" y="${yy.toFixed(1)}" width="${bw.toFixed(1)}" height="${(H - B - yy).toFixed(1)}" rx="3" fill="${o.c}" opacity="${i === n - 1 ? 1 : 0.55}"><title>${labels[i]}: ${o.f(v)}</title></rect>`; });
  }
  // son değer etiketi
  const li = n - 1; g += `<text x="${Math.min(x(li), W - R - 2)}" y="${y(vals[li]) - 7}" text-anchor="end" font-size="12" font-weight="800" fill="#f2f2f2">${o.f(vals[li])}</text>`;
  // yıl etiketleri: her yılın ilk noktası
  let prev = ""; labels.forEach((lb, i) => { const yr = lb.split("/")[0]; if (yr !== prev) { g += `<text x="${x(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : "middle"}" font-size="10.5" fill="#8a8a8a">${yr}</text>`; prev = yr; } });
  return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
function chartsHtml() {
  if (!fin) return "";
  const P = fin.periods, S = fin.s;
  const qNet = P.map((p, i) => { const m = +p.split("/")[1]; if (S.netkar[i] == null) return null; if (m === 3) return S.netkar[i]; return S.netkar[i - 1] == null ? null : +(S.netkar[i] - S.netkar[i - 1]).toFixed(3); });
  const mlr = (v) => v.toLocaleString("tr-TR", { maximumFractionDigits: 1 }) + " mlr", trn = (v) => (v / 1000).toLocaleString("tr-TR", { maximumFractionDigits: 2 }) + " trn", pc = (v) => "%" + v.toLocaleString("tr-TR", { maximumFractionDigits: 1 });
  const C = (t, sub, svg) => `<div class="chart"><h5>${t}</h5><small>${sub}</small>${svg}</div>`;

    C("Net kâr (her çeyrek ayrı)", "milyar TL · son çubuk en güncel çeyrek", chartSvg(qNet, P, { c: "#e0a24f", f: mlr })) +
    C("Toplam aktif", "trilyon TL", chartSvg(S.aktif, P, { c: "#5aa9f0", f: trn, line: true })) +

}

  const nx = takvim().find((x) => !/bilanço dönemi/.test(x.t)) || takvim()[0];
  let h = "";
  if (nx) { const n = dLeft(nx.d), dt = new Date(nx.d + "T12:00:00"); h += `<button type="button" class="nextev" id="toTk"><div class="n">${n === 0 ? "🎯" : (nx.ay ? "~" : "") + n}<small>${n === 0 ? "bugün" : "gün"}</small></div><div><b>${esc(nx.t)}</b><span>${nx.ay ? dt.toLocaleDateString("tr-TR", { month: "long", year: "numeric" }) + " (tahmini)" : dt.toLocaleDateString("tr-TR", { day: "numeric", month: "long", weekday: "long" })} · banka takvimi</span></div><i>›</i></button>`; }
  h += `<div class="daycard"><h4>🏛️ ${exact ? "Bugün banka tarihinde" : "Banka tarihinden"}</h4><p><span class="yr">${esc(f[0])}</span>${esc(f[1])}</p>`;
  const pool = typeof ISQ !== "undefined" ? ISQ : [];
  if (pool.length) {
    const q = pool[(dayIdx() * 7) % pool.length];
    h += `<hr><div class="dq"><h4>❓ Günün sorusu</h4><div class="q">${esc(q[0])}</div><div class="os" id="dqOs">${q[1].map((o, i) => `<button type="button" data-i="${i}">${esc(o)}</button>`).join("")}</div><div class="m" id="dqM">Cevabını seç; yarın yeni soru gelir.</div></div>`;
    setTimeout(() => {
      const os = $("dqOs"); if (!os) return;
      os.onclick = (e) => { const b = e.target.closest("button[data-i]"); if (!b || os.dataset.done) return; os.dataset.done = 1; const i = +b.dataset.i;
        os.querySelectorAll("button").forEach((x) => { if (+x.dataset.i === q[2]) x.classList.add("ok"); });
        if (i !== q[2]) b.classList.add("no");
        $("dqM").textContent = i === q[2] ? "✅ Bravo, doğru!" : "Doğrusu yeşil olan 👆 Yarın yeni soru!"; };
    });
  }
  h += `</div>`;
  $("today").innerHTML = h;
  const tb = $("toTk"); if (tb) tb.onclick = () => { cat = "📅 Takvim"; try { localStorage.setItem("isbankCat", cat); } catch (e) {} renderChips(); renderList(); window.scrollTo({ top: 0, behavior: "smooth" }); };
}

function renderList() {
  $("tfil").hidden = cat !== "Maximum";
  $("today").hidden = cat !== "Tümü";
  if (cat === "📰 Güncel") return renderLive();
  if (cat === "📅 Takvim") return renderTakvim();
  if (cat === "İşCep") return renderIscep();
  if (cat === "Maximum") return renderCamps();
  if (cat === "Şubeler") return renderSubeler();
  $("upd").textContent = (kontrol ? "Son kontrol: " + fmtT(kontrol) : newsUpd ? "Son güncelleme: " + fmtT(newsUpd) : "") + " · günde 2 kez";
  const items = all.filter((h) => cat === "Tümü" || h.kategori === cat);
  if (!items.length) { $("list").innerHTML = '<div class="empty">Bu kategoride henüz haber yok.</div>'; return; }
  let html = "", last = "";
  for (const h of items) {
    if (h.tarih !== last) { html += `<div class="day">${esc(fmtDay(h.tarih))}</div>`; last = h.tarih; }
    html += `<a class="item" href="${esc(h.url)}" target="_blank" rel="noopener" style="--c:${color(h.kategori)}">
      <span class="tag">${esc(h.kategori)}</span>
      <b>${esc(h.baslik)}</b>
      <p>${esc(h.ozet)}</p>
      <div class="src">${esc(h.kaynak)}</div>
    </a>`;
  }
  $("list").innerHTML = html;
}

(async () => {
  try {
    const r = await fetch("isbank/haberler.json?t=" + Date.now(), { cache: "no-store" });
    const d = await r.json();
    all = (d.haberler || []).sort((a, b) => b.tarih.localeCompare(a.tarih));
    newsUpd = d.guncelleme || null;
    try {
      const rc = await fetch("isbank/kampanyalar.json?t=" + Date.now(), { cache: "no-store" });
      const c = await rc.json();
      campUpd = c.guncelleme || null;
      camps = (c.kampanyalar || []).filter((k) => daysLeft(k.bitis) >= 1).sort((a, b) => a.bitis.localeCompare(b.bitis));
    } catch (e) {}
    try {
      const ri = await fetch("isbank/iscep.json?t=" + Date.now(), { cache: "no-store" });
      iscep = await ri.json();
    } catch (e) {}
    try {
      const rs = await fetch("isbank/subeler.json?t=" + Date.now(), { cache: "no-store" });
      subeler = await rs.json();
    } catch (e) {}
    try {
      const rh = await fetch("data/haberler.json?t=" + Date.now(), { cache: "no-store" });
      const h = await rh.json();
      live = (h.cats && h.cats.isbank) || []; liveUpd = h.updated || null;
    } catch (e) {}
    if (!CATS.some((c) => c[0] === cat)) cat = "Tümü";
    try { fin = await (await fetch("isbank/finans.json?t=" + Date.now(), { cache: "no-store" })).json(); } catch (e) {}
    try { yat = await (await fetch("isbank/yatirimci.json?t=" + Date.now(), { cache: "no-store" })).json(); } catch (e) {}
    try { kontrol = (await (await fetch("isbank/kontrol.json?t=" + Date.now(), { cache: "no-store" })).json()).son_kontrol; } catch (e) {}
    $("subeBtn").onclick = () => { cat = cat === "Şubeler" ? "Tümü" : "Şubeler"; try { localStorage.setItem("isbankCat", cat); } catch (e) {} renderChips(); renderList(); };
    renderChips(); renderList(); renderToday();
  } catch (e) {
    $("list").innerHTML = '<div class="empty">Haberler yüklenemedi.</div>';
  }
})();
</script>

<script>
// Yakınımdaki şubeler: konumu cihazdan al (kurum ağı İstanbul'dan çıktığı için Google tek başına Ataşehir gösteriyordu)
(function () {
  const go = (lat, lon) => window.open(`https://www.google.com/maps/search/T%C3%BCrkiye+%C4%B0%C5%9F+Bankas%C4%B1/@${lat},${lon},14z`, "_blank", "noopener");
  const saved = () => { try { const p = (JSON.parse(localStorage.getItem("yakin_v1") || "{}") || {}).place; return p && p.lat ? p : null; } catch (e) { return null; } };
  document.addEventListener("click", (e) => {
    const el = e.target.closest("#nearIsb"); if (!el) return;
    e.preventDefault();
    const old = el.textContent; el.textContent = "📍 Konum alınıyor…";
    const fallback = () => { el.textContent = old; const p = saved(); if (p) go(p.lat, p.lon); else location.href = "yakin.html#isbank"; };
    if (!navigator.geolocation) return fallback();
    let done = false;
    const t = setTimeout(() => { if (!done) { done = true; fallback(); } }, 8000);
    navigator.geolocation.getCurrentPosition((pos) => { if (done) return; done = true; clearTimeout(t); el.textContent = old; go(pos.coords.latitude, pos.coords.longitude); },
      () => { if (done) return; done = true; clearTimeout(t); fallback(); }, { enableHighAccuracy: true, timeout: 7000, maximumAge: 300000 });
  });
})();
</script>
