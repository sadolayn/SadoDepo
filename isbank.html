<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>İş Bankası Yenilikler</title>
<style>
  :root {
    --bg: #000000;
    --card: #0d0d0d;
    --ink: #f2f2f2;
    --muted: #8a8a8a;
    --accent: #e0a24f;
    --line: #262626;
    --urun: #3fc283;
    --dijital: #5aa9f0;
    --kap: #e0a24f;
    --haber: #b48cf0;
    --maxipuan: #e0a24f;
    --taksit: #5aa9f0;
    --indirim: #3fc283;
    --puan: #b48cf0;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 12px 16px 32px;
    line-height: 1.5;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  header a { color: var(--muted); text-decoration: none; font-size: 14px; }
  header h1 { margin: 0; font-size: 20px; }
  .upd { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 8px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chips button {
    flex: none; padding: 8px 14px; border-radius: 99px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    font-size: 14px; cursor: pointer;
  }
  .chips button.active { background: var(--accent); border-color: var(--accent); color: #000; font-weight: 600; }
  .chips button b { font-weight: 400; opacity: .6; margin-left: 4px; }
  .day { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 6px 4px; }
  a.item {
    display: block; text-decoration: none; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--c, var(--line));
  }
  a.item:active { border-color: var(--accent); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .5px; color: var(--c); text-transform: uppercase; }
  .item b { display: block; font-size: 16px; margin: 2px 0 4px; }
  .item p { margin: 0; font-size: 14px; color: #c9c9c9; }
  .src { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .src::after { content: " ↗"; }
  .camp { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; border-left: 4px solid var(--c); }
  .camp .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .camp .left { font-size: 12px; font-weight: 700; padding: 2px 8px; border-radius: 99px; background: #1f1f1f; color: var(--muted); white-space: nowrap; }
  .camp .left.soon { background: rgba(239,106,76,.15); color: #ef6a4c; }
  .camp b { display: block; font-size: 16px; margin: 4px 0; }
  .camp p { margin: 0; font-size: 14px; color: #c9c9c9; }
  .maxlink { display: block; text-align: center; margin: 12px 0 0; padding: 12px; border-radius: 12px; border: 1px solid var(--accent); color: var(--accent); text-decoration: none; font-weight: 600; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }
  .note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <a href="index.html">← Menü</a>
    <h1>🏛️ İş Bankası</h1>
    <span style="width:52px"></span>
  </header>
  <div class="upd" id="upd"></div>

  <div class="chips" id="chips"></div>
  <div id="list"><div class="empty">Yükleniyor…</div></div>

  <p class="note">Haberler ve Maximum kampanyaları kamuya açık kaynaklardan günde iki kez otomatik derlenir. Kampanya koşulları için maximum.com.tr'ye bakın.</p>
</div>

<script>
const $ = (x) => document.getElementById(x);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const CATS = [
  ["Tümü", null],
  ["Ürün", "var(--urun)"],
  ["Dijital", "var(--dijital)"],
  ["KAP", "var(--kap)"],
  ["Haber", "var(--haber)"],
  ["Maximum", "var(--accent)"],
];
const TUR = { MaxiPuan: "var(--maxipuan)", Taksit: "var(--taksit)", "İndirim": "var(--indirim)", Puan: "var(--puan)" };
const color = (k) => (CATS.find((c) => c[0] === k) || [])[1] || "var(--muted)";
const fmtDay = (d) => new Date(d + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long", year: "numeric", weekday: "long" });
let newsUpd = null, all = [], camps = [], campUpd = null, cat = "Tümü";
try { cat = localStorage.getItem("isbankCat") || "Tümü"; } catch (e) {}

function renderChips() {
  $("chips").innerHTML = CATS.map(([k]) => {
    const n = k === "Tümü" ? all.length : k === "Maximum" ? camps.length : all.filter((h) => h.kategori === k).length;
    return `<button data-k="${k}" class="${k === cat ? "active" : ""}">${k}<b>${n}</b></button>`;
  }).join("");
  $("chips").querySelectorAll("button").forEach((b) => (b.onclick = () => {
    cat = b.dataset.k;
    try { localStorage.setItem("isbankCat", cat); } catch (e) {}
    renderChips(); renderList();
  }));
}

function daysLeft(d) {
  const end = new Date(d + "T23:59:59"), now = new Date();
  return Math.ceil((end - now) / 86400000);
}
function renderCamps() {
  if (campUpd) $("upd").textContent = "Kampanyalar güncellendi: " + new Date(campUpd).toLocaleString("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  if (!camps.length) { $("list").innerHTML = '<div class="empty">Şu an listelenen kampanya yok.</div>'; return; }
  let html = "";
  for (const k of camps) {
    const n = daysLeft(k.bitis);
    const left = n <= 1 ? "Son gün" : `Son ${n} gün`;
    html += `<div class="camp" style="--c:${TUR[k.tur] || "var(--muted)"}">
      <div class="top"><span class="tag">${esc(k.tur)}</span><span class="left ${n <= 7 ? "soon" : ""}">${left}</span></div>
      <b>${esc(k.baslik)}</b>
      <p>${esc(k.ozet)}</p>
    </div>`;
  }
  html += `<a class="maxlink" href="https://www.maximum.com.tr/kampanyalar" target="_blank" rel="noopener">Tüm kampanyalar ve katılım koşulları ↗</a>`;
  $("list").innerHTML = html;
}

function renderList() {
  if (cat === "Maximum") return renderCamps();
  if (newsUpd) $("upd").textContent = "Son güncelleme: " + new Date(newsUpd).toLocaleString("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
  const items = all.filter((h) => cat === "Tümü" || h.kategori === cat);
  if (!items.length) { $("list").innerHTML = '<div class="empty">Bu kategoride henüz haber yok.</div>'; return; }
  let html = "", last = "";
  for (const h of items) {
    if (h.tarih !== last) { html += `<div class="day">${esc(fmtDay(h.tarih))}</div>`; last = h.tarih; }
    html += `<a class="item" href="${esc(h.url)}" target="_blank" rel="noopener" style="--c:${color(h.kategori)}">
      <span class="tag">${esc(h.kategori)}</span>
      <b>${esc(h.baslik)}</b>
      <p>${esc(h.ozet)}</p>
      <div class="src">${esc(h.kaynak)}</div>
    </a>`;
  }
  $("list").innerHTML = html;
}

(async () => {
  try {
    const r = await fetch("isbank/haberler.json?t=" + Date.now(), { cache: "no-store" });
    const d = await r.json();
    all = (d.haberler || []).sort((a, b) => b.tarih.localeCompare(a.tarih));
    newsUpd = d.guncelleme || null;
    try {
      const rc = await fetch("isbank/kampanyalar.json?t=" + Date.now(), { cache: "no-store" });
      const c = await rc.json();
      campUpd = c.guncelleme || null;
      camps = (c.kampanyalar || []).filter((k) => daysLeft(k.bitis) >= 1).sort((a, b) => a.bitis.localeCompare(b.bitis));
    } catch (e) {}
    if (!CATS.some((c) => c[0] === cat)) cat = "Tümü";
    renderChips(); renderList();
  } catch (e) {
    $("list").innerHTML = '<div class="empty">Haberler yüklenemedi.</div>';
  }
})();
</script>
</body>
</html>
