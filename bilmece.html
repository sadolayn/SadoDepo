<style>
  /* Sayı Bilmecesi: 80 seviye (1–40 zor, 41–80 Gizli Kural) + İşlem Bulmacası (30). Bilmeceler bu sayfada. */
  :root { --bg: #000; --card: #0d0d0d; --edge: #262626; --key: #161616; --ink: #e8e8e8; --dim: #8d8d8d; --ok: #3fc283; --bad: #ef6a4c; --gold: #e0a24f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: Inter, Roboto, "Helvetica Neue", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 400; font-feature-settings: "tnum" 1, "cv11" 1; -webkit-font-smoothing: antialiased; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 12px calc(10px + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
  .top { display: flex; align-items: center; gap: 10px; height: 62px; flex: none; }
  .top a, .top > button { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--ink); text-decoration: none; cursor: pointer; padding: 0; }
  .mod { flex: 1; display: flex; justify-content: center; }
  .mod div { display: inline-flex; border: 1px solid #2c2c2c; border-radius: 999px; overflow: hidden; padding: 3px; background: #0d0d0d; }
  .mod button { border: 0; background: none; color: var(--dim); font-family: inherit; font-weight: 400; font-size: 15px; letter-spacing: .5px; padding: 8px 16px; cursor: pointer; }
  .mod button { border-radius: 999px; } .mod button.on { background: var(--gold); color: #000; font-weight: 600; }
  .stage { flex: 1; min-height: 320px; background: var(--card); border: 1px solid var(--edge); border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 44px 10px 18px; position: relative; overflow: hidden; }
  /* Masada belli belirsiz Sadolayn imzası (diğer oyunlarda olduğu gibi) */
  .stage::before { content: ""; position: absolute; left: 12%; right: 12%; bottom: 10px; height: 18%; background: url("img/logo.png") center / contain no-repeat; opacity: .04; filter: grayscale(1) brightness(3); pointer-events: none; }
  .sv { position: absolute; left: 16px; right: 16px; top: 14px; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--dim); letter-spacing: .3px; }
  .sv .bar { flex: 1; height: 4px; border-radius: 4px; background: #222; overflow: hidden; }
  .sv .bar i { display: block; height: 100%; width: var(--pr, 0%); background: var(--gold); border-radius: 4px; }
  .sv b { color: var(--gold); font-weight: 700; }
  .stage.shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  .pz { width: 100%; text-align: center; font-weight: 400; color: #f2f2f2; letter-spacing: -.2px; line-height: 1.2; position: relative; }
  .pz .lines div { margin: 6px 0; white-space: nowrap; }
  .pz .op { display: inline-block; width: .62em; height: .62em; vertical-align: -.02em; margin: 0 .04em; }
  .pz .q { font-size: 21px; line-height: 1.5; max-width: 320px; margin: 0 auto; }
  .pz .eq { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 34px; margin: 9px 0; }
  .pz .eq svg { width: 38px; height: 38px; flex: none; }
  .pz .eq.uzun { gap: 6px; font-size: 28px; } .pz .eq.uzun svg { width: 31px; height: 31px; }
  .pz .tri { display: flex; justify-content: center; gap: 12px; }
  .pz .tri svg { width: 29%; max-width: 128px; height: auto; }
  .pz .figs { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px 22px; }
  .pz .figs svg { width: 42%; max-width: 156px; height: auto; }
  .pz .figs.tek svg { width: 70%; max-width: 230px; }
  .pz table { border-collapse: collapse; margin: 0 auto; }
  .pz td { width: 62px; height: 62px; border: 1px solid #5a5a5a; font-size: 28px; text-align: center; }
  .pz .lbl { font-size: 16.5px; color: #c6c6c6; margin-top: 16px; line-height: 1.45; font-weight: 500; }
  .pz .lbl small { color: #8f8f8f; font-weight: 400; }
  .pz .lbl small { font-size: 13px; }
  .pyr div { display: flex; justify-content: center; gap: 6px; margin: 6px 0; }
  .pyr span { width: 54px; height: 44px; border: 1px solid #6a6a6a; display: inline-flex; align-items: center; justify-content: center; font-size: 22px; }
  /* İşlem Bulmacası ızgarası */
  .xg { display: grid; grid-template-columns: 44px 24px 44px 24px 44px 24px 50px; grid-template-rows: 44px 22px 44px 22px 44px 22px 44px; gap: 4px; justify-content: center; align-items: center; justify-items: center; }
  .xg .n, .xg .x, .xg .r { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; font-size: 25px; }
  .xg .x { border: 1px solid #8a8a8a; background: #1d1d1d; color: #fff; font-family: inherit; font-weight: 400; cursor: pointer; padding: 0; border-radius: 2px; }
  .xg .x.sel { border: 2px solid #fff; background: #2d2d2d; }
  .xg .n.ac { color: var(--gold); }
  .xg .r { color: #c4c4c4; width: 50px; }
  .xg .r.bad { color: var(--bad); } .xg .r.ok { color: var(--ok); }
  .xg .o { font-size: 21px; color: #8f8f8f; }
  @media (max-height: 700px) {
    .xg { grid-template-columns: 38px 20px 38px 20px 38px 20px 44px; grid-template-rows: 38px 16px 38px 16px 38px 16px 38px; gap: 3px; }
    .xg .n, .xg .x, .xg .r { width: 38px; height: 38px; font-size: 22px; } .xg .r { width: 44px; }
    .xg .o { font-size: 18px; }
    .xg + .lbl { margin-top: 8px; font-size: 14px; }
  }
  /* Doğru cevap katmanı */
  .done { position: absolute; inset: 0; background: rgba(28,28,28,.97); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 10px; z-index: 2; }
  .done.show { display: flex; animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .done .ic { width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid var(--ok); color: var(--ok); display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .done h2 { margin: 0; font-weight: 400; font-size: 26px; }
  .done p { margin: 0; color: #bdbdbd; font-size: 16px; line-height: 1.5; max-width: 320px; }
  .done button { margin-top: 10px; min-width: 180px; height: 50px; border-radius: 4px; border: 1px solid #444; background: #191919; color: var(--ink); font-weight: 400; font-size: 18px; font-family: inherit; letter-spacing: 1px; cursor: pointer; }
  /* Alt panel */
  .pad { flex: none; margin-top: 10px; display: grid; gap: 8px; }
  .ans { height: 54px; background: transparent; border-bottom: 2px solid var(--gold); display: flex; align-items: center; padding: 0 4px 0 48px; font-size: 30px; font-weight: 600; overflow: hidden; text-align: center; position: relative; }
  .ans span { flex: 1; white-space: nowrap; overflow: hidden; }
  .ans span:empty::before { content: "Cevabın"; color: #5c5c5c; font-size: 20px; font-weight: 400; }
  .ans.isl span:empty::before { content: "Kutu seç"; font-size: 16px; }
  .ans.bad { box-shadow: inset 0 0 0 1.5px var(--bad); }
  .ans button { width: 36px; height: 36px; border: 0; background: none; color: #bbb; cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .k { height: 50px; border: 1px solid #222; border-radius: 14px; background: var(--key); color: var(--ink); font-weight: 500; font-size: 23px; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .k:active { background: #262626; }
  .k.ent { background: var(--gold); border-color: var(--gold); color: #000; }
  .k.ent:active { filter: brightness(.85); }
  /* Cevap hakkı: 4 nokta (cevap satırının solunda) */
  .hak { position: absolute; left: 6px; top: 50%; transform: translateY(-50%); display: flex; gap: 4px; font-size: 11px; color: var(--dim); font-weight: 600; }
  .hak i { width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
  .hak i.yok { background: #333; }
  /* Yanlış cevapta kısa not */
  .not { position: absolute; left: 12px; right: 12px; bottom: 12px; text-align: center; font-size: 14px; line-height: 1.4; color: #f3dca8; background: #141414; border: 1px solid #5a4320; box-shadow: 0 -10px 20px #0d0d0d; border-radius: 12px; padding: 9px 10px; opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .25s; pointer-events: none; z-index: 3; }
  .not.show { opacity: 1; transform: none; }
  #hint { color: var(--gold); }
  #hint.acik { background: color-mix(in srgb, var(--gold) 22%, #000); }
  #hint.kilit { opacity: .4; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  /* Pencereler */
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; overflow-y: auto; padding: 16px; z-index: 20; }
  .ov.show { display: flex; }
  .box { margin: auto; width: 100%; max-width: 380px; max-height: 92vh; max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--card); border: 1px solid var(--edge); border-radius: 6px; padding: 20px; text-align: center; }
  .box h3 { margin: 0 0 10px; font-weight: 400; font-size: 21px; }
  .box p { margin: 0 0 14px; color: #c8c8c8; font-size: 16px; line-height: 1.5; }
  .box .btn { display: block; width: 100%; height: 48px; margin-top: 8px; border-radius: 4px; border: 1px solid #444; background: #191919; color: var(--ink); font-weight: 400; font-size: 17px; font-family: inherit; cursor: pointer; }
  .lv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 6px 0 4px; }
  .lv button { aspect-ratio: 1; border-radius: 4px; border: 1px solid #3a3a3a; background: #1a1a1a; color: var(--ink); font-weight: 400; font-size: 17px; font-family: inherit; cursor: pointer; position: relative; }
  .lv button.ok { border-color: var(--ok); color: var(--ok); }
  .lv button.ip { border-color: var(--gold); color: var(--gold); }
  .lv button.cur { box-shadow: 0 0 0 2px #fff inset; }
  .lv button:disabled { color: #444; border-color: #262626; cursor: default; }
  .lv button i { position: absolute; right: 3px; top: 1px; font-size: 10px; font-style: normal; }
  .lvh { font-size: 12px; letter-spacing: 1.5px; color: var(--dim); text-align: left; margin: 14px 2px 6px; }
  .note { font-size: 13px; color: var(--dim); margin-top: 10px; line-height: 1.45; }
  .qzd { display: flex; justify-content: center; gap: 8px; margin: 2px 0 14px; }
  .qzd i { width: 13px; height: 13px; border-radius: 50%; border: 1px solid #666; }
  .qzd i.on { background: var(--ok); border-color: var(--ok); }
  .qzq { text-align: left; color: var(--ink) !important; font-size: 16.5px !important; }
  .qzo { display: grid; gap: 7px; }
  .qzo button { min-height: 46px; padding: 10px 12px; border-radius: 4px; border: 1px solid #3a3a3a; background: #1a1a1a; color: var(--ink); font-weight: 400; font-size: 15px; font-family: inherit; text-align: left; cursor: pointer; }
  .qzo button.ok { border-color: var(--ok); color: var(--ok); }
  .qzo button.bad { border-color: var(--bad); color: var(--bad); }
  .qzm { font-size: 14px; color: var(--dim); margin: 12px 0 2px; }
  .imza { font-size: 13px; color: #777; margin-top: 12px; letter-spacing: .5px; }
</style>

<header class="top">
  <a href="oyunlar.html" aria-label="Oyunlar" title="Oyunlar"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M15 4 7 12l8 8"/></svg></a>
  <div class="mod"><div id="mod"><button type="button" data-m="b">Bilmece</button><button type="button" data-m="i">İşlem</button></div></div>
  <button type="button" id="lvBtn" aria-label="Seviyeler" title="Seviyeler"><svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="5" r="1.9"/><circle cx="12" cy="5" r="1.9"/><circle cx="19" cy="5" r="1.9"/><circle cx="5" cy="12" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="19" cy="12" r="1.9"/><circle cx="5" cy="19" r="1.9"/><circle cx="12" cy="19" r="1.9"/><circle cx="19" cy="19" r="1.9"/></svg></button>

  <div class="not" id="not" role="status"></div>
  <div class="sv" id="sv"></div>
  <div class="pz" id="pz"></div>

</main>

  <div class="row1">
    <div class="ans" id="ans"><span class="hak" id="hak" aria-label="Kalan cevap hakkı"></span><span id="val"></span><button type="button" id="del" aria-label="Sil"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M21 5H9l-6 7 6 7h12z"/><path d="m11 9 6 6m0-6-6 6"/></svg></button></div>
    <button class="k" type="button" id="hint" aria-label="İpucu"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M9.2 9.3a2.9 2.9 0 0 1 5.6 1c0 1.9-2.8 2.4-2.8 4.2"/><circle cx="12" cy="17.6" r=".6" fill="currentColor"/></svg></button>
    <button class="k ent" type="button" id="ent" aria-label="Tamam"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12.5 9.5 18 20 6.5"/></svg></button>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const oku = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (e) { return d; } };
const yaz = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// ---------- Çizim yardımcıları ----------
const STK = 'fill="none" stroke="#d6d6d6" stroke-width="1.3"';
const TX = (x, y, t, s = 21) => `<text x="${x}" y="${y}" text-anchor="middle" font-size="${s}" font-weight="400" fill="#f0f0f0" font-family="Inter, Roboto, system-ui, sans-serif">${t}</text>`;
const SEKIL = {
  kare: `<svg viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" ${STK}/></svg>`,
  daire: `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" ${STK}/></svg>`,
  ucgen: `<svg viewBox="0 0 40 40"><path d="M20 4 37 35H3z" ${STK}/></svg>`,
  karo: `<svg viewBox="0 0 40 40"><path d="M20 2 38 20 20 38 2 20z" ${STK}/></svg>`,
  yildiz: `<svg viewBox="0 0 40 40"><path d="${(() => { let d = ""; for (let i = 0; i < 10; i++) { const r = i % 2 ? 7.5 : 17, a = -Math.PI / 2 + (i * Math.PI) / 5; d += (i ? "L" : "M") + (20 + r * Math.cos(a)).toFixed(1) + " " + (21 + r * Math.sin(a)).toFixed(1); } return d + "z"; })()}" ${STK}/></svg>`,
};
// Gizli işlem sembolleri: şekillerle aynı ince çizgi
const OPS = (() => { const o = (d) => `<svg class="op" viewBox="0 0 24 24" fill="none" stroke="#e8e8e8" stroke-width="1.5">${d}</svg>`;
  return { "⊕": o('<circle cx="12" cy="12" r="10"/><path d="M12 6.5v11M6.5 12h11"/>'), "⊞": o('<rect x="2.5" y="2.5" width="19" height="19"/><path d="M12 6.5v11M6.5 12h11"/>'), "⊛": o('<circle cx="12" cy="12" r="10"/><path d="M12 6v12M6.8 9l10.4 6M6.8 15l10.4-6"/>'), "◇": o('<path d="M12 1.5 22.5 12 12 22.5 1.5 12z"/>'), "⋆": o('<path d="M12 3.5l2.5 5.6 6 .6-4.5 4 1.3 6-5.3-3.1-5.3 3.1 1.3-6-4.5-4 6-.6z"/>') }; })();
const tok = (t) => (SEKIL[t] ? SEKIL[t] : `<span>${t}</span>`);
const ucgen = ([a, b, c]) => `<svg viewBox="0 0 120 110">${TX(22, 24, a, 25)}${TX(98, 24, b, 25)}<path d="M40 33h40L60 66z" ${STK}/>${TX(60, 96, c, 25)}</svg>`;
const izgara = (n) => { const s = 150, c = s / n; let l = ""; for (let i = 1; i < n; i++) l += `<path d="M${i * c} 0V${s}M0 ${i * c}H${s}" ${STK}/>`; return `<svg viewBox="-2 -2 154 154" style="width:180px;height:180px"><rect x="0" y="0" width="${s}" height="${s}" ${STK}/>${l}</svg>`; };
const dikdortgen = ([r, c]) => { const W = 60 * c, H = 60 * r; let l = ""; for (let i = 1; i < c; i++) l += `<path d="M${i * 60} 0V${H}" ${STK}/>`; for (let i = 1; i < r; i++) l += `<path d="M0 ${i * 60}H${W}" ${STK}/>`; return `<svg viewBox="-2 -2 ${W + 4} ${H + 4}" style="width:${Math.min(220, 40 * c + 60)}px;height:auto"><rect x="0" y="0" width="${W}" height="${H}" ${STK}/>${l}</svg>`; };
const ucgenIzgara = (n) => {
  const A = [80, 6], B = [6, 134], C = [154, 134], at = (P, Q, k) => [P[0] + ((Q[0] - P[0]) * k) / n, P[1] + ((Q[1] - P[1]) * k) / n];
  let l = "";
  for (let k = 1; k < n; k++) [[A, B, A, C], [B, A, B, C], [C, A, C, B]].forEach(([P, Q, R, S]) => { const u = at(P, Q, k), v = at(R, S, k); l += `<path d="M${u[0].toFixed(1)} ${u[1].toFixed(1)}L${v[0].toFixed(1)} ${v[1].toFixed(1)}" ${STK}/>`; });
  return `<svg viewBox="0 0 160 140" style="width:220px;height:auto"><path d="M${A}L${B}L${C}z" ${STK}/>${l}</svg>`;
};
const piramit = (rows) => `<div class="pyr">${rows.map((r) => `<div>${r.map((x) => `<span>${x}</span>`).join("")}</div>`).join("")}</div><div class="lbl">Her kutu, altındaki iki kutunun toplamı</div>`;
const merkez = (x, y, v) => `<circle cx="${x}" cy="${y}" r="16" ${STK}/>${TX(x, y + 7, v, 20)}`;
// Karo: [üst, sağ, alt, sol, orta]
const karo = ([t, r, b, l, m]) => `<svg viewBox="0 0 140 140"><path d="M70 4 136 70 70 136 4 70z" ${STK}/>${TX(70, 40, t)}${TX(108, 77, r)}${TX(70, 120, b)}${TX(32, 77, l)}${merkez(70, 70, m)}</svg>`;
// Çember: dilimler saat yönünde (üstten), ortada sonuç
const cember = ([dil, m]) => {
  const n = dil.length, cx = 70, cy = 70, R = 64, r0 = 18; let s = `<circle cx="${cx}" cy="${cy}" r="${R}" ${STK}/>`;
  for (let k = 0; k < n; k++) { const a = ((-90 + (k + 0.5) * (360 / n)) * Math.PI) / 180; s += `<path d="M${(cx + r0 * Math.cos(a)).toFixed(1)} ${(cy + r0 * Math.sin(a)).toFixed(1)}L${(cx + R * Math.cos(a)).toFixed(1)} ${(cy + R * Math.sin(a)).toFixed(1)}" ${STK}/>`; }
  dil.forEach((v, k) => { const a = ((-90 + k * (360 / n)) * Math.PI) / 180; s += TX(cx + 42 * Math.cos(a), cy + 42 * Math.sin(a) + 7, v, n > 4 ? 19 : 21); });
  return `<svg viewBox="0 0 140 140">${s}${merkez(cx, cy, m)}</svg>`;

const SOZ3 = ["Son hakkın! Kuralı bulmadan basma, biz bekleriz ☕", "Son 1 hak · Şans oyunu değil bu, kalemi kâğıdı al 📝", "Son hakkın kaldı · Emin olunca bas 🎯"];
const hakOf = (p) => ((p.hak ||= {}), (p.mola ||= {}), p);
const molada = () => { const p = hakOf(P()); if (p.mola[p.i] && p.mola[p.i] <= Date.now()) { delete p.mola[p.i]; delete p.hak[p.i]; kaydet(); } return !!p.mola[p.i]; };
let notT = null;
function notGoster(t) { const n = $("not"); n.innerHTML = t; n.classList.add("show"); clearTimeout(notT); notT = setTimeout(() => n.classList.remove("show"), 3200); }
function hakCiz() {
  const p = hakOf(P()), el = $("hak"); if (!el) return;
  if (p.coz[p.i]) { el.innerHTML = ""; return; }
  if (molada()) { el.textContent = "⏳ " + sure(p.mola[p.i] - Date.now()).replace(" dk ", ":").replace(" sn", ""); return; }
  const kalan = HAK - (p.hak[p.i] || 0);
  el.innerHTML = Array.from({ length: HAK }, (_, k) => `<i class="${k < kalan ? "" : "yok"}"></i>`).join("");
}
function yanlis() {
  const p = hakOf(P()), n = (p.hak[p.i] || 0) + 1, kalan = HAK - n;
  salla();
  if (kalan <= 0) { p.mola[p.i] = Date.now() + MOLA; p.hak[p.i] = 0; kaydet(); hakCiz(); setTimeout(() => molaEkran(true), 500); return; }
  p.hak[p.i] = n; kaydet(); hakCiz();
  const sec = (a) => a[Math.floor(Math.random() * a.length)];
  notGoster(n === 1 ? `Olmadı · <b>${kalan} hakkın</b> kaldı` : n === 2 ? `${sec(SOZ2)} · <b>${kalan} hakkın</b> kaldı` : sec(SOZ3));
}
let molaT = null;
function molaEkran(yeni) {
  const p = hakOf(P());
  pencere(`<h3>⏳ Kısa bir mola</h3><p>${yeni ? "4 hakkın da bitti." : "Bu bilmecede mola süresindesin."} Bilmece kaçmıyor; <b id="mkalan" style="color:var(--gold);white-space:nowrap"></b> sonra yeniden 4 hakkın olacak.</p>
    <p style="font-size:14.5px;color:var(--dim)">Bu arada üzerinde düşünebilir ya da 💡 ipucu alabilirsin. Tahminle değil, kuralı bularak çözünce çok daha keyifli 🙂</p><button class="btn" id="kp" type="button">Tamam</button>`);
  const tik = () => { const k = $("mkalan"); if (!k || !$("ov").classList.contains("show")) return clearInterval(molaT); if (!molada()) { clearInterval(molaT); kapat(); hakCiz(); return; } k.textContent = sure(p.mola[p.i] - Date.now()); };
  clearInterval(molaT); tik(); molaT = setInterval(tik, 1000);
  $("kp").onclick = kapat;
}
setInterval(() => { if (molada() || $("hak").textContent.startsWith("⏳")) hakCiz(); }, 1000);
function sonraki() {
  const p = P();
  if (!p.coz[p.i]) return; // bilinmeden geçilmez
  if (p.i >= TOP() - 1) return bitti();
  p.i++; kaydet(); ciz();
}
function pencere(h) { $("box").innerHTML = h; $("ov").classList.add("show"); }
const kapat = () => $("ov").classList.remove("show");
$("ov").onclick = (e) => { if (e.target === $("ov")) kapat(); };

// ---------- İpucu: 5 İş Bankası sorusunu art arda bil ----------
// Bir yanlışta seri sıfırlanır ve ipucu 1 saat kilitlenir (iki modda ortak).
// Cevaplanmamış soru kaydedilir: Vazgeç'e basıp ya da sayfayı yenileyip soru değiştirilemez.
const GEREK = 5, BEKLE = 36e5;
let deste = [], sayac = null;
function isqSec() {
  const pool = typeof ISQ !== "undefined" ? ISQ : [];
  const bekleyen = ST.ipSoru && pool.find((q) => q[0] === ST.ipSoru);
  if (bekleyen) return bekleyen;
  if (!deste.length) deste = pool.map((_, i) => i).sort(() => Math.random() - 0.5);
  const q = pool[deste.pop()]; ST.ipSoru = q[0]; kaydet(); return q;
}
const kilitli = () => (ST.ipKilit || 0) > Date.now();
function kilitIsaret() { if (ST.ipKilit && !kilitli()) { delete ST.ipKilit; kaydet(); } $("hint").classList.toggle("kilit", kilitli() && !P().ip[P().i]); }
const sure = (ms) => { const t = Math.max(0, Math.ceil(ms / 1000)), d = Math.floor(t / 60), sn = t % 60; return d ? `${d} dk ${String(sn).padStart(2, "0")} sn` : `${sn} sn`; };
function kilitEkran(yeni) {
  pencere(`<h3>⏳ Biraz mola</h3><p>${yeni ? "Seri bozuldu." : "Bir soruyu kaçırmıştın."} İpucu için <b id="kalan" style="color:var(--gold);white-space:nowrap"></b> sonra yeniden dene.</p>
    <p style="font-size:14.5px;color:var(--dim)">Tekrar denediğinde ${GEREK} soruyu art arda bilmen gerekiyor. Bu arada bilmeceyi kendin çözmeye devam edebilirsin 🙂</p><button class="btn" id="kp" type="button">Tamam</button>`);
  const tik = () => { if (!$("kalan") || !$("ov").classList.contains("show")) return clearInterval(sayac); if (!kilitli()) { clearInterval(sayac); kilitIsaret(); kapat(); return; } $("kalan").textContent = sure(ST.ipKilit - Date.now()); };
  clearInterval(sayac); tik(); sayac = setInterval(tik, 1000);
  $("kp").onclick = kapat;
}
function ipucu() {
  if (acikMi()) return;
  const p = P();
  if (ST.mod === "i" && p.ip[p.i]) return pencere(`<h3>💡 İpucu</h3><p>Bu bulmacanın ipucunu kullandın; altın renkli rakam ipucuyla açıldı.</p><button class="btn" id="kp" type="button">Tamam</button>`), ($("kp").onclick = kapat);
  if (p.ip[p.i] || typeof ISQ === "undefined" || !ISQ.length) return ipucuGoster();
  if (kilitli()) return kilitEkran(false);
  isqSor();
}
function ipucuGoster() {
  const p = P(); p.ip[p.i] = true; $("hint").classList.add("acik"); kilitIsaret();
  if (ST.mod === "i") {
    const L = ISL[p.i], ac = p.ac[p.i] || [], gz = L.g.filter((k) => !ac.includes(k)), k = gz.find((x) => dol[x] !== L.n[x]) ?? gz[0];
    p.ac[p.i] = ac.concat([k]); delete dol[k]; kaydet(); sec = null;
    pencere(`<h3>💡 İpucu</h3><p>Bir kutuyu açtım: <b style="color:var(--gold)">${L.n[k]}</b><br>Altın renkle gösterdim.</p><button class="btn" id="kp" type="button">Tamam</button>`);
    $("kp").onclick = () => { kapat(); islemCiz(); };
    return;
  }
  kaydet();
  pencere(`<h3>💡 İpucu</h3><p>${SEV[p.i].i}</p><button class="btn" id="kp" type="button">Tamam</button>`);
  $("kp").onclick = kapat;
}
function isqSor() {
  const p = P(), n = p.isq[p.i] || 0, q = isqSec();
  const ord = q[1].map((_, i) => i).sort(() => Math.random() - 0.5), dogru = ord.indexOf(q[2]);
  pencere(`<h3>💡 ${GEREK} soruyu art arda bil</h3>
    <div class="qzd">${Array.from({ length: GEREK }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>
    <p class="qzq"></p><div class="qzo">${ord.map((_, k) => `<button type="button" data-k="${k}"></button>`).join("")}</div>
    <div class="qzm" id="qzm">${n} / ${GEREK} · bir yanlışta seri sıfırlanır, 1 saat beklenir</div><button class="btn" id="kp" type="button">Sonra cevaplarım</button>`);
  $("box").querySelector(".qzq").textContent = q[0];
  $("box").querySelectorAll(".qzo button").forEach((b, k) => (b.textContent = q[1][ord[k]]));
  $("kp").onclick = kapat;
  $("box").querySelector(".qzo").onclick = (e) => {
    const b = e.target.closest("button[data-k]"); if (!b || b.disabled) return;
    $("box").querySelectorAll(".qzo button").forEach((x) => { x.disabled = true; if (+x.dataset.k === dogru) x.classList.add("ok"); });
    delete ST.ipSoru;
    if (+b.dataset.k === dogru) {
      const m = (p.isq[p.i] || 0) + 1; p.isq[p.i] = m; kaydet();
      $("box").querySelectorAll(".qzd i")[m - 1].classList.add("on");
      $("qzm").innerHTML = `<b style="color:var(--ok)">Doğru!</b> ${m} / ${GEREK}`;
      setTimeout(() => (m >= GEREK ? ipucuGoster() : isqSor()), 750);
    } else {
      b.classList.add("bad"); p.isq[p.i] = 0; ST.ipKilit = Date.now() + BEKLE; kaydet(); kilitIsaret();
      $("box").querySelectorAll(".qzd i").forEach((x) => x.classList.remove("on"));
      $("qzm").innerHTML = `<b style="color:var(--bad)">Olmadı</b> · doğrusu yeşil olan<br>Seri sıfırlandı, 1 saat sonra yeniden dene.`;
      $("kp").textContent = "Tamam"; $("kp").onclick = () => kilitEkran(true);
    }
  };
}
setInterval(kilitIsaret, 15000);
// Sadolayn IQ (eğlence amaçlı): ipucusuz çözüm tam puan, ipuculu yarım puan
function iq() {
  const say = (p, v) => Object.values(p.coz).filter((x) => x === v).length;
  const ok = say(ST, "ok") + say(ST.isl, "ok"), ip = say(ST, "ip") + say(ST.isl, "ip");
  if (ok + ip < 3) return "";
  const n = Math.round(85 + (75 * (ok + ip / 2)) / (SEV.length + ISL.length));
  const ad = n >= 145 ? "Einstein bile kıskanır 🤯" : n >= 130 ? "Dahi sınırında 🧠" : n >= 115 ? "Keskin zekâ ⚡" : n >= 100 ? "Isınıyor 🔥" : "Daha yeni başladın 🙂";
  return `<div class="note" style="margin:0 0 10px"><b style="font-size:17px;color:var(--gold, #e0a24f)">🧠 Sadolayn IQ: ${n}</b><br>${ad} · <small>eğlence amaçlı</small></div>`;
}
function seviyeler() {
  const p = P(), n = TOP(), ok = Object.values(p.coz).filter((x) => x === "ok").length, ip = Object.values(p.coz).filter((x) => x === "ip").length;
  const btn = (i) => { const c = p.coz[i]; return `<button type="button" data-i="${i}" class="${c === "ok" ? "ok" : c === "ip" ? "ip" : ""}${i === p.i ? " cur" : ""}"${i > p.acik ? " disabled" : ""}>${i + 1}${c === "ip" ? "<i>💡</i>" : i > p.acik ? "<i>🔒</i>" : ""}</button>`; };
  const grup = (a, b, bas) => `${bas ? `<div class="lvh">${bas}</div>` : ""}<div class="lv">${Array.from({ length: b - a }, (_, k) => btn(a + k)).join("")}</div>`;
  pencere(`<h3>${ST.mod === "i" ? "İşlem Bulmacası" : "Seviyeler"}</h3>${iq()}${ST.mod === "i" ? grup(0, n) : grup(0, 40, "1 – 40") + grup(40, n, "41 – 80 · GİZLİ KURAL")}
    <div class="note">✓ ${ok} kendin çözdün · 💡 ${ip} ipucuyla<br>Bilinmeyen seviyeden sonrakine geçilmez</div><button class="btn" id="kp" type="button">Kapat</button>`);
  $("box").querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => { p.i = +b.dataset.i; kaydet(); kapat(); ciz(); }));
  $("kp").onclick = kapat;
}
function bitti() {
  const p = P(), ok = Object.values(p.coz).filter((x) => x === "ok").length;
  pencere(`<h3>🏆 Hepsini bitirdin!</h3><p>${TOP()} ${ST.mod === "i" ? "işlem bulmacasının" : "bilmecenin"} <b>${ok}</b> tanesini ipucusuz çözdün. Yeni paketler yakında 🙂</p>${iq()}
    <button class="btn" id="kp" type="button">Seviyelere bak</button>${ST.mod === "i" ? "" : `<button class="btn" id="gec" type="button">İşlem Bulmacası'na geç</button>`}<div class="imza">Bilmeceler ✍️ Sadolayn</div>`);
  $("kp").onclick = seviyeler;
  if ($("gec")) $("gec").onclick = () => { kapat(); ST.mod = "i"; kaydet(); ciz(); };
}

// ---------- Tuşlar ----------
{ const K = $("keys"), b = (n) => `<button class="k" type="button" data-k="${n}">${n}</button>`; K.innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9].map(b).join(""); K.append($("hint")); K.insertAdjacentHTML("beforeend", b(0)); K.append($("ent")); }
$("keys").onclick = (e) => { const b = e.target.closest("[data-k]"); if (b) bas(b.dataset.k); };
$("del").onclick = sil;
let basT; $("del").onpointerdown = () => { basT = setTimeout(() => { if (ST.mod === "i") { dol = {}; kontrol = null; islemCiz(); } else { val = ""; goster(); } }, 550); };
["pointerup", "pointerleave"].forEach((ev) => $("del").addEventListener(ev, () => clearTimeout(basT)));
$("ent").onclick = tamam;
$("next").onclick = sonraki;
$("hint").onclick = ipucu;
$("lvBtn").onclick = seviyeler;
document.querySelectorAll("#mod button").forEach((b) => (b.onclick = () => { if (ST.mod === b.dataset.m) return; ST.mod = b.dataset.m; kaydet(); ciz(); }));
document.addEventListener("keydown", (e) => {
  if ($("ov").classList.contains("show")) { if (e.key === "Escape") kapat(); return; }
  if (/^\d$/.test(e.key)) bas(e.key); else if (e.key === "Backspace") sil(); else if (e.key === "Enter") { e.preventDefault(); tamam(); }
});
window.addEventListener("resize", () => { if (ST.mod === "b" && !$("done").classList.contains("show")) { const v = val; ciz(); val = v; goster(); } });
ciz();
</script>
