<style>
  /* Sayı Bilmecesi: seviye seviye zorlaşan sade bilmeceler. Bilmeceler bu sayfada (SEV listesi). */
  :root { --bg: #1c1c1c; --card: #232323; --edge: #2e2e2e; --key: #191919; --ink: #e8e8e8; --dim: #8d8d8d; --ok: #3fc283; --bad: #ef6a4c; --gold: #e0a24f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); }
  body { font-family: Roboto, "Helvetica Neue", system-ui, -apple-system, "Segoe UI", sans-serif; font-weight: 300; max-width: 480px; margin: 0 auto; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding: 0 12px calc(10px + env(safe-area-inset-bottom)); user-select: none; -webkit-user-select: none; }
  .top { display: flex; align-items: center; gap: 10px; height: 64px; flex: none; }
  .top a, .top button { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--ink); text-decoration: none; cursor: pointer; padding: 0; }
  .top h1 { flex: 1; margin: 0; font-size: 22px; font-weight: 300; letter-spacing: .3px; }
  .top h1 small { font-size: 13px; color: var(--dim); margin-left: 6px; }
  .stage { flex: 1; min-height: 300px; background: var(--card); border: 1px solid var(--edge); border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 12px; position: relative; overflow: hidden; }
  .stage.shake { animation: shake .35s; }
  @keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
  .pz { width: 100%; text-align: center; font-weight: 300; color: #e9e9e9; line-height: 1.2; }
  .pz .lines div { font-size: 38px; margin: 6px 0; white-space: nowrap; }
  .pz .q { font-size: 22px; line-height: 1.45; max-width: 300px; }
  .pz .eq { display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 36px; margin: 10px 0; }
  .pz .eq svg { width: 40px; height: 40px; flex: none; }
  .pz .tri { display: flex; justify-content: center; gap: 12px; }
  .pz .tri svg { width: 29%; max-width: 128px; height: auto; }
  .pz table { border-collapse: collapse; margin: 0 auto; }
  .pz td { width: 64px; height: 64px; border: 1px solid #5a5a5a; font-size: 30px; text-align: center; }
  .pz .lbl { font-size: 18px; color: var(--dim); margin-top: 14px; }
  /* Doğru cevap katmanı */
  .done { position: absolute; inset: 0; background: rgba(28,28,28,.96); display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 10px; }
  .done.show { display: flex; animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  .done .ic { width: 64px; height: 64px; border-radius: 50%; border: 1.5px solid var(--ok); color: var(--ok); display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .done h2 { margin: 0; font-weight: 300; font-size: 26px; }
  .done p { margin: 0; color: #bdbdbd; font-size: 16px; line-height: 1.5; max-width: 320px; }
  .done button { margin-top: 10px; min-width: 180px; height: 50px; border-radius: 4px; border: 1px solid #444; background: #191919; color: var(--ink); font-weight: 300; font-size: 18px; font-family: inherit; letter-spacing: 1px; cursor: pointer; }
  /* Alt panel: cevap, ipucu, tamam ve tuşlar */
  .pad { flex: none; margin-top: 10px; background: var(--card); border: 1px solid var(--edge); border-radius: 4px; padding: 8px; display: grid; gap: 7px; }
  .row1 { display: grid; grid-template-columns: 2fr 1fr 2fr; gap: 7px; }
  .ans { height: 52px; background: var(--key); border-radius: 3px; display: flex; align-items: center; padding: 0 6px 0 12px; font-size: 24px; overflow: hidden; }
  .ans span { flex: 1; white-space: nowrap; overflow: hidden; }
  .ans span:empty::before { content: "Cevap"; color: #555; }
  .ans.bad { box-shadow: inset 0 0 0 1.5px var(--bad); }
  .ans button { width: 36px; height: 36px; border: 0; background: none; color: #bbb; cursor: pointer; padding: 0; display: inline-flex; align-items: center; justify-content: center; }
  .k { height: 52px; border: 0; border-radius: 3px; background: var(--key); color: var(--ink); font-weight: 300; font-size: 22px; font-family: inherit; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .k:active { background: #2a2a2a; }
  .k.ent { font-size: 18px; letter-spacing: 1.5px; }
  .keys { display: grid; grid-template-columns: repeat(5, 1fr); gap: 7px; }
  /* Pencereler: ipucu ve seviye listesi */
  .ov { position: fixed; inset: 0; background: rgba(0,0,0,.72); display: none; overflow-y: auto; padding: 16px; z-index: 20; }
  .ov.show { display: flex; }
  .box { margin: auto; width: 100%; max-width: 380px; max-height: 92vh; max-height: calc(100dvh - 32px); overflow-y: auto; background: var(--card); border: 1px solid var(--edge); border-radius: 6px; padding: 20px; text-align: center; }
  .box h3 { margin: 0 0 10px; font-weight: 300; font-size: 22px; }
  .box p { margin: 0 0 14px; color: #c8c8c8; font-size: 16px; line-height: 1.5; }
  .box .btn { display: block; width: 100%; height: 48px; margin-top: 8px; border-radius: 4px; border: 1px solid #444; background: #191919; color: var(--ink); font-weight: 300; font-size: 17px; font-family: inherit; cursor: pointer; }
  .box .btn.gold { border-color: var(--gold); color: var(--gold); }
  .lv { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 6px 0 4px; }
  .lv button { aspect-ratio: 1; border-radius: 4px; border: 1px solid #3a3a3a; background: #1a1a1a; color: var(--ink); font-weight: 300; font-size: 18px; font-family: inherit; cursor: pointer; position: relative; }
  .lv button.ok { border-color: var(--ok); color: var(--ok); }
  .lv button.ip { border-color: var(--gold); color: var(--gold); }
  .lv button.cur { box-shadow: 0 0 0 2px #fff inset; }
  .lv button:disabled { color: #444; border-color: #262626; cursor: default; }
  .lv button i { position: absolute; right: 3px; top: 1px; font-size: 10px; font-style: normal; }
  .pz .lbl small { font-size: 14px; }
  .pyr div { display: flex; justify-content: center; gap: 6px; margin: 6px 0; }
  .pyr span { width: 56px; height: 46px; border: 1px solid #6a6a6a; display: inline-flex; align-items: center; justify-content: center; font-size: 24px; }
  /* İpucu için İş Bankası soruları */
  .qzd { display: flex; justify-content: center; gap: 8px; margin: 2px 0 14px; }
  .qzd i { width: 13px; height: 13px; border-radius: 50%; border: 1px solid #666; }
  .qzd i.on { background: var(--ok); border-color: var(--ok); }
  .qzq { text-align: left; color: var(--ink) !important; font-size: 16.5px !important; }
  .qzo { display: grid; gap: 7px; }
  .qzo button { min-height: 46px; padding: 10px 12px; border-radius: 4px; border: 1px solid #3a3a3a; background: #1a1a1a; color: var(--ink); font-weight: 300; font-size: 15px; font-family: inherit; text-align: left; cursor: pointer; }
  .qzo button.ok { border-color: var(--ok); color: var(--ok); }
  .qzo button.bad { border-color: var(--bad); color: var(--bad); }
  .qzm { font-size: 14px; color: var(--dim); margin: 12px 0 2px; }
  #hint.acik { color: var(--gold); }
  .note { font-size: 13px; color: var(--dim); margin-top: 10px; }
</style>

<script>
const $ = (id) => document.getElementById(id);
const oku = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (e) { return d; } };
const yaz = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

// ---------- Çizim yardımcıları ----------
const STK = 'fill="none" stroke="#d6d6d6" stroke-width="1.3"';
const SEKIL = {
  kare: `<svg viewBox="0 0 40 40"><rect x="4" y="4" width="32" height="32" ${STK}/></svg>`,
  daire: `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" ${STK}/></svg>`,
  ucgen: `<svg viewBox="0 0 40 40"><path d="M20 4 37 35H3z" ${STK}/></svg>`,
  karo: `<svg viewBox="0 0 40 40"><path d="M20 2 38 20 20 38 2 20z" ${STK}/></svg>`,
  yildiz: `<svg viewBox="0 0 40 40"><path d="${(() => { let d = ""; for (let i = 0; i < 10; i++) { const r = i % 2 ? 7.5 : 17, a = -Math.PI / 2 + (i * Math.PI) / 5; d += (i ? "L" : "M") + (20 + r * Math.cos(a)).toFixed(1) + " " + (21 + r * Math.sin(a)).toFixed(1); } return d + "z"; })()}" ${STK}/></svg>`,
};
const tok = (t) => (SEKIL[t] ? SEKIL[t] : `<span>${t}</span>`);
const ucgen = ([a, b, c]) => `<svg viewBox="0 0 120 110"><text x="22" y="24" text-anchor="middle" font-size="25" font-weight="300" fill="#e6e6e6" font-family="inherit">${a}</text><text x="98" y="24" text-anchor="middle" font-size="25" font-weight="300" fill="#e6e6e6" font-family="inherit">${b}</text><path d="M40 33h40L60 66z" ${STK}/><text x="60" y="96" text-anchor="middle" font-size="25" font-weight="300" fill="#e6e6e6" font-family="inherit">${c}</text></svg>`;
const izgara = (n) => { const s = 150, c = s / n; let l = ""; for (let i = 1; i < n; i++) l += `<path d="M${i * c} 0V${s}M0 ${i * c}H${s}" ${STK}/>`; return `<svg viewBox="-2 -2 154 154" style="width:170px;height:170px"><rect x="0" y="0" width="${s}" height="${s}" ${STK}/>${l}</svg>`; };
// 2 satır × 3 sütun dikdörtgen ızgara
const dikdortgen = () => `<svg viewBox="-2 -2 184 124" style="width:220px;height:auto"><rect x="0" y="0" width="180" height="120" ${STK}/><path d="M60 0V120M120 0V120M0 60H180" ${STK}/></svg>`;
// Kenarı n parçaya bölünmüş üçgen
const ucgenIzgara = (n) => {
  const A = [80, 6], B = [6, 134], C = [154, 134], at = (P, Q, k) => [P[0] + ((Q[0] - P[0]) * k) / n, P[1] + ((Q[1] - P[1]) * k) / n];
  let l = "";
  for (let k = 1; k < n; k++) [[A, B, A, C], [B, A, B, C], [C, A, C, B]].forEach(([P, Q, R, S]) => { const u = at(P, Q, k), v = at(R, S, k); l += `<path d="M${u[0].toFixed(1)} ${u[1].toFixed(1)}L${v[0].toFixed(1)} ${v[1].toFixed(1)}" ${STK}/>`; });
  return `<svg viewBox="0 0 160 140" style="width:210px;height:auto"><path d="M${A}L${B}L${C}z" ${STK}/>${l}</svg>`;
};
// Sayı piramidi: her kutu, altındaki iki kutunun toplamı
const piramit = (rows) => `<div class="pyr">${rows.map((r) => `<div>${r.map((x) => `<span>${x}</span>`).join("")}</div>`).join("")}</div><div class="lbl">Her kutu, altındaki iki kutunun toplamı</div>`;

// ---------- Bilmeceler (zordan daha zora) ----------
// t: seri | islem | esle | sekil | ucgen | kare | dikdortgen | ucgenSay | piramit | tablo | soru · c: cevap · i: ipucu · a: açıklama
const SEV = [
  { t: "seri", p: "2, 5, 11, 23, 47, ?", c: 95, i: "Her sayıyı ikiyle çarp, sonra bir şey ekle.", a: "Her sayı: önceki × 2 + 1 → 47 × 2 + 1 = 95" },
  { t: "islem", p: "8 ÷ 2 × (2 + 2) = ?", c: 16, i: "Önce parantez; bölme ve çarpma soldan sağa.", a: "2 + 2 = 4 → 8 ÷ 2 = 4 → 4 × 4 = 16" },
  { t: "esle", p: ["3 → 8", "5 → 24", "7 → 48", "9 → ?"], c: 80, i: "Sayının karesine bak.", a: "Karesinin 1 eksiği: 9 × 9 − 1 = 80" },
  { t: "sekil", p: [["kare", "+", "ucgen", "=", "13"], ["kare", "−", "ucgen", "=", "5"], ["kare", "×", "ucgen", "=", "?"]], c: 36, i: "İlk iki satırı alt alta topla.", a: "2 kare = 18 → kare = 9, üçgen = 4 → 9 × 4 = 36" },
  { t: "seri", p: "7, 10, 8, 11, 9, 12, ?", c: 10, i: "Bir artıyor, bir azalıyor.", a: "+3, −2, +3, −2… → 12 − 2 = 10" },
  { t: "islem", p: "6 − 6 × 0 + 2 ÷ 2 = ?", c: 7, i: "Sıfırla çarpılan şey sıfır olur.", a: "6 × 0 = 0, 2 ÷ 2 = 1 → 6 − 0 + 1 = 7" },
  { t: "ucgen", p: [[5, 3, 7], [6, 4, 14], [7, 5, "?"]], c: 23, i: "Çarpımla toplamı karşılaştır.", a: "Çarpım − toplam: 7 × 5 − (7 + 5) = 35 − 12 = 23" },
  { t: "seri", p: "0, 3, 8, 15, 24, ?", c: 35, i: "1, 4, 9, 16, 25 dizisine benziyor mu?", a: "Kare sayıların 1 eksiği: 6 × 6 − 1 = 35" },
  { t: "soru", p: "1'den 100'e kadar bütün sayılar yazılırken kaç tane 9 rakamı kullanılır?", c: 20, i: "Birler basamağındaki ve onlar basamağındaki 9'ları ayrı say.", a: "Birler basamağında 10 tane (9, 19 … 99), onlar basamağında 10 tane (90–99) → 20" },
  { t: "sekil", p: [["daire", "+", "daire", "+", "kare", "=", "20"], ["daire", "+", "kare", "+", "kare", "=", "22"], ["daire", "+", "kare", "=", "?"]], c: 14, i: "İki satırı topla, kaç daire ve kaç kare olur?", a: "Toplayınca 3 daire + 3 kare = 42 → daire + kare = 14" },
  { t: "seri", p: "1, 2, 4, 7, 11, 16, ?", c: 22, i: "Aradaki farklar: 1, 2, 3, 4…", a: "Farklar birer artıyor: 16 + 6 = 22" },
  { t: "soru", p: "5 makine 5 dakikada 5 parça üretiyor. 100 makine 100 parçayı kaç dakikada üretir?", c: 5, i: "Bir makine bir parçayı kaç dakikada üretiyor?", a: "Her makine 1 parçayı 5 dakikada üretir; 100 makine aynı anda 100 parça → 5 dakika" },
  { t: "kare", p: 3, c: 14, i: "1×1, 2×2 ve 3×3 kareleri ayrı ayrı say.", a: "9 küçük + 4 orta + 1 büyük = 14 kare" },
  { t: "esle", p: ["21 → 3", "47 → 11", "385 → 16", "999 → ?"], c: 27, i: "Rakamlarla bir işlem yapılıyor.", a: "Rakamların toplamı: 9 + 9 + 9 = 27" },
  { t: "islem", p: "1 + 2 + 3 + … + 100 = ?", c: 5050, i: "Baştan ve sondan eşleştir: 1 + 100, 2 + 99…", a: "50 çift, her biri 101 → 50 × 101 = 5050" },
  { t: "seri", p: "3, 6, 18, 72, ?", c: 360, i: "Çarpan her seferinde değişiyor.", a: "× 2, × 3, × 4, × 5 → 72 × 5 = 360" },
  { t: "piramit", p: [["30"], ["", ""], ["5", "?", "9"]], c: 8, i: "Ortadaki kutuları harflerle yaz: tepe = 5 + 2 × ? + 9", a: "Tepe = 5 + 2 × ? + 9 = 30 → 2 × ? = 16 → ? = 8" },
  { t: "soru", p: "Bir salyangoz 10 metrelik kuyunun dibinde. Gündüz 3 m tırmanıyor, gece 2 m kayıyor. Kaçıncı gün kuyudan çıkar?", c: 8, i: "Son gün gece kaymaya fırsat bulamaz.", a: "Her gün net 1 m: 7. gecenin sonunda 7 m'de; 8. gündüz 3 m tırmanıp çıkar" },
  { t: "ucgen", p: [[7, 3, 40], [9, 4, 65], [8, 5, "?"]], c: 39, i: "Üstteki sayıların karelerine bak.", a: "Karelerin farkı: 8 × 8 − 5 × 5 = 64 − 25 = 39" },
  { t: "seri", p: "1, 3, 4, 7, 11, 18, ?", c: 29, i: "Fibonacci'ye benziyor.", a: "Her sayı önceki ikisinin toplamı: 11 + 18 = 29" },
  { t: "soru", p: "Bir baba 36, oğlu 6 yaşında. Kaç yıl sonra babanın yaşı oğlunun yaşının 4 katı olur?", c: 4, i: "x yıl sonra: 36 + x = 4 × (6 + x)", a: "36 + x = 24 + 4x → 12 = 3x → x = 4 (baba 40, oğul 10)" },
  { t: "esle", p: ["2 → 9", "3 → 28", "4 → 65", "5 → ?"], c: 126, i: "Sayıyı kendisiyle üç kez çarp.", a: "Küpünün 1 fazlası: 5 × 5 × 5 + 1 = 126" },
  { t: "dikdortgen", c: 18, i: "Yatayda 3, dikeyde 4 çizgi var; her dikdörtgen 2 yatay ve 2 dikey çizgi seçer.", a: "3 yatay çizgiden 2'si (3 yol) × 4 dikey çizgiden 2'si (6 yol) = 18" },
  { t: "soru", p: "10 kişi birbiriyle birer kez tokalaşıyor. Toplam kaç tokalaşma olur?", c: 45, i: "Her kişi 9 kişiyle tokalaşır ama her tokalaşma iki kez sayılır.", a: "10 × 9 ÷ 2 = 45" },
  { t: "seri", p: "2, 12, 36, 80, ?", c: 150, i: "1×1×2, 2×2×3 …", a: "n × n × (n + 1): 5 × 5 × 6 = 150" },
  { t: "sekil", p: [["yildiz", "×", "yildiz", "=", "49"], ["karo", "−", "yildiz", "=", "5"], ["karo", "×", "yildiz", "−", "karo", "=", "?"]], c: 72, i: "Hangi sayı kendisiyle çarpılınca 49 eder?", a: "Yıldız = 7, karo = 12 → 12 × 7 − 12 = 72" },
  { t: "soru", p: "Bir sınıfta 30 öğrenci var. 18'i futbol, 15'i basketbol oynuyor; 5'i hiçbirini oynamıyor. Kaç öğrenci ikisini de oynuyor?", c: 8, i: "Spor yapan kaç kişi var? 18 + 15 bundan ne kadar fazla?", a: "Spor yapan 25 kişi; 18 + 15 = 33 → 33 − 25 = 8 kişi ikisini de oynuyor" },
  { t: "soru", p: "Saat 3:30'da akrep ile yelkovan arasındaki dar açı kaç derecedir?", c: 75, i: "Yelkovan 6'da; akrep 3 ile 4'ün tam ortasında.", a: "Yelkovan 180°, akrep 90° + 15° = 105° → 180 − 105 = 75°" },
  { t: "tablo", p: [[8, "", 6], ["", 5, ""], [4, "?", 2]], c: 9, i: "Her satır, sütun ve köşegenin toplamı aynı. Köşegen 8 + 5 + 2 kaç?", a: "Toplam 15 → üst orta 15 − 8 − 6 = 1 → orta sütun 1 + 5 + ? = 15 → 9" },

// ---------- Durum ----------
// Bilmeceler değiştiği için yeni kayıt anahtarı. Bilinmeyen bilmecede bir sonrakine geçilmez.
const ST = Object.assign({ i: 0, acik: 0, coz: {}, ip: {}, isq: {} }, oku("bilmeceSt2", {}));
if (ST.i > ST.acik) ST.i = ST.acik;
if (ST.acik >= SEV.length) ST.acik = SEV.length - 1;
let val = "";
const kaydet = () => yaz("bilmeceSt2", ST);

function ciz() {
  const L = SEV[ST.i];
  $("title").innerHTML = `Seviye ${ST.i + 1}<small>/ ${SEV.length}</small>`;
  let h = "";
  if (L.t === "seri" || L.t === "islem") {
    const fs = Math.min(44, Math.floor((Math.min(innerWidth, 480) - 60) / (L.p.length * 0.52)));
    h = `<div style="font-size:${fs}px;white-space:nowrap">${L.p}</div>`;
  } else if (L.t === "esle") h = `<div class="lines">${L.p.map((x) => `<div>${x}</div>`).join("")}</div>`;
  else if (L.t === "sekil") h = L.p.map((r) => `<div class="eq">${r.map(tok).join("")}</div>`).join("");
  else if (L.t === "ucgen") h = `<div class="tri">${L.p.map(ucgen).join("")}</div>`;
  else if (L.t === "kare") h = `${izgara(L.p)}<div class="lbl">Şekilde kaç kare var?</div>`;
  else if (L.t === "dikdortgen") h = `${dikdortgen()}<div class="lbl">Şekilde kaç dikdörtgen var?<br><small>(kareler de dikdörtgendir)</small></div>`;
  else if (L.t === "ucgenSay") h = `${ucgenIzgara(L.p)}<div class="lbl">Şekilde kaç üçgen var?</div>`;
  else if (L.t === "piramit") h = piramit(L.p);
  else if (L.t === "tablo") h = `<table>${L.p.map((r) => `<tr>${r.map((x) => `<td>${x}</td>`).join("")}</tr>`).join("")}</table><div class="lbl">Her satır, sütun ve köşegenin toplamı aynı</div>`;
  else if (L.t === "soru") h = `<div class="q">${L.p}</div>`;
  $("pz").innerHTML = h;
  $("done").classList.remove("show");
  $("hint").classList.toggle("acik", !!ST.ip[ST.i]);
  val = ""; goster();
}
function goster() { $("val").textContent = val; $("ans").classList.remove("bad"); }
function bas(k) { if ($("done").classList.contains("show") || $("ov").classList.contains("show")) return; if (val.length < 7) { val = (val + k).replace(/^0+(?=\d)/, ""); goster(); } }
function sil() { val = val.slice(0, -1); goster(); }
function tamam() {
  if ($("done").classList.contains("show")) return sonraki();
  if (!val) return;
  const L = SEV[ST.i];
  if (Number(val) === L.c) {
    ST.coz[ST.i] = ST.ip[ST.i] ? "ip" : "ok";
    ST.acik = Math.max(ST.acik, Math.min(ST.i + 1, SEV.length - 1)); kaydet();
    window.Rapor && Rapor.oyun("bilmece", true, `Seviye ${ST.i + 1}`);
    $("exp").textContent = L.a;
    $("next").textContent = ST.i >= SEV.length - 1 ? "Bitir" : "Sonraki ›";
    $("done").classList.add("show");
  } else {
    $("ans").classList.add("bad");
    const s = $("stage"); s.classList.remove("shake"); void s.offsetWidth; s.classList.add("shake");
    try { navigator.vibrate && navigator.vibrate(40); } catch (e) {}
    setTimeout(() => { val = ""; goster(); }, 600);
  }
}
function sonraki() {
  if (ST.i >= SEV.length - 1) return bitti();
  if (!ST.coz[ST.i]) return; // bilinmeden geçilmez
  ST.i++; kaydet(); ciz();
}
function pencere(h) { $("box").innerHTML = h; $("ov").classList.add("show"); }
const kapat = () => $("ov").classList.remove("show");
$("ov").onclick = (e) => { if (e.target === $("ov")) kapat(); };

// ---------- İpucu: önce 5 İş Bankası sorusunu doğru bil ----------
const GEREK = 5;
let deste = [];
function isqSec() {
  const pool = typeof ISQ !== "undefined" ? ISQ : [];
  if (!deste.length) deste = pool.map((_, i) => i).sort(() => Math.random() - 0.5);
  return pool[deste.pop()];
}
function ipucu() {
  const L = SEV[ST.i];
  if (ST.ip[ST.i] || typeof ISQ === "undefined" || !ISQ.length) return ipucuGoster();
  isqSor();
}
function ipucuGoster() {
  const L = SEV[ST.i];
  ST.ip[ST.i] = true; kaydet(); $("hint").classList.add("acik");
  pencere(`<h3>💡 İpucu</h3><p>${L.i}</p><button class="btn" id="kp" type="button">Tamam</button>`);
  $("kp").onclick = kapat;
}
function isqSor() {
  const n = ST.isq[ST.i] || 0, q = isqSec();
  const ord = q[1].map((_, i) => i).sort(() => Math.random() - 0.5), dogru = ord.indexOf(q[2]);
  pencere(`<h3>💡 İpucu için ${GEREK} İş Bankası sorusu</h3>
    <div class="qzd">${Array.from({ length: GEREK }, (_, i) => `<i class="${i < n ? "on" : ""}"></i>`).join("")}</div>
    <p class="qzq"></p><div class="qzo">${ord.map((_, k) => `<button type="button" data-k="${k}"></button>`).join("")}</div>
    <div class="qzm" id="qzm">${n} / ${GEREK} doğru</div><button class="btn" id="kp" type="button">Vazgeç</button>`);
  $("box").querySelector(".qzq").textContent = q[0];
  $("box").querySelectorAll(".qzo button").forEach((b, k) => (b.textContent = q[1][ord[k]]));
  $("kp").onclick = kapat;
  $("box").querySelector(".qzo").onclick = (e) => {
    const b = e.target.closest("button[data-k]"); if (!b || b.disabled) return;
    const k = +b.dataset.k;
    $("box").querySelectorAll(".qzo button").forEach((x) => { x.disabled = true; if (+x.dataset.k === dogru) x.classList.add("ok"); });
    if (k === dogru) {
      const m = (ST.isq[ST.i] || 0) + 1; ST.isq[ST.i] = m; kaydet();
      $("qzm").innerHTML = `<b style="color:var(--ok)">Doğru!</b> ${m} / ${GEREK}`;
      setTimeout(() => (m >= GEREK ? ipucuGoster() : isqSor()), 750);
    } else {
      b.classList.add("bad");
      $("qzm").innerHTML = `<b style="color:var(--bad)">Olmadı</b> · doğrusu yeşil olan`;
      setTimeout(isqSor, 1500);
    }
  };
}
function seviyeler() {
  const ok = Object.values(ST.coz).filter((x) => x === "ok").length, ip = Object.values(ST.coz).filter((x) => x === "ip").length;
  pencere(`<h3>Seviyeler</h3><div class="lv">${SEV.map((_, i) => { const c = ST.coz[i]; return `<button type="button" data-i="${i}" class="${c === "ok" ? "ok" : c === "ip" ? "ip" : ""}${i === ST.i ? " cur" : ""}"${i > ST.acik ? " disabled" : ""}>${i + 1}${c === "ip" ? "<i>💡</i>" : i > ST.acik ? "<i>🔒</i>" : ""}</button>`; }).join("")}</div>
    <div class="note">✓ ${ok} kendin çözdün · 💡 ${ip} ipucuyla · bilinmeyen seviyeden sonrakine geçilmez</div><button class="btn" id="kp" type="button">Kapat</button>`);
  $("box").querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => { ST.i = +b.dataset.i; kaydet(); kapat(); ciz(); }));
  $("kp").onclick = kapat;
}
function bitti() {
  const ok = Object.values(ST.coz).filter((x) => x === "ok").length;
  pencere(`<h3>🏆 Hepsini bitirdin!</h3><p>${SEV.length} bilmecenin <b>${ok}</b> tanesini ipucusuz çözdün. Yeni bilmeceler yakında 🙂</p><button class="btn" id="kp" type="button">Seviyelere bak</button>`);
  $("kp").onclick = seviyeler;
}

// ---------- Tuşlar ----------
$("keys").innerHTML = [1, 2, 3, 4, 5, 6, 7, 8, 9, 0].map((n) => `<button class="k" type="button" data-k="${n}">${n}</button>`).join("");
$("keys").onclick = (e) => { const b = e.target.closest("[data-k]"); if (b) bas(b.dataset.k); };
$("del").onclick = sil;
let basT; $("del").onpointerdown = () => { basT = setTimeout(() => { val = ""; goster(); }, 550); };
["pointerup", "pointerleave"].forEach((ev) => $("del").addEventListener(ev, () => clearTimeout(basT)));
$("ent").onclick = tamam;
$("next").onclick = sonraki;
$("hint").onclick = ipucu;
$("lvBtn").onclick = seviyeler;
document.addEventListener("keydown", (e) => {
  if ($("ov").classList.contains("show")) { if (e.key === "Escape") kapat(); return; }
  if (/^\d$/.test(e.key)) bas(e.key); else if (e.key === "Backspace") sil(); else if (e.key === "Enter") { e.preventDefault(); tamam(); }
});
window.addEventListener("resize", () => { if (!$("done").classList.contains("show")) { const v = val; ciz(); val = v; goster(); } });
ciz();
</script>
