# İl / ilçe listesi (Bölgem): 10 günde bir, turkey-neighbourhoods paketinden (PTT posta kodu listesi) yeniden üretilir; değişmediyse dokunulmaz
name: İl ilçe listesi
on:
  schedule:
    - cron: "41 3 1,11,21 * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ililce
  cancel-in-progress: false
jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Listeyi karşılaştır
        run: python scripts/ililce.py
      - name: Commit
        run: |
          git config user.name "sadolayn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ililce.json
          git diff --cached --quiet && exit 0
          git commit -q -m "İl/ilçe listesi güncellendi"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
