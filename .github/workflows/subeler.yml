name: Şube konumları
# Türkiye'deki İş Bankası şube ve bankamatik konumlarını günde bir kez günceller.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: subeler
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Şube ve bankamatik konumları
        run: python scripts/isbank_sube_konum.py
      - name: Commit
        run: |
          git config user.name "sadolayn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add isbank/sube_konum.json || true
          git diff --cached --quiet || (git commit -q -m "Şube konumları güncellendi" && git pull --rebase -q && git push -q)
