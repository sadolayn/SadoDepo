name: Resmi Gazete Güncelle

on:
  schedule:
    - cron: "15 4 * * *"
    - cron: "30 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gazete
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resmi Gazete çek
        run: python scripts/gazete.py

      - name: Commit
        run: |
          git config user.name "sadolayn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add gazete/
          git diff --cached --quiet || (git commit -m "Resmi Gazete güncellendi $(date +%Y-%m-%d)" && git pull --rebase -q && git push -q)