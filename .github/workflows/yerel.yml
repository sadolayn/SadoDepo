# Yerel haberler (Güncel Haberler › Yerel): günde bir kez, sabah 10:00'dan önce (İstanbul 09:17)
# Google Haberler'de "<il/ilçe> site:<gazete>" araması; gazetelerin sitelerine girilmez. Yalnızca başlık, bağlantı ve saat data/yerel.json'a yazılır.
name: Yerel haberler
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: yerel
  cancel-in-progress: false
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Yerel başlıklar
        run: python scripts/yerel.py
      - name: Commit
        run: |
          git config user.name "sadolayn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/yerel.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Yerel haberler güncellendi"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
