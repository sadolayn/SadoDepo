name: Haftalık bağlantı kontrolü

# Her pazartesi 07:23 (TR) sitedeki dış bağlantıları dener; sonuç data/baglanti.json.
# Banka siteleri denenmez (CLAUDE.md). Elle çalıştırmak için: Actions → Haftalık bağlantı kontrolü → Run workflow.
on:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: baglanti
  cancel-in-progress: false

jobs:
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bağlantıları dene
        run: python scripts/baglanti.py
      - name: Sonucu kaydet
        run: |
          git config user.name "sadolayn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/baglanti.json
          git diff --cached --quiet || (git commit -q -m "Haftalık bağlantı kontrolü" && git pull --rebase -q && git push -q)
