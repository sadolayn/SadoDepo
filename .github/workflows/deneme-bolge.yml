# GEÇİCİ: Bölgem arama kalıplarının denemesi (yalnızca Google Haberler RSS başlıkları okunur; iş bitince silinecek)
name: Deneme Bolgem
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aramalar
        shell: python
        run: |
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET, time
          UA={"User-Agent":"Mozilla/5.0"}
          def ara(q):
              u="https://news.google.com/rss/search?q="+urllib.parse.quote(q)+"&hl=tr&gl=TR&ceid=TR:tr"
              try:
                  r=ET.fromstring(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20).read())
                  return [ (it.findtext("title") or "") for it in r.findall(".//item")]
              except Exception as e: return ["HATA "+str(e)[:60]]
          K={
           "Atama":['atandı','"göreve başladı"','"görevine başladı"','"görev değişikliği"','"yeni müdür"'],
           "Vefat":['vefat','"cenaze töreni"','"son yolculuğuna"','"toprağa verildi"'],
           "OSB":['"organize sanayi"','OSB'],
           "Afet":['sel','deprem','"elektrik kesintisi"','"su kesintisi"','fırtına'],
           "Tarım":['hasat','rekolte','çiftçi','çiftçiler','"zirai don"'],
          }
          SL="aeıioöuü"
          def ekler(ad):
              k=ad.lower().replace("I","ı").replace("İ","i"); v=[c for c in k if c in SL][-1]
              son=k[-1] in SL; sert=k[-1] in "çfhkpsşt"
              kal = v in "aıou"
              d=("t" if sert else "d")+("a" if kal else "e")
              gen=("n" if son else "")+{"a":"ın","ı":"ın","o":"un","u":"un","e":"in","i":"in","ö":"ün","ü":"ün"}[v]
              dat=("y" if son else "")+("a" if kal else "e")
              li="l"+{"a":"ı","ı":"ı","o":"u","u":"u","e":"i","i":"i","ö":"ü","ü":"ü"}[v]
              return [f'"{ad}\'{d}"',f'"{ad}\'{d}ki"',f'"{ad}\'{gen}"',f'"{ad}\'{dat}"',f'"{ad}\'{d}n"',f'{ad}{li}',f'"{ad} Valiliği"',f'"{ad} Valisi"',f'"{ad} Belediyesi"',f'"{ad} Büyükşehir"']
          K={"Atama":K["Atama"],"Vefat":K["Vefat"],
             "Tarım":['hasat','rekolte','çiftçiler','çiftçilere','"zirai don"','"dolu yağışı"'],
             "Afet":['sel','deprem','"elektrik kesintisi"','"su kesintisi"','"fırtına uyarısı"'],"Tüm":[]}
          def yer(ilce,il,bel):
              if not ilce:
                  e=ekler(il); f=[e[0],e[1],f'"{il} Valiliği"',f'"{il} Büyükşehir"']
                  return "("+" OR ".join("intitle:"+x for x in f)+")"
              if bel: return f'intitle:"{ilce}" intitle:"{il}"'
              return f'intitle:"{ilce}" {il}'
          YER=[("Çay","Afyonkarahisar",1),("Kale","Denizli",1),("Pazar","Rize",1),("Bor","Niğde",1),("","Aydın",0),("","İzmir",0),("Nazilli","Aydın",0)]
          for ilce,il,bel in YER:
              for k,ws in K.items():
                  grp=(" ("+" OR ".join("intitle:"+w for w in ws)+")") if ws else ""
                  Q=yer(ilce,il,bel)+grp+" when:30d"
                  t=ara(Q); time.sleep(1)
                  print(f"### {ilce or il}/{k} F: {len(t)} sonuç  [{len(Q.split())} kelime]  {Q[:100]}")
                  for x in t[:7]: print("   -",x[:110])
