# GEÇİCİ: Bölgem arama kalıplarının denemesi (yalnızca Google Haberler RSS başlıkları okunur; iş bitince silinecek)
name: Deneme Bolgem
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aramalar
        shell: python
        run: |
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET, time
          UA={"User-Agent":"Mozilla/5.0"}
          def ara(q):
              u="https://news.google.com/rss/search?q="+urllib.parse.quote(q)+"&hl=tr&gl=TR&ceid=TR:tr"
              try:
                  r=ET.fromstring(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20).read())
                  return [ (it.findtext("title") or "") for it in r.findall(".//item")]
              except Exception as e: return ["HATA "+str(e)[:60]]
          Q=[["İnc/V1", "intitle:\"İncirliova\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"yeni müdür\" OR intitle:\"yeni başkan\") when:30d"], ["İnc/V2", "intitle:\"İncirliova\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\") when:30d"], ["İnc/V3", "intitle:\"İncirliova\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\" OR intitle:\"müdürlüğüne atandı\") when:30d"], ["Naz/V1", "intitle:\"Nazilli\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"yeni müdür\" OR intitle:\"yeni başkan\") when:30d"], ["Naz/V2", "intitle:\"Nazilli\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\") when:30d"], ["Naz/V3", "intitle:\"Nazilli\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\" OR intitle:\"müdürlüğüne atandı\") when:30d"], ["Efe/V1", "intitle:\"Efeler\" intitle:\"Aydın\" (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"yeni müdür\" OR intitle:\"yeni başkan\") when:30d"], ["Efe/V2", "intitle:\"Efeler\" intitle:\"Aydın\" (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\") when:30d"], ["Efe/V3", "intitle:\"Efeler\" intitle:\"Aydın\" (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\" OR intitle:\"müdürlüğüne atandı\") when:30d"], ["Ayd/V1", "intitle:\"Aydın'da\" (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"yeni müdür\" OR intitle:\"yeni başkan\") when:30d"], ["Ayd/V2", "intitle:\"Aydın'da\" (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\") when:30d"], ["Ayd/V3", "intitle:\"Aydın'da\" (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\" OR intitle:\"müdürlüğüne atandı\") when:30d"], ["Bay/V1", "intitle:\"Bayburt'ta\" (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"yeni müdür\" OR intitle:\"yeni başkan\") when:30d"], ["Bay/V2", "intitle:\"Bayburt'ta\" (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\") when:30d"], ["Bay/V3", "intitle:\"Bayburt'ta\" (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\" OR intitle:\"müdürlüğüne atandı\") when:30d"]]
          for ad,q in Q:
              t=ara(q); time.sleep(1)
              print(f"### {ad}: {len(t)} sonuç [{len(q.split())} kelime] {q[:80]}")
              for x in t[:9]: print("   -",x[:105])
