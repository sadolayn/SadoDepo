# GEÇİCİ: Bölgem arama kalıplarının denemesi (yalnızca Google Haberler RSS başlıkları okunur; iş bitince silinecek)
name: Deneme Bolgem
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aramalar
        shell: python
        run: |
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET, time
          UA={"User-Agent":"Mozilla/5.0"}
          def ara(q):
              u="https://news.google.com/rss/search?q="+urllib.parse.quote(q)+"&hl=tr&gl=TR&ceid=TR:tr"
              try:
                  r=ET.fromstring(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20).read())
                  return [ (it.findtext("title") or "") for it in r.findall(".//item")]
              except Exception as e: return ["HATA "+str(e)[:60]]
          K={
           "Atama":['atandı','"göreve başladı"','"görevine başladı"','"görev değişikliği"','"yeni müdür"'],
           "Vefat":['vefat','"cenaze töreni"','"son yolculuğuna"','"toprağa verildi"'],
           "OSB":['"organize sanayi"','OSB'],
           "Afet":['sel','deprem','"elektrik kesintisi"','"su kesintisi"','fırtına'],
           "Tarım":['hasat','rekolte','çiftçi','çiftçiler','"zirai don"'],
          }
          YER=[("İncirliova","Aydın"),("Nazilli","Aydın"),("Efeler","Aydın"),("Aydın",""),("Bornova","İzmir")]
          for ilce,il in YER:
              for k,ws in K.items():
                  grp=" OR ".join("intitle:"+w for w in ws)
                  A=(f'"{ilce}" {il} ({grp}) when:7d' if il else f'{ilce} haberleri ({grp}) when:7d')
                  B=f'intitle:"{ilce}" ({grp}) when:7d'
                  C=f'allintitle: {ilce} {ws[0]} when:7d'
                  for ad,q in (("A-simdiki",A),("B-yer-baslikta",B)):
                      t=ara(q); time.sleep(1)
                      print(f"### {ilce}/{k} {ad}: {len(t)} sonuç")
                      for x in t[:6]: print("   -",x[:110])
