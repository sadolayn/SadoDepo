# GEÇİCİ: Bölgem arama kalıplarının denemesi (yalnızca Google Haberler RSS başlıkları okunur; iş bitince silinecek)
name: Deneme Bolgem
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aramalar
        shell: python
        run: |
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET, time
          UA={"User-Agent":"Mozilla/5.0"}
          def ara(q):
              u="https://news.google.com/rss/search?q="+urllib.parse.quote(q)+"&hl=tr&gl=TR&ceid=TR:tr"
              try:
                  r=ET.fromstring(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20).read())
                  return [ (it.findtext("title") or "") for it in r.findall(".//item")]
              except Exception as e: return ["HATA "+str(e)[:60]]
          Q=[["İnc/eski(run8)", "intitle:\"İncirliova\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"yeni müdür\" OR intitle:\"yeni başkan\") when:30d"], ["Nazilli/eski(run8)", "intitle:\"Nazilli\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"görev değişimi\" OR intitle:\"yeni müdür\" OR intitle:\"yeni başkan\") when:30d"], ["İnc/yeni", "intitle:\"İncirliova\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:müdürlüğüne OR intitle:başkanlığına) when:30d"], ["Nazilli/yeni", "intitle:\"Nazilli\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:müdürlüğüne OR intitle:başkanlığına) when:30d"], ["İnc/yeni-2", "intitle:\"İncirliova\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\") when:30d"], ["Nazilli/yeni-2", "intitle:\"Nazilli\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\") when:30d"], ["İnc/yeni+görevine", "intitle:\"İncirliova\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:görevine OR intitle:başkanlığına) when:30d"], ["Nazilli/yeni+görevine", "intitle:\"Nazilli\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:görevine OR intitle:başkanlığına) when:30d"], ["İnc/atandı", "intitle:\"İncirliova\" Aydın (intitle:atandı) when:30d"], ["Nazilli/atandı", "intitle:\"Nazilli\" Aydın (intitle:atandı) when:30d"], ["İnc/başkanlığına", "intitle:\"İncirliova\" Aydın (intitle:başkanlığına) when:30d"], ["Nazilli/başkanlığına", "intitle:\"Nazilli\" Aydın (intitle:başkanlığına) when:30d"]]
          for ad,q in Q:
              t=ara(q); time.sleep(1)
              print(f"### {ad}: {len(t)} sonuç [{len(q.split())} kelime] {q[:80]}")
              for x in t[:4]: print("   -",x[:105])
