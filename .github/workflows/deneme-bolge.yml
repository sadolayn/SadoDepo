# GEÇİCİ: Bölgem arama kalıplarının denemesi (yalnızca Google Haberler RSS başlıkları okunur; iş bitince silinecek)
name: Deneme Bolgem
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aramalar
        shell: python
        run: |
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET, time
          UA={"User-Agent":"Mozilla/5.0"}
          def ara(q):
              u="https://news.google.com/rss/search?q="+urllib.parse.quote(q)+"&hl=tr&gl=TR&ceid=TR:tr"
              try:
                  r=ET.fromstring(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20).read())
                  return [ (it.findtext("title") or "") for it in r.findall(".//item")]
              except Exception as e: return ["HATA "+str(e)[:60]]
          Q=[["Nazilli/Tüm", "intitle:\"Nazilli\" Aydın when:30d"], ["Nazilli/Atama", "intitle:\"Nazilli\" Aydın (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\" OR intitle:\"müdürlüğüne atandı\") when:30d"], ["Nazilli/Vefat", "intitle:\"Nazilli\" Aydın (intitle:vefat OR intitle:\"cenaze töreni\" OR intitle:\"yolculuğuna uğurlandı\" OR intitle:\"toprağa verildi\") when:30d"], ["Nazilli/Ödül & başarı", "intitle:\"Nazilli\" Aydın (intitle:\"ödül aldı\" OR intitle:\"ödülünü aldı\" OR intitle:\"ödülüne layık\" OR intitle:\"ödülü verildi\") when:30d"], ["Nazilli/Organize sanayi", "intitle:\"Nazilli\" Aydın (intitle:OSB OR intitle:\"sanayi bölgesi\") when:30d"], ["Nazilli/Sanayi & yatırım", "intitle:\"Nazilli\" Aydın (intitle:fabrika OR intitle:yatırım OR intitle:\"üretim tesisi\" OR intitle:kapasite) when:30d"], ["Nazilli/İhracat & ticaret", "intitle:\"Nazilli\" Aydın (intitle:ihracat OR intitle:ithalat OR intitle:ihracatçı OR intitle:ihracatçılar) when:30d"], ["Nazilli/Maaş promosyonu", "intitle:\"Nazilli\" Aydın (intitle:promosyon OR intitle:promosyonu OR intitle:\"promosyon anlaşması\" OR intitle:\"promosyon ihalesi\") when:30d"], ["Nazilli/Açılış", "intitle:\"Nazilli\" Aydın (intitle:\"açılış töreni\" OR intitle:\"hizmete açıldı\" OR intitle:\"hizmete girdi\" OR intitle:\"açılışı yapıldı\" OR intitle:\"açılışını yaptı\") when:30d"], ["Nazilli/İstihdam", "intitle:\"Nazilli\" Aydın (intitle:istihdam OR intitle:İŞKUR OR intitle:\"kariyer fuarı\" OR intitle:\"işçi alımı\") when:30d"], ["Nazilli/Belediye & ihale", "intitle:\"Nazilli\" Aydın (intitle:belediye OR intitle:ihale OR intitle:\"meclis kararı\" OR intitle:altyapı) when:30d"], ["Nazilli/İnşaat & konut", "intitle:\"Nazilli\" Aydın (intitle:\"konut projesi\" OR intitle:\"kentsel dönüşüm\" OR intitle:imar OR intitle:TOKİ OR intitle:\"temeli atıldı\") when:30d"], ["Nazilli/Oda & borsa", "intitle:\"Nazilli\" Aydın (intitle:\"ticaret odası\" OR intitle:\"ticaret borsası\" OR intitle:\"esnaf odası\" OR intitle:\"sanayi odası\") when:30d"], ["Nazilli/Tarım", "intitle:\"Nazilli\" Aydın (intitle:hasat OR intitle:hasadı OR intitle:rekolte OR intitle:çiftçiler OR intitle:çiftçilere OR intitle:tarımsal OR intitle:\"zirai don\") when:30d"], ["Nazilli/Turizm", "intitle:\"Nazilli\" Aydın (intitle:turizm OR intitle:otel OR intitle:turist OR intitle:\"turizm sezonu\") when:30d"], ["Nazilli/Fuar & etkinlik", "intitle:\"Nazilli\" Aydın (intitle:fuar OR intitle:festival OR intitle:şenlik OR intitle:panel OR intitle:sempozyum) when:30d"], ["Nazilli/Afet & kesinti", "intitle:\"Nazilli\" Aydın (intitle:sel OR intitle:deprem OR intitle:kesintisi OR intitle:sağanak OR intitle:heyelan) when:30d"], ["İzmir/Tüm", "intitle:\"İzmir'de\" when:7d"], ["İzmir/Atama", "intitle:\"İzmir'de\" (intitle:atandı OR intitle:atama OR intitle:\"göreve başladı\" OR intitle:\"görevine başladı\" OR intitle:\"göreve getirildi\" OR intitle:\"başkanlığına seçildi\" OR intitle:\"müdürlüğüne atandı\") when:7d"], ["İzmir/Vefat", "intitle:\"İzmir'de\" (intitle:vefat OR intitle:\"cenaze töreni\" OR intitle:\"yolculuğuna uğurlandı\" OR intitle:\"toprağa verildi\") when:7d"], ["İzmir/Ödül & başarı", "intitle:\"İzmir'de\" (intitle:\"ödül aldı\" OR intitle:\"ödülünü aldı\" OR intitle:\"ödülüne layık\" OR intitle:\"ödülü verildi\") when:7d"], ["İzmir/Organize sanayi", "intitle:\"İzmir'de\" (intitle:OSB OR intitle:\"sanayi bölgesi\") when:7d"], ["İzmir/Sanayi & yatırım", "intitle:\"İzmir'de\" (intitle:fabrika OR intitle:yatırım OR intitle:\"üretim tesisi\" OR intitle:kapasite) when:7d"], ["İzmir/İhracat & ticaret", "intitle:\"İzmir'de\" (intitle:ihracat OR intitle:ithalat OR intitle:ihracatçı OR intitle:ihracatçılar) when:7d"], ["İzmir/Maaş promosyonu", "intitle:\"İzmir'de\" (intitle:promosyon OR intitle:promosyonu OR intitle:\"promosyon anlaşması\" OR intitle:\"promosyon ihalesi\") when:7d"], ["İzmir/Açılış", "intitle:\"İzmir'de\" (intitle:\"açılış töreni\" OR intitle:\"hizmete açıldı\" OR intitle:\"hizmete girdi\" OR intitle:\"açılışı yapıldı\" OR intitle:\"açılışını yaptı\") when:7d"], ["İzmir/İstihdam", "intitle:\"İzmir'de\" (intitle:istihdam OR intitle:İŞKUR OR intitle:\"kariyer fuarı\" OR intitle:\"işçi alımı\") when:7d"], ["İzmir/Belediye & ihale", "intitle:\"İzmir'de\" (intitle:belediye OR intitle:ihale OR intitle:\"meclis kararı\" OR intitle:altyapı) when:7d"], ["İzmir/İnşaat & konut", "intitle:\"İzmir'de\" (intitle:\"konut projesi\" OR intitle:\"kentsel dönüşüm\" OR intitle:imar OR intitle:TOKİ OR intitle:\"temeli atıldı\") when:7d"], ["İzmir/Oda & borsa", "intitle:\"İzmir'de\" (intitle:\"ticaret odası\" OR intitle:\"ticaret borsası\" OR intitle:\"esnaf odası\" OR intitle:\"sanayi odası\") when:7d"], ["İzmir/Tarım", "intitle:\"İzmir'de\" (intitle:hasat OR intitle:hasadı OR intitle:rekolte OR intitle:çiftçiler OR intitle:çiftçilere OR intitle:tarımsal OR intitle:\"zirai don\") when:7d"], ["İzmir/Turizm", "intitle:\"İzmir'de\" (intitle:turizm OR intitle:otel OR intitle:turist OR intitle:\"turizm sezonu\") when:7d"], ["İzmir/Fuar & etkinlik", "intitle:\"İzmir'de\" (intitle:fuar OR intitle:festival OR intitle:şenlik OR intitle:panel OR intitle:sempozyum) when:7d"], ["İzmir/Afet & kesinti", "intitle:\"İzmir'de\" (intitle:sel OR intitle:deprem OR intitle:kesintisi OR intitle:sağanak OR intitle:heyelan) when:7d"]]
          for ad,q in Q:
              t=ara(q); time.sleep(1)
              print(f"### {ad}: {len(t)} sonuç [{len(q.split())} kelime] {q[:80]}")
              for x in t[:6]: print("   -",x[:105])
