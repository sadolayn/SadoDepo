# GEÇİCİ: Bölgem arama kalıplarının denemesi (yalnızca Google Haberler RSS başlıkları okunur; iş bitince silinecek)
name: Deneme Bolgem
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dene:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aramalar
        shell: python
        run: |
          import urllib.request, urllib.parse, xml.etree.ElementTree as ET, time
          UA={"User-Agent":"Mozilla/5.0"}
          def ara(q):
              u="https://news.google.com/rss/search?q="+urllib.parse.quote(q)+"&hl=tr&gl=TR&ceid=TR:tr"
              try:
                  r=ET.fromstring(urllib.request.urlopen(urllib.request.Request(u,headers=UA),timeout=20).read())
                  return [ (it.findtext("title") or "") for it in r.findall(".//item")]
              except Exception as e: return ["HATA "+str(e)[:60]]
          SL="aeıioöuü"
          def bul(ad):
              k=ad.lower().replace("I","ı").replace("İ","i"); v=[c for c in k if c in SL][-1]
              d=("t" if k[-1] in "çfhkpsşt" else "d")+("a" if v in "aıou" else "e")
              return f"{ad}'{d}"
          BS={"Aydın","İzmir","Denizli","Manisa"}
          AL={"Afyonkarahisar":"Afyon"}
          def ilg(il, tek=False):
              b=bul(il)
              if tek: return f'intitle:"{b}"'
              f=[f'"{b}"',f'"{b}ki"',f'"{il} Valiliği"',f'"{il} Valisi"',f'"{il} Büyükşehir"' if il in BS else f'"{il} Belediyesi"']
              if il in AL: f.append(f'"{bul(AL[il])}"')
              return "("+" OR ".join("intitle:"+x for x in f)+")"
          def grp(ws): return (" ("+" OR ".join("intitle:"+w for w in ws)+")") if ws else ""
          def go(ad,Q,n=5):
              t=ara(Q); time.sleep(1)
              print(f"### {ad}: {len(t)} sonuç [{len(Q.split())} kelime] {Q[:90]}")
              for x in t[:n]: print("   -",x[:105])
          T={"Maaş":['"maaş promosyonu"','"promosyon anlaşması"','"promosyon ihalesi"','"banka promosyonu"'],
             "OSB":['"organize sanayi"','OSB'],
             "Vefat":['vefat','"cenaze töreni"','"son yolculuğuna"','"toprağa verildi"'],
             "Ödül":['"ödül aldı"','"ödülünü aldı"','"ödülüne layık"','"ödülü verildi"']}
          print("=== küçük il, 5 kalıp vs tek kalıp")
          for il in ["Bayburt","Kilis","Ardahan","Tunceli"]:
              for k,ws in T.items():
                  for s in ["1d","7d"]:
                      go(f"{il}/{k}/{s}/5", ilg(il)+grp(ws)+" when:"+s, 3)
                  go(f"{il}/{k}/1d/tek", ilg(il,True)+grp(ws)+" when:1d", 3)
          print("=== Aydın atama terimleri tek tek (30g)")
          for w in ['atandı','atama','"göreve başladı"','"görevine başladı"','"görev değişikliği"','"yeni müdür"','"görevden alındı"','"yeni başkan"']:
              go("Aydın/"+w, ilg("Aydın")+grp([w])+" when:30d", 6)
          print("=== Efeler (belirsiz) ve alias")
          go("Efeler/Tüm", 'intitle:"Efeler" intitle:"Aydın" when:30d', 8)
          go("Efeler/Afet", 'intitle:"Efeler" intitle:"Aydın"'+grp(['sel','deprem','"elektrik kesintisi"','"su kesintisi"','"fırtına uyarısı"'])+" when:30d", 5)
          go("Afyon/Tüm", ilg("Afyonkarahisar")+" when:7d", 8)
          go("Güney/Tüm", 'intitle:"Güney" intitle:"Denizli" when:30d', 6)
          go("Beşiktaş/Vefat", 'intitle:"Beşiktaş" intitle:"İstanbul"'+grp(T["Vefat"])+" when:30d", 6)
          go("İncirliova/Maaş/7d", 'intitle:"İncirliova" Aydın'+grp(T["Maaş"])+" when:7d", 5)
          go("Aydın/Maaş/30d", ilg("Aydın")+grp(T["Maaş"])+" when:30d", 6)
          go("İzmir/OSB/7d", ilg("İzmir")+grp(T["OSB"])+" when:7d", 6)
