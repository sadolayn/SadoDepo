name: Güncel haberler
# GitHub'ın zamanlayıcısı bu depoda tetiklenmediği için iş, bittiğinde
# ~1 saat bekleyip kendini yeniden başlatır (zincir). Cron yalnızca yedek.
# PPK günü bekleme 14:01'e ayarlanır; karar kaydedilene kadar ~2,5 dakikada bir denenir.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: haberler
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: PPK faiz kararı (karar günü 14:00'ten sonra)
        run: |
          python scripts/ppk.py
          git config user.name "sadolayn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ppk.json
          git diff --cached --quiet || (git commit -q -m "PPK faiz kararı güncellendi" && git pull --rebase -q && git push -q)
        continue-on-error: true
      - name: Haberler
        run: python scripts/haberler.py
        continue-on-error: true
      - name: İş Bankası resmi finansal veriler
        run: pip install -q openpyxl && python scripts/isbank_finans.py
        continue-on-error: true
      - name: İş Black ayrıcalıkları (günlük kontrol)
        run: python scripts/isbank_black.py
        continue-on-error: true
      - name: Piyasa (kur ve maden)
        run: python scripts/piyasa.py
        continue-on-error: true
      - name: Commit
        run: |
          git config user.name "sadolayn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/haberler.json data/piyasa.json data/ppk.json isbank/finans.json isbank/black.json isbank/banka_kampanya.json
          git diff --cached --quiet || (git commit -q -m "Haberler ve piyasa güncellendi" && git pull --rebase -q && git push -q)
      - name: Bir saat sonra yeniden başlat (PPK günü karar saatine göre)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          S=$(python scripts/ppk.py --sleep 2>/dev/null || echo 3300)
          case "$S" in ''|*[!0-9]*) S=3300 ;; esac
          echo "Bekleme: $S sn"
          sleep "$S"
          gh workflow run haberler.yml --repo "${{ github.repository }}" --ref main
