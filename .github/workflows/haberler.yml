name: Güncel haberler
on:
  schedule:
    - cron: "7 3-21 * * *"   # İstanbul 06:07 – 00:07 arası her saat
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: haberler
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/haberler.py
      - name: Commit
        run: |
          git config user.name "sadolayn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/haberler.json
          git diff --cached --quiet || (git commit -m "Haberler güncellendi" && git pull --rebase -q && git push)
