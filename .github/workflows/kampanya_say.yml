# Kampanya kaynakları sayım denemesi: yalnızca elle çalışır, hiçbir şey commit etmez, yalnızca sayı basar
name: Kampanya sayım denemesi
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  say:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sayım
        run: python scripts/kampanya_say.py
