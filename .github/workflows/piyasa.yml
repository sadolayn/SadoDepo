name: Piyasa verisi
on:
  schedule:
    - cron: "15 7 * * *"     # 10:15 İstanbul
    - cron: "45 15 * * 1-5"  # 18:45 İstanbul
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/piyasa.py
      - name: Commit
        run: |
          git config user.name "sadolayn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/piyasa.json
          git diff --cached --quiet || (git commit -m "Piyasa verisi güncellendi" && git pull --rebase -q && git push)
