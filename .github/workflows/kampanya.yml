# Kampanyalar: isbank.com.tr, maximum.com.tr ve maximiles.com.tr (bireysel + ticari), günde bir kez, her sabah (İstanbul 08:23; GitHub gecikse de mesai başına yetişsin diye erken)
# Yalnızca işlenmiş alanlar isbank/kampanya_hepsi.json'a yazılır; kayda yalnızca sayılar basılır
name: Kampanyalar
on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kampanya
  cancel-in-progress: false
jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tarayıcı (Maximiles listesi sayfada sonradan yükleniyor)
        continue-on-error: true
        run: pip install -q playwright && python -m playwright install --with-deps chromium > /dev/null
      - name: Kampanyaları topla
        run: python scripts/kampanya_topla.py
      - name: Commit
        run: |
          git config user.name "sadolayn-bot"
          git config user.email "actions@users.noreply.github.com"
          git add isbank/kampanya_hepsi.json isbank/kampanya_ilk.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Kampanyalar güncellendi"
          # Toplama sürerken veri dosyası elle düzeltilmişse çakışma olur: bu turun taze verisi geçerli sayılır (-X theirs)
          for i in 1 2 3; do (git pull --rebase -q -X theirs || { git rebase --abort; false; }) && git push -q && exit 0; sleep 5; done
          exit 1
