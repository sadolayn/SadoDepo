<script>
const CATS = [["gundem", "Gündem"], ["isbank", "İş Bankası"], ["yerel", "Yerel"], ["tarim", "Tarım"], ["yz", "Yapay Zekâ"], ["okul", "Okul Tatili"], ["ekonomi", "Ekonomi"], ["dunya", "Dünya"], ["teknoloji", "Teknoloji"], ["spor", "Spor"], ["yazarlar", "Yazarlar"]];

const $ = (x) => document.getElementById(x);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

try { cat = localStorage.getItem("haber_cat") || "gundem"; yaz = localStorage.getItem("haber_yaz") || ""; } catch (e) {}
const ago = (iso) => {
  if (!iso) return "";
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 1) return "şimdi";
  if (m < 60) return m + " dk önce";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " sa önce";

};
const dayLabel = (iso) => {
  const d = new Date(iso), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return "Bugün";
  if (d.toDateString() === y.toDateString()) return "Dün";
  return d.toLocaleDateString("tr-TR", { day: "numeric", month: "long", weekday: "long" });
};
const fold = (s) => s.toLocaleLowerCase("tr");
// ---------- Yerel: bu sayfa haber derlemez, listelemez. Konumdan (Hava Durumu'ndaki gibi OpenStreetMap'ten yalnızca il/ilçe adı) ya da
// yazılan il/ilçeyle Google Haberler'deki aramaya yönlendirir; haberleri ve kaynakları Google gösterir. Yer yalnızca bu cihazda tutulur ----------
let YS = { il: "", ilce: "", elle: "", konum: false, son: [], sure: "7d" }, yNot = "";
try { const v = JSON.parse(localStorage.getItem("haber_yerel2") || "null"); if (v && typeof v === "object") YS = { ...YS, ...v }; } catch (e) {}
if (!Array.isArray(YS.son)) YS.son = [];

const gnUrl = (ek) => `https://news.google.com/search?q=${encodeURIComponent(yerAra() + (ek ? " (" + ek + ")" : "") + " when:" + (YS.sure === "1d" ? "1d" : "7d"))}&amp;hl=tr&amp;gl=TR&amp;ceid=TR:tr`;
// Şube müdürünün yerelde bilmek isteyeceği konular: [simge, ad, Google Haberler'de aranacak kelimeler]
const YKONU = [

  ["🕊️", "Vefat", 'vefat OR "cenaze töreni" OR "son yolculuğuna" OR "toprağa verildi"'],

  ["🏛️", "Belediye & ihale", 'belediye OR ihale OR imar OR altyapı'],

];

function yerelKur() {

  const ad = yerAd(), son = YS.son.filter((x) => x.ad !== ad);
  const ust = `<div class="yHead"><b>📍 Bölgendeki haberler</b><small>Konumunu bul ya da il / ilçe yaz; haberler Google Haberler'de açılır.</small></div>`;
  const sonuc = ad ? `<div class="ySonuc"><div class="ySat"><span class="yAd">${esc(ad)}</span><small>${YS.konum ? "konumundan" : "aradığın yer"}</small><button type="button" id="ySil" aria-label="Yeri temizle">✕</button></div>`
    + `<div class="ySure" role="group" aria-label="Süre"><button type="button" data-sure="1d" class="${YS.sure === "1d" ? "on" : ""}">Son 24 saat</button><button type="button" data-sure="7d" class="${YS.sure === "1d" ? "" : "on"}">Son 7 gün</button></div>`
    + `<a class="yTum" href="${gnUrl("")}" target="_blank" rel="noopener">Tüm haberler ↗</a>`
    + `<div class="yKonu">${YKONU.map(([ic, ad, q]) => `<a href="${gnUrl(q)}" target="_blank" rel="noopener"><span>${ic}</span>${esc(ad)}</a>`).join("")}</div></div>` : "";
  const bul = `<button type="button" id="yKonum" class="ykon ${ad ? "" : "ana"}">📍 ${YS.konum ? "Konumumu yenile" : "Konumumu bul"}</button>`;
  const yaz = `<div class="yAyrac"><i></i><span>ya da</span><i></i></div><form id="yForm" class="yform"><input id="yYaz" type="search" enterkeyhint="search" placeholder="İl / ilçe yaz, ör. Germencik" aria-label="İl ya da ilçe" autocomplete="off"><button type="submit">Ara</button></form><div class="yOner" id="yOner"></div>`;
  const kisa = son.length ? `<div class="ySon"><small>Son baktıkların</small>${son.map((x, k) => `<button type="button" data-son="${k}">${esc(x.ad)}</button>`).join("")}</div>` : "";
  return `<div class="ykur">${ust}${sonuc}${bul}${yNot ? `<small class="ynot">${esc(yNot)}</small>` : ""}${yaz}${kisa}<small class="yAlt">Bu sayfa haber derlemez; konum yalnızca il/ilçe adını bulmak için kullanılır, kaydedilmez.</small></div>`;
}
// İl/ilçe önerisi: 81 il ve 973 ilçe (data/ililce.json; PTT posta kodu listesinden, turkey-neighbourhoods paketi, MIT).
// Türkçe harf gerekmez ("cine" → Çine · Aydın); internete sorulmaz, yazdıkça anında süzülür.
let IL = null;
const sadeT = (t) => String(t).toLocaleLowerCase("tr").replace(/[çğıöşüâî]/g, (h) => ({ ç: "c", ğ: "g", ı: "i", ö: "o", ş: "s", ü: "u", â: "a", î: "i" })[h]);
function ilYukle() { if (!IL) IL = Ortak.json("data/ililce.json").then((j) => Object.entries(j).flatMap(([il, ic]) => [{ il, ilce: "", s: sadeT(il) }, ...ic.map((c) => ({ il, ilce: c, s: sadeT(c) }))])).catch(() => []); return IL; }
let YON = [];
async function yerOner() {
  const kutu = $("yOner"), q = sadeT(($("yYaz") || {}).value || "").trim(); if (!kutu) return;
  if (q.length < 2) { kutu.innerHTML = ""; YON = []; return; }
  const L = await ilYukle();
  if (sadeT($("yYaz").value).trim() !== q) return; // bu arada yazı değiştiyse eski sonucu basma
  YON = L.map((x) => ({ ...x, p: x.s.startsWith(q) ? 0 : x.s.includes(q) ? 1 : sadeT(x.il).startsWith(q) && x.ilce ? 2 : 9 })).filter((x) => x.p < 9)
    .sort((a, b) => a.p - b.p || (a.ilce ? 1 : 0) - (b.ilce ? 1 : 0) || a.s.localeCompare(b.s)).slice(0, 8);
  kutu.innerHTML = YON.length ? YON.map((x, k) => `<button type="button" data-on="${k}"><b>${esc(x.ilce || x.il)}</b><small>${x.ilce ? esc(x.il) : "il geneli"}</small></button>`).join("")
    : `<small>Eşleşen il ya da ilçe yok; "Ara" ile yazdığın gibi aranır.</small>`;
}
function yerelKonum() {
  if (!navigator.geolocation) { yNot = "Bu tarayıcı konum vermiyor; il / ilçe yazabilirsin."; render(); return; }
  yNot = "Konum bulunuyor…"; render();
  navigator.geolocation.getCurrentPosition(async (pos) => {
    try {
      const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${pos.coords.latitude}&lon=${pos.coords.longitude}&format=json&accept-language=tr&zoom=10`);
      const a = (await r.json()).address || {}, il = a.province || a.state || "", ilce = a.town || a.county || a.city || a.district || "";
      if (!il && !ilce) throw 0;
      yerSec({ il, ilce: fold(ilce) === fold(il) ? "" : ilce, konum: true });
    } catch (e) { yNot = "Konumdan yer bulunamadı; il / ilçe yazabilirsin."; render(); }
  }, () => { yNot = "Konum izni verilmedi; il / ilçe yazabilirsin."; render(); }, { timeout: 15000, maximumAge: 600000 });
}

// ---------- Trend tespiti ----------
// Eşikler: 5+ haber = dikkat, 10+ haber = çok konuşulan
const T1 = 5, T2 = 10, STORY_H = 12, SEC_H = 18;
const lvl = (n) => (n >= T2 ? 2 : n >= T1 ? 1 : 0);
// Bölüm uyarısı verilen konu sekmeleri (gündem gibi genel sekmeler zaten hep dolu)
const SEC = { okul: ["🏫", "Okul tatili", "okul tatili haberi"], isbank: ["🏦", "İş Bankası", "İş Bankası haberi"] };
const STOP = new Set("son dakika haber haberi haberleri açıklama açıklaması açıkladı oldu olan olarak nerede bugün yarın için ile gibi daha sonra kadar çok yeni büyük ilk önce sonrası tarafından ocak şubat mart nisan mayıs haziran temmuz ağustos eylül ekim kasım aralık pazartesi salı çarşamba perşembe cuma cumartesi pazar ve veya ama ancak bir iki üç bu şu da de mi mı mu mü ne neden nasıl hangi kim var yok değil diye olduğu ortaya çıktı geldi verdi etti dedi canlı video foto galeri izle işte tüm il en bakan bakanı başkan başkanı".split(" "));
const toks = (t) => [...new Set(fold(t).replace(/[’'`´][a-zçğıöşü]+/g, "").replace(/[^a-zçğıöşüâîû0-9 ]+/g, " ").split(/\s+/)
  .filter((w) => w.length >= 4 && !STOP.has(w) && !/^\d+$/.test(w)).map((w) => w.slice(0, 5)))];
let TR = { stories: [], byUrl: new Map(), sec: [], chip: {} }, story = null, showAll = false;
function analyze() {
  const now = Date.now(), seen = new Map();
  for (const [c, arr] of Object.entries(D.cats)) for (const x of arr) {
    if (!x.d || now - new Date(x.d) > STORY_H * 3600e3) continue;
    if (seen.has(x.u)) { seen.get(x.u).cs.add(c); continue; }
    seen.set(x.u, { ...x, cs: new Set([c]), k: toks(x.t) });
  }
  const byT = new Map(); for (const x of seen.values()) { const t = fold(x.t); if (!byT.has(t)) byT.set(t, x); }
  const it = [...byT.values()];
  // Her yerde geçen kelimeler (örn. "yapay zeka") konu ayırt etmez: ele
  const df = new Map(); for (const x of it) for (const w of x.k) df.set(w, (df.get(w) || 0) + 1);
  const cap = Math.max(8, it.length * 0.06); for (const x of it) x.k = x.k.filter((w) => df.get(w) <= cap);
  const sim = (a, b) => { let s = 0; for (const w of a.k) if (b.k.includes(w)) s++; return s >= 2 && s / Math.min(a.k.length, b.k.length) >= 0.4; };
  const nb = it.map((a, i) => it.map((b, j) => (i !== j && sim(a, b) ? j : -1)).filter((j) => j >= 0));
  const used = new Set(), out = [];
  for (;;) {
    let best = -1, bn = [];
    it.forEach((_, i) => { if (used.has(i)) return; const n = nb[i].filter((j) => !used.has(j)); if (n.length > bn.length) { best = i; bn = n; } });
    if (best < 0 || bn.length + 1 < T1) break;
    const mem = [best, ...bn]; mem.forEach((j) => used.add(j));
    const srcN = new Set(mem.map((j) => it[j].s)).size;
    if (srcN < 3) continue; // tek kaynağın tekrarı "konu" sayılmaz
    // Başlık: kümede en çok bağı olan, çok uzun olmayan haber
    const inC = (j) => nb[j].filter((x) => mem.includes(x)).length;
    const head = [...mem].sort((a, b) => (it[a].t.length > 120) - (it[b].t.length > 120) || inC(b) - inC(a))[0];
    const cc = {}; mem.forEach((j) => it[j].cs.forEach((c) => (cc[c] = (cc[c] || 0) + 1)));
    // Konu sekmeleri (tarım, yapay zeka) geniş toplar; genel sekmeler öncelikli
    const W = { tarim: 0.4, yz: 0.4 };
    const main = Object.entries(cc).sort((a, b) => b[1] * (W[b[0]] || 1) - a[1] * (W[a[0]] || 1))[0][0];
    const items = mem.map((j) => it[j]).sort((a, b) => new Date(b.d) - new Date(a.d));
    out.push({ id: "s" + out.length, head: it[head].t, n: mem.length, srcN, main, items, l: lvl(mem.length) });
  }
  out.sort((a, b) => b.n - a.n);
  const byUrl = new Map(); out.forEach((s) => s.items.forEach((x) => byUrl.set(x.u, s)));
  const sec = Object.entries(SEC).map(([c, m]) => {
    const n = (D.cats[c] || []).filter((x) => x.d && now - new Date(x.d) < SEC_H * 3600e3).length;
    return { c, m, n, l: c === "okul" && n ? Math.max(lvl(n), 0.5) : lvl(n) };
  }).filter((x) => x.l);
  const chip = {};
  sec.forEach((x) => { if (x.l >= 1) chip[x.c] = { l: x.l, n: x.n }; });
  out.forEach((s) => { if (!s.l) return; const o = chip[s.main] || { l: 0, n: 0 }; chip[s.main] = { l: Math.max(o.l, s.l), n: o.n || s.n }; });
  TR = { stories: out, byUrl, sec, chip };
}
// TCMB PPK kararı: karar gününden itibaren 3 gün Gündem, Ekonomi ve İş Bankası sekmelerinde sabit kart (data/ppk.json)
let PPKJ = null;
function ppkKart() {
  const L = PPKJ && PPKJ.last; if (!L || story || (cat !== "gundem" && cat !== "ekonomi" && cat !== "isbank")) return "";
  const gun = (Date.now() - new Date(L.date + "T14:00:00+03:00")) / 864e5; if (gun < 0 || gun > 3) return "";
  const d = new Date(L.date + "T12:00:00").toLocaleDateString("tr-TR", { day: "numeric", month: "long" });
  const dg = L.change ? `${L.change > 0 ? "+" : "−"}${String(Math.abs(L.change)).replace(".", ",")} puan` : "değişmedi";
  return `<div class="sbar">🏦 <span class="st"><b>TCMB ${d}: politika faizi %${esc(String(L.rate).replace(".", ","))}</b><small>${esc(dg)} · PPK kararı · <a href="${esc(L.url || "https://www.tcmb.gov.tr")}" target="_blank" rel="noopener">karar metni ↗</a></small></span></div>`;
}
// Tarım sekmesinde sabit İş Bankası köşesi: haber olmasa da bankanın tarım ürünlerine giden resmî bağlantılar
function tarimKose() {
  if (story || cat !== "tarim") return "";
  return `<a class="sbar tkose" href="https://www.isbank.com.tr/is-ticari/tarim-bankaciligi" target="_blank" rel="noopener">🌾 <span class="st"><b>İş Bankası Tarım Bankacılığı ↗</b><small>İmece Kart, İmeceMobil ve tarım kredileri bankanın tek sayfasında</small></span></a>`;
}
function trendCards() {
  // Gündem kartları yalnızca Gündem sekmesinde: başka sekmede üstte hep aynı kartlar kalınca seçilen sekmenin haberleri ekranın altında kalıyor, sekme değişmemiş gibi görünüyordu
  if (!story && cat !== "gundem") return "";
  if (story) { const s = TR.stories.find((x) => x.id === story); return `<div class="sbar">🔥 <span class="st"><b>${esc(s.head)}</b><small>${s.n} haber · ${s.srcN} kaynak · aynı konu</small></span><button id="xStory">Kapat ✕</button></div>`; }
  const cards = [];
  for (const x of TR.sec) {
    if (x.c === cat) continue;
    const [ic, nm, w] = x.m, L = Math.floor(x.l);
    cards.push({ L, n: x.n, h: `<div class="tr ${L === 2 ? "l2" : ""}" data-go="${x.c}"><span class="ic">${ic}</span><span class="tx"><span class="lb">${L === 2 ? '<i class="dot"></i>Yoğun gündem' : nm}<em>· son saatler</em></span><span class="hd">${L ? "" : "Son saatlerde "}<b>${x.n}</b> ${w} var. Görmek için dokun.</span></span>${L ? `<span class="ct">${x.n}<small>HABER</small></span>` : ""}</div>` });
  }
  for (const s of TR.stories) {
    if (!s.l) continue;
    if (TR.sec.some((x) => x.c === s.main && x.c !== cat)) continue; // aynı konu zaten bölüm kartında
    cards.push({ L: s.l, n: s.n, h: `<div class="tr ${s.l === 2 ? "l2" : ""}" data-story="${s.id}"><span class="ic">${s.l === 2 ? "🔥" : "📣"}</span><span class="tx"><span class="lb">${s.l === 2 ? '<i class="dot"></i>Çok konuşulan' : "Gündemde"}<em>· ${s.srcN} kaynak</em></span><span class="hd">${esc(s.head)}</span></span><span class="ct">${s.n}<small>HABER</small></span></div>` });
  }
  if (!cards.length) return "";
  cards.sort((a, b) => b.L - a.L || b.n - a.n);
  const vis = showAll ? cards : cards.slice(0, 3);
  return `<div class="trends">${vis.map((c) => c.h).join("")}${cards.length > 3 ? `<span class="more" id="more">${showAll ? "Daha az göster" : `+${cards.length - 3} konu daha`}</span>` : ""}</div>`;
}
function render() {
  $("cats").innerHTML = CATS.map(([k, n]) => { const h = TR.chip[k]; return `<span class="chip ${k === cat && !story ? "on" : ""} ${h ? "h" + h.l : ""}" data-k="${k}"><i>${CIC[k] || "📰"}</i><span class="cn">${n}</span>${h ? `<span class="bd">${h.n}</span>` : ""}</span>`; }).join("");
  const YZ = D.yazarlar || [], isY = cat === "yazarlar" && !story;
  if (isY && yaz && !YZ.some((y) => y.k === yaz)) yaz = "";
  $("alert").innerHTML = ppkKart() + tarimKose() + yerelKur() + (cat === "yerel" && !story ? "" : isY ? `<div class="chips yz">${[["", "Hepsi"], ...YZ.map((y) => [y.k, y.n])].map(([k, n]) => `<span class="chip ${k === yaz ? "on" : ""}" data-y="${k}">${esc(n)}</span>`).join("")}</div>` : trendCards());
  // Yerel sekmesinde haber listesi yok: yalnızca yer kutusu ve Google Haberler bağlantısı
  const sat = document.querySelector(".stick .row");
  const not_ = document.querySelector("p.note");
  if (cat === "yerel" && !story) { if (sat) sat.style.display = "none"; $("list").innerHTML = ""; $("list").style.display = "none"; if (not_) not_.style.display = "none"; return; }
  if (sat) sat.style.display = ""; $("list").style.display = ""; if (not_) not_.style.display = "";
  const st = story && TR.stories.find((x) => x.id === story);
  const items = st ? st.items : isY ? YZ.filter((y) => !yaz || y.k === yaz).flatMap((y) => y.items.map((x) => ({ ...x, a: y.n }))).sort((a, b) => (b.d || "").localeCompare(a.d || "")) : cat === "isbank" ? (D.cats[cat] || []).filter((x) => !Ortak.tikTuzagi(x.t)) : (D.cats[cat] || []); // İş Bankası sekmesinde tık tuzağı başlıklar elenir
  const srcs = [...new Set(items.map((x) => x.s))].sort((a, b) => a.localeCompare(b, "tr"));
  const cur = $("src").value;
  $("src").innerHTML = `<option value="">Tüm kaynaklar</option>` + srcs.map((s) => `<option ${s === cur ? "selected" : ""}>${esc(s)}</option>`).join("");
  const q = fold($("q").value.trim()), src = $("src").value;
  const list = items.filter((x) => (!src || x.s === src) && (!q || fold(x.t).includes(q)));
  if (!list.length) { $("list").innerHTML = `<div class="empty">${cat === "okul" && !q && !src ? "Son 36 saatte okul tatili haberi yok." : cat === "isbank" && !q && !src ? "Son 36 saatte İş Bankası haberi yok." : isY && !q && !src ? "Bu yazar için henüz yazı yok; bir sonraki güncellemede dolacak." : (cat === "tarim" || cat === "yz") && !(D.cats[cat] || []).length ? "Bu kategori bir sonraki güncellemede dolacak." : "Bu filtrede haber yok."}</div>`; return; }
  let h = "", last = "";
  for (const x of list) {
    const dl = x.d ? dayLabel(x.d) : "";
    if (dl && dl !== last) { h += `<div class="sep">${dl}</div>`; last = dl; }
    const s = !st && TR.byUrl.get(x.u), f = s && s.l ? `<span class="fire ${s.l === 2 ? "l2" : ""}">${s.l === 2 ? "🔥" : "📣"} ${s.n} haber</span>` : "";
    h += `<a class="n ${s && s.l === 2 ? "hot" : ""}" href="${esc(x.u)}" target="_blank" rel="noopener"><b>${esc(x.t)}</b><span>${x.a && !yaz ? `<i>✍️ ${esc(x.a)}</i> · ` : ""}<i>${esc(x.s)}</i> · ${ago(x.d)}${f}</span></a>`;
  }
  $("list").innerHTML = h;
}
$("alert").onclick = (e) => {
  if (e.target.closest("#yKonum")) { yerelKonum(); return; }
  const on = e.target.closest("[data-on]"); if (on) { const x = YON[+on.dataset.on]; YON = []; if (x) yerSec({ il: x.il, ilce: x.ilce }); return; }
  const su = e.target.closest("[data-sure]"); if (su) { YS.sure = su.dataset.sure; ySakla(); render(); return; }
  if (e.target.closest("#ySil")) { YS = { ...YS, il: "", ilce: "", elle: "", konum: false }; ySakla(); render(); return; }
  const sb = e.target.closest("[data-son]"); if (sb) { const ad = yerAd(), x = YS.son.filter((y) => y.ad !== ad)[+sb.dataset.son]; if (x) yerSec(x); return; }
  if (e.target.closest("#xStory")) { story = null; $("src").value = ""; render(); return; }
  if (e.target.closest("#more")) { showAll = !showAll; render(); return; }
  const y = e.target.closest("[data-y]"); if (y) { yaz = y.dataset.y; try { localStorage.setItem("haber_yaz", yaz); } catch (er) {} $("src").value = ""; render(); return; }
  const c = e.target.closest(".tr"); if (!c) return;
  if (c.dataset.go) { cat = c.dataset.go; story = null; } else story = c.dataset.story;
  $("src").value = ""; render(); window.scrollTo(0, 0);
};
$("cats").onclick = (e) => { const c = e.target.closest(".chip"); if (!c) return; cat = c.dataset.k; story = null; $("src").value = ""; try { localStorage.setItem("haber_cat", cat); } catch (er) {} render(); window.scrollTo(0, 0); };
$("src").onchange = render;
$("alert").addEventListener("input", (e) => { if (e.target.id === "yYaz") yerOner(); });
$("alert").addEventListener("focusin", (e) => { if (e.target.id === "yYaz") ilYukle(); });
$("alert").addEventListener("submit", (e) => {
  if (e.target.id !== "yForm") return; e.preventDefault();
  const t = $("yYaz").value.trim(); if (!t) return;
  if (YON.length) { const x = YON[0]; YON = []; yerSec({ il: x.il, ilce: x.ilce }); return; } // önerilerden ilki
  yerSec({ elle: t });
});
$("q").addEventListener("input", render);
Ortak.json("data/ppk.json").then((j) => { PPKJ = j; if (typeof D !== "undefined" && D) render(); }).catch(() => {});
Ortak.json("data/haberler.json")
  .then((j) => { D = j; $("upd").textContent = "Son güncelleme: " + new Date(j.updated).toLocaleString("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }); analyze(); render(); })
  .catch(() => { Ortak.hata("list", { ne: "Haberler" }); $("upd").textContent = ""; });
setInterval(() => D && render(), 60000);
