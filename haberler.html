<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<link rel="icon" type="image/png" href="img/icon.png">
<link rel="apple-touch-icon" href="img/icon.png">
<meta name="theme-color" content="#000000">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Güncel Haberler</title>
<style>
  :root { --bg:#000; --card:#0d0d0d; --field:#161616; --ink:#f2f2f2; --muted:#8a8a8a; --accent:#e0a24f; --line:#262626; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",sans-serif; padding:12px 16px 32px; line-height:1.45; -webkit-tap-highlight-color:transparent; }
  .wrap { max-width:640px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  header h1 { margin:0; font-size:20px; }
  .upd { text-align:center; color:var(--muted); font-size:12px; margin-bottom:10px; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .chip { padding:8px 13px; border-radius:18px; background:var(--field); border:1px solid var(--line); color:var(--muted); font-size:14px; font-weight:600; cursor:pointer; }
  .chip.on { background:var(--accent); color:#000; border-color:var(--accent); }
  .row { display:flex; gap:8px; }
  select, input { flex:1; min-width:0; padding:10px 12px; font-size:15px; border-radius:12px; background:var(--field); color:var(--ink); border:1px solid var(--line); outline:none; font-family:inherit; }
  select { flex:0 0 42%; -webkit-appearance:none; appearance:none; }
  input:focus, select:focus { border-color:var(--accent); }
  .list { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:2px 14px; }
  .n { display:block; padding:12px 0; border-top:1px solid var(--line); color:var(--ink); text-decoration:none; }
  .n:first-child { border-top:none; }
  .n b { display:block; font-size:15.5px; font-weight:600; line-height:1.35; }
  .n span { font-size:12px; color:var(--muted); }
  .n span i { font-style:normal; color:var(--accent); font-weight:600; }
  .n:active b { color:var(--accent); }
  .sep { font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--accent); padding:12px 0 2px; border-top:1px solid var(--line); }
  .sep:first-child { border-top:none; }
  .empty { text-align:center; color:var(--muted); padding:40px 0; }
  .note { font-size:12px; color:var(--muted); text-align:center; margin-top:14px; }
  .stick { position:sticky; top:0; z-index:30; background:#000; margin:0 -16px 12px; padding:10px 16px; border-bottom:1px solid transparent; transition:border-color .2s, box-shadow .2s; }
  .stick.stuck { border-bottom-color:#222; box-shadow:0 8px 18px rgba(0,0,0,.55); }
  .stick > :last-child { margin-bottom:0; }
</style>
</head>
<body>
<div class="wrap">
  <div class="stick">
  <header>
    <a href="index.html" style="display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;flex:0 0 46px;border-radius:14px;background:#161616;border:1px solid #e0a24f;font-size:22px;line-height:1;text-decoration:none" title="Anasayfa" aria-label="Anasayfa">🏠</a>
    <h1>📰 Güncel Haberler</h1>
    <span style="width:46px"></span>
  </header>
  <div class="upd" id="upd">Yükleniyor…</div>
  <div class="chips" id="cats"></div>
  <div class="row">
    <select id="src" aria-label="Kaynak"><option value="">Tüm kaynaklar</option></select>
    <input id="q" type="search" placeholder="Başlıklarda ara" autocomplete="off">
  </div>
  </div>
  <div class="list" id="list"><div class="empty">Yükleniyor…</div></div>
  <p class="note">Başlıklar haber sitelerinin herkese açık RSS akışlarından gün içinde her saat otomatik derlenir. Habere dokununca yayıncının sitesinde açılır.</p>
</div>
<script>
const CATS = [["gundem", "Gündem"], ["ekonomi", "Ekonomi"], ["dunya", "Dünya"], ["teknoloji", "Teknoloji"], ["spor", "Spor"]];
const $ = (x) => document.getElementById(x);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
let D = null, cat = "gundem";
try { cat = localStorage.getItem("haber_cat") || "gundem"; } catch (e) {}
const ago = (iso) => {
  if (!iso) return "";
  const m = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
  if (m < 1) return "şimdi";
  if (m < 60) return m + " dk önce";
  const h = Math.floor(m / 60);
  if (h < 24) return h + " sa önce";
  return new Date(iso).toLocaleDateString("tr-TR", { day: "numeric", month: "short" });
};
const dayLabel = (iso) => {
  const d = new Date(iso), t = new Date(), y = new Date(); y.setDate(t.getDate() - 1);
  if (d.toDateString() === t.toDateString()) return "Bugün";
  if (d.toDateString() === y.toDateString()) return "Dün";
  return d.toLocaleDateString("tr-TR", { day: "numeric", month: "long", weekday: "long" });
};
const fold = (s) => s.toLocaleLowerCase("tr");
function render() {
  $("cats").innerHTML = CATS.map(([k, n]) => `<span class="chip ${k === cat ? "on" : ""}" data-k="${k}">${n}</span>`).join("");
  const items = (D.cats[cat] || []);
  const srcs = [...new Set(items.map((x) => x.s))].sort((a, b) => a.localeCompare(b, "tr"));
  const cur = $("src").value;
  $("src").innerHTML = `<option value="">Tüm kaynaklar</option>` + srcs.map((s) => `<option ${s === cur ? "selected" : ""}>${esc(s)}</option>`).join("");
  const q = fold($("q").value.trim()), src = $("src").value;
  const list = items.filter((x) => (!src || x.s === src) && (!q || fold(x.t).includes(q)));
  if (!list.length) { $("list").innerHTML = '<div class="empty">Bu filtrede haber yok.</div>'; return; }
  let h = "", last = "";
  for (const x of list) {
    const dl = x.d ? dayLabel(x.d) : "";
    if (dl && dl !== last) { h += `<div class="sep">${dl}</div>`; last = dl; }
    h += `<a class="n" href="${esc(x.u)}" target="_blank" rel="noopener"><b>${esc(x.t)}</b><span><i>${esc(x.s)}</i> · ${ago(x.d)}</span></a>`;
  }
  $("list").innerHTML = h;
}
$("cats").onclick = (e) => { const c = e.target.closest(".chip"); if (!c) return; cat = c.dataset.k; $("src").value = ""; try { localStorage.setItem("haber_cat", cat); } catch (er) {} render(); window.scrollTo(0, 0); };
$("src").onchange = render;
$("q").addEventListener("input", render);
fetch("data/haberler.json?t=" + Date.now(), { cache: "no-store" })
  .then((r) => r.json())
  .then((j) => { D = j; $("upd").textContent = "Son güncelleme: " + new Date(j.updated).toLocaleString("tr-TR", { day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" }); render(); })
  .catch(() => { $("list").innerHTML = '<div class="empty">Haberler yüklenemedi. Biraz sonra tekrar dene.</div>'; $("upd").textContent = ""; });
setInterval(() => D && render(), 60000);
</script>
<footer class="copyright" style="width:100%;text-align:center;font-size:12px;color:#6f6f6f;margin:28px 0 8px;letter-spacing:.5px;font-family:system-ui,-apple-system,'Segoe UI',sans-serif">© <span class="cy">2026</span> Sadolayn. All rights reserved.</footer>
<script>document.querySelectorAll(".cy").forEach(e=>e.textContent=new Date().getFullYear())</script>
<script>(function(){var s=document.querySelector(".stick");if(!s)return;var f=function(){s.classList.toggle("stuck",window.scrollY>4)};window.addEventListener("scroll",f,{passive:true});f();})();</script>
<script data-goatcounter="https://sadolayn.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</body>
</html>
